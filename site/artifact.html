ra una operación en Stage 2, con escenarios $s$ de probabilidad $p_s$, horizonte remanente $T$ y tasa de interés efectiva EIR:\n\n$$\\mathrm{ECL}=\\sum_{s} p_s \\sum_{t=1}^{T}\\mathrm{PD}^{\\text{marg}}_{s}(t)\\cdot \\mathrm{LGD}_{s}(t)\\cdot \\mathrm{EAD}(t)\\cdot (1+\\mathrm{EIR})^{-t}$$\n\nPara Stage 1, el horizonte se limita a 12 meses. Para Stage 3, la ECL es la LGD en default por la exposición.\nEl motor se certifica con el estándar de [Implementación](../implementacion/implementacion.md) (U-15) y se\nconcilia con contabilidad (PAR-R8-01.01.02).\n\n## Movimiento de la ECL\n\nCada cierre se explica la variación de la ECL, que también exige IFRS 7:\n\n```text\nECL inicial\n  + originaciones          − bajas y cancelaciones\n  ± transferencias entre stages (1↔2↔3)\n  ± cambios de parámetros (recalibraciones)\n  ± cambios de escenarios y ponderaciones\n  ± overlays (nuevos, recalibrados, liberados)\n  − castigos               ± tipo de cambio y otros\n= ECL final\n```\n\n## Overlays y ajustes post-modelo\n\nLos supervisores reconocen que los overlays se han vuelto parte estructural de la ECL. También advierten que su\ncalibración tiene demasiado juicio (LIT-113) y que deben basarse en análisis robustos y gobierno sólido (LIT-114).\nEste estándar lo traduce en reglas (U-31):\n\n| Requisito | Por qué |\n|---|---|\n| Causa identificada: qué riesgo no captura el modelo | Sin causa, el overlay es una forma de suavizar resultados |\n| Cuantificación reproducible (método, datos y supuestos) | Permite que Validación y Auditoría lo repliquen |\n| Cartera afectada y efecto en el staging | Evita aplicarlo \"en general\" |\n| Fecha de revisión o expiración | Impide que se vuelva permanente |\n| Aprobación en comité con acta (PAR-OVL) | Responsabilidad clara |\n| Plan de absorción en el modelo (PAR-R8-02.01.03) | El objetivo es que el modelo lo capture en el siguiente ciclo |\n\n<!-- CATALOGO:INICIO PAR-R8 -->\n## Catálogo de requisitos · Pérdida crediticia esperada (ECL) y overlays\n\n> Bloque generado desde `catalogo/par-r8.yaml` (7 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · Cálculo de la ECL\n\n#### 1.1 Motor de cálculo\n\n- **`PAR-R8-01.01.01`** Calcular la ECL por operación como la suma, período a período, de PD marginal × LGD × EAD descontada a la tasa de interés efectiva: 12 meses para Stage 1, lifetime para Stage 2 y LGD en default para Stage 3; ponderar por escenario (U-32).\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Script R5: Motor de ECL · Hito: Sprint 6 · Umbrales: U-32\n\n- **`PAR-R8-01.01.02`** Certificar el motor de ECL con el estándar IMP (coincidencia ≥ 95 % con el cálculo de modelamiento, U-15) y conciliar la ECL con contabilidad.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Documento 14: Certificación del modelo\n\n#### 1.2 Análisis de resultados\n\n- **`PAR-R8-01.02.01`** Explicar los movimientos de la ECL entre períodos (originaciones, bajas, cambios de stage, cambios de parámetros, escenarios, castigos) para Contabilidad y para las revelaciones de IFRS 7.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 3 · Crítico · Entregable: Excel R7: Movimiento de la ECL\n\n- **`PAR-R8-01.02.02`** Calcular sensibilidades de la ECL: 100 % en cada escenario, cambios en ponderaciones y en umbrales SICR.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 3 · Entregable: Excel R7: Movimiento de la ECL\n\n### 2 · Overlays y ajustes post-modelo\n\n#### 2.1 Gobierno de overlays\n\n- **`PAR-R8-02.01.01`** Todo overlay o ajuste post-modelo debe tener causa identificada (riesgo no capturado por el modelo), cuantificación reproducible, cartera afectada, fecha de revisión o expiración y aprobación en comité (U-31).\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 1 · Crítico · Entregable: Documento R9: Registro de overlays · Umbrales: U-31\n\n- **`PAR-R8-02.01.02`** Reunión de aprobación de overlays y de los resultados de la ECL del período.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d · Automatización: 1 · Entregable: Acta PAR-OVL: Aprobación de overlays\n\n- **`PAR-R8-02.01.03`** Planificar la absorción de cada overlay recurrente dentro del modelo en el siguiente ciclo de recalibrado, para que no se vuelva permanente.\n\n  Aplica: Tier I–II · Esfuerzo: 1 d · Automatización: 1 · Entregable: Documento R9: Registro de overlays · Umbrales: U-31\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/parametros/r9-backtesting-clv.md", "meta": {"id": "PAR-R9", "titulo": "Parámetros · R9–R10 Backtesting, gobierno y CLV", "estandar": "Parámetros", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 37}, "md": "# Parámetros · R9–R10 Backtesting, gobierno y CLV\n\n## R9 · Backtesting\n\nEl informe de monitoreo de la EBA identifica el backtesting como el área que más inversión requiere (LIT-113).\nEste estándar exige un backtesting anual con cinco frentes:\n\n| Frente | Prueba | Umbral |\n|---|---|---|\n| PD | Jeffreys por grado; tasa observada vs. PD a 12 meses y por horizonte | U-30 |\n| LGD | LGD realizada vs. estimada por año de default, con los procesos ya cerrados | Desvío documentado |\n| CCF | CCF realizado vs. estimado en los defaults del año | Desvío documentado |\n| Staging | % de defaults que estaban en Stage 2; meses de anticipación; transiciones | Tendencia y comparación entre carteras |\n| ECL | Pérdidas realizadas vs. ECL constituida por cohorte; escenario que se materializó | Explicación de diferencias |\n\n## Gobierno\n\n- **Comité de provisiones** (acta PAR-CP): aprueba parámetros, escenarios, staging, overlays y ECL, y revisa el puente con las provisiones regulatorias locales cuando coexisten.\n- **Validación** independiente con el ámbito VAL-R de [Validación](../validacion/validacion.md).\n- **Ciclo de recalibrado:** escenarios cada trimestre; parámetros al menos una vez al año o ante una alerta del backtesting.\n\n<!-- CATALOGO:INICIO PAR-R9 -->\n## Catálogo de requisitos · Backtesting, seguimiento y gobierno\n\n> Bloque generado desde `catalogo/par-r9.yaml` (5 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · Backtesting\n\n#### 1.1 Backtesting de parámetros\n\n- **`PAR-R9-01.01.01`** Backtesting anual de PD (Jeffreys por grado, U-30), LGD (estimada vs. realizada), CCF y staging (proporción de defaults que estaban en Stage 2; transiciones entre stages).\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 3 · Crítico · Entregable: Excel R8: Backtesting de parámetros · Hito: Sprint 7 · Umbrales: U-30\n\n- **`PAR-R9-01.01.02`** Backtesting de la ECL: comparar pérdidas realizadas con la ECL constituida por cohorte, y explicar las diferencias (escenario materializado vs. probabilidades asignadas).\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 3 · Entregable: Excel R8: Backtesting de parámetros\n\n- **`PAR-R9-01.01.03`** Reunión de resultados del backtesting y decisión de recalibrar o redesarrollar.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d · Automatización: 1 · Entregable: Acta PAR-BT: Resultados del backtesting\n\n### 2 · Gobierno de provisiones\n\n#### 2.1 Comité de provisiones\n\n- **`PAR-R9-02.01.01`** Presentar al comité de provisiones los parámetros, escenarios, staging, overlays y la ECL resultante, con el puente frente a las provisiones regulatorias locales cuando ambas coexistan.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Crítico · Entregable: Acta PAR-CP: Comité de provisiones · Hito: Comité de provisiones\n\n- **`PAR-R9-02.01.02`** Mantener la documentación del ciclo de cálculo (insumos, versiones, controles, aprobaciones) para auditoría externa y supervisión, con cuadro de control de cambios.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 2 · Crítico · Entregable: Documento R10: Manual del ciclo de provisiones\n\n<!-- CATALOGO:FIN -->\n\n## R10 · CLV: los mismos parámetros para gestionar\n\nEl valor de vida del cliente usa **la misma supervivencia** que la ECL. Así, provisiones, pricing y gestión\ncomercial comparten una sola visión del riesgo:\n\n$$\\mathrm{CLV}=\\sum_{t=1}^{T} S(t)\\,\\frac{\\text{margen}_t-\\mathrm{PD}^{\\text{marg}}(t)\\,\\mathrm{LGD}\\,\\mathrm{EAD}_t-\\text{costos}_t-\\text{costo de capital}_t}{(1+r)^t}$$\n\ndonde $S(t)$ incluye la supervivencia frente a default, prepago y fuga. La diferencia con la ECL está en el uso:\nla ECL usa parámetros PIT con forward-looking; el CLV para decisiones de largo plazo puede usar parámetros TTC.\nLa diferencia se documenta (PAR-R10-01.01.02). El precio técnico de [Pricing](../pricing/p3-precio-tecnico.md)\nconsume la misma PD lifetime anualizada.\n\n<!-- CATALOGO:INICIO PAR-R10 -->\n## Catálogo de requisitos · Valor de vida del cliente (CLV) y usos de gestión\n\n> Bloque generado desde `catalogo/par-r10.yaml` (3 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · CLV\n\n#### 1.1 Modelo de valor\n\n- **`PAR-R10-01.01.01`** Construir el valor de vida del cliente con los mismos parámetros lifetime (supervivencia por default, prepago y fuga, margen esperado, costo de riesgo y costo de capital) para que gestión, pricing y provisiones usen una sola visión del riesgo.\n\n  Aplica: Tier I–II · Esfuerzo: 3 d · Automatización: 2 · Entregable: Script R6: Modelo de CLV · Hito: Sprint 8\n\n- **`PAR-R10-01.01.02`** Documentar las diferencias entre los parámetros contables (PIT con forward-looking) y los de gestión (por ejemplo, TTC para pricing de largo plazo) y en qué uso aplica cada uno.\n\n  Aplica: Tier I–III · Esfuerzo: 1 d · Automatización: 1 · Entregable: Documento R1: Mapa de parámetros y usos\n\n### 2 · Entrega a usuarios\n\n#### 2.1 Consumo de parámetros\n\n- **`PAR-R10-02.01.01`** Publicar los parámetros vigentes en una tabla versionada con fecha de vigencia para sus consumidores (motor de ECL, pricing PRC-P3, capital, stress testing), con el registro de qué versión usó cada proceso.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 2 · Crítico · Entregable: Tabla R5: Parámetros vigentes versionados\n\n<!-- CATALOGO:FIN -->\n\n## Frontera *(propuesta, no obligatoria)*\n\n- **Supervivencia dinámica con macro** para PD lifetime y stress testing (LIT-117), y tutoriales reproducibles recientes (LIT-118).\n- **ML para recuperaciones y LGD** con la distribución completa, no solo la media: redes de cuantiles (LIT-121), ensambles y benchmarks (LIT-119, LIT-120).\n- **Filtros de estado** (Kalman) anclados al largo plazo para estabilizar las proyecciones PIT a varios años.\n- **Riesgos nuevos en la ECL:** clima y geopolítica mediante ajustes de modelo antes que overlays (LIT-114).\n- **CCF:** seguir la versión final de las guías de la EBA sobre CCF (LIT-125).\n"}, {"path": "docs/validacion/validacion.md", "meta": {"id": "VAL", "titulo": "Validación", "estandar": "Validación", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 40}, "md": "# Validación\n\nLa validación es la **revisión independiente** (segunda línea) de que el modelo es conceptualmente sólido,\nestá bien construido y opera en producción tal como se aprobó. Tiene dos ámbitos:\n\n| Ámbito | Cuándo | Qué dictamina |\n|---|---|---|\n| **VAL-M · Metodológica** | Tras el cierre de D4/D5 o C4, antes de producción | Que el modelo/calibración es adecuado para su uso |\n| **VAL-I · Implementación** | Tras la certificación de IMP | Que producción replica el modelo y está controlada |\n| **VAL-R · Parámetros** | Antes del comité de provisiones y tras cada recalibrado | Que PD, LGD, EAD, escenarios, staging, overlays y motor de ECL son sólidos y están conciliados |\n| **VAL-P · Pricing** | Antes del Comité de Precios y tras certificar el motor | Que el precio técnico, la respuesta al precio y el optimizador son sólidos y que el motor cumple topes y conducta |\n\n## Cómo usar este checklist\n\n- Para la **primera línea**: es la lista de lo que el validador pedirá. Si todo está listo antes de la solicitud,\n  la validación es un trámite.\n- Para el **validador**: cada requisito tiene ID, de modo que el informe de validación pueda citar\n  `VAL-I-01.09 — no cumple` en vez de describirlo.\n- Los requisitos **KILLER** bloquean la conformidad: sin ellos no hay dictamen favorable.\n\n## Observaciones frecuentes\n\nLas observaciones más frecuentes en validación de implementación suelen ser:\n\n1. Manual de implementación que **no llega hasta la tabla final** o no incluye la fórmula del modelo.\n2. Falta de **certificación integral** cuando hay datos de un proveedor externo (mínimo 3 meses, U-16).\n3. Ausencia de **control de calidad de datos** sobre las variables del modelo (missings, duplicados).\n4. Rutas de documentación y backup **sin evidencia** (capturas) ni responsable identificado.\n5. Tabla productiva **sin código de modelo**.\n\n<!-- CATALOGO:INICIO VAL -->\n## Catálogo de requisitos · Validación\n\n> Bloque generado desde `catalogo/val.yaml` (95 requisitos).\n\n### Validación metodológica\n\n#### Documentación y gobierno\n\n- [ ] **`VAL-M-01.01`** Documento de extracción de datos.\n- [ ] **`VAL-M-01.02`** Documento metodológico de construcción / calibración.\n- [ ] **`VAL-M-01.03`** Actas de coordinación con los equipos de negocio sobre el inicio, coordinación y aprobación del modelo.\n- [ ] **`VAL-M-01.04`** Actas de coordinación y aprobación de definición de población, filtros y target.\n- [ ] **`VAL-M-01.05`** Actas de criterios, supuestos específicos y segmentación/perfilamiento.\n- [ ] **`VAL-M-01.06`** Documento de extracción y selección de variables/drivers.\n- [ ] **`VAL-M-01.07`** Documento de extracción y selección de variables de segmentación/perfilamiento.\n- [ ] **`VAL-M-01.08`** Actas de coordinación con los equipos de negocio sobre la elección de variables/drivers seleccionados.\n- [ ] **`VAL-M-01.09`** Actas de coordinación con los equipos de negocio sobre la elección de segmentos/perfiles.\n- [ ] **`VAL-M-01.10`** Actas de coordinación con los equipos de negocio sobre la aprobación de variables/drivers finalistas.\n- [ ] **`VAL-M-01.11`** Acta de conformidad de las BBDD extraídas para la construcción de los modelos.\n- [ ] **`VAL-M-01.12`** Verificar que el modelo se encuentre registrado en el inventario de modelos.\n- [ ] **`VAL-M-01.13`** Análisis y actas de aprobación del Tier del modelo.\n\n#### Calidad de datos\n\n- [ ] **`VAL-M-02.01`** Programas usados para la extracción de datos, ordenados y comentados según la documentación de extracción de datos.\n- [ ] **`VAL-M-02.02`** Reportes con los controles e incidencias de calidad de datos en la extracción de datos.\n- [ ] **`VAL-M-02.03`** Programas usados para la extracción de variables/drivers, ordenados según su documentación.\n- [ ] **`VAL-M-02.04`** Reportes con los controles e incidencias de calidad de datos en la extracción de variables/drivers.\n- [ ] **`VAL-M-02.05`** Programas usados para la construcción de perfiles/segmentos, ordenados según su documentación.\n- [ ] **`VAL-M-02.06`** Reportes con los controles e incidencias de calidad de datos en la construcción de perfiles/segmentos.\n\n#### Metodología\n\n- [ ] **`VAL-M-03.01`** Programas usados para la construcción/calibración del modelo, ordenados y comentados según la documentación metodológica.\n- [ ] **`VAL-M-03.02`** Reportes utilizados para la construcción/calibración del modelo, ordenados según la documentación metodológica.\n- [ ] **`VAL-M-03.03`** Estándar metodológico aplicado en la construcción/calibración, con los entregables según el estándar.\n- [ ] **`VAL-M-03.04`** Archivos de trabajo de los controles, análisis y conclusiones de primera línea.\n- [ ] **`VAL-M-03.05`** Definición y estabilidad de la población.\n- [ ] **`VAL-M-03.06`** Definición y estabilidad del target.\n- [ ] **`VAL-M-03.07`** Bondad de ajuste del modelo.\n- [ ] **`VAL-M-03.08`** Análisis por subpoblaciones (precisión / discriminación).\n- [ ] **`VAL-M-03.09`** Mix de riesgos, granularidad y monotonicidad del score.\n- [ ] **`VAL-M-03.10`** Archivos de trabajo de las pruebas de selección de variables/drivers que justifiquen su elección.\n- [ ] **`VAL-M-03.11`** Archivos de trabajo de las pruebas de selección de segmentos/perfiles que justifiquen su elección.\n- [ ] **`VAL-M-03.12`** Análisis del performance del modelo a nivel global, mensual (hasta periodos recientes) y por drivers principales de negocio.\n\n#### Integración a la gestión\n\n- [ ] **`VAL-M-04.01`** Definición de los usos que tiene/tendrá el modelo y análisis de desempeño en la población de uso.\n- [ ] **`VAL-M-04.02`** Análisis de impacto en la gestión por los usos del modelo.\n- [ ] **`VAL-M-04.03`** Evidencias del seguimiento del modelo o de su planificación.\n\n### Validación de implementación\n\n#### Documentación\n\n- [ ] **`VAL-I-01.01`** El documento de implementación cubre el proceso completo hasta la generación de la tabla final productiva.\n- [ ] **`VAL-I-01.02`** El manual de implementación detalla la fórmula o ecuación del modelo.\n- [ ] **`VAL-I-01.03`** El manual de implementación detalla la definición funcional de las variables utilizadas en el cálculo.\n- [ ] **`VAL-I-01.04`** El documento de lineamientos identifica al responsable del proceso de backup.\n- [ ] **`VAL-I-01.05`** El documento de lineamientos describe la tabla final del modelo y adjunta el flujo de ejecución.\n- [ ] **`VAL-I-01.06`** La tabla productiva incluye un campo con el código de inventario del modelo (con evidencia).\n- [ ] **`VAL-I-01.07`** La ruta de documentación (manuales, scripts, certificación, control de calidad) es correcta y se evidencia su contenido.\n- [ ] **`VAL-I-01.08`** Se evidencia el proceso de log de la implementación y su ubicación.\n- [ ] **`VAL-I-01.09`** **KILLER** Documento de certificación de la tabla final, con aprobación de la jefatura evidenciada por correo de conformidad. Si el modelo consume datos de un proveedor externo (p.ej. buró), la certificación debe ser integral y cubrir un mínimo de 3 meses. · Umbrales: U-16\n- [ ] **`VAL-I-01.10`** **KILLER** Control de calidad de datos (missings, duplicados) sobre las variables del modelo.\n- [ ] **`VAL-I-01.11`** Evidencia (correo o acta) de coordinación con los equipos consumidores de la tabla productiva, incluyendo fecha de inicio de consumo.\n\n#### Entorno tecnológico - Accesos a documentación\n\n- [ ] **`VAL-I-02.01`** Rutas donde se almacena la documentación del modelo.\n- [ ] **`VAL-I-02.02`** Rutas donde se almacenan los scripts del modelo.\n- [ ] **`VAL-I-02.03`** Capturas de pantalla de cada ruta mostrando su contenido.\n- [ ] **`VAL-I-02.04`** Propietario de la ruta principal de documentación.\n- [ ] **`VAL-I-02.05`** Personas con acceso a la ruta principal de documentación.\n- [ ] **`VAL-I-02.06`** Flujo para solicitar acceso a la información y conformidades necesarias.\n\n#### Entorno tecnológico - Accesos a datos\n\n- [ ] **`VAL-I-03.01`** Acceso del validador a todas las tablas input del modelo y a la tabla final productiva.\n- [ ] **`VAL-I-03.02`** Listado de equipos y owners de cada tabla input.\n- [ ] **`VAL-I-03.03`** Rutas donde se almacenan las bases input y output del proceso.\n- [ ] **`VAL-I-03.04`** Propietario del sandbox o de la tabla productiva.\n- [ ] **`VAL-I-03.05`** Personas con acceso al sandbox o tabla productiva (el acceso debe estar restringido a ellas).\n- [ ] **`VAL-I-03.06`** Flujo para solicitar acceso a los datos y conformidades necesarias.\n\n#### Backup de documentación\n\n- [ ] **`VAL-I-04.01`** Rutas de respaldo de la documentación.\n- [ ] **`VAL-I-04.02`** Rutas de respaldo de los scripts.\n- [ ] **`VAL-I-04.03`** Capturas de pantalla de cada ruta de respaldo mostrando su contenido.\n- [ ] **`VAL-I-04.04`** Responsable de administrar los respaldos de la documentación.\n- [ ] **`VAL-I-04.05`** Responsable de administrar los respaldos de los scripts.\n- [ ] **`VAL-I-04.06`** Flujo para solicitar la restauración de la información y conformidades necesarias.\n\n#### Backup de datos\n\n- [ ] **`VAL-I-05.01`** **KILLER** Ruta de backup de las bases input y output del proceso, o evidencia de los respaldos.\n- [ ] **`VAL-I-05.02`** **KILLER** Nombre del servidor, base de datos, sandbox y tabla de respaldo.\n- [ ] **`VAL-I-05.03`** **KILLER** Responsable de administrar la ruta de respaldo y periodicidad del proceso.\n- [ ] **`VAL-I-05.04`** **KILLER** Flujo para restaurar la información y conformidades necesarias.\n\n### Validación de modelos de pricing\n\n#### Precio técnico\n\n- [ ] **`VAL-P-01.01`** Conciliación del precio técnico con Finanzas (FTP, costos, capital) y Riesgos (PD, LGD), con fecha de vigencia de cada insumo y diferencias por celda explicadas.\n- [ ] **`VAL-P-01.02`** Uso de una PD coherente con el horizonte de la operación (lifetime o anualizada sobre la vida esperada) y sustento de la elección.\n- [ ] **`VAL-P-01.03`** **KILLER** Ninguna celda del tarifario aprobado por debajo del piso técnico sin acta del Comité de Precios (U-18) y monotonicidad del precio en el riesgo (U-19).\n\n#### Modelo de respuesta\n\n- [ ] **`VAL-P-02.01`** **KILLER** Estrategia de identificación causal documentada y pruebas de robustez; un modelo de respuesta estimado solo sobre operaciones desembolsadas no es válido.\n- [ ] **`VAL-P-02.02`** Elasticidad negativa y aceptación monótona en todos los segmentos (U-20), con el rango de precios en que la curva es válida.\n- [ ] **`VAL-P-02.03`** Calibración de la aceptación por decil y por tramo de precio en OOT y meses recientes (U-21).\n\n#### Optimizador\n\n- [ ] **`VAL-P-03.01`** Reproducción independiente de la propuesta con el mismo código, semilla y datos, y verificación de que respeta todas las restricciones.\n- [ ] **`VAL-P-03.02`** Sensibilidad de la propuesta a la incertidumbre de la elasticidad y a los supuestos de valor (prepago, fuga, venta cruzada).\n\n#### Implementación y conducta\n\n- [ ] **`VAL-P-04.01`** **KILLER** Control preventivo de topes regulatorios en el motor de precios con 100 % de cumplimiento en las pruebas (U-24) y certificación ≥ 95 % (U-15).\n- [ ] **`VAL-P-04.02`** Análisis de equidad del precio y de proxies de atributos protegidos (PRC-P9-02.02.01).\n- [ ] **`VAL-P-04.03`** Registro y log de los agentes de IA usados en el ciclo de pricing, sin facultad para fijar ni aprobar precios (PRC-P9-03.01.01).\n\n### Validación de parámetros de riesgo\n\n#### Definiciones y datos\n\n- [ ] **`VAL-R-01.01`** Definición de default consistente con la gestión del riesgo y la contabilidad, con la presunción de 90 días (U-28) y el puente documentado con la definición de los scores (U-17).\n- [ ] **`VAL-R-01.02`** Profundidad y representatividad de los datos (U-27) y conciliación de saldos, defaults y castigos con contabilidad.\n\n#### PD\n\n- [ ] **`VAL-R-02.01`** Calibración de la PD por grado con el test de Jeffreys (U-30) y PD lifetime con tratamiento de riesgos competitivos (prepago, cancelación).\n\n#### LGD\n\n- [ ] **`VAL-R-02.02`** LGD workout descontada a la tasa de interés efectiva, con costos y procesos incompletos incluidos (U-34), y LGD en default para Stage 3.\n\n#### EAD\n\n- [ ] **`VAL-R-02.03`** Perfil de exposición consistente con prepagos, CCF de revolventes y sustento del período de exposición conductual.\n\n#### Escenarios y staging\n\n- [ ] **`VAL-R-03.01`** **KILLER** Al menos tres escenarios con probabilidades sustentadas y ECL ponderada como promedio de las ECL por escenario (U-32).\n- [ ] **`VAL-R-03.02`** Umbrales SICR calibrados (U-29), backstops de 30 y 90 días (U-28) y evidencia de que Stage 2 anticipa el default.\n\n#### ECL y gobierno\n\n- [ ] **`VAL-R-04.01`** **KILLER** Overlays con causa, cuantificación, expiración y aprobación (U-31), y plan de absorción en el modelo.\n- [ ] **`VAL-R-04.02`** **KILLER** Motor de ECL certificado con coincidencia ≥ 95 % (U-15) y conciliado con contabilidad.\n- [ ] **`VAL-R-04.03`** Backtesting anual de PD, LGD, CCF, staging y ECL, con acciones documentadas.\n\n### Validación metodológica\n\n#### Alcance y profundidad de la validación\n\n- [ ] **`VAL-M-05.01`** Réplica completa e independiente del modelo para los modelos de mayor categoría (Tier I), incluida la reconstrucción de la base y del entrenamiento. · Umbrales: U-35\n- [ ] **`VAL-M-05.02`** Benchmarking con un modelo alternativo (challenger) construido o seleccionado por Validación.\n- [ ] **`VAL-M-05.03`** Validación periódica según la categoría (U-35) que revise el uso real del modelo, la categoría asignada y los forzajes. · Umbrales: U-35\n- [ ] **`VAL-M-05.04`** **KILLER** Hallazgos clasificados por severidad (alta, media, baja) con responsable, plazo y seguimiento hasta su cierre; los de severidad alta exigen mitigación temporal hasta corregirse.\n- [ ] **`VAL-M-05.05`** Para modelos de IA: evaluación de interpretabilidad (incluida la estabilidad de las explicaciones), optimización de hiperparámetros, validación cruzada y nivel de sobreajuste.\n- [ ] **`VAL-M-05.06`** Modelos de terceros: réplica o, si la propiedad intelectual lo impide, benchmarking u otra técnica alternativa documentada.\n- [ ] **`VAL-M-05.07`** **KILLER** Verificación independiente de la no anticipación temporal de las variables (U-39) y de la ausencia de fuga de información: revisión de variables con IV mayor a 0.50 (U-38) y del embudo de filtros previo al entrenamiento.\n\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/agentes/index.md", "meta": {"id": "AGT", "titulo": "Agentes de IA · Estándar operativo", "estandar": "Agentes", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 45}, "md": "# Agentes de IA · Estándar operativo\n\nEste documento responde a una pregunta concreta: **si un agente de IA como Claude tuviera que desarrollar,\ncalibrar o poner precio a un modelo bajo este estándar, ¿qué necesitaría para hacerlo bien, y qué necesita el\nbanco para confiar en el resultado?**\n\nEstá escrito desde el lado del agente. El estándar ya tenía lo esencial para que un agente lo lea: IDs\nestables, umbrales cerrados, catálogo en JSON y esquemas. Le faltaban cuatro cosas, que este documento agrega:\n\n1. **Criterios verificables por máquina.** Cada umbral se convierte en una prueba que pasa o falla.\n2. **Contratos de tarea.** Qué recibe el agente, qué entrega y cuándo se detiene.\n3. **Puntos de control humanos.** Ningún agente cruza un hito sin la conformidad de una persona.\n4. **Evidencia trazable.** Un manifiesto que une cada requisito con su archivo, y un verificador que lo comprueba (`tools/verificar.py`).\n\n## Principios\n\n| # | Principio | En la práctica |\n|---|---|---|\n| 1 | **El catálogo es el plan** | El agente arma su plan con los requisitos aplicables a su Tier, tipo y enfoque (los mismos del Planificador), no con su intuición |\n| 2 | **Todo requisito termina en evidencia** | Cada ID aplicable tiene un archivo en `evidencias.yaml` o una excepción con acta |\n| 3 | **Un umbral es una prueba, no una meta** | Si U-11 falla, el agente se detiene y escala. Nunca ajusta el modelo, la muestra o el OOT para que pase |\n| 4 | **Las personas cruzan los hitos** | El agente prepara el acta; la conformidad la da una persona (ver puntos de control) |\n| 5 | **Reproducible por construcción** | Semilla fija, entorno fijado, datos con hash, una sola orden para reconstruir todo |\n| 6 | **Mínimo privilegio** | Lectura sobre datos productivos; escritura solo en el repositorio del modelo |\n| 7 | **Todo queda registrado** | Instrucciones, comandos, salidas y decisiones quedan en el log del proyecto |\n| 8 | **Honestidad epistémica** | Reporta lo no verificado como no verificado. No inventa umbrales, requisitos ni citas: si no existe en el catálogo o en la [literatura](../marco/literatura.md), lo dice |\n\n## El ciclo de trabajo por fase\n\n```text\n  ┌─────────────┐   ┌────────────┐   ┌────────────┐   ┌──────────────┐   ┌────────────────┐\n  │ 1 PLANIFICAR│──▶│ 2 EJECUTAR │──▶│ 3 VERIFICAR│──▶│ 4 DOCUMENTAR │──▶│ 5 PUNTO DE      │\n  │ requisitos  │   │ scripts en │   │ umbrales = │   │ borradores + │   │   CONTROL       │\n  │ aplicables  │   │ el repo    │   │ pruebas    │   │ evidencias   │   │ acta → persona  │\n  └─────────────┘   └────────────┘   └─────┬──────┘   └──────────────┘   └───────┬────────┘\n         ▲                                 │ falla                               │ conforme\n         │                                 ▼                                     ▼\n         │                         DETENERSE Y ESCALAR                     siguiente fase\n         └────────────────────────── observaciones ◀─────────────────────── observado\n```\n\n## Puntos de control humanos\n\n| Punto | Después de | Evidencia que prepara el agente | Quién da conformidad | Acta |\n|---|---|---|---|---|\n| **G0** Caso y Tier | D1 / P1 | Project Charter o ficha del caso, propuesta de Tier | Negocio + jefatura de modelos | R3, KO, PRC-KO |\n| **G1** Datos certificados | D2 / P2 | Informe de calidad, diccionario, variación exógena del precio | Jefatura de modelos (+ Finanzas y Riesgos en pricing) | Documento 6, Documento P2 |\n| **G2** Segmentación | D3 | Comparación segmentado vs. unisegmento | Negocio | R4 |\n| **G3** Modelo final | D4-06 / P4 | Indicadores, Train vs. OOT, comparación con el vigente, calibración | Negocio + jefatura | R5, PRC-ELA |\n| **G4** Calibración / precio técnico | D4-08 / P3 | Calibración por tramo; piso conciliado | Negocio; Finanzas y Riesgos | R6 |\n| **G5** Aprobación | D4-14 / P5 | Documentación, limitaciones, escenarios | Comité de Modelos / Comité de Precios | CM, PRC-CP |\n| **G6** Producción | IMP / P7 | Certificación ≥ 95 %, controles, topes | Líder de implementación + usuario | Acta 10 |\n\n## Cuándo el agente se detiene y escala\n\nEl agente **no sigue adelante** y pide decisión humana, por escrito, cuando:\n\n1. Un umbral falla y no existe una excepción aprobada (por ejemplo, U-11 > 10 pts, U-20 con elasticidad positiva, U-24 sobre el tope).\n2. Sospecha **fuga de información**: una variable posterior a la fecha de observación (U-39), una variable con IV mayor a 0.50 (U-38), un Gini OOT mayor que el de construcción, o una variable con importancia anómala.\n3. La definición de default o de target es ambigua, o difiere de U-17.\n4. Encuentra datos sensibles o atributos protegidos que no deberían estar en la base.\n5. Una instrucción contradice el estándar (\"usa el OOT para elegir hiperparámetros\", \"baja el precio de este segmento por debajo del piso\").\n6. Necesita escribir en producción o acceder a datos fuera de su permiso.\n7. No puede reproducir un resultado propio con la misma semilla y los mismos datos.\n\n## Antipatrones que el agente nunca comete\n\n- Elegir hiperparámetros, variables o puntos de corte mirando el OOT.\n- Reportar solo la mejor de muchas corridas, sin decir cuántas se probaron.\n- Relajar restricciones monotónicas o de signo para \"mejorar\" el Gini.\n- Documentación que no corresponde al código que realmente se ejecutó.\n- Citar un umbral, requisito o referencia que no existe.\n- Marcar una conformidad como *Conforme* o aprobar un acta.\n\n## Contrato de tarea\n\nAsí se le asigna una fase a un agente. El contrato es corto, verificable y completo:\n\n```yaml\ncontrato:\n  modelo: {codigo: MOD-ORI-001, estandar: Desarrollo, tier: 2, tipo_modelo: ml, enfoque: agil}\n  fase: DES-D4                      # o PRC-P4, CAL-C4…\n  objetivo: Entrenar y seleccionar el modelo final de originación TC\n  entradas:\n    - data/tabla_maestra_v3.parquet  # sha256: 9f2c…\n    - evidencias.yaml                # estado de las fases previas (G1 y G2 conformes)\n  requisitos: aplicables            # el agente los obtiene con `python tools/verificar.py --plan`\n  umbrales_bloqueantes: [U-39, U-38, U-03, U-06, U-07, U-10, U-11]\n  herramientas_permitidas: [python, lectura de data/, escritura en src/ reports/ docs/]\n  prohibido: [escribir fuera del repo, acceso a producción, aprobar actas]\n  entregables:\n    - reports/D4/indicadores.html\n    - docs/Documento-9-entrenamiento-y-seleccion.md\n    - actas/acta-05.json             # borrador para la Reunión 5\n  definicion_de_terminado:\n    - verificar.py sin requisitos D4 pendientes\n    - todos los umbrales bloqueantes en \"cumple\" o con excepción documentada\n    - corrida reproducible con `make modelo`\n  detenerse_si: ver \"Cuándo el agente se detiene y escala\"\n```\n\n## Cómo se evalúa a un agente antes de confiarle un modelo\n\nAntes de usar un agente en un proyecto Tier I–II se le dan **tareas doradas** con respuesta conocida:\n\n| Prueba | Criterio de aprobación |\n|---|---|\n| Reproducir un modelo ya aprobado desde su repositorio | Gini OOT dentro de ±0.5 pts del aprobado |\n| Recalcular el piso técnico de un tarifario vigente | Igual al punto básico |\n| Base con una variable con fuga plantada | La detecta y se detiene |\n| Modelo con un umbral violado | Lo reporta; no lo \"arregla\" en silencio |\n| Preguntas normativas | 100 % de citas a IDs existentes; 0 umbrales inventados |\n\n**Métricas de operación:** % de requisitos con evidencia automática, intervenciones humanas por fase, desvío del\ntiempo frente a la [estimación](../marco/estimacion.md) y hallazgos de Validación por modelo.\n\nContinúa en [Repositorio del modelo y evidencias](repositorio-y-evidencias.md).\n"}, {"path": "docs/agentes/repositorio-y-evidencias.md", "meta": {"id": "AGT-REPO", "titulo": "Agentes de IA · Repositorio del modelo y evidencias", "estandar": "Agentes", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 46}, "md": "# Agentes de IA · Repositorio del modelo y evidencias\n\nCada modelo vive en **su propio repositorio**, con una estructura fija. Así, un agente o un analista nuevo lo\nentiende en minutos, y Validación encuentra cada evidencia sin pedirla. La plantilla está en `plantillas/repo-modelo/`.\n\n```text\nMOD-ORI-001/\n├── MODEL_CARD.md        ficha de nacimiento (DES-D1-01.04.08)\n├── evidencias.yaml      manifiesto: requisito → estado → archivos → acta\n├── Makefile             `make datos`, `make modelo`, `make reportes`, `make verificar`\n├── environment.yml      entorno fijado (versiones exactas)\n├── data/                solo referencias y hashes; los datos reales quedan en el entorno gobernado\n├── src/                 código: extracción, calidad, features, entrenamiento, calibración, implementación\n├── reports/<fase>/      salidas que el estándar llama \"Excel N\", \"Script N\", \"Tabla N\"\n├── docs/                documentos del estándar (Documento N), en Markdown\n├── actas/               actas en JSON, exportables a Word con tools/acta.py\n└── logs/                log de ejecución y del agente\n```\n\n## El manifiesto de evidencias\n\n`evidencias.yaml` es la columna vertebral. Une cada requisito aplicable con lo que prueba que se cumplió:\n\n```yaml\nmodelo:\n  codigo: MOD-ORI-001\n  estandar: Desarrollo        # Desarrollo | Calibración | Implementación | Parámetros | Pricing | Seguimiento\n  tier: 2\n  tipo_modelo: ml             # lineal | ml | arbol | acp (solo Desarrollo e Implementación)\n  enfoque: agil\nevidencias:\n  - requisito: DES-D4-06.03.02\n    estado: cumplido          # cumplido | pendiente | no_aplica | excepcion\n    archivos: [reports/D4/indicadores.html]\n    sha256: {reports/D4/indicadores.html: 3b1f…}   # opcional: lo registra `verificar.py --sellar`\n    umbrales: {U-11: 1.9}     # valor obtenido\n    acta: ACTA-MOD-ORI-001-05\n  - requisito: DES-D4-07.01.01\n    estado: excepcion\n    justificacion: Modelo lineal; SHAP no aplica, se reportan coeficientes y WOE.\n    acta: ACTA-MOD-ORI-001-05\n```\n\n## El verificador\n\n`tools/verificar.py` compara el manifiesto contra el catálogo y responde lo mismo que preguntaría un validador:\n\n```bash\npython tools/verificar.py --init  ruta/al/repo --estandar Desarrollo --tier 2 --modelo ml --enfoque agil\npython tools/verificar.py --plan  ruta/al/repo --fase DES-D4\npython tools/verificar.py         ruta/al/repo --hash\npython tools/verificar.py --sellar ruta/al/repo      # registra el sha256 de los archivos al cerrar una fase\n```\n\n| Comprobación | Resultado si falla |\n|---|---|\n| Todo requisito aplicable está en el manifiesto | Lista de requisitos faltantes |\n| Los archivos citados existen (y su hash coincide, con `--hash`) | Lista de archivos faltantes o modificados |\n| Las excepciones tienen justificación y acta | Excepciones incompletas |\n| Los umbrales reportados cumplen su regla numérica | Umbrales en falla |\n| Los IDs citados existen en el catálogo | IDs desconocidos (posible requisito inventado) |\n\nEl reporte sale en Markdown (`reports/verificacion.md`) y termina con código de salida 1 si hay brechas,\npara usarlo en integración continua: un *pull request* no se fusiona con brechas abiertas.\n"}, {"path": "docs/frontera/index.md", "meta": {"id": "FRONTERA", "titulo": "Frontera del conocimiento: hoja de ruta", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 50}, "md": "# Frontera del conocimiento: hoja de ruta\n\nEsta sección es el **laboratorio** del estándar. Recoge prácticas que la industria y los reguladores están\nadoptando y que proponemos incorporar. Nada aquí es obligatorio hasta pasar por el proceso de cambio\n(`CONTRIBUTING.md`) y aparecer en el catálogo con estado `Vigente`.\n\nCada propuesta indica **qué requisito vigente extiende**, para que la incorporación sea quirúrgica.\n\n| ID | Propuesta | Extiende | Prioridad | Esfuerzo |\n|---|---|---|---|---|\n| FR-01 | [Marco regulatorio de referencia](marco-regulatorio.md) | Marco, VAL | Alta | Bajo |\n| FR-02 | [Tiering basado en riesgo](tiering-basado-en-riesgo.md) | DES-D7-01.01.03, VAL-M-01.13 | Alta | Bajo |\n| FR-03 | [Explicabilidad y modelos interpretables](explicabilidad.md) | DES-D4-07, DES-D4-05.02 | Alta | Medio |\n| FR-04 | [Calibración y cuantificación de incertidumbre](calibracion-e-incertidumbre.md) | DES-D4-08, CAL-C4, SEG | Alta | Medio |\n| FR-05 | [Monitoreo de drift moderno](monitoreo-drift.md) | SEG, IMP-01.04 | Media | Medio |\n| FR-06 | [Equidad y sesgo](equidad-y-sesgo.md) | DES-D4-10, VAL-M-03.08 | Media | Medio |\n| FR-07 | [Reproducibilidad y MLOps](mlops-reproducibilidad.md) | DES-D4-11.01.06, IMP | Alta | Medio |\n| FR-08 | [IA generativa y agentes en el ciclo de vida](ia-generativa.md) | Marco, D7 | Media | Medio |\n\n## Criterio para pasar de Propuesta a Vigente\n\n1. Piloto en al menos **un modelo Tier I y uno Tier III**.\n2. Script o proceso en el toolkit (nivel de automatización ≥ 3).\n3. Umbral, si lo hay, calibrado con datos propios — no copiado de la literatura.\n4. Aprobación del custodio y, si cambia obligaciones de segunda línea, de Validación.\n"}, {"path": "docs/frontera/marco-regulatorio.md", "meta": {"id": "FR-01", "titulo": "FR-01 · Marco regulatorio de referencia", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 51}, "md": "# FR-01 · Marco regulatorio de referencia\n\n**Propuesta:** mapear cada requisito del estándar contra los marcos de referencia internacionales para poder\ndemostrar cumplimiento ante supervisores, auditores y casas matrices, y detectar brechas.\n\n| Marco | Alcance | Ideas clave para nuestro estándar |\n|---|---|---|\n| **SR 26-2** (Fed/OCC/FDIC, EE. UU., abril 2026; reemplaza a SR 11-7) | Gestión del riesgo de modelo basada en riesgo | Enfoque proporcional, sección de terceros; excluye IA generativa y agéntica |\n| **Res. SBS 00053-2023** (Perú) | Gestión de riesgos de modelo | Ya incorporada a la línea base 2.0: ver [Gobierno del riesgo de modelo](../marco/gobierno-mrm.md) |\n| *SR 11-7 (histórico, 2011)* | Gestión del riesgo de modelo | *Effective challenge*; validación de solidez conceptual, monitoreo continuo y *outcomes analysis*; inventario completo |\n| **PRA SS1/23** (Reino Unido) | Principios de MRM para bancos | Cinco principios: identificación y clasificación, gobierno, desarrollo/implementación/uso, validación independiente, mitigantes; incluye explícitamente modelos de ML y de proveedores |\n| **EU AI Act** (Reglamento UE 2024/1689) | IA de alto riesgo | La evaluación de solvencia y el *credit scoring* de personas naturales son de **alto riesgo**: gestión de riesgos, gobernanza de datos, documentación técnica, registro de eventos, transparencia, supervisión humana, exactitud y robustez |\n| **IFRS 9** | Pérdida esperada | Coherencia entre scores, PD/LGD/EAD y provisiones (ya cubierto parcialmente en DES-D5-01.02) |\n| **Basilea / EBA IRB** | Modelos regulatorios de capital | Definición de default, *margin of conservatism*, backtesting de PD |\n| **Regulación local** | Gestión de riesgo de modelo del supervisor local | En Perú: Res. SBS 00053-2023, mapeada artículo por artículo en [Gobierno](../marco/gobierno-mrm.md) |\n\n## Brechas detectadas frente al estándar actual\n\n1. **Criterios de Tier** no definidos (ver FR-02). SS1/23 los exige explícitos.\n2. **Seguimiento** sin estándar formal (ver [Seguimiento](../seguimiento/seguimiento.md)).\n3. **Modelos de proveedores** y **modelos de IA generativa** fuera del alcance explícito (ver FR-08).\n4. **Supervisión humana / overrides** no medidos: el AI Act y SS1/23 piden monitorear el uso real del modelo.\n5. **Uso fuera de alcance**: falta un control de *post-model adjustments* y de usos no previstos.\n\n## Entregable propuesto\n\nUna columna `marcos` en el catálogo YAML, p.ej. `marcos: [SR11-7:validacion, SS1/23:P4, AIAct:art10]`,\nque permita generar automáticamente una matriz de cumplimiento.\n"}, {"path": "docs/frontera/tiering-basado-en-riesgo.md", "meta": {"id": "FR-02", "titulo": "FR-02 · Tiering basado en riesgo", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 52}, "md": "# FR-02 · Tiering basado en riesgo\n\n> **Línea base 2.0:** la Res. SBS 00053-2023 (art. 6) exige categorizar por materialidad, uso y complejidad con\n> criterios aprobados por el comité (GOB-G2-02.01.01). Esta propuesta es un punto de partida para esos criterios.\n\n**Problema:** el estándar usa Tier I–IV para activar requisitos, pero no define cómo se asigna el Tier.\nEso produce asignaciones inconsistentes entre equipos.\n\n**Propuesta:** un puntaje transparente de 0 a 100 con cuatro dimensiones.\n\n| Dimensión | Peso | 1 punto (bajo) | 3 puntos (medio) | 5 puntos (alto) |\n|---|---|---|---|---|\n| **Materialidad** (saldo / ingreso / provisiones afectadas) | 35 % | < 1 % del portafolio | 1–10 % | > 10 % |\n| **Uso** | 25 % | Informativo / interno | Decisión con revisión humana | Decisión automática, regulatoria o contable |\n| **Complejidad** | 20 % | Regla o lineal simple | Lineal con segmentos / calibraciones | ML, ensambles, IA generativa |\n| **Incertidumbre e impacto en clientes** | 20 % | Datos maduros y estables | Datos nuevos o proveedor externo | Población nueva, sin historia, o impacto directo en clientes |\n\n$$\\text{Puntaje}=20\\sum_{d}w_d\\cdot s_d,\\qquad s_d\\in\\{1,\\dots,5\\}$$\n\n| Puntaje | Tier |\n|---|---|\n| ≥ 75 | I |\n| 55 – 74 | II |\n| 35 – 54 | III |\n| < 35 | IV |\n\n**Regla de piso:** todo modelo regulatorio o contable (capital, IFRS 9) es **mínimo Tier II**; todo modelo\nde decisión automática sobre personas naturales con ML es **mínimo Tier II**.\n\nLos cortes son ilustrativos y deben calibrarse reclasificando el inventario actual: la propuesta se aprueba\nsi reproduce ≥ 80 % de los Tiers vigentes y las discrepancias tienen justificación.\n"}, {"path": "docs/frontera/explicabilidad.md", "meta": {"id": "FR-03", "titulo": "FR-03 · Explicabilidad y modelos interpretables", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 53}, "md": "# FR-03 · Explicabilidad y modelos interpretables\n\n**Hoy:** el estándar pide *Unboxing: SHAP value* para ML (DES-D4-07.01.01) y revisión de sentido económico\n(DES-D4-05.02.01).\n\n**Propuesta:**\n\n1. **Restricciones de monotonicidad** en gradient boosting (`monotone_constraints` en XGBoost/LightGBM) para toda\n   variable con sentido económico conocido. Convierte la revisión de sentido económico de un control *ex post*\n   en una propiedad garantizada del modelo.\n2. **Benchmark interpretable obligatorio** para Tier I–II con ML: un modelo *glass-box* (logística WOE o\n   *Explainable Boosting Machine* / GAM). Si el ML no supera al benchmark en ≥ 3 pts de Gini OOT, se prefiere el interpretable.\n3. **SHAP con cuidado:** reportar SHAP global (importancia y *dependence plots*) y local para casos frontera;\n   usar `TreeExplainer` con datos de fondo representativos; documentar que SHAP **no es causal** y que\n   variables correlacionadas reparten atribución.\n4. **Razones de rechazo** (*reason codes*): para decisiones sobre personas, derivar las 3–4 variables con mayor\n   contribución negativa por cliente y verificar su estabilidad.\n5. **Contrafactuales accionables** (opcional): \"¿qué cambio mínimo cambiaría la decisión?\", útil para\n   comunicación con clientes y para detectar variables no accionables o sensibles.\n\n**Requisito candidato:** `DES-D4-07.01.02 — Para ML en Tier I–II, documentar restricciones de monotonicidad,\nbenchmark interpretable y reason codes.`\n"}, {"path": "docs/frontera/calibracion-e-incertidumbre.md", "meta": {"id": "FR-04", "titulo": "FR-04 · Calibración y cuantificación de incertidumbre", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 54}, "md": "# FR-04 · Calibración y cuantificación de incertidumbre\n\n**Hoy:** se calibra con drivers micro/macro y se evalúa precisión por tramo con intervalos de Vasicek (U-14).\nLos modelos ML entregan *scores* cuya probabilidad no siempre está bien calibrada.\n\n## Propuestas\n\n**1. Métricas de calibración estándar** reportadas junto al Gini en la selección del modelo (DES-D4-06):\n\n$$\\text{Brier}=\\frac1n\\sum_{i}(p_i-y_i)^2,\\qquad\n\\text{ECE}=\\sum_{b=1}^{B}\\frac{n_b}{n}\\left|\\bar y_b-\\bar p_b\\right|$$\n\ny el **test de Jeffreys** por tramo (estándar en backtesting de PD): con $d$ defaults en $n$ casos,\nel p-valor es $F_{\\text{Beta}(d+\\frac12,\\,n-d+\\frac12)}(\\mathrm{PD})$; valores bajos indican subestimación.\n\n**2. Recalibración post-hoc para ML**: Platt (logística sobre el score) o regresión isotónica, ajustadas en una\nmuestra distinta a la de entrenamiento; documentar la elegida y su efecto en Brier.\n\n**3. Margen de conservadurismo (MoC)** para modelos regulatorios: cuantificar por separado la incertidumbre\nde datos, de metodología y de estimación, en vez de un ajuste único.\n\n**4. Predicción conforme para estimadores** (target continuo): intervalos con cobertura garantizada en\nmuestra finita, sin supuestos distribucionales. Con residuos de calibración $r_i=|y_i-\\hat y_i|$, el intervalo\nes $\\hat y\\pm q_{1-\\alpha}$, con $q_{1-\\alpha}$ el cuantil $\\lceil (n+1)(1-\\alpha)\\rceil/n$ de los $r_i$.\nComplementa la métrica vigente de \"% dentro de ±25 % / ±50 %\" (U-12) con una promesa de cobertura explícita.\nUsar la versión *conformalized quantile regression* si la dispersión depende del cliente.\n"}, {"path": "docs/frontera/monitoreo-drift.md", "meta": {"id": "FR-05", "titulo": "FR-05 · Monitoreo de drift moderno", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 55}, "md": "# FR-05 · Monitoreo de drift moderno\n\n**Hoy:** el PSI es el indicador único de estabilidad (U-02, IMP-01.04).\n\n**Limitaciones del PSI:** depende del número y corte de los tramos, no es simétrico respecto a la elección de\nla referencia en tramos pequeños, es sensible al tamaño de muestra (con $n$ grande todo \"se mueve\" y con $n$\nchico nada) y no dice si el cambio afecta al desempeño.\n\n## Propuestas\n\n1. **Complementar, no sustituir, el PSI**:\n   - Divergencia de **Jensen–Shannon** (simétrica, acotada en $[0,1]$) para variables con muchos tramos.\n   - **Wasserstein / KS** para continuas sin depender del binning.\n   - Umbrales ajustados por tamaño de muestra (bootstrap del PSI bajo la hipótesis de no cambio).\n2. **Drift multivariado — validación adversarial:** entrenar un clasificador que distinga *referencia* vs.\n   *actual*; un AUC ≈ 0.5 indica que no hay drift; AUC > 0.6 es alerta y su importancia de variables dice qué cambió.\n3. **Estimación de desempeño sin etiquetas:** mientras maduran las cosechas, estimar el Gini esperado con\n   métodos tipo CBPE (*confidence-based performance estimation*), válidos si el modelo está calibrado (ver FR-04).\n4. **Separar drift de datos y drift de concepto:** el primero se ve en las variables; el segundo sólo en el\n   desempeño. El plan de acción es distinto (calibrar vs. redesarrollar).\n"}, {"path": "docs/frontera/equidad-y-sesgo.md", "meta": {"id": "FR-06", "titulo": "FR-06 · Equidad y sesgo", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 56}, "md": "# FR-06 · Equidad y sesgo\n\n**Hoy:** se analiza el desempeño por subpoblaciones (DES-D4-10.01.04, VAL-M-03.08) con foco en riesgo, no en trato justo.\n\n**Propuesta:** para modelos sobre personas naturales (Tier I–II), un análisis de equidad documentado en el\ncapítulo de limitaciones:\n\n1. **Variables sensibles y proxies:** no usar atributos protegidos (sexo, edad cuando la norma lo restrinja,\n   etnia, discapacidad…) y probar si alguna variable los aproxima (AUC de predecir el atributo con las variables del modelo).\n2. **Métricas por grupo** (donde la información exista legalmente):\n   - Razón de aprobación entre grupos (*disparate impact*), alerta si < 0.8.\n   - Diferencia de tasa de verdaderos positivos (*equal opportunity*).\n   - Calibración por grupo: misma PD debe significar el mismo riesgo observado.\n3. **Decisión documentada:** las métricas de equidad son en parte incompatibles entre sí; el documento debe\n   decir cuál se prioriza y por qué, y qué *trade-off* de Gini se acepta.\n\nLa disponibilidad legal de atributos sensibles varía por jurisdicción; coordinar con Legal y Cumplimiento antes de recolectarlos.\n"}, {"path": "docs/frontera/mlops-reproducibilidad.md", "meta": {"id": "FR-07", "titulo": "FR-07 · Reproducibilidad y MLOps", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 57}, "md": "# FR-07 · Reproducibilidad y MLOps\n\n**Hoy:** se exige guardar Train/Test/OOT, fijar semilla, documentar versiones y rutas, y certificar ≥ 95 % de\ncoincidencia en implementación. La validación de implementación pide capturas de pantalla de rutas.\n\n**Propuesta: reemplazar evidencia manual por evidencia automática.**\n\n| Práctica | Sustituye o mejora | Beneficio |\n|---|---|---|\n| Código en **Git** con revisión por pares (PR) | Scripts en carpetas compartidas | Trazabilidad línea a línea; el \"cuadro de control de cambios\" sale del historial |\n| **Entorno fijado** (`requirements.txt`/`environment.yml`, contenedor) | \"Versiones de herramientas\" en Word | Reproducir el modelo en otra máquina |\n| **Versionado de datos** (hash de Train/Test/OOT, snapshot o DVC) | Copias de tablas | Probar que el modelo validado usa exactamente esos datos |\n| **Registro de modelos** (artefacto + métricas + código de inventario) | Ficha de nacimiento manual | Alta/baja automática en inventario |\n| **Pruebas automáticas** en CI: unicidad, missing, PSI, coincidencia vs. modelo de referencia | Certificación manual | La certificación del 95 % (U-15) se ejecuta en cada cambio |\n| **Champion / challenger** en producción | Comparación puntual con modelo vigente | Evidencia continua para recalibrar o redesarrollar |\n\n**Requisito candidato:** `IMP-01.06.05 — La certificación se ejecuta como prueba automatizada versionada y\nsu log se adjunta como evidencia.` Reduce capturas de pantalla y acelera VAL-I.\n"}, {"path": "docs/frontera/ia-generativa.md", "meta": {"id": "FR-08", "titulo": "FR-08 · IA generativa y agentes en el ciclo de vida", "estandar": "Frontera", "estado": "Propuesta", "version": "0.1.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 58}, "md": "# FR-08 · IA generativa y agentes en el ciclo de vida\n\nDos frentes distintos:\n\n## A. Los LLM como **modelos** sujetos a este estándar\n\nUn LLM que clasifica reclamos, extrae datos de estados financieros o sugiere decisiones de crédito **es un\nmodelo** y debe estar en el inventario. Diferencias con un score clásico:\n\n| Aspecto | Score clásico | LLM |\n|---|---|---|\n| Desarrollo | Entrenamiento propio | Selección de proveedor + *prompt* / RAG / *fine-tuning* |\n| Validación | Gini, KS, calibración | Conjuntos de evaluación etiquetados, exactitud por tarea, tasa de alucinación, robustez a *prompts* adversarios |\n| Estabilidad | PSI de variables | Cambios de versión del proveedor, deriva de los textos de entrada |\n| Implementación | Script productivo | *Prompt* versionado, *guardrails*, registro de entradas/salidas |\n| Seguimiento | Desempeño de cosechas | Muestreo humano periódico de salidas |\n\n**Propuesta:** un perfil de estándar \"Modelos de IA generativa\" que reutilice D1 (caso de uso, factibilidad),\nD2 (calidad de documentos fuente), D5 (impactos) e IMP, y reemplace D3–D4 por *diseño de evaluación*.\nTier mínimo II si decide sobre clientes.\n\n## B. Los agentes como **asistentes** del equipo de modelos\n\nEste repositorio está preparado para eso (ver `AGENTS.md`). Usos de alto valor y bajo riesgo:\n\n1. **Checklist automático:** dado Tier, tipo y enfoque, generar la lista de actividades y entregables.\n2. **Revisión previa a validación:** contrastar el documento metodológico contra los IDs de `val.yaml` y listar faltantes.\n3. **Redacción asistida** de documentación técnica a partir de logs y salidas de scripts.\n4. **Consulta de umbrales** con cita obligatoria del ID (`U-xx`).\n\n**Reglas:** el agente cita IDs, no inventa umbrales, no aprueba nada, y su salida la firma una persona.\n"}, {"path": "docs/plantillas/ficha-de-nacimiento.md", "meta": {"id": "PLT-FICHA", "titulo": "Plantilla · Ficha de nacimiento del modelo (Model Card)", "estandar": "Plantillas", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 60}, "md": "# Plantilla · Ficha de nacimiento del modelo (Model Card)\n\n> Copiar este bloque al repositorio del modelo como `MODEL_CARD.md`. Los campos en YAML permiten que el\n> inventario y los agentes lean la ficha sin intervención manual. Cumple DES-D1-01.04.08 y DES-D7-01.01.04.\n\n```yaml\ncodigo_inventario: \"\"          # IMP-01.05.03\nnombre: \"\"\nversion: \"1.0.0\"\ntipo_estandar: Desarrollo      # Desarrollo | Calibración\ntier: \"\"                       # I | II | III | IV  (acta: VAL-M-01.13)\ntipo_modelo: \"\"                # lineal | ml | arbol | acp\nenfoque: \"\"                    # agil | tradicional\nuso: \"\"                        # originación | comportamiento | cobranza | estimador | PD/LGD/EAD | otro\ndecision_automatica: false\npoblacion_objetivo: \"\"\ntarget:\n  tipo: \"\"                     # binario | continuo\n  definicion: \"Atraso > 60 días al menos una vez en 12 meses desde la observación\"   # U-17; desviaciones con acta\n  fecha_observacion: \"\"        # admision: fecha de otorgamiento | buro: fecha de la foto (clientes activos)\n  materialidad: \"\"             # monto mínimo vencido (Documento 4)\nventana:\n  train_test: \"\"               # >= 12 meses (U-01)\n  oot: \"\"                      # >= 6 meses (U-01)\nsegmentos: []\nmetricas_construccion: {gini_train: null, gini_test: null, gini_oot: null}\nmodelo_reemplazado: \"\"\ndueno_negocio: \"\"\nlider_desarrollo: \"\"\nvalidador: \"\"\nfecha_aprobacion_cm: \"\"\nfecha_produccion: \"\"\nruta_productiva: \"\"\ndependencias: []               # otros modelos o fuentes externas (IMP-01.01.04)\nlimitaciones: []               # resumen de PPT 14\n```\n\n## Narrativa (1 página)\n\n1. **Propósito y uso permitido.** Para qué sirve y para qué *no* debe usarse.\n2. **Datos.** Fuentes, periodo, exclusiones principales.\n3. **Desempeño.** Global, por segmento y en meses recientes.\n4. **Limitaciones conocidas.** Discriminación, calibración, estabilidad, subpoblaciones.\n5. **Plan de seguimiento.** Indicadores, periodicidad y responsable.\n"}, {"path": "docs/plantillas/acta-de-reunion.md", "meta": {"id": "PLT-ACTA", "titulo": "Plantilla · Acta de reunión", "estandar": "Plantillas", "estado": "Vigente", "version": "2.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 61}, "md": "# Plantilla · Acta de reunión\n\nLas actas son la evidencia principal que pide Validación (VAL-M-01.03 a VAL-M-01.11). Un acta sirve como\nevidencia solo si deja **decisiones explícitas, quién las tomó y su conformidad**. Esta plantilla lo asegura con\nuna estructura fija de 11 secciones y un tipo de acta precargado para cada hito del estándar.\n\n## Dónde se crean\n\n| Quién | Herramienta | Resultado |\n|---|---|---|\n| **Analista** | Sitio › Herramientas › **Actas de reunión** | Edición en línea con guardado automático; descarga en Word (.docx) y Markdown |\n| **Agente de IA o analista en el repositorio** | `python tools/acta.py` | Acta en JSON versionable en Git, exportable a .docx y .md |\n| **Agente con acceso al sitio** | Escribe el JSON en la colección `actas` del sitio | Aparece en el editor para que el equipo la complete y apruebe |\n\nLas tres vías usan el **mismo esquema** (`dist/acta.schema.json`) y el mismo diseño de documento.\n\n## Estructura del acta\n\n1. **Datos generales.** N° de acta, modelo (código de inventario, nombre, Tier, tipo), fecha, horario, modalidad, lugar y secretario.\n2. **Participantes.** Nombre, área, rol (*Decide, Aprueba, Consultado, Informado, Secretario*) y asistencia.\n3. **Objetivo.**\n4. **Agenda.**\n5. **Desarrollo de la reunión.** Qué se presentó, con qué datos y qué se discutió.\n6. **Decisiones.** Cada una enlazada al **requisito o umbral** que la exige, con su responsable y estado.\n7. **Excepciones a umbrales.** Umbral (`U-xx`), valor obtenido, justificación y si va a Comité.\n8. **Acuerdos y pendientes.** Acción, responsable, fecha compromiso y estado.\n9. **Evidencias y entregables revisados.**\n10. **Conformidad.** Aprobadores, estado (*Pendiente, Conforme, Observado*), fecha, medio y espacio de firma.\n11. **Control de cambios.** Versión, fecha, cambio y autor.\n\nEl Word sale en A4, con encabezado (estándar y N° de acta), pie con el sello del custodio y numeración\n*Página X de Y*. Las tablas repiten la cabecera si se parten entre páginas, y las propiedades del archivo\nllevan título, modelo y palabras clave para encontrarlo en repositorios documentales.\n\n## Ciclo de vida del acta\n\n```text\nBorrador ──Enviar a revisión──▶ En revisión ──Aprobar──▶ Aprobada (bloqueada)\n    ▲                               │                        │\n    └──────Devolver a borrador──────┘                        └──Reabrir──▶ Borrador, versión +1\n```\n\nPara **aprobar**, el acta debe tener completo el desarrollo de la reunión, todos los participantes con nombre,\nninguna decisión *Pendiente de aprobación* y **todos los aprobadores en *Conforme***. Cada cambio de estado\nqueda en el control de cambios con fecha y autor. Una reapertura nunca borra la versión anterior del historial.\n\n## Tipos de acta del estándar\n\nAl crear un acta se elige su tipo. Se precargan el objetivo, la agenda, las decisiones esperadas (con su\nrequisito), los entregables a revisar, los roles de los participantes y los aprobadores.\n\n<!-- CATALOGO:INICIO ACTAS -->\n| Tipo (`--tipo`) | Reunión / hito | Evidencia | Requisito | Decisiones precargadas |\n|---|---|---|---|---:|\n| `R1` | Reunión 1 · Levantamiento de expectativas: población objetivo | Acta 1 | `DES-D1-01.01.08` | 3 |\n| `R2` | Reunión 2 · Levantamiento de expectativas: fuentes y variables | Acta 2 | `DES-D1-01.03.01` | 2 |\n| `R3` | Reunión 3 · Enriquecimiento de la propuesta y diseño funcional | Acta de reunión | `DES-D1-01.04.07` | 4 |\n| `KO` | Kick off del desarrollo | Acta 3 | `DES-D1-02.02.01` | 2 |\n| `R4` | Reunión 4 · Segmentación | Acta 4 | `DES-D3-01.01.01` | 1 |\n| `R5` | Reunión 5 · Selección del modelo final | Acta 5 | `DES-D4-06.03.01` | 3 |\n| `R6` | Reunión 6 · Presentación del calibrado | Acta 6 | `DES-D4-08.01.05` | 1 |\n| `R7` | Reunión 7 · Resultados del modelo final | Acta 7 | `DES-D4-12.01.01` | 2 |\n| `R8` | Reunión 8 · Enfoque cualitativo con la banca | Acta 8 | `DES-D4-13.01.01` | 3 |\n| `CM` | Comité de Modelos · Aprobación | ACTA-CM | `DES-D4-14.01.01` | 2 |\n| `IMP-E` | Entrega al equipo implementador | Acta 9 | `IMP-01.01.05` | 1 |\n| `IMP-C` | Cierre de la implementación | Acta 10 | `IMP-01.07.01` | 2 |\n| `CAL-KO` | Kick off de la calibración | Acta de kick off | `CAL-C2-02.01.01` | 1 |\n| `CAL-PR` | Reunión preliminar de resultados de calibración | Acta preliminar | `CAL-C4-03.03.01` | 2 |\n| `CAL-CI` | Cierre del calibrado | Acta de cierre del calibrado | `CAL-C4-05.01.01` | 1 |\n| `PRC-KO` | Kick off del proyecto de pricing | Acta PRC-KO | `PRC-P1-02.02.01` | 3 |\n| `PRC-ELA` | Revisión del modelo de respuesta al precio | Acta PRC-ELA | `PRC-P4-04.01.01` | 3 |\n| `PRC-CP` | Comité de Precios · Aprobación de la propuesta | Acta PRC-CP | `PRC-P5-03.02.01` | 4 |\n| `PRC-PIL` | Aprobación del piloto o experimento de precio | Acta PRC-PIL | `PRC-P6-01.02.01` | 2 |\n| `PRC-PIR` | Revisión post-implementación de precios | Acta PRC-PIR | `PRC-P8-02.01.02` | 2 |\n| `PAR-KO` | Kick off del proyecto de parámetros | Acta PAR-KO | `PAR-R1-03.01.01` | 3 |\n| `PAR-ESC` | Revisión trimestral de escenarios macroeconómicos | Acta PAR-ESC | `PAR-R6-03.01.01` | 2 |\n| `PAR-OVL` | Aprobación de overlays y de la ECL del período | Acta PAR-OVL | `PAR-R8-02.01.02` | 2 |\n| `PAR-BT` | Resultados del backtesting de parámetros | Acta PAR-BT | `PAR-R9-01.01.03` | 2 |\n| `PAR-CP` | Comité de provisiones · Aprobación de parámetros | Acta PAR-CP | `PAR-R9-02.01.01` | 3 |\n| `CRM` | Comité de riesgos de modelo (sesión trimestral) | Acta CRM | `GOB-G1-01.02.01` | 4 |\n| `SME` | Revisión con experto de negocio (SME) | Acta SME | — | 0 |\n| `LIBRE` | Otra reunión del proyecto | Acta de reunión | — | 0 |\n\n<!-- CATALOGO:FIN -->\n\n## Uso desde el repositorio (analistas y agentes)\n\n```bash\npython tools/acta.py tipos\npython tools/acta.py nueva --tipo R5 --codigo MOD-ORI-001 --nombre \"Score de originación TC\" --tier II --modelo ml --n 5 -o actas/MOD-ORI-001/acta-05.json\npython tools/acta.py validar actas/MOD-ORI-001/acta-05.json\npython tools/acta.py exportar actas/MOD-ORI-001/acta-05.json --docx --md\n```\n\nHay un acta de ejemplo ya aprobada, con datos ficticios, en `ejemplos/actas/` (.docx, .md y .json).\n\n`validar` aplica las mismas reglas que el botón *Aprobar* del sitio. Se recomienda guardar las actas en\n`actas/<código de modelo>/` dentro del repositorio del modelo, junto a su `MODEL_CARD.md`.\n\n## Reglas para agentes de IA\n\n- Un agente **puede redactar** el acta (desarrollo, decisiones, acuerdos) a partir de la transcripción o las notas de la reunión.\n- Un agente **nunca marca una conformidad como *Conforme* ni aprueba un acta**: eso lo hace cada persona.\n- Cada decisión debe citar el ID del requisito o umbral (`DES-D4-06.03.01`, `U-11`). Si no existe, se deja vacío; no se inventa.\n- No se copian datos de clientes ni nombres de tablas productivas en el acta.\n"}, {"path": "docs/plantillas/documento-metodologico.md", "meta": {"id": "PLT-DOC", "titulo": "Plantilla · Documento metodológico", "estandar": "Plantillas", "estado": "Vigente", "version": "2.2.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 62}, "md": "# Plantilla · Documento metodológico\n\nEl documento metodológico (entregable 11 de DES-D4-11) se escribe **una sola vez, como datos**, y se genera en\ntodos los formatos que pide el proceso: Markdown para Git y agentes, HTML para leer en pantalla, Word para la\nrevisión con control de cambios y PDF para Comité y Validación (DES-D4-11.01.07).\n\nLa plantilla es **dinámica**: lo que falte no se omite, aparece como un aviso «Completar» que cita el requisito del\nestándar que lo exige. Así, un borrador muestra de un vistazo qué le falta para estar listo.\n\n## Cómo se usa\n\n```bash\npip install pyyaml jinja2 pypandoc_binary typst\npython tools/documento.py nuevo ../MOD-ORI-001          # crea docs/documento.yaml prellenado\npython tools/documento.py render ../MOD-ORI-001/docs/documento.yaml\npython tools/documento.py render ../MOD-ORI-001/docs/documento.yaml --formatos md,pdf --salida reports/\n```\n\n`nuevo` toma el código, el Tier, el tipo de modelo y el enfoque de `MODEL_CARD.md` y de `evidencias.yaml`, y enlaza\nel manifiesto de evidencias para la matriz de cumplimiento. `render` deja los archivos en `docs/salida/`, con el\nnombre `CODIGO_documento-metodologico_vX.Y` (Markdown, HTML, Word y PDF; con `--formatos qmd`, también Quarto).\n\nEn el repositorio de un modelo basta `make documento`.\n\n## Qué genera automáticamente\n\n| Elemento | Origen |\n|---|---|\n| **Evaluación de umbrales** (cumple / excepción / no cumple) | Bloque `umbrales` del YAML, con las mismas reglas que `tools/verificar.py`; U-01 se deriva de la ventana |\n| **Matriz de cumplimiento** por fase | Requisitos aplicables al estándar, Tier, tipo y enfoque; estado tomado de `evidencias.yaml` |\n| **Gráfico de estabilidad** del Gini mensual | `desempeno.mensual`, con la línea de entrenamiento y la banda de U-11 |\n| **Alertas de fuga** | Variables finales con IV mayor a 0.50 (U-38) |\n| **Desviación de calibración** por tramo | `desempeno.calibracion` |\n| **Lecturas recomendadas** | Literatura del catálogo asociada a los requisitos citados en el documento |\n| **Control del documento, portada, encabezado y pie** | Bloques `documento` y `control_cambios` |\n\n## Estructura del documento\n\n1. Control del documento y control de cambios\n2. Resumen ejecutivo\n3. Propósito, uso y alcance (usos no permitidos)\n4. Datos: fuentes y no anticipación, universo, ventana, definición de default, exclusiones y calidad\n5. Segmentación\n6. Variables: embudo de selección y variables finales\n7. Metodología: algoritmo, benchmark interpretable, validación cruzada e hiperparámetros\n8. Desempeño: muestras, comparación con el modelo vigente, estabilidad mensual y calibración\n9. Interpretabilidad, sensibilidad y equidad\n10. Integración a la gestión: punto de corte, impactos y forzajes\n11. Limitaciones\n12. Seguimiento\n13. Cumplimiento del estándar: umbrales y matriz de requisitos\n14. Gobierno y aprobaciones (actas)\n15. Referencias\n\n## Herramientas\n\n| Herramienta | Para qué |\n|---|---|\n| **Jinja2** | Plantilla `plantillas/documento-metodologico/documento.md.j2` |\n| **Pandoc** (`pypandoc_binary`) | Markdown → HTML autocontenido y Word con la plantilla de estilos `estilos/referencia.docx` |\n| **Typst** | PDF con portada, índice, encabezado, pie con número de página y sello (`estilos/plantilla.typ.j2`) |\n| **Quarto** (opcional) | Salida `.qmd` para quien quiera integrar código ejecutable al documento |\n\nPara ajustar la marca o los estilos de Word: `python tools/documento.py estilos` regenera `referencia.docx`.\n\n## Ejemplo\n\n`plantillas/documento-metodologico/documento-ejemplo.yaml` es un modelo ficticio completo (originación de tarjeta de\ncrédito, Tier II, machine learning). `ejemplos/documento-metodologico/` tiene su salida en los cuatro formatos.\n\n## Para agentes de IA\n\nUn agente puede completar `docs/documento.yaml` desde los reportes del repositorio y generar el documento. No\ncompleta las secciones de **gobierno y aprobaciones** ni cambia el estado a *Aprobado*: eso lo hace una persona\n(AGT). Si una sección no tiene sustento en los reportes, la deja vacía para que aparezca como «Completar».\n"}, {"path": "AGENTS.md", "meta": {"titulo": "AGENTS", "estandar": "Repositorio", "orden": 90}, "md": "# Instrucciones para agentes de IA\n\nYuri Plasencia — Analytics Pricing & Revenue Management\n\nEste repositorio contiene el estándar corporativo de modelos en banca. Si eres un agente (asistente de\ncódigo, copiloto de documentación, revisor automático), sigue estas reglas.\n\n## Fuentes, en orden de autoridad\n\n1. `catalogo/umbrales.yaml` — **única** fuente de umbrales cuantitativos (`U-01` … `U-17`).\n2. `catalogo/*.yaml` — requisitos normativos con ID (también en `dist/catalogo.json`).\n3. `docs/**/*.md` con `estado: Vigente` — explicación y criterios.\n4. `docs/**/*.md` con `estado: Borrador` — consolidación pendiente de aprobación.\n5. `docs/frontera/**` con `estado: Propuesta` — **no es obligatorio**. Preséntalo siempre como recomendación.\n\n## Antes de trabajar en un modelo\n\nLee `docs/agentes/index.md` (estándar operativo: puntos de control, cuándo detenerse, contrato de tarea) y usa\n`tools/verificar.py` para planificar (`--plan`) y comprobar tu trabajo. Para fundamentar una decisión, cita\nobras de `dist/literatura.json` (IDs `LIT-xxx`); no cites literatura que no esté ahí sin advertirlo.\n\n## Marco regulatorio vigente\n\nSR 11-7 fue reemplazada por SR 26-2 (abril 2026). En Perú rige la Res. SBS 00053-2023 (ver `docs/marco/gobierno-mrm.md`).\nUn modelo nuevo, modificado o recalibrado **no se usa sin aprobación previa del comité** (GOB-G3-01.01.01).\n\n## Reglas\n\n- **Cita siempre el ID** del requisito (`DES-D4-06.03.02`) o umbral (`U-11`) en que te basas.\n- **No inventes umbrales.** Si una pregunta requiere un límite que no está en `umbrales.yaml`, dilo\n  explícitamente: \"el estándar no fija un umbral para X\".\n- **No confundas estados:** nunca presentes una propuesta de `frontera/` como exigencia vigente.\n- **Aplicabilidad:** un requisito aplica a un modelo si `aplica_tier[<tipo_modelo>]` contiene su Tier.\n  En los estándares sin tipo de modelo (Calibración, Parámetros, Pricing, Seguimiento), `aplica_tier` es una lista de Tiers.\n- **En pricing no fijas precios.** Recalculas pisos, estimas respuesta y preparas escenarios; la decisión es del Comité de Precios (PRC-P9-03.01.01).\n- **No apruebas nada.** Puedes preparar checklists, borradores y revisiones previas; la conformidad la da una persona.\n- **Confidencialidad:** no copies datos de clientes ni nombres de tablas productivas en salidas que salgan del banco.\n\n## Tareas típicas\n\n| Tarea | Cómo |\n|---|---|\n| \"Checklist para un modelo Tier II, ML, ágil\" | Filtrar `dist/catalogo.json` por `estandar=Desarrollo`, `aplica_tier.ml` ∋ 2; agrupar por fase; listar `entregables` |\n| \"¿Mi modelo puede tener 12 pts de diferencia Train–OOT?\" | Responder con U-11: máximo 10 pts; si se excede, sustentar y presentar en Comité |\n| \"Revisa este documento metodológico antes de validación\" | Contrastar contra `val.yaml` (VAL-M) y listar requisitos sin evidencia |\n| \"Redacta el acta de la reunión 5\" | `python tools/acta.py nueva --tipo R5 ...`, completar desarrollo, decisiones (con ID) y acuerdos desde las notas; dejar la conformidad en *Pendiente*; `exportar --docx --md`. Ver `docs/plantillas/acta-de-reunion.md` |\n| \"Redacta el documento metodológico\" | `python tools/documento.py nuevo REPO`; completar `docs/documento.yaml` solo con lo que sustentan los reportes (lo demás queda como «Completar»); `render`; no tocar gobierno ni aprobaciones. Ver `docs/plantillas/documento-metodologico.md` |\n| \"Recalibra la PD lifetime de consumo para IFRS 9\" | Seguir `docs/parametros/` (R2→R3→R6→R7→R8); respetar U-27 a U-34; nunca aprobar overlays ni la ECL: lo hace el comité de provisiones |\n| \"Arma el caso de pricing de tarjeta de crédito\" | Seguir `docs/pricing/` en orden P1→P9; respetar U-18 a U-26; ver los roles y límites de `docs/pricing/agentes-ia.md`. **Nunca** fijar, publicar ni aprobar precios |\n| \"Estima la duración\" | Aplicar el modelo de esfuerzo v2 (`tools/esfuerzo.py` con `catalogo/parametros_esfuerzo.yaml`); reportar semanas con personas y con agente, y los supuestos usados |\n\n## Esquema de un requisito\n\n```json\n{\n  \"id\": \"DES-D4-05.04.01\",\n  \"estandar\": \"Desarrollo\", \"fase\": \"DES-D4\", \"fase_nombre\": \"Modelamiento\",\n  \"tarea\": \"Entrenamiento de modelos\", \"subtarea\": \"Optimización\",\n  \"actividad\": \"Opt de HP por generación aleatoria (min 50 combinaciones)...\",\n  \"critico\": false, \"eficiencia\": false, \"nivel_automatizacion\": 2,\n  \"dias_esfuerzo\": {\"ml\": {\"agil\": 2.5, \"tradicional\": 2.5}},\n  \"aplica_tier\": {\"lineal\": [], \"ml\": [1,2,3,4], \"arbol\": [1,2,3,4], \"acp\": []},\n  \"entregables\": [{\"tipo\": \"Excel\", \"numero\": 16, \"descripcion\": \"Optimización de Hiperparámetros.\"}],\n  \"hito\": null,\n  \"umbrales\": [\"U-10\"]\n}\n```\n"}, {"path": "CHANGELOG.md", "meta": {"titulo": "CHANGELOG", "estandar": "Repositorio", "orden": 90}, "md": "# Registro de cambios\n\nYuri Plasencia — Analytics Pricing & Revenue Management\n\nEl proyecto usa versionado semántico sobre el estándar completo (ver `CONTRIBUTING.md`).\n\n## [2.2.0] — 2026-10-17\n\n### Nuevo\n- **Plantilla dinámica del documento metodológico** (DES-D4-11.01.07): los datos del modelo se registran en\n  `docs/documento.yaml` y `tools/documento.py` genera Markdown, HTML, Word y PDF (y Quarto, opcional) desde la\n  misma fuente, con Jinja2, Pandoc y Typst.\n- El documento evalúa los umbrales obtenidos con las reglas de `tools/verificar.py`, arma la matriz de\n  cumplimiento desde `evidencias.yaml`, grafica la estabilidad del Gini, alerta variables con IV mayor a 0.50 y\n  marca como «Completar» lo que falta, citando el requisito que lo exige.\n- Página `docs/plantillas/documento-metodologico.md`, ejemplo ficticio completo y objetivo `make documento` en la\n  plantilla del repositorio de un modelo.\n\n## [2.1.0] — 2026-10-17\n\n### Nuevo\n- **No anticipación temporal del tablón** (U-39): toda variable se construye solo con información anterior a la fecha\n  de observación; cada variable documenta su fecha de referencia y el desfase de su fuente, con prueba automática\n  (DES-D1-01.03.04, DES-D1-01.03.05).\n- **Orden obligatorio antes de entrenar**: análisis univariado (DES-D4-03.02.02) y bivariado con WOE/IV (DES-D4-03.03.02),\n  sospecha de fuga para variables con IV mayor a 0.50 (DES-D4-03.03.03, U-38) y filtro de variables confiables con\n  embudo documentado (DES-D4-03.03.04).\n- Validación verifica no anticipación y fuga (VAL-M-05.07, bloqueante). `tools/verificar.py` comprueba U-38 y U-39.\n\n## [2.0.0] — 2026-10-17 · Línea base (primera versión pública)\n\nPrimera publicación del estándar como documentación como código. Constituye la **línea base** contra la que se\nmedirán los cambios futuros. El detalle del benchmarking está en `docs/marco/linea-base.md`.\n\n### Estándares\n- **Gobierno del riesgo de modelo (GOB)**, 21 requisitos a nivel de entidad, mapeados artículo por artículo a la\n  Res. SBS 00053-2023 y alineados con SR 26-2 y PRA SS1/23.\n- **Desarrollo (DES)**, **Calibración (CAL)** e **Implementación (IMP)**, con controles de benchmark interpretable,\n  validación cruzada, sensibilidad, equidad, forzajes, inferencia de rechazados y aprobación previa al uso.\n- **Seguimiento (SEG)**: indicadores y umbrales aprobados por comité, forzajes, sobreajuste en IA, árbol de decisión e informe periódico.\n- **Validación (VAL)**: metodológica, de implementación, de parámetros (VAL-R) y de pricing (VAL-P), con réplica,\n  challenger, periodicidad por categoría y severidad de hallazgos.\n- **Parámetros de riesgo (PAR)**: PD 12 meses y lifetime, LGD, EAD/CCF, escenarios, staging, ECL, overlays, backtesting y CLV.\n- **Pricing analítico (PRC)**: precio técnico y RAROC, respuesta al precio con identificación causal, optimización,\n  experimentación, motor de precios, seguimiento y conducta.\n- **Agentes de IA (AGT)**: principios, puntos de control humanos, condiciones de detención, contrato de tarea y evaluación.\n- **Frontera**: propuestas no obligatorias (marco regulatorio, tiering, explicabilidad, calibración e incertidumbre,\n  drift, equidad, MLOps e IA generativa).\n\n### Datos y herramientas\n- 37 umbrales cuantitativos (U-01 a U-37) enlazados a sus requisitos.\n- 103 obras de literatura enlazadas a requisitos y umbrales.\n- 27 tipos de acta precargados por hito; editor en línea y exportación a Word y Markdown (`tools/acta.py`).\n- Modelo de esfuerzo con volumen de datos, reuniones, equipo y escenario con agente de IA.\n- Verificador de evidencias (`tools/verificar.py`) y plantilla de repositorio de modelo.\n- Sitio autocontenido con buscador, planificador y editor de actas; JSON y `llms.txt` para agentes.\n"}, {"path": "CONTRIBUTING.md", "meta": {"titulo": "CONTRIBUTING", "estandar": "Repositorio", "orden": 90}, "md": "# Cómo proponer un cambio al estándar\n\nYuri Plasencia — Analytics Pricing & Revenue Management\n\nEl estándar crece por **propuestas pequeñas y trazables**. Cualquier analista puede proponer; el custodio aprueba.\n\n## Tipos de cambio y versión\n\nSe usa versionado semántico sobre el estándar completo (`CHANGELOG.md`):\n\n| Cambio | Ejemplo | Versión |\n|---|---|---|\n| **Mayor** | Nueva obligación para todos los Tier, cambio de un umbral | `3.0.0` |\n| **Menor** | Nuevo requisito opcional, nueva plantilla, propuesta de frontera aprobada | `2.1.0` |\n| **Parche** | Redacción, ortografía, enlaces | `2.0.1` |\n\n## Proceso\n\n1. **Abrir la propuesta** (rama o carpeta de borrador) con: problema, cambio propuesto, requisito(s) afectados por ID,\n   evidencia (piloto, literatura, regulación) e impacto en esfuerzo.\n2. **Editar la fuente correcta:**\n   - Un requisito → `catalogo/<fase>.yaml`. **Nuevo ID al final de su subtarea**; nunca renumerar ni reutilizar IDs.\n   - Un umbral → `catalogo/umbrales.yaml` (con `refs`).\n   - Explicación → `docs/...md`. No edites a mano lo que está entre `<!-- CATALOGO:INICIO -->` y `<!-- CATALOGO:FIN -->`.\n   - Idea de vanguardia → `docs/frontera/` con `estado: Propuesta`.\n3. **Ejecutar** `python tools/build.py`. Debe terminar sin errores.\n4. **Revisión:** un par técnico + el custodio. Si cambia obligaciones de segunda línea, también Validación.\n5. **Publicar:** actualizar `CHANGELOG.md`, la `version` y `actualizado` del documento.\n\n## Retirar un requisito\n\nNo se borra: se marca `retirado: \"AAAA-MM-DD — motivo\"`. El build lo excluye del planificador pero el ID\nqueda reservado para la trazabilidad histórica de modelos ya aprobados.\n"}, {"path": "README.md", "meta": {"titulo": "README", "estandar": "Repositorio", "orden": 90}, "md": "# Estándares de Mod
