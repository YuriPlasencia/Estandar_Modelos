* Reunión de revisión del modelo de respuesta con el dueño del precio: elasticidades por segmento, su sentido de negocio y sus límites de uso.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Entregable: Acta PRC-ELA: Revisión del modelo de respuesta\n\n#### 4.2 Documentación\n\n- **`PRC-P4-04.02.01`** Documentar el modelo de respuesta con la estructura de DES-D4-11 (memoria metodológica, limitaciones, rango de precios en que la elasticidad es válida).\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 1 · Entregable: Documento P4: Modelo de respuesta y elasticidad\n\n<!-- CATALOGO:FIN -->\n\n## P5 · Optimización\n\nPara cada oferta (o celda) se elige el precio que maximiza el valor esperado:\n\n$$\\max_{r_i}\\ \\sum_i P_i(r_i)\\cdot V_i(r_i)\\quad\\text{s.a.}\\quad\n\\begin{cases}\nr_{\\min,i}\\le r_i\\le r_{\\max} & \\text{(U-18, U-24)}\\\\\n\\sum_i P_i(r_i)\\,\\mathrm{EAD}_i \\ge \\text{Volumen objetivo}\\\\\nr_i \\text{ no decreciente en el riesgo dentro de la celda} & \\text{(U-19)}\\\\\n|r_i - r_i^{\\text{actual}}| \\le \\Delta & \\text{(U-25)}\n\\end{cases}$$\n\ncon $V_i(r)$ el valor presente de la operación: margen sobre el piso, ajustado por prepago, fuga, uso de\nlínea y, si la entidad lo gestiona, venta cruzada. Para un objetivo solo de margen y respuesta logística,\nel óptimo sin restricciones cumple\n\n$$r^{*}_i = r_{\\min,i} + \\frac{1}{|\\beta_i|\\,\\big(1-P_i(r^{*}_i)\\big)}$$\n\nEs decir, el margen óptimo sobre el piso es inversamente proporcional a la sensibilidad del cliente.\n\n### Buenas prácticas\n\n- **Robustez:** optimiza con el intervalo de la elasticidad, no solo con su punto central (PRC-P5-02.02.01).\n  Una elasticidad sobreestimada cede margen; una subestimada pierde volumen. Ambos errores tienen costo asimétrico.\n- **Granularidad comercial:** redondea a la grilla (p.ej. 25 pb) y reporta el valor perdido por redondeo.\n- **Escenarios, no un número:** el comité decide entre alternativas con volumen, margen, RAROC, pérdida\n  esperada, capital y provisiones a 12 meses.\n\n<!-- CATALOGO:INICIO PRC-P5 -->\n## Catálogo de requisitos · Optimización y propuesta de precios\n\n> Bloque generado desde `catalogo/prc-p5.yaml` (7 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Formulación\n\n#### 1.1 Problema de optimización\n\n- **`PRC-P5-01.01.01`** Formular el problema: maximizar la función objetivo de P1 sumando, por oferta, la probabilidad de aceptación por el valor de la operación al precio propuesto, sujeto a precio ≥ piso técnico (U-18), precio ≤ tope regulatorio (U-24), metas de volumen y riesgo, monotonicidad en el riesgo (U-19) y gradualidad (U-25).\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 1 · Crítico · Entregable: Documento P5: Propuesta de precios · Hito: Sprint 4 · Umbrales: U-19, U-25\n\n- **`PRC-P5-01.01.02`** Definir la granularidad de la decisión (celda de tarifario o precio individual) y la regla de redondeo a la grilla comercial (por ejemplo, múltiplos de 25 pb), evaluando el valor perdido por redondeo.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Entregable: Documento P5: Propuesta de precios\n\n### 2 · Resolución\n\n#### 2.1 Optimizador\n\n- **`PRC-P5-02.01.01`** Implementar el optimizador (búsqueda en grilla, programación no lineal o entera) con semilla y versiones fijadas, y verificar que la solución respeta todas las restricciones.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Script P2: Optimizador de precios\n\n#### 2.2 Robustez\n\n- **`PRC-P5-02.02.01`** Optimizar con incertidumbre: propagar el intervalo de la elasticidad (bootstrap o posterior) a la propuesta y preferir precios cuyo resultado sea bueno en todo el rango plausible, no solo en el punto central.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Entregable: Script P2: Optimizador de precios\n\n#### 2.3 Escenarios\n\n- **`PRC-P5-02.03.01`** Construir escenarios para el comité: precio actual, propuesta óptima, propuesta con restricción de volumen y alternativas del negocio, con impacto en volumen, margen, RAROC, pérdida esperada, capital y provisiones a 12 meses.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: PPT P1: Escenarios de precio\n\n### 3 · Validación de la propuesta\n\n#### 3.1 Controles\n\n- **`PRC-P5-03.01.01`** Controlar la propuesta antes de llevarla a comité: 100 % de precios dentro de [piso, tope], monotonicidad, cambios mayores al umbral de gradualidad identificados, y análisis de equidad de precios por grupos: las diferencias deben explicarse por riesgo, costo, plazo o canal (PRC-P9-02.02.01).\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 3 · Crítico · Entregable: Documento P5: Propuesta de precios\n\n#### 3.2 Comité de Precios\n\n- **`PRC-P5-03.02.01`** Presentar la propuesta y sus escenarios al Comité de Precios para su aprobación, con las excepciones a umbrales explícitas.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Crítico · Entregable: Acta PRC-CP: Comité de Precios · Hito: Comité de Precios\n\n<!-- CATALOGO:FIN -->\n\n## Frontera *(propuesta, no obligatoria)*\n\n- **Bandits contextuales** para el precio individual en canales digitales de alto volumen: equilibran aprender\n  la elasticidad y explotarla, siempre dentro de [piso, tope] y con exploración acotada y registrada.\n- **Causal ML** (*causal forests*, *meta-learners*) para estimar elasticidades heterogéneas por cliente con\n  intervalos de confianza honestos.\n- **Optimización de cartera con capital:** asignación conjunta de precio y límite cuando el capital es la restricción vinculante.\n"}, {"path": "docs/pricing/p6-experimentacion-implementacion.md", "meta": {"id": "PRC-P6", "titulo": "Pricing · P6–P7 Experimentación e implementación", "estandar": "Pricing", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 28}, "md": "# Pricing · P6–P7 Experimentación e implementación\n\n## P6 · Experimentar antes de escalar\n\nUn experimento de precio bien diseñado es la única forma de medir la elasticidad sin sesgo, y además es la\nmejor defensa ante el comité: muestra el efecto real en lugar de una proyección.\n\n**Tamaño muestral** por brazo, para detectar una diferencia $\\delta$ en la tasa de aceptación $p$:\n\n$$n=\\frac{\\left(z_{1-\\alpha/2}+z_{1-\\beta}\\right)^2\\,2\\,p\\,(1-p)}{\\delta^2}$$\n\nEjemplo: con $p=0.30$, $\\delta=0.02$, $\\alpha=5\\,\\%$ y potencia 80 % (U-22), $n\\approx 8\\,240$ ofertas por brazo.\n\n**Reglas de oro**\n\n- Pre-registrar hipótesis, métrica primaria, MDE, duración y regla de parada **antes** de lanzar (PRC-P6-01.01.01).\n- No mirar los resultados para decidir antes de tiempo: inflar el error tipo I es la causa número uno de\n  \"pilotos exitosos\" que luego no se replican.\n- Aleatorizar por la unidad que decide (cliente, no oferta, si el cliente puede re-cotizar).\n- Métricas de resguardo: riesgo de la cosecha, quejas, conversión por canal.\n- Ética y conducta: los precios de prueba respetan topes y transparencia y se asignan por regla objetiva (PRC-P6-01.01.02).\n\n<!-- CATALOGO:INICIO PRC-P6 -->\n## Catálogo de requisitos · Experimentación y piloto\n\n> Bloque generado desde `catalogo/prc-p6.yaml` (6 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Diseño del experimento\n\n#### 1.1 Protocolo\n\n- **`PRC-P6-01.01.01`** Pre-registrar el experimento antes de lanzarlo: hipótesis, métrica primaria (margen esperado por oferta o conversión), métricas de resguardo (riesgo de cosecha, quejas), unidad de aleatorización, tamaño muestral con potencia y MDE (U-22), duración y regla de parada.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 1 · Crítico · Entregable: Documento P6: Diseño del experimento · Hito: Sprint 5 · Umbrales: U-22\n\n- **`PRC-P6-01.01.02`** Revisar el experimento con Cumplimiento y Legal: los precios de prueba respetan topes y transparencia, no discriminan por atributos protegidos y se aplican por reglas objetivas comunicables.\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d · Automatización: 1 · Crítico · Entregable: Documento P6: Diseño del experimento\n\n#### 1.2 Aprobación\n\n- **`PRC-P6-01.02.01`** Aprobación del piloto o experimento por el dueño del precio y Riesgos, con el grupo de control y los límites de exposición definidos.\n\n  Aplica: Tier I–II · Esfuerzo: 0.25 d · Automatización: 1 · Entregable: Acta PRC-PIL: Aprobación del piloto\n\n### 2 · Ejecución y lectura\n\n#### 2.1 Lectura de resultados\n\n- **`PRC-P6-02.01.01`** Ejecutar el piloto con control aleatorio y monitorear diariamente asignación, balance entre grupos y métricas de resguardo. Leer resultados solo al cumplir el tamaño muestral pre-registrado (sin \"espiar\" para decidir antes).\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Entregable: Excel P4: Resultados del piloto\n\n- **`PRC-P6-02.01.02`** Estimar el efecto con intervalo de confianza, actualizar la elasticidad del modelo de respuesta con la evidencia experimental y documentar la decisión (escalar, ajustar o descartar).\n\n  Aplica: Tier I–II · Esfuerzo: 1.5 d · Automatización: 2 · Entregable: Excel P4: Resultados del piloto\n\n#### 2.2 Despliegue gradual\n\n- **`PRC-P6-02.02.01`** Para Tier III–IV sin experimento, desplegar de forma escalonada por región o canal (champion/challenger) y comparar contra el grupo que mantiene el precio anterior.\n\n  Aplica: Tier III–IV · Esfuerzo: 1.5 d · Automatización: 2 · Entregable: Excel P4: Resultados del piloto\n\n<!-- CATALOGO:FIN -->\n\n## P7 · El precio llega al cliente tal como se aprobó\n\nLa mayor fuga de valor no ocurre en el modelo, ocurre en la ejecución: excepciones sin control, tarifarios\ndesactualizados en un canal o descuentos acumulados. P7 cierra esa brecha con tres piezas:\n\n1. **Tarifario versionado** con TCEA/TREA por celda (PRC-P7-01.01.01).\n2. **Matriz de facultades:** cuántos pb puede ceder cada nivel, hasta qué piso y con qué evidencia (PRC-P7-01.02.01).\n\n   | Nivel | Descuento máximo sobre tarifario | Piso | Evidencia |\n   |---|---|---|---|\n   | Ejecutivo | hasta 25 pb | ≥ piso técnico | Motivo registrado |\n   | Jefe de agencia / banca | hasta 75 pb | ≥ piso técnico | Motivo + oferta de la competencia |\n   | Gerencia de producto | hasta 150 pb | ≥ piso técnico | Caso de relación comercial |\n   | Comité de Precios | sin límite | puede ir bajo el piso | Acta PRC-CP |\n\n   *Valores ilustrativos: cada entidad los fija en su política (PRC-P9-01.02.01).*\n3. **Motor de precios con controles preventivos** que bloquea ofertas sobre el tope o bajo el piso sin facultad,\n   certificado con el estándar de [Implementación](../implementacion/implementacion.md) (U-15) y con registro de cada oferta (PRC-P7-02.03.01).\n\n<!-- CATALOGO:INICIO PRC-P7 -->\n## Catálogo de requisitos · Implementación en el motor de precios\n\n> Bloque generado desde `catalogo/prc-p7.yaml` (6 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Tarifario y facultades\n\n#### 1.1 Tarifario\n\n- **`PRC-P7-01.01.01`** Publicar el tarifario aprobado con fecha de vigencia, versión y la TCEA o TREA resultante para cada celda, según la normativa de transparencia aplicable.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 2 · Crítico · Entregable: Documento P7: Tarifario y matriz de facultades · Hito: Sprint 6\n\n#### 1.2 Matriz de facultades\n\n- **`PRC-P7-01.02.01`** Definir la matriz de facultades de descuento: quién puede ceder cuántos puntos básicos sobre el tarifario, hasta qué piso y con qué evidencia. Ningún nivel puede ofrecer por debajo del piso técnico sin aprobación del Comité de Precios (U-18, U-23).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Crítico · Entregable: Documento P7: Tarifario y matriz de facultades · Umbrales: U-18, U-23\n\n### 2 · Motor de precios\n\n#### 2.1 Reglas y controles preventivos\n\n- **`PRC-P7-02.01.01`** Implementar en el motor de precios las reglas del tarifario, la matriz de facultades y los controles preventivos que bloquean ofertas por encima del tope regulatorio (U-24) o por debajo del piso sin facultad, registrando cada excepción con su motivo y aprobador.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Script P3: Reglas del motor de precios · Umbrales: U-24\n\n#### 2.2 Certificación\n\n- **`PRC-P7-02.02.01`** Certificar la implementación con el estándar IMP: los precios que calcula el motor coinciden con los del modelo aprobado en ≥ 95 % de casos de prueba (U-15) y el 100 % de las restricciones regulatorias se cumplen.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Documento 14: Certificación del modelo\n\n#### 2.3 Registro de ofertas\n\n- **`PRC-P7-02.03.01`** Registrar cada oferta emitida (precio, versión del tarifario, componentes del piso, excepción y aceptación) para cerrar el ciclo de datos que alimenta el siguiente recalibrado del modelo de respuesta.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 2 · Crítico · Entregable: Tabla P1: Base de cotizaciones\n\n#### 2.4 Habilitación comercial\n\n- **`PRC-P7-02.04.01`** Capacitar a la fuerza de ventas en el nuevo tarifario, las facultades y la argumentación al cliente; dejar evidencia de la capacitación.\n\n  Aplica: Tier I–III · Esfuerzo: 1 d · Automatización: 1 · Entregable: Documento P7: Tarifario y matriz de facultades\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/pricing/p8-seguimiento-gobierno.md", "meta": {"id": "PRC-P8", "titulo": "Pricing · P8–P9 Seguimiento, gobierno y conducta", "estandar": "Pricing", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 29}, "md": "# Pricing · P8–P9 Seguimiento, gobierno y conducta\n\n## P8 · ¿Estamos capturando el valor?\n\n### Descomposición del margen\n\nCada mes, la variación del margen del segmento se separa en sus causas, para atribuir resultados a la\nestrategia de precios y no al mercado (PRC-P8-01.02.01). Con $M=s\\,V$, $s=\\bar r-r_{\\text{FTP}}$ el spread sobre\nel costo de fondos, $V$ el volumen, $w_k$ el peso de la celda $k$ (riesgo, plazo, canal) y $r_k$ su tasa:\n\n$$\\Delta M=\\underbrace{V_1\\sum_k w_{1,k}\\,\\Delta r_k}_{\\text{precio}}+\\underbrace{V_1\\sum_k \\Delta w_k\\,r_{0,k}}_{\\text{mix}}-\\underbrace{V_1\\,\\Delta r_{\\text{FTP}}}_{\\text{costo de fondos}}+\\underbrace{s_0\\,\\Delta V}_{\\text{volumen}}$$\n\nLos cuatro efectos suman exactamente la variación del margen.\n\n### Tablero mínimo\n\n| Indicador | Umbral |\n|---|---|\n| Conversión observada vs. predicha por tramo de precio | U-21 |\n| Price realization (efectiva ÷ lista) | Tendencia; caída sostenida = fuga |\n| Margen y RAROC realizados vs. esperados | U-26 |\n| Excepciones y margen cedido | U-23 |\n| Ofertas bajo el piso sin aprobación | 0 (U-18) |\n| Ofertas sobre el tope regulatorio | 0 (U-24) |\n| Brecha con la competencia por celda | Informativo |\n\n<!-- CATALOGO:INICIO PRC-P8 -->\n## Catálogo de requisitos · Seguimiento de precios\n\n> Bloque generado desde `catalogo/prc-p8.yaml` (6 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Tablero de seguimiento\n\n#### 1.1 Indicadores\n\n- **`PRC-P8-01.01.01`** Construir el tablero mensual: conversión por tramo de precio, price realization, margen y RAROC realizados vs. esperados, mix de riesgo de lo colocado, excepciones de precio y margen cedido, brecha con la competencia y cumplimiento de topes.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 3 · Crítico · Entregable: Dashboard P1: Seguimiento de precios · Hito: Sprint 7\n\n#### 1.2 Descomposición de resultados\n\n- **`PRC-P8-01.02.01`** Descomponer cada mes la variación del margen en efecto precio, efecto volumen, efecto mix (riesgo, plazo, canal) y efecto costo de fondos, para atribuir resultados a la estrategia de precios y no al mercado.\n\n  Aplica: Tier I–III · Esfuerzo: 1.5 d · Automatización: 3 · Entregable: Dashboard P1: Seguimiento de precios\n\n#### 1.3 Alertas\n\n- **`PRC-P8-01.03.01`** Activar alertas: margen realizado fuera de ±15 % del esperado por dos meses (U-26), excepciones por encima del umbral de leakage (U-23), deriva de la elasticidad (calibración del modelo de respuesta fuera de U-21) y cualquier oferta sobre el tope regulatorio (U-24).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 3 · Crítico · Entregable: Dashboard P1: Seguimiento de precios · Umbrales: U-21, U-23, U-26\n\n### 2 · Revisión post-implementación\n\n#### 2.1 Revisión\n\n- **`PRC-P8-02.01.01`** Revisión post-implementación entre 3 y 6 meses después del lanzamiento: valor capturado frente al caso de negocio de P1, aprendizajes y decisión de recalibrar el precio técnico, el modelo de respuesta o ambos.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Entregable: Documento P8: Revisión post-implementación\n\n- **`PRC-P8-02.01.02`** Reunión de revisión post-implementación con el dueño del precio y Finanzas.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d · Automatización: 1 · Entregable: Acta PRC-PIR: Revisión post-implementación\n\n#### 2.2 Ciclo de recalibrado\n\n- **`PRC-P8-02.02.01`** Actualizar los insumos del precio técnico cuando cambian FTP, costos, capital o PD/LGD (al menos trimestralmente), y recalibrar el modelo de respuesta al menos una vez al año o ante alerta.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 3 · Entregable: Excel P2: Calculadora de precio técnico\n\n<!-- CATALOGO:FIN -->\n\n## P9 · Gobierno, conducta y regulación\n\n### Comité de Precios\n\nAprueba tarifarios, pisos, matrices de facultades, experimentos y excepciones a umbrales de pricing.\nLo integran el dueño del precio, Finanzas/ALM, Riesgos y Cumplimiento, con Analytics Pricing como secretaría\ntécnica. Cada sesión deja acta (tipo **PRC-CP** del [editor de actas](../plantillas/acta-de-reunion.md)).\n\n### Marco regulatorio y de conducta\n\n- **Topes de tasa** donde la regulación los fije. Por ejemplo, en Perú el BCRP fija tasas máximas para\n  ciertos créditos de consumo y pequeña empresa. **Verificar la norma y los valores vigentes** antes de cada\n  revisión de tarifario. El motor los controla en forma preventiva (U-24).\n- **Transparencia:** cálculo y publicación de la TCEA (créditos) y la TREA (depósitos), y comunicación\n  anticipada de cambios de condiciones, según la normativa de transparencia del supervisor local.\n- **Trato justo:** el precio se explica por riesgo, costo, plazo, canal y relación comercial. Está prohibido\n  usar como palanca la baja sensibilidad de clientes vulnerables. Se prueban proxies de atributos protegidos\n  como en [FR-06](../frontera/equidad-y-sesgo.md) (PRC-P9-02.02.01).\n- **Modelos de pricing = modelos:** precio técnico, respuesta y optimizador se inventarían, se asignan a un\n  Tier y se validan (ámbito VAL-P de [Validación](../validacion/validacion.md)).\n\n<!-- CATALOGO:INICIO PRC-P9 -->\n## Catálogo de requisitos · Gobierno, conducta y regulación de precios\n\n> Bloque generado desde `catalogo/prc-p9.yaml` (6 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Gobierno de precios\n\n#### 1.1 Comité de Precios\n\n- **`PRC-P9-01.01.01`** Operar un Comité de Precios con mandato escrito: aprueba tarifarios, pisos, matrices de facultades, experimentos y excepciones a umbrales de pricing. Integra al dueño del precio, Finanzas/ALM, Riesgos y Cumplimiento; cada sesión deja acta (PRC-CP).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Crítico · Entregable: Documento P9: Política de precios y conducta\n\n#### 1.2 Política de precios\n\n- **`PRC-P9-01.02.01`** Mantener una política de precios aprobada que establezca principios, metodología de piso técnico, gradualidad, facultades, uso de modelos y de agentes de IA, y frecuencia de revisión.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Entregable: Documento P9: Política de precios y conducta\n\n### 2 · Conducta y regulación\n\n#### 2.1 Cumplimiento regulatorio\n\n- **`PRC-P9-02.01.01`** Verificar el cumplimiento de la normativa vigente de tasas y transparencia: topes de tasa donde existan (U-24), cálculo y publicación de TCEA/TREA, comunicación de cambios de condiciones con la anticipación exigida y prohibición de cobros no permitidos.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 2 · Crítico · Entregable: Documento P9: Política de precios y conducta · Umbrales: U-24\n\n#### 2.2 Trato justo\n\n- **`PRC-P9-02.02.01`** Asegurar que el precio se explique por riesgo, costo, plazo, canal y relación comercial, y no por atributos protegidos o por la vulnerabilidad del cliente. Prohibido usar como palanca de precio la baja sensibilidad de clientes vulnerables (p.ej. menor alfabetización financiera). Probar proxies como en FR-06.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 2 · Crítico · Entregable: Documento P9: Política de precios y conducta\n\n#### 2.3 Explicabilidad al cliente\n\n- **`PRC-P9-02.03.01`** Poder explicar a un cliente, a un ejecutivo o al supervisor por qué una oferta tiene ese precio, a partir de los componentes del piso técnico y de los ajustes comerciales registrados.\n\n  Aplica: Tier I–II · Esfuerzo: 1 d · Automatización: 2 · Entregable: Documento P9: Política de precios y conducta\n\n### 3 · Agentes de IA en pricing\n\n#### 3.1 Controles\n\n- **`PRC-P9-03.01.01`** Si se usan agentes de IA en el ciclo de pricing, registrar cada agente (rol, herramientas permitidas, datos a los que accede), conservar el log de sus acciones y asegurar que ningún agente fije, publique ni apruebe precios: toda decisión de precio la toma y firma una persona con facultad.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 2 · Crítico · Entregable: Documento P9: Política de precios y conducta\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/implementacion/implementacion.md", "meta": {"id": "IMP", "titulo": "Implementación", "estandar": "Implementación", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 30}, "md": "# Implementación\n\n## Objetivo\n\nLlevar el modelo aprobado a producción de forma **fiel, controlada, recuperable y auditable**. Aplica igual a\ndesarrollos nuevos (fase D6) y calibraciones (C5). Duración de referencia: ≈ 2 semanas dentro de un desarrollo\ny ≈ 5–6 semanas como proyecto independiente.\n\n## Los dos documentos obligatorios\n\n### Documento 13 · Guía de implementación\n\nCon cuadro de control de cambios. Debe contener:\n\n- Versiones del modelo y **código de inventario**.\n- Descripción funcional de variables **input** y **output**.\n- Generación del universo, **llaves y desfases**.\n- Proceso de implementación paso a paso y aplicativos necesarios.\n- Control de calidad de datos (estabilidad poblacional con umbrales corporativos) y **plan de acción ante alertas**.\n\n### Documento 14 · Lineamientos de ejecución\n\n- Responsables de la ejecución periódica (y de los backups).\n- Ubicación de la documentación y archivos de ejecución.\n- **Planes de contingencia**: ausencia del responsable, caída de servidores o aplicativos (datalake, SAS…),\n  indisponibilidad de información, alertas de calidad de datos.\n- Evidencia de usuarios con acceso a ambientes productivos y de **backups** de documentos, scripts y datos.\n- Medios y normativa para compartir información con Validación de forma segura.\n\n## Requisitos técnicos\n\n- Script productivo con **logs de ejecución y errores**.\n- **Tabla productiva** con código de inventario del modelo y fecha de ejecución.\n- Controles de calidad sobre input y output: evolutivos y **PSI** contra un periodo de referencia, unicidad, missing;\n  umbrales de PSI definidos; si hay proveedor externo, exigir sus logs, estabilidad, unicidad y fechas de actualización.\n- Ruta productiva definida y respaldada, **código único** del modelo, listado de usuarios con acceso.\n\n## Certificación\n\n1. Definir las pruebas (Correo 3).\n2. Comparar modelamiento vs. implementación: **≥ 95 % de coincidencia** (U-15).\n3. Constancia de pruebas (Documento 14: Certificación).\n4. Conformidad del líder de implementación (o del Sub Gerente de Modelos de Riesgo si implementa el equipo modelador).\n5. Presentación al equipo usuario y acta de cierre (Acta 10).\n\n<!-- CATALOGO:INICIO IMP -->\n## Catálogo de requisitos · Implementación\n\n> Bloque generado desde `catalogo/imp.yaml` (28 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Implementación v1.0.\n\n### 1 · Implementación tecnológica\n\n#### 1.1 Documento de implementación\n\n- **`IMP-01.01.01`** Preparación del documento de implementación (Agregar un registo al cuadro de control de cambios con cada modificación ), este documento debe contener:\n  - Proceso de Implementación. El cual debe detallar:  \n   - Cuadro resumen de las versiones del modelo y código del modelo.  \n   - Descripción funcional de las variables input  \n   - Descripción a detalle de la generación del universo.  \n   - Descripción de las llaves y desfases a usar.  \n   - Descripción a detalle de todo el proceso de implementación.  \n   - Descripción funcional de las variables del output.  \n   - Descripción de los aplicativos necesarios para la ejecución del proceso..\n  - Proceso de control de Calidad de Datos. El cual consta del análisis de estabilidad poblacional de las variables cuyas umbrales son definidos corportaivamente.\n  - Detalle del plan de Acción cuando existan alertas en el control de Calidad de Datos\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1.75 d ágil / 2.75 d trad. · Automatización: 1 · Entregable: Documento 13: Guia de implementación · Hito: Sprint 20\n\n- **`IMP-01.01.02`** Documentación y reglamentación de variables críticas del modelo. Luego de la implementación, realizar controles para alarmas sobre cambios relevantes en variables originales y transformadas.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`IMP-01.01.03`** Documentar variables que deben ser modificadas en el tiempo, por nuevas versiones u otros\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`IMP-01.01.04`** Documentar la existencia de dependencia de variables inputs y/o otros modelos\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`IMP-01.01.05`** Envío de manual de implementación al equipo implementador\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0 d ágil / 0 d trad. · Automatización: 1 · Entregable: Acta 9: Reunión con el equipo implementador.\n\n- **`IMP-01.01.06`** Bitácora de cambios para variables, tablas empleada en modelo a implementar, tanto la versión del modelador como la versión final de data (ya que ellos cambian algunas fuentes)\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`IMP-01.01.07`** En caso la implementación no la realice el modelador se realizará una revisión con área de implementación y acta de entrega\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`IMP-01.01.08`** Registrar modelo en el inventario de modelos e incluir el código de modelo en el documento de implementación.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0 d ágil · Automatización: 1\n\n- **`IMP-01.01.09`** Documentar un plan de contingencia, para variables erradas y/o caidas de herramientas como datalake/ sas\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n#### 1.2 Documento de Lineamientos\n\n- **`IMP-01.02.01`** Preparación del documento de Lineamientos del proceso de Implementación. (Agregar un registo al cuadro de control de cambios con cada modificación ), este documento debe precisar:\n  - Responsables de la Ejecución Periódica.\n  - Ubicación del documento de implementación y archivos de ejecución\n  - Planes de Contingencia:  \n   - En caso el responsable de la ejecución no se encuentre disponible..  \n   - En caso los servidores y/o aplicaciones donde se ejecute el modelo no se encuentren disponibles.  \n   - En caso la información no se encuentre disponible.  \n   - En caso se tengan alertas de calidad de datos.\n  - Evidencias de disponibilidad de los usaurios que tienen accesos a los ambientes productivos del modelo.\n  - Evidencia de los backups de los docuemnto, archivos de ejecución e información procesada.\n  - Detalles de las herramientas o medios de comunicación por la cual se comparte información del modelo a validación y la normativa en el cual se rigen para que la transferencia sea bajo los lineamientos indicados por seguridad\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1.75 d ágil / 2.75 d trad. · Automatización: 1 · Entregable: Documento 14: Documento de Lineamientos\n\n#### 1.3 Desarrollo de implementación\n\n- **`IMP-01.03.01`** Desarrollo de script de implementación, el cual debe contar con un proceso de almacenamiento de Logs de ejecución y errores durante el proceso\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.8333 d ágil / 0.8333 d trad. · Automatización: 1 · Entregable: Proceso Productivo\n\n- **`IMP-01.03.02`** Construir la tabla productiva del modelo, la cual debe de contar con el código de inventario del modelo y fecha de ejecución\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.8333 d ágil / 0.8333 d trad. · Automatización: 1\n\n- **`IMP-01.03.03`** Garantizar que la información final se encuentre resguardada y en caso contrario generar un archivo plano y almacenar en la ruta productiva del modelo\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.8333 d ágil / 0.8333 d trad. · Automatización: 1\n\n#### 1.4 Calidad de datos\n\n- **`IMP-01.04.01`** Desarrollo de controles de calidad de datos para variables input y output:\n  - Evolutivos de distribución y calculo de PSI en función de un periodo de referencia.\n  - Control de unicidad de registros.\n  - Control de valores missing.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.5 d ágil / 0.5 d trad. · Automatización: 1 · Entregable: Excel: de Control de Calidad de Datos\n\n- **`IMP-01.04.02`** Definición de umbrales de PSI con los cuales se evaluará el control de calidad\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.5 d ágil / 0.5 d trad. · Automatización: 1\n\n- **`IMP-01.04.03`** Solicitud de controles de calidad en caso la información provenga de un proveedor externo.\n  - Reportes de ejecución correcta (Logs)\n  - Estabilidad Poblacional\n  - Unicidad de Resgistros.\n  - Fechas de Actualización de la información.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.5 d ágil / 0.5 d trad. · Automatización: 1\n\n#### 1.5 Entorno Tecnológico\n\n- **`IMP-01.05.01`** Definición de la ruta productiva en la cual se almacenará el proceso de implementació.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.3 d ágil / 0.3 d trad. · Automatización: 1\n\n- **`IMP-01.05.02`** Solicitar al equipo de servidores la evidencia del resguardo de la ruta productiva del modelo\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.3 d ágil / 0.3 d trad. · Automatización: 1\n\n- **`IMP-01.05.03`** Solicitud de un código único del modelo\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.3 d ágil / 0.3 d trad. · Automatización: 1\n\n- **`IMP-01.05.04`** Solicitud del listado de usuarios que tienen acceso a la ruta productiva del modelo y a la ubicación del resultado final\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.3 d ágil / 0.3 d trad. · Automatización: 1\n\n- **`IMP-01.05.05`** Solicitud de evidencia del resguardo de información en caso la información provenga de un proveedor externo.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.3 d ágil / 0.3 d trad. · Automatización: 1\n\n#### 1.6 Pruebas de certificación\n\n- **`IMP-01.06.01`** Definición de pruebas sobre el modelo a implementar\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Correo 3: Pruebas a realizar.\n\n- **`IMP-01.06.02`** Revisión de diferencias entre proceso de modelamiento vs proceso de implementación (95% de coincidencia mínima para obtener conformidad)\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1.0625 d ágil / 1.25 d trad. · Automatización: 1 · Umbrales: U-15\n\n- **`IMP-01.06.03`** Constancia de pruebas de control sobre el modelo\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Documento 14: Certificación del modelo. · Hito: SME 13\n\n- **`IMP-01.06.04`** Solicitar conformidad de los resultados al líder del proyecto de implementación (en caso la implementación sea realizada por el equipo modelador, la aprobación será brindada por el Sub Gerente de Modelos de Riesgos)\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`IMP-01.06.05`** Probar escenarios de error (datos faltantes, valores fuera de rango, caída de fuentes) y verificar el manejo de excepciones y el control de accesos del proceso productivo.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 2 · Crítico · Nota: Línea base 2.0 (2026-10-17). Res. SBS 00053-2023 art. 18.\n\n- **`IMP-01.06.06`** Registrar en cada resultado productivo la versión del modelo y del código que lo generó, para trazabilidad y seguimiento.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 2 · Nota: Línea base 2.0 (2026-10-17). Práctica de bancos de referencia; FR-07.\n\n#### 1.7 Presentación del proceso de implementación al equipo usuario\n\n- **`IMP-01.07.01`** Reunión y elaboración de acta\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Acta 10: Reunión de cierre · Hito: SME 13\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/pricing/agentes-ia.md", "meta": {"id": "PRC-IA", "titulo": "Pricing · Agentes de IA en el ciclo de pricing", "estandar": "Pricing", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 30}, "md": "# Pricing · Agentes de IA en el ciclo de pricing\n\nPricing es una de las áreas donde los agentes de IA aportan más. El trabajo es repetitivo y muy cargado de\ndatos (recalcular pisos, refrescar curvas, preparar escenarios, redactar comités), y las decisiones están\nmuy reguladas. La regla que lo hace posible es simple: **el agente prepara, la persona decide**.\nPRC-P9-03.01.01 lo hace obligatorio.\n\n## Arquitectura de referencia\n\n```text\n                    ┌──────────────────────────────────────────────┐\n                    │  Analista de pricing (orquesta, revisa, firma)│\n                    └───────────────┬──────────────────────────────┘\n                                    │ instrucciones + aprobación por paso\n   ┌───────────────┬────────────────┼────────────────┬───────────────────┐\n   ▼               ▼                ▼                ▼                   ▼\n Agente de      Agente de        Agente de        Agente de          Agente revisor\n datos          precio técnico   respuesta        escenarios         (2ª opinión)\n P2: arma la    P3: recalcula    P4: reentrena,   P5: corre el       contrasta contra\n base, corre    pisos y RAROC    calibra, reporta optimizador y      el catálogo y los\n controles      por celda        U-20/U-21        arma el comité     umbrales; lista\n                                                                     faltantes\n   │               │                │                │                   │\n   └───────────────┴──── herramientas permitidas ────┴───────────────────┘\n        consultas de solo lectura · scripts del toolkit · tools/acta.py · catálogo\n   ─────────────────────────── límite duro ───────────────────────────────\n        SIN acceso a: publicar tarifario · motor de precios · aprobar actas\n```\n\n## Qué hace cada agente y qué no\n\n| Agente | Hace | Nunca |\n|---|---|---|\n| **Datos** | Construye la base de cotizaciones, corre los controles de PRC-P2-02.01.01, reporta variación exógena | Modificar fuentes, borrar registros |\n| **Precio técnico** | Recalcula pisos y RAROC cuando cambian FTP, costos o PD/LGD; concilia diferencias > 5 pb | Cambiar supuestos de Finanzas o Riesgos |\n| **Respuesta** | Reentrena con restricciones monotónicas, reporta calibración por decil y tramo de precio | Relajar U-20 o U-21 para \"mejorar\" resultados |\n| **Escenarios** | Corre el optimizador con robustez, arma escenarios, redacta el borrador del acta PRC-CP | Elegir el escenario, enviar al comité |\n| **Revisor** | Contrasta entregables con el catálogo (PRC, VAL-P) y los umbrales; lista faltantes | Dar conformidad |\n\n## Controles obligatorios\n\n1. **Registro del agente:** rol, modelo usado, versión, herramientas y datos a los que accede (PRC-P9-03.01.01).\n2. **Log completo** de instrucciones, llamadas a herramientas y salidas, conservado con la evidencia del proyecto.\n3. **Herramientas de solo lectura** sobre datos productivos. Los agentes escriben solo en el espacio del proyecto.\n4. **Citas obligatorias:** toda afirmación normativa cita el ID (`PRC-P3-02.01.01`, `U-18`). Ver `AGENTS.md`.\n5. **Evaluación del agente:** antes de usarlo en un proyecto Tier I–II se prueba con un caso cerrado de\n   resultado conocido. Por ejemplo, recalcular el piso de un tarifario ya aprobado y obtener la misma cifra al punto básico.\n6. **Sin datos de clientes en prompts a servicios externos** no aprobados por Seguridad de la Información.\n\n## Impacto esperado en el esfuerzo\n\nEl modelo de esfuerzo v2 aplica a pricing la misma lógica que a desarrollo: el agente reduce el trabajo de\ndatos (≈ 75 %) y documentación (≈ 70 %), menos el de análisis (≈ 40 %), y nada en gobierno ni en reuniones.\nVer los resultados en [Estimación](../marco/estimacion.md) y en el Planificador (estándar *Pricing*).\n"}, {"path": "docs/parametros/r0-marco.md", "meta": {"id": "PAR", "titulo": "Parámetros de riesgo · Marco", "estandar": "Parámetros", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 31}, "md": "# Parámetros de riesgo · Marco\n\nLos scores ordenan clientes; los **parámetros** ponen cifras en soles. PD, LGD y EAD, más los escenarios\nmacroeconómicos y los criterios de staging, determinan la **pérdida crediticia esperada (ECL)** que se registra\nen los estados financieros bajo IFRS 9. También alimentan el capital, el stress testing, el precio técnico\n(PRC-P3) y el valor de vida del cliente. Un punto básico mal estimado en la PD de una cartera grande es\nun error contable, no solo estadístico. Por eso este estándar es el más exigente en conciliación, gobierno\ny backtesting.\n\n## Arquitectura de parámetros\n\n```text\n                 Escenarios macro (Estudios Económicos) ── probabilidades\n                                │\n                    modelos satélite (macro → tasas de default, LGD)\n                                │\n  Scores aprobados ──▶ PD 12m ─▶ PD lifetime ─┐\n  (Desarrollo/CAL)                            │\n  Recuperaciones ────▶ LGD / LGD en default ──┼──▶ ECL = Σ escenarios Σ períodos PD·LGD·EAD·descuento\n  Cronogramas/líneas ▶ EAD / CCF / vida ──────┘          │\n                                │                        ├── Stage 1: 12 meses\n                    Staging (SICR: PD lifetime vs. origen,├── Stage 2: lifetime\n                    backstops 30/90 días)                └── Stage 3: LGD en default\n                                │\n                         Overlays gobernados ──▶ ECL final ──▶ Contabilidad · IFRS 7 · Comité de provisiones\n```\n\n## Un parámetro, varios usos\n\n| Uso | Horizonte | Calibración | Particularidad |\n|---|---|---|---|\n| **IFRS 9 (ECL)** | 12 meses o vida | Point-in-time con forward-looking | Ponderación de escenarios, staging, descuento a la EIR |\n| **Provisiones regulatorias locales** | Según norma | Reglas del supervisor | En Perú conviven con IFRS 9 (Res. SBS 11356-2008); se documenta el puente |\n| **Capital (IRB, económico)** | 12 meses | Through-the-cycle; LGD downturn | Margen de conservadurismo |\n| **Pricing** | Vida de la operación | TTC o lifetime anualizada | Precio técnico (PRC-P3-01.02.01) |\n| **CLV** | Vida del cliente | Lifetime con fuga y prepago | Visión única de riesgo y valor (PAR-R10) |\n\n**Regla de oro:** un mismo dato, una misma definición de default (con sus puentes documentados) y una tabla de\nparámetros versionada que todos los consumidores leen (PAR-R10-02.01.01).\n\n## Fases del estándar\n\n| Fase | Contenido | Página |\n|---|---|---|\n| R1 | Marco, alcance, usos, segmentación, definiciones de default y cura | esta página |\n| R2 | Datos: cohortes, recuperaciones, exposición, macro, calidad | [R2](r2-datos.md) |\n| R3 | PD 12 meses y lifetime | [R3](r3-pd.md) |\n| R4–R5 | LGD, LGD en default, EAD, CCF y vida conductual | [R4–R5](r4-lgd-ead.md) |\n| R6–R7 | Escenarios, modelos satélite y staging (SICR) | [R6–R7](r6-escenarios-staging.md) |\n| R8 | Cálculo de la ECL, movimientos y overlays | [R8](r8-ecl.md) |\n| R9–R10 | Backtesting, gobierno, CLV y publicación de parámetros | [R9–R10](r9-backtesting-clv.md) |\n\n## Definición de default: el puente que siempre se debe documentar\n\nEl estándar de scores define el default como **más de 60 días de atraso en 12 meses** (U-17), porque busca\nanticipar el deterioro al originar. IFRS 9, en cambio, presume que el default **no ocurre después de los 90 días**\n(U-28), y la regulación prudencial suele usar 90 días. El área de Parámetros debe:\n\n1. Usar para la ECL una definición coherente con la gestión del riesgo y con la contabilidad (PAR-R1-02.01.01).\n2. Documentar el puente: si la PD se calibra desde un score entrenado con 60 días, mostrar la tasa de default a\n   90 días por grado y recalibrar la PD a la definición contable.\n3. Aplicar los mismos criterios de salida de default y cura en LGD y en staging (U-33).\n\n<!-- CATALOGO:INICIO PAR-R1 -->\n## Catálogo de requisitos · Marco, alcance y gobierno de parámetros\n\n> Bloque generado desde `catalogo/par-r1.yaml` (6 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · Alcance y usos\n\n#### 1.1 Inventario de parámetros\n\n- **`PAR-R1-01.01.01`** Inventariar los parámetros de riesgo por cartera y uso (PD 12 meses y lifetime, LGD, LGD en default, EAD/CCF, escenarios, criterios de staging, CLV) y registrar cada modelo en el inventario con su Tier.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Crítico · Entregable: Documento R1: Mapa de parámetros y usos · Hito: Sprint 0\n\n- **`PAR-R1-01.01.02`** Declarar los usos de cada parámetro (provisiones IFRS 9, provisiones regulatorias locales, capital, pricing, stress testing, CLV) y las diferencias de calibración que cada uso exige: point-in-time con forward-looking para IFRS 9, through-the-cycle o downturn para capital.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 1 · Crítico · Entregable: Documento R1: Mapa de parámetros y usos\n\n#### 1.2 Segmentación de carteras\n\n- **`PAR-R1-01.02.01`** Definir las carteras con riesgo homogéneo (producto, segmento, garantía, canal, moneda) sobre las que se estiman los parámetros, con evidencia de homogeneidad y materialidad suficiente de defaults por segmento.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Excel R1: Segmentación de carteras\n\n### 2 · Definiciones comunes\n\n#### 2.1 Default y unidad de análisis\n\n- **`PAR-R1-02.01.01`** Alinear la definición de default de parámetros con la gestión del riesgo y con la contabilidad: en IFRS 9 el default no puede ocurrir después de los 90 días de atraso salvo evidencia que refute la presunción (U-28). Documentar el puente con la definición de default de los scores de originación (U-17: más de 60 días) y su efecto en la calibración.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 1 · Crítico · Entregable: Documento R2: Definiciones de default, cura y unidad · Umbrales: U-28\n\n- **`PAR-R1-02.01.02`** Definir los criterios de salida de default y cura: período mínimo de observación y tratamiento de reestructurados (U-33), e impacto en LGD y en staging.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Crítico · Entregable: Documento R2: Definiciones de default, cura y unidad · Umbrales: U-33\n\n### 3 · Gobierno inicial\n\n#### 3.1 Kick off\n\n- **`PAR-R1-03.01.01`** Kick off del proyecto de parámetros con Riesgos, Finanzas/Contabilidad, Estudios Económicos y Validación.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Entregable: Acta PAR-KO: Kick off de parámetros · Hito: Kick Off\n\n<!-- CATALOGO:FIN -->\n\n## Fuentes públicas usadas para construir este estándar\n\nEl estándar se contrastó con guías libres y con la práctica pública de bancos de referencia:\n\n- **GPPC (2016)**, [*The implementation of IFRS 9 impairment requirements by banks*](https://www.iasplus.com/en/publications/global/other/ifrs-9-impairment-banks): la guía libre más completa (LIT-110).\n- **BCBS (2015)**, [*Guidance on credit risk and accounting for expected credit losses* (d350)](https://www.bis.org/bcbs/publ/d350.htm) (LIT-111).\n- **EBA (2017)**, [*Guidelines on accounting for expected credit losses* (EBA/GL/2017/06)](https://eba.europa.eu/sites/default/documents/files/documents/10180/1842525/d769d006-d992-4202-8838-711a034e80a2/Final%20Guidelines%20on%20Accounting%20for%20Expected%20Credit%20Losses%20%28EBA-GL-2017-06%29.pdf) (LIT-112).\n- **EBA (2023)**, [*IFRS 9 implementation by EU institutions*](https://www.eba.europa.eu/sites/default/files/2023-11/25b12d35-9c28-4335-a589-166c77198920/Final%20Report%20on%20IFRS9%20implementation%20by%20EU%20institutions.pdf): overlays estructurales, backtesting insuficiente (LIT-113).\n- **BCE (2024)**, [*IFRS 9 overlays and model improvements for novel risks*](https://www.bankingsupervision.europa.eu/ecb/pub/pdf/ssm.IFRS9novelrisks_202407~5e0eb30b5c.ro.pdf) (LIT-114).\n- **Credicorp, Form 20-F** ([ejercicio 2025](https://www.sec.gov/Archives/edgar/data/0001001290/000100129026000008/bap-20251231.htm)): PD × LGD × EAD descontada a la EIR, tres escenarios ponderados revisados trimestralmente, SICR mensual frente al origen y LGD ELBE para Stage 3 (LIT-122).\n\n> Estas fuentes son públicas y se citan como referencia de buenas prácticas. Las cifras y los criterios\n> de cualquier banco concreto se obtienen de sus documentos internos aprobados, no de este estándar.\n"}, {"path": "docs/parametros/r2-datos.md", "meta": {"id": "PAR-R2", "titulo": "Parámetros · R2 Datos y reconstrucción histórica", "estandar": "Parámetros", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 32}, "md": "# Parámetros · R2 Datos y reconstrucción histórica\n\nLos parámetros se estiman sobre **cuatro bases**, todas conciliadas con contabilidad:\n\n| Base | Unidad | Uso | Error típico que se debe evitar |\n|---|---|---|---|\n| Cohortes de default | Operación × mes | PD 12m y lifetime, matrices, curas | Cohortes que no incluyen un período de estrés (U-27) |\n| Recuperaciones (workout) | Default | LGD, LGD en default | Excluir procesos abiertos y sesgar la LGD a la baja (U-34) |\n| Exposición | Operación × mes | EAD, CCF, prepago, vida conductual | Medir el uso de línea en el default y no 12 meses antes |\n| Macro | Mes o trimestre | Modelos satélite | Usar series con frecuencias o rezagos distintos a los de Estudios Económicos |\n\n**Profundidad.** Al menos cinco años con un período de estrés (U-27). Si la cartera es nueva, se combinan\ndatos internos de carteras similares, datos de buró o externos y un margen de conservadurismo documentado.\n\n<!-- CATALOGO:INICIO PAR-R2 -->\n## Catálogo de requisitos · Datos y reconstrucción histórica\n\n> Bloque generado desde `catalogo/par-r2.yaml` (7 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · Bases de estimación\n\n#### 1.1 Series de default\n\n- **`PAR-R2-01.01.01`** Construir las cohortes de default por cartera con al menos cinco años de historia que incluyan un período de estrés (U-27): saldos, estados de atraso mensuales, defaults, curas y salidas (prepago, castigo, venta).\n\n  Aplica: Tier I–IV · Esfuerzo: 4 d · Automatización: 2 · Crítico · Entregable: Tabla R1: Cohortes de default · Hito: Sprint 1 · Umbrales: U-27\n\n- **`PAR-R2-01.01.02`** Reconstruir la historia de calificaciones o scores en una escala estable para estimar matrices de migración, corrigiendo cambios de modelo con un mapeo documentado.\n\n  Aplica: Tier I–II · Esfuerzo: 3 d · Automatización: 2 · Entregable: Tabla R1: Cohortes de default\n\n#### 1.2 Base de recuperaciones\n\n- **`PAR-R2-01.02.01`** Construir la base de recuperaciones por default: flujos de cobranza, ejecución de garantías, costos directos e indirectos y fecha de cierre del proceso. Identificar los procesos incompletos y su tratamiento.\n\n  Aplica: Tier I–IV · Esfuerzo: 4 d · Automatización: 2 · Crítico · Entregable: Tabla R2: Base de recuperaciones (workout)\n\n#### 1.3 Base de exposición\n\n- **`PAR-R2-01.03.01`** Construir la base de exposición: cronogramas de amortización, prepagos, líneas y uso de línea 12 meses antes del default para estimar CCF.\n\n  Aplica: Tier I–IV · Esfuerzo: 2.5 d · Automatización: 2 · Crítico · Entregable: Tabla R3: Base de exposición y uso de línea\n\n#### 1.4 Series macroeconómicas\n\n- **`PAR-R2-01.04.01`** Recopilar las series macroeconómicas candidatas (PBI, desempleo, inflación, tasas, tipo de cambio, precios de inmuebles, términos de intercambio) con la misma frecuencia y rezagos que usará Estudios Económicos en sus escenarios.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 2 · Crítico · Entregable: Tabla R4: Series macroeconómicas\n\n### 2 · Calidad de datos\n\n#### 2.1 Certificación\n\n- **`PAR-R2-02.01.01`** Aplicar los controles de calidad de DES-D2 y los específicos de parámetros: continuidad de cohortes, defaults sin recuperación registrada, recuperaciones mayores al saldo, y conciliación de saldos y castigos con contabilidad.\n\n  Aplica: Tier I–IV · Esfuerzo: 2.5 d · Automatización: 3 · Crítico · Entregable: Documento R3: Certificación de datos de parámetros\n\n- **`PAR-R2-02.01.02`** Certificar las bases con acta de conformidad de las fuentes (Riesgos, Cobranzas, Contabilidad, Estudios Económicos).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Entregable: Documento R3: Certificación de datos de parámetros\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/parametros/r3-pd.md", "meta": {"id": "PAR-R3", "titulo": "Parámetros · R3 Probabilidad de default", "estandar": "Parámetros", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 33}, "md": "# Parámetros · R3 Probabilidad de default\n\n## De la PD a 12 meses a la curva lifetime\n\nLa ECL de Stage 2 necesita la PD **de cada período futuro**, no solo la de los próximos 12 meses. Con un modelo\nde supervivencia en tiempo discreto, la probabilidad de default en el período $t$ dado que la operación llegó\nviva es la *hazard* $h(t)$, y:\n\n$$S(t)=\\prod_{u=1}^{t}\\big(1-h(u)\\big),\\qquad \\mathrm{PD}^{\\text{marg}}(t)=S(t-1)\\,h(t),\\qquad \\mathrm{PD}^{\\text{acum}}(T)=1-S(T)$$\n\nCon **riesgos competitivos** (prepago o cancelación con hazard $h^{p}$), la supervivencia relevante es\n$S(t)=\\prod_{u\\le t}(1-h(u)-h^{p}(u))$. Ignorarlos **sobreestima** la PD acumulada de los créditos que se\nprepagan (PAR-R3-02.01.02).\n\n| Método | Cuándo usarlo | Cuidado |\n|---|---|---|\n| **Supervivencia discreta** (logit o cloglog por período, con variables de comportamiento y macro) | Carteras minoristas con historia mensual | Separar efectos de antigüedad, cohorte y calendario |\n| **Matrices de migración (Markov)** | Carteras con escala de calificación estable (empresas) | Monotonicidad, estado absorbente, no estacionariedad |\n| **Curvas vintage** | Productos homogéneos, buen volumen | Extrapolación de la cola de la curva |\n\n## Point-in-time y through-the-cycle\n\nCon el modelo de un factor de Vasicek, una PD de largo plazo $\\mathrm{PD}_{\\text{TTC}}$ se condiciona al estado del\nciclo $Z$ (negativo en recesión) con correlación de activos $\\rho$:\n\n$$\\mathrm{PD}_{\\text{PIT}}(Z)=\\Phi\\!\\left(\\frac{\\Phi^{-1}(\\mathrm{PD}_{\\text{TTC}})-\\sqrt{\\rho}\\,Z}{\\sqrt{1-\\rho}}\\right)$$\n\nProyectando $Z$ con los escenarios macro se obtienen matrices PIT por período y, multiplicándolas, la PD lifetime\ncondicional a cada escenario. La literatura reciente propone filtros de estado para estabilizar estas\nproyecciones a varios años (ver Frontera en [R9–R10](r9-backtesting-clv.md)).\n\n## Calibración\n\nLa PD se calibra al nivel observado con la definición de default de parámetros, y se contrasta por grado con\nel **test de Jeffreys** (U-30): con $d$ defaults en $n$ operaciones, el p-valor es la CDF de una\n$\\mathrm{Beta}(d+\\tfrac12,\\;n-d+\\tfrac12)$ evaluada en la PD. Valores bajos indican que la PD subestima el riesgo.\n\n<!-- CATALOGO:INICIO PAR-R3 -->\n## Catálogo de requisitos · Probabilidad de default (PD)\n\n> Bloque generado desde `catalogo/par-r3.yaml` (7 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · PD a 12 meses\n\n#### 1.1 Estimación y calibración\n\n- **`PAR-R3-01.01.01`** Estimar la PD a 12 meses por grado o segmento, o calibrar el score aprobado a tasas de default observadas siguiendo DES-D4-08, con la definición de default de R1.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Script R1: Modelos de PD · Hito: Sprint 2\n\n- **`PAR-R3-01.01.02`** Separar el componente through-the-cycle (tendencia de largo plazo) del point-in-time (ciclo), y documentar cómo se ancla la PD al promedio de largo plazo.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Documento R4: Metodología de PD\n\n### 2 · PD lifetime\n\n#### 2.1 Estructura temporal\n\n- **`PAR-R3-02.01.01`** Estimar la curva de PD lifetime (marginal y acumulada por período) con un método documentado: supervivencia en tiempo discreto, matrices de migración (Markov) o curvas vintage, según la cartera y los datos disponibles.\n\n  Aplica: Tier I–IV · Esfuerzo: 4 d · Automatización: 2 · Crítico · Entregable: Script R1: Modelos de PD\n\n- **`PAR-R3-02.01.02`** Tratar los riesgos competitivos (prepago, cancelación, castigo) para no sobreestimar la PD acumulada de operaciones que salen del portafolio antes de su vencimiento.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Entregable: Script R1: Modelos de PD\n\n- **`PAR-R3-02.01.03`** Para matrices de migración: verificar monotonicidad (mayor PD en peores grados), estado absorbente de default y estabilidad de la matriz; si se condiciona al ciclo (factor Z de Vasicek u otro), documentar la estimación del factor.\n\n  Aplica: Tier I–II · Esfuerzo: 1.5 d · Automatización: 2 · Entregable: Script R1: Modelos de PD\n\n### 3 · Desempeño de la PD\n\n#### 3.1 Validación de la PD\n\n- **`PAR-R3-03.01.01`** Evaluar discriminación por horizonte y, sobre todo, calibración: tasa observada vs. PD por grado con el test de Jeffreys (U-30), en construcción y en los períodos más recientes.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 3 · Crítico · Entregable: Excel R2: Desempeño y calibración de PD · Umbrales: U-30\n\n- **`PAR-R3-03.01.02`** Documentar la metodología de PD, sus supuestos y limitaciones con la estructura de DES-D4-11.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 1 · Entregable: Documento R4: Metodología de PD\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/parametros/r4-lgd-ead.md", "meta": {"id": "PAR-R4", "titulo": "Parámetros · R4–R5 Severidad y exposición", "estandar": "Parámetros", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 34}, "md": "# Parámetros · R4–R5 Severidad y exposición\n\n## R4 · LGD\n\n**LGD workout** de un default con exposición $\\mathrm{EAD}$, recuperaciones $R_k$ y costos $C_k$ en los momentos\n$t_k$, descontados a la tasa de interés efectiva (U-34):\n\n$$\\mathrm{LGD}=1-\\frac{1}{\\mathrm{EAD}}\\sum_{k}\\frac{R_k-C_k}{(1+\\mathrm{EIR})^{t_k}}$$\n\n**Modelo de dos etapas.** Muchos defaults minoristas se curan (vuelven al día) con pérdida casi nula. Separar ese\ncomponente mejora la precisión:\n\n$$\\mathrm{LGD}=p_{\\text{cura}}\\cdot \\mathrm{LGD}_{\\text{cura}}+(1-p_{\\text{cura}})\\cdot \\mathrm{LGD}_{\\text{no cura}}$$\n\n**Buenas prácticas**\n\n- La LGD vive en $[0,1]$ y suele ser bimodal: usar regresión fraccional, beta, dos etapas o ML con calibración, nunca una regresión lineal sin restricciones.\n- **Procesos incompletos:** se incluyen proyectando las recuperaciones remanentes. Excluirlos sesga la LGD hacia los casos que se resuelven rápido, que son los de menor pérdida.\n- **Garantías:** el driver es el LTV *actual* (con el valor de la garantía actualizado), no el de originación.\n- **LGD en default (ELBE):** para Stage 3 la severidad depende del tiempo en default; una operación con 24 meses en cobranza tiene menos probabilidad de recuperarse que una recién caída.\n\n<!-- CATALOGO:INICIO PAR-R4 -->\n## Catálogo de requisitos · Severidad (LGD)\n\n> Bloque generado desde `catalogo/par-r4.yaml` (8 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · LGD de operaciones vigentes\n\n#### 1.1 LGD workout\n\n- **`PAR-R4-01.01.01`** Calcular la LGD realizada por default como 1 menos el valor presente de las recuperaciones netas de costos sobre la EAD, descontadas a la tasa de interés efectiva (U-34).\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Excel R3: LGD realizada · Hito: Sprint 3 · Umbrales: U-34\n\n- **`PAR-R4-01.01.02`** Tratar los procesos de recuperación incompletos con un método documentado (proyección de recuperaciones remanentes, curvas de recuperación) en lugar de excluirlos, para no sesgar la LGD hacia los casos que se cierran rápido.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Excel R3: LGD realizada · Umbrales: U-34\n\n- **`PAR-R4-01.01.03`** Separar la LGD en sus componentes cuando aporte precisión: probabilidad de cura y severidad dado que no hay cura (modelo de dos etapas).\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Entregable: Script R2: Modelos de LGD\n\n#### 1.2 Modelo de LGD\n\n- **`PAR-R4-01.02.01`** Estimar el modelo de LGD respetando su soporte acotado y su distribución bimodal (regresión fraccional, beta, dos etapas o métodos de ML con calibración), con drivers de garantía (LTV actual), producto y antigüedad del default.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Script R2: Modelos de LGD\n\n- **`PAR-R4-01.02.02`** Incorporar el forward-looking en la LGD cuando la recuperación dependa del ciclo (por ejemplo, precios de inmuebles para hipotecarios), con el mismo marco de escenarios de R6.\n\n  Aplica: Tier I–II · Esfuerzo: 1.5 d · Automatización: 2 · Entregable: Script R2: Modelos de LGD\n\n### 2 · LGD en default\n\n#### 2.1 Exposiciones en default\n\n- **`PAR-R4-02.01.01`** Estimar la LGD para exposiciones ya en default (mejor estimación de la pérdida, ELBE) en función del tiempo en default y del estado de la cobranza, para el cálculo de Stage 3.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Script R2: Modelos de LGD\n\n### 3 · Validación y documentación\n\n#### 3.1 Desempeño de la LGD\n\n- **`PAR-R4-03.01.01`** Comparar LGD estimada vs. realizada por segmento y por año de default, incluido el período de estrés, y evaluar el poder de ordenamiento.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 3 · Crítico · Entregable: Excel R4: Desempeño de LGD\n\n- **`PAR-R4-03.01.02`** Documentar la metodología de LGD (descuento, costos, incompletos, garantías, LGD en default).\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 1 · Entregable: Documento R5: Metodología de LGD\n\n<!-- CATALOGO:FIN -->\n\n## R5 · EAD y CCF\n\nPara productos **revolventes**, la exposición al default incluye la parte de la línea que el cliente usará antes de caer:\n\n$$\\mathrm{EAD}=\\text{Saldo}+\\mathrm{CCF}\\cdot(\\text{Línea}-\\text{Saldo}),\\qquad\n\\mathrm{CCF}_{\\text{realizado}}=\\frac{\\mathrm{EAD}_{\\text{default}}-\\text{Saldo}_{t-12}}{\\text{Línea}_{t-12}-\\text{Saldo}_{t-12}}$$\n\nSe mide con la foto **12 meses antes del default**. Medirla al momento del default subestima el CCF.\n\n**Vida conductual.** Una tarjeta no tiene vencimiento contractual efectivo: el banco queda expuesto mientras no\ngestione la línea. Para la ECL lifetime se usa el período de exposición observado (tiempo hasta la cancelación,\nel default o la reducción efectiva de la línea), documentado por cartera (PAR-R5-02.01.02).\n\nPara **amortizables**, la exposición sigue el cronograma ajustado por prepagos esperados, coherente con la EIR\n(PAR-R5-01.01.01).\n\n<!-- CATALOGO:INICIO PAR-R5 -->\n## Catálogo de requisitos · Exposición (EAD y CCF)\n\n> Bloque generado desde `catalogo/par-r5.yaml` (3 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · Exposición de productos amortizables\n\n#### 1.1 Perfil de exposición\n\n- **`PAR-R5-01.01.01`** Proyectar la exposición de cada período con el cronograma contractual ajustado por prepagos y cancelaciones esperadas, consistente con la tasa de interés efectiva.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Script R3: Modelos de EAD y CCF · Hito: Sprint 3\n\n### 2 · Exposición de productos revolventes\n\n#### 2.1 CCF y vida conductual\n\n- **`PAR-R5-02.01.01`** Estimar el factor de conversión (CCF) del monto no utilizado a 12 meses antes del default, con el uso de línea, la antigüedad y el estado de atraso como drivers.\n\n  Aplica: Tier I–IV · Esfuerzo: 2.5 d · Automatización: 2 · Crítico · Entregable: Script R3: Modelos de EAD y CCF\n\n- **`PAR-R5-02.01.02`** Para revolventes (tarjetas, líneas), estimar el período de exposición conductual más allá del plazo contractual, durante el que el banco está expuesto porque no gestiona la línea en la práctica; documentar el horizonte usado para la ECL lifetime.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 2 · Crítico · Entregable: Documento R6: Metodología de EAD y vida conductual\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/parametros/r6-escenarios-staging.md", "meta": {"id": "PAR-R6", "titulo": "Parámetros · R6–R7 Escenarios y staging", "estandar": "Parámetros", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 35}, "md": "# Parámetros · R6–R7 Escenarios y staging\n\n## R6 · Forward-looking\n\n**Responsabilidades.** Estudios Económicos produce los escenarios y sus probabilidades; Parámetros los traduce a\ntasas de default y LGD con **modelos satélite**; el comité los aprueba cada trimestre (U-32).\n\n**La no linealidad importa.** Las pérdidas crecen más que proporcionalmente en recesión. Por eso la ECL se pondera\n**después** de calcularla en cada escenario:\n\n| Escenario | Probabilidad | ECL (ejemplo, millones) |\n|---|---:|---:|\n| Optimista | 25 % | 100 |\n| Base | 50 % | 120 |\n| Pesimista | 25 % | 220 |\n| **ECL ponderada** $\\sum_s p_s\\,\\mathrm{ECL}_s$ | | **140** |\n| ECL de un \"escenario promedio\" (incorrecto) | | ≈ 125 |\n\nUsar el escenario promedio **subestima** la provisión, aquí en unos 15 millones.\n\n**Riesgos que la macro no ve.** Clima, energía, cadenas de suministro, geopolítica o concentraciones sectoriales\nno siempre se reflejan en el PBI. El BCE considera mala práctica tratarlos solo vía variables macro generales\n(LIT-114). Se evalúan explícitamente y, si el modelo no los captura, se cubren con un overlay gobernado (R8).\n\n<!-- CATALOGO:INICIO PAR-R6 -->\n## Catálogo de requisitos · Escenarios macroeconómicos y forward-looking\n\n> Bloque generado desde `catalogo/par-r6.yaml` (6 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · Escenarios\n\n#### 1.1 Diseño y probabilidades\n\n- **`PAR-R6-01.01.01`** Recibir de Estudios Económicos al menos tres escenarios (base, optimista y pesimista) con sus probabilidades y su sustento, revisados como mínimo cada trimestre (U-32).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Crítico · Entregable: Documento R7: Escenarios y probabilidades · Hito: Sprint 4 · Umbrales: U-32\n\n- **`PAR-R6-01.01.02`** Definir el horizonte de proyección explícito y la regla de reversión a la media de largo plazo de las variables macro y de los parámetros.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Crítico · Entregable: Documento R7: Escenarios y probabilidades\n\n### 2 · Modelos satélite\n\n#### 2.1 Vínculo macro–parámetros\n\n- **`PAR-R6-02.01.01`** Estimar los modelos satélite que vinculan las variables macro con la tasa de default (y con la LGD cuando aplique): selección de variables con sentido económico y signo esperado, rezagos, y estabilidad fuera de muestra.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Script R4: Modelos satélite\n\n- **`PAR-R6-02.01.02`** Probar la no linealidad: la ECL ponderada se calcula como el promedio de las ECL de cada escenario, nunca como la ECL de un escenario promedio (U-32).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 3 · Crítico · Entregable: Excel R5: ECL por escenario · Umbrales: U-32\n\n- **`PAR-R6-02.01.03`** Evaluar riesgos que la macro no captura (clima, energía, cadenas de suministro, geopolítica, sectores concentrados) y decidir si requieren un ajuste del modelo o un overlay gobernado (R8).\n\n  Aplica: Tier I–II · Esfuerzo: 1.5 d · Automatización: 1 · Entregable: Documento R7: Escenarios y probabilidades\n\n### 3 · Gobierno de escenarios\n\n#### 3.1 Revisión trimestral\n\n- **`PAR-R6-03.01.01`** Reunión trimestral de revisión de escenarios y probabilidades con Estudios Económicos, Riesgos y Contabilidad.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d · Automatización: 1 · Entregable: Acta PAR-ESC: Revisión de escenarios\n\n<!-- CATALOGO:FIN -->\n\n## R7 · Staging\n\n| Stage | Condición | ECL |\n|---|---|---|\n| **1** | Sin aumento significativo del riesgo desde el origen | 12 meses |\n| **2** | Aumento significativo (SICR), sin default | Lifetime |\n| **3** | En default (deterioro crediticio) | Lifetime con LGD en default |\n\n**Criterio cuantitativo** (U-29), por operación, con PD lifetime en el reconocimiento inicial y hoy, para el plazo remanente:\n\n$$\\frac{\\mathrm{PD}^{\\text{LT}}_{\\text{hoy}}}{\\mathrm{PD}^{\\text{LT}}_{\\text{origen}}}\\ \\ge\\ k\\qquad\\text{y}\\qquad \\mathrm{PD}^{\\text{LT}}_{\\text{hoy}}-\\mathrm{PD}^{\\text{LT}}_{\\text{origen}}\\ \\ge\\ a$$\n\nEl umbral absoluto $a$ evita que operaciones de muy bajo riesgo pasen a Stage 2 por variaciones mínimas; el\nrelativo $k$ capta el deterioro en riesgos medios.\n\n**Backstops y criterios cualitativos** (U-28): más de 30 días de atraso implica Stage 2; default implica Stage 3.\nA esto se suman refinanciados, lista de vigilancia y alertas tempranas.\n\n**Cómo saber si el staging funciona:** la mayoría de los defaults deberían haber pasado antes por Stage 2, con\nanticipación suficiente (PAR-R7-01.01.02). Si muchos defaults saltan directo de Stage 1 a Stage 3, los umbrales\nson demasiado laxos.\n\n<!-- CATALOGO:INICIO PAR-R7 -->\n## Catálogo de requisitos · Staging y aumento significativo del riesgo (SICR)\n\n> Bloque generado desde `catalogo/par-r7.yaml` (4 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Parámetros de riesgo v1.0 (nuevo, 2026-10-17).\n\n### 1 · Criterios de staging\n\n#### 1.1 Criterios cuantitativos\n\n- **`PAR-R7-01.01.01`** Comparar la PD lifetime actual con la PD lifetime en el reconocimiento inicial, por operación, con umbrales relativos y absolutos calibrados por cartera (U-29).\n\n  Aplica: Tier I–IV · Esfuerzo: 2.5 d · Automatización: 2 · Crítico · Entregable: Documento R8: Criterios de staging · Hito: Sprint 5 · Umbrales: U-29\n\n- **`PAR-R7-01.01.02`** Calibrar los umbrales SICR para que Stage 2 anticipe el default: proporción de defaults que pasaron antes por Stage 2, tiempo de permanencia y estabilidad de las transiciones.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Excel R6: Calibración de umbrales SICR · Umbrales: U-29\n\n#### 1.2 Criterios cualitativos y backstops\n\n- **`PAR-R7-01.02.01`** Aplicar el backstop de 30 días de atraso para Stage 2 y el de default para Stage 3 (U-28), además de criterios cualitativos: refinanciados, lista de vigilancia y alertas tempranas.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 2 · Crítico · Entregable: Documento R8: Criterios de staging · Umbrales: U-28\n\n- **`PAR-R7-01.02.02`** Definir el retorno de Stage 2 a Stage 1 y de Stage 3 a Stage 2 con períodos de prueba (U-33), y documentar el tratamiento de activos adquiridos u originados con deterioro (POCI).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Entregable: Documento R8: Criterios de staging · Umbrales: U-33\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/seguimiento/seguimiento.md", "meta": {"id": "SEG", "titulo": "Seguimiento (monitoreo) de modelos", "estandar": "Seguimiento", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 35}, "md": "# Seguimiento (monitoreo) de modelos\n\n> **Línea base 2.0.** El seguimiento tiene catálogo propio (SEG-S1 a SEG-S4), alineado con la Res. SBS 00053-2023 (arts. 21–22) y con la\n> práctica de los bancos de referencia: indicadores y umbrales aprobados por comité, seguimiento de forzajes,\n> sobreajuste en IA, acciones gobernadas e informe al menos anual. Para precios, ver además\n> [Pricing · P8](../pricing/p8-seguimiento-gobierno.md); para provisiones, [Parámetros · R9](../parametros/r9-backtesting-clv.md).\n\n## Qué se mide\n\n| Familia | Indicador | Periodicidad | Umbral |\n|---|---|---|---|\n| Estabilidad | PSI del score y de cada variable | Mensual | U-37 (verde ≤ 10 %, rojo > 25 %) |\n| Discriminación | Gini y KS por cosecha madura, global y por segmento | Mensual o trimestral | U-37 (rojo: caída > 10 pts) |\n| Calibración | Tasa observada vs. PD por tramo (binomial o Jeffreys); estimadores con ±25 %/±50 % | Trimestral | U-37, U-12 |\n| Uso | Volumen y desempeño de los forzajes; uso solo para el propósito aprobado | Mensual | U-36 |\n| IA | Sobreajuste en producción (construcción vs. meses recientes) | Trimestral | Según el plan aprobado |\n| Datos | Fill rate, duplicados, frescura de fuentes externas | Cada ejecución | Cualquier fallo es rojo |\n\n## Qué se hace ante una alerta\n\n```text\nVerde ─▶ continuar\nÁmbar ─▶ análisis de causa raíz (drivers, mix, pauta) en ≤ 1 mes\nRojo en calibración, discriminación aceptable ─▶ CALIBRACIÓN (estándar CAL)\nRojo en discriminación ─▶ REDESARROLLO (estándar DES)\nRojo en datos ─▶ plan de contingencia del Documento de Lineamientos (IMP-01.02.01)\nRojo persistente 3 períodos o cambio material de política/población ─▶ comité de riesgos de modelo + mitigación temporal\n```\n\n## Requisitos heredados de otros estándares\n\n| Requisito | Origen |\n|---|---|\n| Reporte de seguimiento preparado en el desarrollo | DES-D4-09.01.02 |\n| Muestra mínima mensual para estimadores | DES-D5-01.03.01 |\n| Política de forzajes definida antes del uso | DES-D5-01.01.02 |\n| Controles de PSI, unicidad y missing en producción | IMP-01.04.01, IMP-01.04.02 |\n| Versión del modelo registrada en cada resultado | IMP-01.06.06 |\n| La calibración parte de la base de seguimiento | CAL-C1-01.02.01, CAL-C1-01.02.02 |\n\n<!-- CATALOGO:INICIO SEG-S1 -->\n## Catálogo de requisitos · Diseño del seguimiento\n\n> Bloque generado desde `catalogo/seg-s1.yaml` (3 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): consolidación de requisitos vigentes, Res. SBS 00053-2023 y práctica de bancos de referencia.\n\n### 1 · Plan de seguimiento\n\n#### 1.1 Indicadores y umbrales\n\n- **`SEG-S1-01.01.01`** Definir para cada modelo los indicadores de seguimiento (estabilidad, discriminación, calibración, forzajes, calidad de datos y, para IA, sobreajuste) con umbrales y alertas aprobados por el comité de riesgos de modelo (SBS art. 21; U-37).\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 2 · Crítico · Entregable: Documento S1: Plan de seguimiento · Hito: Sprint 0 · Umbrales: U-37\n\n- **`SEG-S1-01.01.02`** Fijar la periodicidad por categoría (Tier I mensual o trimestral; Tier III–IV al menos semestral) y la fecha en que cada cosecha madura lo suficiente para medir desempeño.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Entregable: Documento S1: Plan de seguimiento\n\n- **`SEG-S1-01.01.03`** Asegurar los datos de seguimiento: tabla productiva con versión del modelo, scores, decisiones, forzajes y desempeño posterior; para estimadores, la muestra mínima acordada en DES-D5-01.03.01.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Tabla S1: Base de seguimiento\n\n<!-- CATALOGO:FIN -->\n\n<!-- CATALOGO:INICIO SEG-S2 -->\n## Catálogo de requisitos · Ejecución del seguimiento\n\n> Bloque generado desde `catalogo/seg-s2.yaml` (6 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): consolidación de requisitos vigentes, Res. SBS 00053-2023 y práctica de bancos de referencia.\n\n### 1 · Indicadores\n\n#### 1.1 Estabilidad y datos\n\n- **`SEG-S2-01.01.01`** Medir el PSI del score y de cada variable frente a la población de construcción, y los controles de calidad de los datos productivos (missings, duplicados, fuentes desactualizadas).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 4 · Crítico · Entregable: Dashboard S1: Tablero de seguimiento\n\n#### 1.2 Desempeño\n\n- **`SEG-S2-01.02.01`** Medir la discriminación (Gini, KS) por cosecha madura, global y por segmento, frente a la de construcción (U-37).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 4 · Crítico · Entregable: Dashboard S1: Tablero de seguimiento · Umbrales: U-37\n\n- **`SEG-S2-01.02.02`** Medir la calibración: tasa observada vs. PD por tramo con intervalos binomiales o de Jeffreys; para estimadores, el % de casos dentro de ±25 % y ±50 % (U-12).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 4 · Crítico · Entregable: Dashboard S1: Tablero de seguimiento\n\n- **`SEG-S2-01.02.03`** Para modelos de IA, medir el sobreajuste en producción: brecha de desempeño entre construcción y los meses recientes (SBS art. 22).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 3 · Entregable: Dashboard S1: Tablero de seguimiento\n\n#### 1.3 Uso y forzajes\n\n- **`SEG-S2-01.03.01`** Medir el volumen de forzajes (overrides) y el desempeño de los casos forzados frente a los no forzados, por motivo y por nivel que forzó (U-36).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 3 · Crítico · Entregable: Dashboard S1: Tablero de seguimiento · Umbrales: U-36\n\n- **`SEG-S2-01.03.02`** Verificar que el modelo se usa solo para el propósito y la población aprobados; un uso nuevo es un cambio de uso que requiere aprobación (GOB-G3-01.01.01).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Crítico\n\n<!-- CATALOGO:FIN -->\n\n<!-- CATALOGO:INICIO SEG-S3 -->\n## Catálogo de requisitos · Acciones ante alertas\n\n> Bloque generado desde `catalogo/seg-s3.yaml` (2 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): consolidación de requisitos vigentes, Res. SBS 00053-2023 y práctica de bancos de referencia.\n\n### 1 · Respuesta\n\n#### 1.1 Árbol de decisión\n\n- **`SEG-S3-01.01.01`** Aplicar el árbol de decisión: verde, continuar; ámbar, análisis de causa raíz en un mes; rojo en calibración con discriminación aceptable, calibrar (CAL); rojo en discriminación, redesarrollar (DES); rojo en datos, plan de contingencia (IMP-01.02.01).\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Crítico · Entregable: Documento S2: Informe de seguimiento\n\n- **`SEG-S3-01.01.02`** Escalar al comité un rojo que persista tres períodos o un cambio material de política o de población, con medidas temporales de mitigación mientras se corrige (SBS art. 7).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Crítico · Entregable: Acta CRM: Comité de riesgos de modelo\n\n<!-- CATALOGO:FIN -->\n\n<!-- CATALOGO:INICIO SEG-S4 -->\n## Catálogo de requisitos · Reporte del seguimiento\n\n> Bloque generado desde `catalogo/seg-s4.yaml` (2 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): consolidación de requisitos vigentes, Res. SBS 00053-2023 y práctica de bancos de referencia.\n\n### 1 · Informes\n\n#### 1.1 Informe periódico\n\n- **`SEG-S4-01.01.01`** Emitir el informe de seguimiento al menos una vez al año (más frecuente según categoría) con desviaciones de indicadores, backtesting, sensibilidad, forzajes, cumplimiento de acciones y, para IA, sobreajuste; aprobarlo en el comité (SBS art. 22).\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Documento S2: Informe de seguimiento\n\n- **`SEG-S4-01.01.02`** Actualizar el inventario con el estado del modelo y sus debilidades abiertas después de cada informe (GOB-G2-01.01.01).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d · Automatización: 2\n\n<!-- CATALOGO:FIN -->\n\n## Frontera *(propuesta)*\n\nVer [FR-05 · Monitoreo de drift moderno](../frontera/monitoreo-drift.md): Jensen–Shannon y Wasserstein además del\nPSI, validación adversarial y estimación de desempeño sin etiquetas mientras maduran las cosechas.\n"}, {"path": "docs/parametros/r8-ecl.md", "meta": {"id": "PAR-R8", "titulo": "Parámetros · R8 Pérdida esperada y overlays", "estandar": "Parámetros", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 36}, "md": "# Parámetros · R8 Pérdida esperada y overlays\n\n## Cálculo\n\nPa
