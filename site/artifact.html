elos en Banca\n\n[![Publicar sitio](https://github.com/YuriPlasencia/estandares-modelos/actions/workflows/pages.yml/badge.svg)](https://github.com/YuriPlasencia/estandares-modelos/actions/workflows/pages.yml)\n\n**Sitio:** https://yuriplasencia.github.io/estandares-modelos/\n\n**Un estándar abierto, versionado y legible por máquinas para el ciclo de vida completo de los modelos en banca:\ndesarrollo, calibración, implementación, seguimiento, validación, parámetros de riesgo (IFRS 9), pricing analítico\ny trabajo con agentes de IA.**\n\nAutor y custodio: **Yuri Plasencia — Analytics Pricing & Revenue Management** · Versión **2.2.0** (sobre la línea base 2.0) · Octubre 2026 · Licencia CC BY 4.0 (contenido) y MIT (código)\n\n---\n\n## Por qué existe\n\nLos estándares de modelos suelen vivir en documentos difíciles de mantener, de auditar y de consultar. Este\nrepositorio los trata como **código**: cada requisito tiene un ID estable, cada umbral está en una lista cerrada y\ntrazable, cada cambio pasa por control de versiones, y todo se publica a la vez para personas (un sitio navegable) y\npara agentes de IA (JSON y `llms.txt`).\n\n| | |\n|---|---|\n| **540 requisitos** con ID estable, aplicabilidad por Tier y tipo de modelo, esfuerzo, entregables e hitos | **39 umbrales** cuantitativos, cada uno enlazado a los requisitos que lo establecen |\n| **103 obras** de literatura enlazadas a los requisitos que fundamentan | **27 tipos de acta**, con editor en línea y exportación a Word y Markdown |\n| Mapeo artículo por artículo a la **Res. SBS 00053-2023** y alineado con **SR 26-2**, **PRA SS1/23**, IFRS 9 y el **EU AI Act** | **Estándar operativo para agentes de IA** con verificador automático de evidencias |\n\n## Contenido\n\n| Estándar | Prefijo | Qué cubre |\n|---|---|---|\n| Gobierno del riesgo de modelo | `GOB` | Comité, inventario, categorización, aprobación previa, terceros, IA, informe anual |\n| Desarrollo | `DES` | Definición, datos, segmentación, modelamiento, integración a la gestión, gobierno |\n| Calibración | `CAL` | Entendimiento, datos, segmentación, calibrado e implementación del calibrado |\n| Implementación | `IMP` | Documentación, lineamientos, controles, entorno tecnológico, certificación |\n| Seguimiento | `SEG` | Indicadores y umbrales, forzajes, acciones ante alertas, informe periódico |\n| Validación | `VAL` | Metodológica, de implementación, de parámetros y de pricing |\n| Parámetros de riesgo | `PAR` | PD, LGD, EAD/CCF, escenarios, staging, ECL, overlays, backtesting y CLV |\n| Pricing analítico | `PRC` | Precio técnico, respuesta al precio, optimización, experimentos, motor de precios, conducta |\n| Agentes de IA | `AGT` | Contratos de tarea, puntos de control humanos, evidencias, evaluación de agentes |\n\nCada estándar distingue lo **vigente** (obligatorio), lo que está en **borrador** y las **propuestas de frontera**\n(prácticas emergentes que no son obligatorias hasta aprobarse).\n\n## Cómo usarlo\n\n**Para leer.** Entra al [sitio publicado](https://yuriplasencia.github.io/estandares-modelos/) o abre `site/index.html` con doble clic (funciona sin servidor). Incluye buscador, panel de detalle por\nrequisito con sus lecturas, planificador por estándar, Tier, tipo de modelo y enfoque, y el editor de actas.\nTambién puedes leer directamente `docs/` (Markdown con fórmulas en LaTeX).\nEn el sitio publicado, las actas se guardan en el navegador de cada persona; para editarlas en equipo, usa el\nrepositorio con `tools/acta.py` o una instancia con almacenamiento compartido.\n\n**Para trabajar un modelo.**\n\n```bash\npip install pyyaml\npython tools/verificar.py --init ../MOD-ORI-001 --estandar Desarrollo --tier 2 --modelo ml --enfoque agil\npython tools/verificar.py --plan ../MOD-ORI-001 --fase DES-D4\npython tools/acta.py nueva --tipo R5 --codigo MOD-ORI-001 --nombre \"Score de originación\" -o ../MOD-ORI-001/actas/acta-05.json\npython tools/acta.py exportar ../MOD-ORI-001/actas/acta-05.json --docx --md\npython tools/documento.py nuevo ../MOD-ORI-001\npython tools/documento.py render ../MOD-ORI-001/docs/documento.yaml   # .md, .html, .docx y .pdf\n```\n\nEl documento metodológico se genera desde datos (`docs/documento.yaml`) con la plantilla dinámica; requiere\n`pip install jinja2 pypandoc_binary typst`. Ver `docs/plantillas/documento-metodologico.md`.\n\nParte de la plantilla `plantillas/repo-modelo/`.\n\n**Para agentes de IA.** Lee `AGENTS.md`. Los datos están en `dist/catalogo.json`, `dist/umbrales.json`,\n`dist/literatura.json`, `dist/acta.schema.json` y `llms.txt`.\n\n## Estructura\n\n```text\ncatalogo/            Fuente de verdad: requisitos, umbrales, actas, literatura y modelo de esfuerzo (YAML)\ndocs/                Documentación por estándar (Markdown); los bloques de catálogo se generan\ndist/                Generado: JSON para agentes y llms-full.txt\nsite/                Generado: sitio autocontenido (index.html)\nplantillas/          Plantilla de repositorio de un modelo y plantilla dinámica del documento metodológico\nejemplos/            Acta y documento metodológico de ejemplo con datos ficticios\ntools/               build.py · verificar.py · acta.py · documento.py · esfuerzo.py · generadores de catálogo\n```\n\n## Contribuir\n\n`python tools/build.py` valida todo y regenera `docs/`, `dist/` y `site/`. **Falla** si un documento cita un ID que no\nexiste, si hay IDs duplicados, si un umbral o una obra referencia un requisito inexistente o si falta el sello de\ncustodio. Ver [`CONTRIBUTING.md`](CONTRIBUTING.md) y [`CHANGELOG.md`](CHANGELOG.md).\n\n## Aviso\n\nEste estándar recoge buenas prácticas y referencias públicas. No es asesoría regulatoria ni reemplaza las políticas\naprobadas de ninguna entidad. Los umbrales marcados como *valor de referencia* deben calibrarse con datos propios, y\nlas normas citadas deben verificarse en su versión vigente. Los nombres de entidades se citan solo a partir de\ninformación pública.\n\n## Licencia\n\n- **Documentación, catálogo y datos** (`catalogo/`, `docs/`, `dist/`, `site/`, plantillas y ejemplos):\n  [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/). Puedes usarlos y adaptarlos, incluso con fines\n  comerciales, citando al autor.\n- **Código** (`tools/`): [MIT](tools/LICENSE).\n\nDetalle en [`LICENSE`](LICENSE).\n\n## Cómo citar\n\nVer [`CITATION.cff`](CITATION.cff).\n"}], "fases": [{"fase": "CAL-C1", "nombre": "Entendimiento", "estandar": "Calibración", "origen": "Estándar de Calibración v1.0", "archivo": "catalogo/cal-c1.yaml"}, {"fase": "CAL-C2", "nombre": "Preparación y calidad de datos", "estandar": "Calibración", "origen": "Estándar de Calibración v1.0", "archivo": "catalogo/cal-c2.yaml"}, {"fase": "CAL-C3", "nombre": "Segmentación", "estandar": "Calibración", "origen": "Estándar de Calibración v1.0", "archivo": "catalogo/cal-c3.yaml"}, {"fase": "CAL-C4", "nombre": "Calibrado", "estandar": "Calibración", "origen": "Estándar de Calibración v1.0", "archivo": "catalogo/cal-c4.yaml"}, {"fase": "CAL-C5", "nombre": "Implementación del calibrado", "estandar": "Calibración", "origen": "Estándar de Calibración v1.0", "archivo": "catalogo/cal-c5.yaml"}, {"fase": "DES-D1", "nombre": "Definición, alcance, diseño y extracción", "estandar": "Desarrollo", "origen": "Estándar de Desarrollo v1.0", "archivo": "catalogo/des-d1.yaml"}, {"fase": "DES-D2", "nombre": "Preparación, calidad y entendimiento de los datos", "estandar": "Desarrollo", "origen": "Estándar de Desarrollo v1.0", "archivo": "catalogo/des-d2.yaml"}, {"fase": "DES-D3", "nombre": "Segmentación", "estandar": "Desarrollo", "origen": "Estándar de Desarrollo v1.0", "archivo": "catalogo/des-d3.yaml"}, {"fase": "DES-D4", "nombre": "Modelamiento", "estandar": "Desarrollo", "origen": "Estándar de Desarrollo v1.0", "archivo": "catalogo/des-d4.yaml"}, {"fase": "DES-D5", "nombre": "Integración a la gestión", "estandar": "Desarrollo", "origen": "Estándar de Desarrollo v1.0", "archivo": "catalogo/des-d5.yaml"}, {"fase": "DES-D7  4], "lecturas": ["LIT-004"], "naturaleza": "datos", "doc": "docs/calibracion/c4-calibrado.md"}, {"id": "CAL-C4-03.01.04", "estandar": "Calibración", "fase": "CAL-C4", "fase_nombre": "Calibrado", "tarea": "Ejecución de calibración", "subtarea": "Modelo a Calibrar", "actividad": "Para la inclusion de los drivers:\n- Trameado (bucketización) del driver por cortes recomendados u objetos de interés de negocio.\n- Evaluación de la precisión por cada tramo o bucket según los intervalos de Vasicek.\n- Buckets que se encuentren en semáforo rojo deberán de incluirse en el proceso de calibración.\n- Buckets que se encuentren dentro de los límites rojos, deberán de evaluarse y aprobarse por la gerencia.\n- Verificación de la significancia de los coeficientes añadidos\n- Evaluación del aporte marginal en la discriminación del modelo por la inclusión de los drivers de calibración. Sin embargo, el tener un aporte muy bajo no será determinante para excluir el driver. Llevar discucion a la gerencia.", "dias_esfuerzo": 2.0, "aplica_tier": [1, 2, 3, 4], "umbrales": ["U-14"], "lecturas": ["LIT-004", "LIT-006", "LIT-007", "LIT-043"], "naturaleza": "datos", "doc": "docs/calibracion/c4-calibrado.md"}, {"id": "CAL-C4-03.01.05", "estandar": "Calibración", "fase": "CAL-C4", "fase_nombre": "Calibrado", "tarea": "Ejecución de calibración", "subtarea": "Modelo a Calibrar", "actividad": "Dependiendo del tipo de calibración e inclusión de los drivers:\nEvaluación y esclarecimiento en la documentación el tratamiento de valores missing y especiales.", "dias_esfuerzo": 0.5, "aplica_tier": [1, 2, 3, 4], "lecturas": ["LIT-004"], "naturaleza": "documentacion", "doc": "docs/calibracion/c4-calibrado.md"}, {"id": "CAL-C4-03.01.06", "estandar": "Calibración", "fase": "CAL-C4", "fase_nombre": "Calibrado", "tarea": "Ejecución de calibración", "subtarea": "Modelo a Calibrar", "actividad": "Dependiendo de la necesidad del proyecto de calibración:\n- Evaluación de la materialidad de los ejes de segmentación, e  "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "lecturas": ["LIT-122", "LIT-130", "LIT-131", "LIT-143"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G1-01.02.01", "estandar": "Gobierno", "fase": "GOB-G1", "fase_nombre": "Organización y comité de riesgos de modelo", "tarea": "Estructura", "subtarea": "Comité de riesgos de modelo", "actividad": "Operar un comité de riesgos de modelo con al menos un director, el jefe de riesgos y los responsables de desarrollo, validación y seguimiento, que sesione como mínimo cada trimestre (SBS arts. 10–11).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "critico": true, "entregables": [{"tipo": "Acta", "numero": "CRM", "descripcion": "Comité de riesgos de modelo"}], "lecturas": ["LIT-122", "LIT-130", "LIT-131", "LIT-143"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G1-01.02.02", "estandar": "Gobierno", "fase": "GOB-G1", "fase_nombre": "Organización y comité de riesgos de modelo", "tarea": "Estructura", "subtarea": "Comité de riesgos de modelo", "actividad": "El comité aprueba los criterios de categorización (Tier), los indicadores y umbrales de seguimiento, la periodicidad de las validaciones, los informes de validación y seguimiento y las acciones ante debilidades.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "critico": true, "entregables": [{"tipo": "Acta", "numero": "CRM", "descripcion": "Comité de riesgos de modelo"}], "lecturas": ["LIT-122", "LIT-130", "LIT-131", "LIT-143"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G1-01.02.03", "estandar": "Gobierno", "fase": "GOB-G1", "fase_nombre": "Organización y comité de riesgos de modelo", "tarea": "Estructura", "subtarea": "Comité de riesgos de modelo", "actividad": "El directorio aprueba las políticas, asigna recursos y aprueba las excepciones de uso de modelos de mayor categoría con debilidades dad y frecuencia de validación y seguimiento y si se exige réplica completa (SBS art. 6; U-35).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "critico": true, "entregables": [{"tipo": "Documento", "numero": "G2", "descripcion": "Criterios de categorización"}], "umbrales": ["U-35"], "lecturas": ["LIT-122", "LIT-130", "LIT-131", "LIT-133"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G2-02.01.02", "estandar": "Gobierno", "fase": "GOB-G2", "fase_nombre": "Inventario y categorización", "tarea": "Categorización", "subtarea": "Criterios de categoría", "actividad": "Revisar periódicamente el propio esquema de categorización (que sea objetivo y que discrimine), como exige SS1/23.", "aplica_tier": [1, 2], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "analisis", "entregables": [{"tipo": "Documento", "numero": "G2", "descripcion": "Criterios de categorización"}], "lecturas": ["LIT-122", "LIT-130", "LIT-131", "LIT-133"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G3-01.01.01", "estandar": "Gobierno", "fase": "GOB-G3", "fase_nombre": "Políticas, aprobación y documentación", "tarea": "Ciclo de aprobación", "subtarea": "Aprobación previa", "actividad": "Todo modelo nuevo, modificado (cambio de variables, supuestos o parámetros, incluida una recalibración) o con cambio de uso requiere validación y aprobación previa del comité antes de usarse (SBS art. 17).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "critico": true, "lecturas": ["LIT-122", "LIT-130", "LIT-131"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G3-01.02.01", "estandar": "Gobierno", "fase": "GOB-G3", "fase_nombre": "Políticas, aprobación y documentación", "tarea": "Ciclo de aprobación", "subtarea": "Manuales", "actividad": "Mantener manuales aprobados de desarrollo, validación, uso, seguimiento, categorización, calidad de datos y contratación de proveedores de modelos (SBS art. 14); este estándar cumple esa función para los modelos analíticos.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "documentacion", "critico": true, "lecturas": ["LIT-122", "LIT-130", "LIT-131"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G3-01.02.02", "estandar": "Gobierno", "fase": "GOB-G3", "fase_nombre": "Políticas, aprobación y documentación", "tarea": "Ciclo de aprobación", "subtarea": "Manuales", "actividad": "Conservar la documentación de cada modelo (desarrollo, validación, seguimiento, actas, bases, diccionarios y código) con historial de versiones y disponible para el supervisor (SBS art. 15).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 2, "naturaleza": "documentacion", "critico": true, "lecturas": ["LIT-122", "LIT-130", "LIT-131"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G4-01.01.01", "estandar": "Gobierno", "fase": "GOB-G4", "fase_nombre": "Modelos de terceros y sistemas de IA", "tarea": "Terceros", "subtarea": "Proveedores", "actividad": "La entidad es plenamente responsable de los modelos de terceros: puede tercerizar desarrollo, validación o implementación, pero el seguimiento lo hace la propia entidad (SBS arts. 23–24).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "critico": true, "lecturas": ["LIT-122", "LIT-130", "LIT-131"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G4-01.01.02", "estandar": "Gobierno", "fase": "GOB-G4", "fase_nombre": "Modelos de terceros y sistemas de IA", "tarea": "Terceros", "subtarea": "Proveedores", "actividad": "Para modelos de terceros de mayor categoría, exigir réplica; si la propiedad intelectual lo impide, aplicar benchmarking u otra técnica alternativa documentada (SBS art. 25).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "critico": true, "lecturas": ["LIT-122", "LIT-130", "LIT-131"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G4-01.01.03", "estandar": "Gobierno", "fase": "GOB-G4", "fase_nombre": "Modelos de terceros y sistemas de IA", "tarea": "Terceros", "subtarea": "Proveedores", "actividad": "Contar con una estrategia de continuidad para los modelos de proveedores que soportan servicios priorizados.", "aplica_tier": [1, 2], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "lecturas": ["LIT-122", "LIT-130", "LIT-131"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G4-02.01.01", "estandar": "Gobierno", "fase": "GOB-G4", "fase_nombre": "Modelos de terceros y sistemas de IA", "tarea": "Sistemas de IA", "subtarea": "IA responsable", "actividad": "Inventariar los sistemas de IA (incluidos los de IA generativa y los agentes) y aplicarles controles proporcionales a su riesgo: los modelos de IA no generativa siguen este estándar; los generativos y agénticos, además, el estándar AGT.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0, "nivel_automatizacion": 2, "naturaleza": "gobierno", "critico": true, "entregables": [{"tipo": "Documento", "numero": "G1", "descripcion": "Inventario de modelos"}], "lecturas": ["LIT-122", "LIT-130", "LIT-131", "LIT-142"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G4-02.01.02", "estandar": "Gobierno", "fase": "GOB-G4", "fase_nombre": "Modelos de terceros y sistemas de IA", "tarea": "Sistemas de IA", "subtarea": "IA responsable", "actividad": "Adoptar principios de IA responsable (transparencia, equidad, privacidad, seguridad y supervisión humana) traducidos en métricas y controles verificables, no solo en declaraciones.", "aplica_tier": [1, 2], "dias_esfuerzo": 0, "nivel_automatizacion": 1, "naturaleza": "gobierno", "lecturas": ["LIT-122", "LIT-130", "LIT-131", "LIT-142"], "doc": "docs/marco/gobierno-mrm.md"}, {"id": "GOB-G5-01.01.01", "estandar": "Gobierno", "fase": "GOB-G5", "fase_nombre": "Reporte, debilidades y auditoría", "tarea": "Debilidades", "subtarea": "Gestión de debilidades", "ac omatizacion": 2, "naturaleza": "datos", "entregables": [{"tipo": "Excel", "numero": "P1", "descripcion": "Diagnóstico del precio actual"}], "hito": "Sprint 1", "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P1-01.02.02", "estandar": "Pricing", "fase": "PRC-P1", "fase_nombre": "Definición del caso de pricing y gobierno inicial", "tarea": "Caso de negocio", "subtarea": "Diagnóstico del precio actual", "actividad": "Estimar el valor en juego: margen cedido por excepciones (leakage), clientes con precio por debajo del piso técnico (U-18) y oportunidad por segmento. Es la base para priorizar el proyecto y medir su éxito.", "aplica_tier": [1, 2], "dias_esfuerzo": 2, "nivel_automatizacion": 2, "naturaleza": "datos", "entregables": [{"tipo": "Excel", "numero": "P1", "descripcion": "Diagnóstico del precio actual"}], "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P1-02.01.01", "estandar": "Pricing", "fase": "PRC-P1", "fase_nombre": "Definición del caso de pricing y gobierno inicial", "tarea": "Gobierno inicial", "subtarea": "Clasificación y responsables", "actividad": "Registrar en el inventario los modelos que intervendrán (precio técnico, respuesta, optimizador) y asignar su Tier. Un modelo de pricing es un modelo sujeto a este estándar y a Validación.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0.5, "nivel_automatizacion": 1, "naturaleza": "gobierno", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P1", "descripcion": "Ficha del caso de pricing"}], "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P1-02.01.02", "estandar": "Pricing", "fase": "PRC-P1", "fase_nombre": "Definición del caso de pricing y gobierno inicial", "tarea": "Gobierno inicial", "subtarea": "Clasificación y responsables", "actividad": "Definir la matriz RACI: dueño del precio (negocio), Finanzas/ALM (costo de fondos y capital), Riesgos (PD/LGD y apetito), Analytics Pricing (modelos y optimización), Cumplimiento y Legal (conducta y transparencia), Tecnología (motor de precios).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0.5, "nivel_automatizacion": 1, "naturaleza": "gobierno", "entregables": [{"tipo": "Documento", "numero": "P1", "descripcion": "Ficha del caso de pricing"}], "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P1-02.02.01", "estandar": "Pricing", "fase": "PRC-P1", "fase_nombre": "Definición del caso de pricing y gobierno inicial", "tarea": "Gobierno inicial", "subtarea": "Kick off", "actividad": "Reunión de kick off del proyecto de pricing con el dueño del precio, Finanzas, Riesgos y Cumplimiento.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0.5, "nivel_automatizacion": 1, "naturaleza": "reunion", "entregables": [{"tipo": "Acta", "numero": "PRC-KO", "descripcion": "Kick off de pricing"}], "hito": "Kick Off", "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P2-01.01.01", "estandar": "Pricing", "fase": "PRC-P2", "fase_nombre": "Datos de pricing y calidad", "tarea": "Base de cotizaciones", "subtarea": "Construcción", "actividad": "Construir la base a nivel de oferta o cotización, no solo de operaciones desembolsadas: precio ofrecido, precio final, aceptación (sí/no), monto, plazo, canal, ejecutivo, fecha y motivo de no aceptación. Sin las ofertas rechazadas por el cliente no se puede estimar la respuesta al precio.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 4, "nivel_automatizacion": 2, "naturaleza": "datos", "critico": true, "entregables": [{"tipo": "Tabla", "numero": "P1", "descripcion": "Base de cotizaciones"}], "hito": "Sprint 1", "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P2-01.01.02", "estandar": "Pricing", "fase": "PRC-P2", "fase_nombre": "Datos de pricing y calidad", "tarea": "Base de cotizaciones", "subtarea": "Construcción", "actividad": "Enriquecer cada oferta con los insumos del precio técnico vigentes a la fecha de la oferta: PD y LGD del modelo de riesgo aprobado (definición de default U-17), curva FTP, costo operativo y consumo de capital.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 3, "nivel_automatizacion": 2, "naturaleza": "datos", "critico": true, "entregables": [{"tipo": "Tabla", "numero": "P1", "descripcion": "Base de cotizaciones"}], "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P2-01.01.03", "estandar": "Pricing", "fase": "PRC-P2", "fase_nombre": "Datos de pricing y calidad", "tarea": "Base de cotizaciones", "subtarea": "Construcción", "actividad": "Incorporar variables de contexto: tasas de la competencia por producto y plazo, tasa de referencia de política monetaria, campañas vigentes, estacionalidad y saturación del canal.", "aplica_tier": [1, 2], "dias_esfuerzo": 2, "nivel_automatizacion": 2, "naturaleza": "datos", "entregables": [{"tipo": "Tabla", "numero": "P1", "descripcion": "Base de cotizaciones"}], "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P2-01.01.04", "estandar": "Pricing", "fase": "PRC-P2", "fase_nombre": "Datos de pricing y calidad", "tarea": "Base de cotizaciones", "subtarea": "Construcción", "actividad": "Para productos con comportamiento posterior (TC, consumo, hipotecario, depósitos), unir el desempeño: prepago, cancelación, uso de línea, saldo promedio y default, para calcular el valor de la operación y no solo su aceptación.", "aplica_tier": [1, 2, 3], "dias_esfuerzo": 3, "nivel_automatizacion": 2, "naturaleza": "datos", "entregables": [{"tipo": "Tabla", "numero": "P1", "descripcion": "Base de cotizaciones"}], "lecturas": ["LIT-071"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P2-02.01.01", "estandar": "Pricing", "fase": "PRC-P2", "fase_nombre": "Datos de pricing y calidad", "tarea": "Calidad de datos de pricing", "subtarea": "Controles", "actividad": "Aplicar los controles de calidad de DES-D2 (validez, completitud, unicidad, precisión, consistencia) y los específicos de pricing: precio ofrecido registrado antes de la decisión del cliente, cotizaciones duplicadas por re-cotización, tasas fuera de rango y fechas de oferta coherentes con la de desembolso.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 2.5, "nivel_automatizacion": 3, "naturaleza": "datos", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P2", "descripcion": "Diccionario y certificación de datos de pricing"}], "lecturas": ["LIT-056", "LIT-071", "LIT-091"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P2-02.01.02", "estandar": "Pricing", "fase": "PRC-P2", "fase_nombre": "Datos de pricing y calidad", "tarea": "Calidad de datos de pricing", "subtarea": "Controles", "actividad": "Medir la variación exógena del precio disponible para identificar la elasticidad: cambios de tarifario, campañas, saltos de la grilla, pruebas previas. Si no existe variación suficiente, el diseño de un experimento (P6) pasa a ser requisito previo para el modelo de respuesta.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 1.5, "nivel_automatizacion": 1, "naturaleza": "analisis", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P2", "descripcion": "Diccionario y certificación de datos de pricing"}], "lecturas": ["LIT-056", "LIT-071", "LIT-091"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P2-02.01.03", "estandar": "Pricing", "fase": "PRC-P2", "fase_nombre": "Datos de pricing y calidad", "tarea": "Calidad de datos de pricing", "subtarea": "Controles", "actividad": "Certificar la base de pricing con acta de conformidad de las fuentes (Finanzas para FTP y costos; Riesgos para PD/LGD).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0.5, "nivel_automatizacion": 1, "naturaleza": "gobierno", "entregables": [{"tipo": "Documento", "numero": "P2", "descripcion": "Diccionario y certificación de datos de pricing"}], "lecturas": ["LIT-056", "LIT-071", "LIT-091"], "doc": "docs/pricing/p1-definicion-datos.md"}, {"id": "PRC-P3-01.01.01", "estandar": "Pricing", "fase": "PRC-P3", "fase_nombre": "Precio técnico y rentabilidad ajustada por riesgo", "tarea": "Componentes del precio técnico", "subtarea": "Costo de fondos", "actividad": "Asignar el costo de fondos con la curva de precios de transferencia (FTP) de Finanzas/ALM según plazo y perfil de amortización (duración equivalente), incluyendo la prima de liquidez. Para depósitos, el FTP es el valor del fondeo que aporta el producto.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 2, "nivel_automatizacion": 2, "naturaleza": "datos", "critico": true, "entregables": [{"tipo": "Excel", "numero": "P2", "descripcion": "Calculadora de precio técnico"}], "hito": "Sprint 2", "lecturas": ["LIT-071", "LIT-076"], "doc": "docs/pricing/p3-precio-tecnico.md"}, {"id": "PRC-P3-01.02.01", "estandar": "Pricing", "fase": "PRC-P3", "fase_nombre": "Precio técnico y rentabilidad ajustada por riesgo", "tarea": "Componentes del precio técnico", "subtarea": "Pérdida esperada", "actividad": "Calcular la pérdida esperada anualizada con los modelos de riesgo aprobados: PD ajustada al horizonte de la operación (lifetime o promedio anual sobre la vida esperada, no solo la PD a 12 meses de U-17), LGD y EAD con su perfil de amortización y uso de línea.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 3, "nivel_automatizacion": 2, "naturaleza": "datos", "critico": true, "entregables": [{"tipo": "Excel", "numero": "P2", "descripcion": "Calculadora de precio técnico"}], "lecturas": ["LIT-005", "LIT-071"], "doc": "docs/pricing/p3-precio-tecnico.md"}, {"id": "PRC-P3-01.03.01", "estandar": "Pricing", "fase": "PRC-P3", "fase_nombre": "Precio técnico y rentabilidad ajustada por riesgo", "tarea": "Componentes del precio técnico", "subtarea": "Costos operativos y de adquisición", "actividad": "Asignar costos operativos (originación, mantenimiento, cobranza) y de adquisición por canal, con su driver (por operación o por saldo), conciliados con Finanzas.", "aplica_ io técnico, sus supuestos, fuentes y fecha de vigencia de cada insumo, con cuadro de control de cambios.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 1.5, "nivel_automatizacion": 1, "naturaleza": "documentacion", "entregables": [{"tipo": "Documento", "numero": "P3", "descripcion": "Metodología de precio técnico"}], "lecturas": ["LIT-071"], "doc": "docs/pricing/p3-precio-tecnico.md"}, {"id": "PRC-P4-01.01.01", "estandar": "Pricing", "fase": "PRC-P4", "fase_nombre": "Modelos de respuesta al precio", "tarea": "Identificación causal", "subtarea": "Estrategia de identificación", "actividad": "Documentar cómo se separa el efecto del precio del efecto del riesgo y del perfil del cliente, dado que el precio histórico no fue asignado al azar: experimento aleatorio (preferido), discontinuidad en la grilla de precios, variable instrumental (por ejemplo, cambios del costo de fondos o del tarifario ajenos al cliente) o double machine learning con controles completos.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 2, "nivel_automatizacion": 1, "naturaleza": "analisis", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P4", "descripcion": "Modelo de respuesta y elasticidad"}], "hito": "Sprint 3", "lecturas": ["LIT-060", "LIT-061", "LIT-062", "LIT-065", "LIT-070", "LIT-071", "LIT-074"], "doc": "docs/pricing/p4-respuesta-optimizacion.md"}, {"id": "PRC-P4-01.01.02", "estandar": "Pricing", "fase": "PRC-P4", "fase_nombre": "Modelos de respuesta al precio", "tarea": "Identificación causal", "subtarea": "Estrategia de identificación", "actividad": "Pruebas de robustez de la identificación: placebo en periodos sin cambio de precio, balance de covariables entre grupos de precio, sensibilidad a variables omitidas y estabilidad de la elasticidad entre submuestras temporales.", "aplica_tier": [1, 2], "dias_esfuerzo": 2, "nivel_automatizacion": 2, "naturaleza": "datos", "entregables": [{"tipo": "Documento", "numero": "P4", "descripcion": "Modelo de respuesta y elasticidad"} edicha por decil y por tramo de precio (U-21). En pricing un modelo descalibrado optimiza mal aunque ordene bien.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 1.5, "nivel_automatizacion": 3, "naturaleza": "datos", "critico": true, "entregables": [{"tipo": "Excel", "numero": "P3", "descripcion": "Curvas de respuesta por segmento"}], "umbrales": ["U-21"], "lecturas": ["LIT-040", "LIT-070", "LIT-071", "LIT-073", "LIT-074", "LIT-077"], "doc": "docs/pricing/p4-respuesta-optimizacion.md"}, {"id": "PRC-P4-03.01.01", "estandar": "Pricing", "fase": "PRC-P4", "fase_nombre": "Modelos de respuesta al precio", "tarea": "Comportamiento posterior", "subtarea": "Modelos de valor", "actividad": "Estimar los modelos que determinan el valor de la operación según el precio: prepago y cancelación (activos), sensibilidad de saldo y fuga ante cambios de tasa (depósitos: beta de traslado y elasticidad de saldos), uso de línea (TC).", "aplica_tier": [1, 2], "dias_esfuerzo": 4, "nivel_automatizacion": 2, "naturaleza": "datos", "entregables": [{"tipo": "Script", "numero": "P1", "descripcion": "Modelo de respuesta"}], "lecturas": ["LIT-070", "LIT-071", "LIT-074"], "doc": "docs/pricing/p4-respuesta-optimizacion.md"}, {"id": "PRC-P4-03.01.02", "estandar": "Pricing", "fase": "PRC-P4", "fase_nombre": "Modelos de respuesta al precio", "tarea": "Comportamiento posterior", "subtarea": "Modelos de valor", "actividad": "Evaluar si el precio afecta el riesgo (selección adversa); si la PD observada cambia con el precio para un mismo score, incorporarlo en el valor esperado.", "aplica_tier": [1, 2], "dias_esfuerzo": 1.5, "nivel_automatizacion": 2, "naturaleza": "analisis", "entregables": [{"tipo": "Documento", "numero": "P4", "descripcion": "Modelo de respuesta y elasticidad"}], "lecturas": ["LIT-070", "LIT-071", "LIT-074"], "doc": "docs/pricing/p4-respuesta-optimizacion.md"}, {"id": "PRC-P4-04.01.01", "estandar": "Pricing", "fase": "PRC-P4", "fase_nombre": "Modelos de respuesta al precio", "tarea": "Cierre del modelo de respuesta", "subtarea": "Revisión", "actividad": "Reunión de revisión del modelo de respuesta con el dueño del precio: elasticidades por segmento, su sentido de negocio y sus límites de uso.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0.5, "nivel_automatizacion": 1, "naturaleza": "reunion", "entregables": [{"tipo": "Acta", "numero": "PRC-ELA", "descripcion": "Revisión del modelo de respuesta"}], "lecturas": ["LIT-070", "LIT-071", "LIT-074"], "doc": "docs/pricing/p4-respuesta-optimizacion.md"}, {"id": "PRC-P4-04.02.01", "estandar": "Pricing", "fase": "PRC-P4", "fase_nombre": "Modelos de respuesta al precio", "tarea": "Cierre del modelo de respuesta", "subtarea": "Documentación", "actividad": "Documentar el modelo de respuesta con la estructura de DES-D4-11 (memoria metodológica, limitaciones, rango de precios en que la elasticidad es válida).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 2, "nivel_automatizacion": 1, "naturaleza": "documentacion", "entregables": [{"tipo": "Documento", "numero": "P4", "descripcion": "Modelo de respuesta y elasticidad"}], "lecturas": ["LIT-070", "LIT-071", "LIT-074"], "doc": "docs/pricing/p4-respuesta-optimizacion.md"}, {"id": "PRC-P5-01.01.01", "estandar": "Pricing", "fase": "PRC-P5", "fase_nombre": "Optimización y propuesta de precios", "tarea": "Formulación", "subtarea": "Problema de optimización", "actividad": "Formular el problema: maximizar la función objetivo de P1 sumando, por oferta, la probabilidad de aceptación por el valor de la operación al precio propuesto, sujeto a precio ≥ piso técnico (U-18), precio ≤ tope regulatorio (U-24), metas de volumen y riesgo, monotonicidad en el riesgo (U-19) y gradualidad (U-25).", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 2, "nivel_automatizacion": 1, "naturaleza": "analisis", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P5", "descripcion": "Propuesta de precios"}], "hito": "Sprint 4", "umbrales": ["U-19", "U-25"], "lecturas": ["LIT-070", " ecios", "actividad": "Presentar la propuesta y sus escenarios al Comité de Precios para su aprobación, con las excepciones a umbrales explícitas.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 0.5, "nivel_automatizacion": 1, "naturaleza": "reunion", "critico": true, "entregables": [{"tipo": "Acta", "numero": "PRC-CP", "descripcion": "Comité de Precios"}], "hito": "Comité de Precios", "lecturas": ["LIT-070", "LIT-071", "LIT-073", "LIT-074", "LIT-138"], "doc": "docs/pricing/p4-respuesta-optimizacion.md"}, {"id": "PRC-P6-01.01.01", "estandar": "Pricing", "fase": "PRC-P6", "fase_nombre": "Experimentación y piloto", "tarea": "Diseño del experimento", "subtarea": "Protocolo", "actividad": "Pre-registrar el experimento antes de lanzarlo: hipótesis, métrica primaria (margen esperado por oferta o conversión), métricas de resguardo (riesgo de cosecha, quejas), unidad de aleatorización, tamaño muestral con potencia y MDE (U-22), duración y regla de parada.", "aplica_tier": [1, 2], "dias_esfuerzo": 2, "nivel_automatizacion": 1, "naturaleza": "analisis", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P6", "descripcion": "Diseño del experimento"}], "hito": "Sprint 5", "umbrales": ["U-22"], "lecturas": ["LIT-061", "LIT-064", "LIT-071", "LIT-077", "LIT-078"], "doc": "docs/pricing/p6-experimentacion-implementacion.md"}, {"id": "PRC-P6-01.01.02", "estandar": "Pricing", "fase": "PRC-P6", "fase_nombre": "Experimentación y piloto", "tarea": "Diseño del experimento", "subtarea": "Protocolo", "actividad": "Revisar el experimento con Cumplimiento y Legal: los precios de prueba respetan topes y transparencia, no discriminan por atributos protegidos y se aplican por reglas objetivas comunicables.", "aplica_tier": [1, 2], "dias_esfuerzo": 0.5, "nivel_automatizacion": 1, "naturaleza": "gobierno", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P6", "descripcion": "Diseño del experimento"}], "lecturas": ["LIT-061", "LIT-064", "LIT-071", "LIT-077", "LIT-078" ables (p.ej. menor alfabetización financiera). Probar proxies como en FR-06.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 1.5, "nivel_automatizacion": 2, "naturaleza": "analisis", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P9", "descripcion": "Política de precios y conducta"}], "lecturas": ["LIT-071", "LIT-080", "LIT-082", "LIT-083", "LIT-102", "LIT-134"], "doc": "docs/pricing/p8-seguimiento-gobierno.md"}, {"id": "PRC-P9-02.03.01", "estandar": "Pricing", "fase": "PRC-P9", "fase_nombre": "Gobierno, conducta y regulación de precios", "tarea": "Conducta y regulación", "subtarea": "Explicabilidad al cliente", "actividad": "Poder explicar a un cliente, a un ejecutivo o al supervisor por qué una oferta tiene ese precio, a partir de los componentes del piso técnico y de los ajustes comerciales registrados.", "aplica_tier": [1, 2], "dias_esfuerzo": 1, "nivel_automatizacion": 2, "naturaleza": "documentacion", "entregables": [{"tipo": "Documento", "numero": "P9", "descripcion": "Política de precios y conducta"}], "lecturas": ["LIT-029", "LIT-071", "LIT-102"], "doc": "docs/pricing/p8-seguimiento-gobierno.md"}, {"id": "PRC-P9-03.01.01", "estandar": "Pricing", "fase": "PRC-P9", "fase_nombre": "Gobierno, conducta y regulación de precios", "tarea": "Agentes de IA en pricing", "subtarea": "Controles", "actividad": "Si se usan agentes de IA en el ciclo de pricing, registrar cada agente (rol, herramientas permitidas, datos a los que accede), conservar el log de sus acciones y asegurar que ningún agente fije, publique ni apruebe precios: toda decisión de precio la toma y firma una persona con facultad.", "aplica_tier": [1, 2, 3, 4], "dias_esfuerzo": 1, "nivel_automatizacion": 2, "naturaleza": "gobierno", "critico": true, "entregables": [{"tipo": "Documento", "numero": "P9", "descripcion": "Política de precios y conducta"}], "lecturas": ["LIT-071", "LIT-092", "LIT-093", "LIT-094"], "doc": "docs/pricing/p8-seguimiento-gobierno.md"}, {"id": "SEG-S1-01.01.01", "e ales — peso máximo recomendado 25 % por variable (toolkit). Modelos ML — peso por gain, máximo recomendado 10 %. Calibraciones — métrica Chi-Wald.", "valor": {"peso_max_tradicional": 0.25, "peso_max_ml": 0.1}, "refs": ["DES-D4-05.02.06"], "lecturas": ["LIT-002", "LIT-009", "LIT-010", "LIT-011", "LIT-020", "LIT-021", "LIT-024", "LIT-132", "LIT-135"]}, {"id": "U-10", "tema": "Optimización de hiperparámetros", "regla": "Mínimo 50 combinaciones en búsqueda aleatoria; si no se completa, sustentar. Fijar semilla para replicabilidad.", "valor": {"combinaciones_min": 50}, "refs": ["DES-D4-05.04.01"], "lecturas": ["LIT-002", "LIT-009", "LIT-010", "LIT-011", "LIT-020", "LIT-021", "LIT-023", "LIT-132", "LIT-135"]}, {"id": "U-11", "tema": "Sobreajuste Train vs OOT", "regla": "Diferencia máxima de 10 puntos de performance (Gini) entre Train y OOT. Si es mayor, sustentar en la documentación y presentar el caso en Comité de Modelos.", "valor": {"dif_gini_max_pts": 10}, "refs": ["DES-D4-06.03.02"], "lecturas": ["LIT-008", "LIT-010", "LIT-027", "LIT-030", "LIT-031"]}, {"id": "U-12", "tema": "Precisión de estimadores (target continuo)", "regla": "Reportar R², % de casos con real dentro de ±25 % y ±50 % del proyectado, y error cuadrático medio, en construcción y meses recientes.", "valor": {"bandas": [0.25, 0.5]}, "refs": ["DES-D4-06.01.02"], "lecturas": ["LIT-008", "LIT-010", "LIT-027", "LIT-044", "LIT-045", "LIT-046", "LIT-138"]}, {"id": "U-13", "tema": "Materialidad de ejes de segmentación (calibración)", "regla": "Si un eje de segmentación no tiene materialidad superior al 5 %, revisar su inclusión con usuarios de negocio y gerencia.", "valor": {"materialidad_min": 0.05}, "refs": ["CAL-C4-03.01.06"], "lecturas": ["LIT-004"]}, {"id": "U-14", "tema": "Precisión por bucket (calibración)", "regla": "Evaluar la precisión de cada tramo del driver con intervalos de Vasicek. Buckets en semáforo rojo deben incluirse en la calibración; los que estén dentro de límites rojos se evalúan y aprueban por gerencia.", "valor": {"metodo": "intervalos_vasicek"}, "refs": ["CAL-C4-03.01.04"], "lecturas": ["LIT-004", "LIT-006", "LIT-007", "LIT-043", "LIT-105"]}, {"id": "U-15", "tema": "Certificación de implementación", "regla": "Coincidencia mínima del 95 % entre el proceso de modelamiento y el implementado para obtener conformidad.", "valor": {"coincidencia_min": 0.95}, "refs": ["IMP-01.06.02", "CAL-C5-01.04.02"], "lecturas": ["LIT-003", "LIT-053", "LIT-054"]}, {"id": "U-16", "tema": "Certificación con datos de proveedor externo", "regla": "Si el modelo consume datos de un proveedor externo, la certificación debe ser integral y cubrir un periodo mínimo de 3 meses.", "valor": {"meses_min": 3}, "refs": ["VAL-I-01.09"], "lecturas": ["LIT-100", "LIT-101", "LIT-107", "LIT-130"]}, {"id": "U-17", "tema": "Definición de default", "regla": "Un cliente/operación es default (malo) si registra un atraso mayor a 60 días al menos una vez en los 12 meses siguientes a la fecha de observación. Aplica a modelos de admisión (la fecha de observación es la originación del crédito) y a modelos de buró (clientes activos en la fecha de observación).", "valor": {"atraso_dias_mayor_a": 60, "ventana_desempeno_meses": 12, "criterio": "al menos una vez en la ventana", "aplica_a": ["admision", "buro"]}, "refs": ["DES-D1-05.01.01", "DES-D1-05.02.01", "DES-D1-05.04.01"], "nota": "Las operaciones que no completan los 12 meses de desempeño se excluyen (DES-D1-04.01.03, DES-D1-04.01.04). Los indeterminados, con mora menor a la altura de default pero cercana a ella, se analizan y excluyen según DES-D1-04.01.05. El rango exacto se sustenta con roll rates (DES-D1-05.02.02). La materialidad (monto mínimo vencido) se fija en el Documento 4.", "lecturas": ["LIT-001", "LIT-002", "LIT-003", "LIT-009"]}, {"id": "U-18", "tema": "Precio piso técnico (pricing)", "regla": "Ninguna oferta por debajo del precio técnico mínimo, definido como la tasa con RAROC igual al hurdle de la entidad. Las excepciones solo se otorgan dentro de la matriz de facultades y por debajo del piso requieren Comité de Precios.", "valor": {"raroc_min": "hurdle_corporativo"}, "refs": ["PRC-P3-02.01.01", "PRC-P7-01.02.01"], "lecturas": ["LIT-071", "LIT-075"]}, {"id": "U-19", "tema": "Monotonicidad del precio en el riesgo (pricing)", "regla": "Dentro de una misma celda (producto, plazo, canal), la tasa no puede disminuir cuando aumenta la PD o empeora el tramo de riesgo.", "valor": {"monotonia": "no_decreciente_en_pd"}, "refs": ["PRC-P3-02.01.02", "PRC-P5-01.01.01"], "lecturas": ["LIT-070", "LIT-071", "LIT-072", "LIT-073", "LIT-074", "LIT-075", "LIT-138"]}, {"id": "U-20", "tema": "Signo de la respuesta al precio (pricing)", "regla": "La probabilidad de aceptación debe ser monótona decreciente en el precio en todos los segmentos (elasticidad-precio negativa). Un segmento con elasticidad positiva o nula invalida su curva para optimizar.", "valor": {"elasticidad": "< 0"}, "refs": ["PRC-P4-02.01.02"], "lecturas": ["LIT-063", "LIT-070", "LIT-071", "LIT-073", "LIT-074", "LIT-077"]}, {"id": "U-21", "tema": "Calibración del modelo de respuesta (pricing)", "regla": "Por decil de probabilidad y por tramo de precio, la aceptación observada debe estar dentro de ±10 % relativo de la predicha o dentro del intervalo binomial al 95 %.", "valor": {"desvio_relativo_max": 0.1, "ic": 0.95}, "refs": ["PRC-P4-02.02.01", "PRC-P8-01.03.01"], "nota": "Valor de referencia inicial; calibrar en el primer ciclo.", "lecturas": ["LIT-040", "LIT-042", "LIT-043", "LIT-052", "LIT-070", "LIT-071", "LIT-073", "LIT-074", "LIT-077"]}, {"id": "U-22", "tema": "Diseño de experimentos de precio (pricing)", "regla": "Potencia ≥ 80 % y α = 5 % para el efecto mínimo detectable pre-registrado; grupo de control ≥ 10 % del tráfico elegible; duración mínima de un ciclo comercial completo (4 semanas).", "valor": {"potencia_min": 0.8, "alfa": 0.05, "control_min": 0.1, "semanas_min": 4}, "refs": ["PRC-P6-01.01.01"], "lecturas": ["LIT-061", "LIT-064", "LIT-071", "LIT-077", "LIT-078"]}, {"id": "U-23", "tema": "Excepciones de precio y margen cedido (pricing)", "regla": "Alerta si las operaciones con precio fuera de tarifario superan el 15 % de las colocaciones del segmento en el mes, o si el margen cedido por excepciones supera el 10 % del margen esperado.", "valor": {"excepciones_max": 0.15, "margen_cedido_max": 0.1}, "refs": ["PRC-P7-01.02.01", "PRC-P8-01.03.01"], "nota": "Valor de referencia inicial; calibrar en el primer ciclo.", "lecturas": ["LIT-052", "LIT-071"]}, {"id": "U-24", "tema": "Topes regulatorios de tasa (pricing)", "regla": "El 100 % de las ofertas debe respetar la tasa máxima vigente donde la regulación la fije (medida como la exige la norma, p.ej. TCEA). El motor de precios lo controla antes de emitir la oferta.", "valor": {"cumplimiento": 1.0}, "refs": ["PRC-P7-02.01.01", "PRC-P9-02.01.01"], "lecturas": ["LIT-053", "LIT-071", "LIT-102", "LIT-108"]}, {"id": "U-25", "tema": "Gradualidad de cambios de precio (pricing)", "regla": "Un cambio de tasa de lista mayor a 100 pb, o mayor al 15 % relativo, en un mismo ciclo requiere aprobación del Comité de Precios.", "valor": {"cambio_max_pb": 100, "cambio_max_relativo": 0.15}, "refs": ["PRC-P1-01.01.03", "PRC-P5-01.01.01"], "nota": "Valor de referencia inicial; calibrar en el primer ciclo.", "lecturas": ["LIT-070", "LIT-071", "LIT-072", "LIT-073", "LIT-074", "LIT-138"]}, {"id": "U-26", "tema": "Margen realizado vs. esperado (pricing)", "regla": "Si el margen realizado del segmento se desvía más de ±15 % del esperado durante dos meses consecutivos, se revisan el precio técnico y el modelo de respuesta.", "valor": {"desvio_max": 0.15, "meses": 2}, "refs": ["PRC-P8-01.03.01"], "nota": "Valor de referencia inicial; calibrar en el primer ciclo.", "lecturas": ["LIT-052", "LIT-071"]}, {"id": "U-27", "tema": "Profundidad histórica de parámetros", "regla": "Al menos cinco años de datos de default por cartera, que incluyan un período de estrés o recesión; si no existen, se documenta la limitación y se compensa con conservadurismo o datos externos.", "valor": {"anios_min": 5, "incluye_estres": true}, "refs": ["PAR-R2-01.01.01"], "lecturas": ["LIT-110", "LIT-115"]}, {"id": "U-28", "tema": "Presunciones de IFRS 9 (staging y default)", "regla": "Más de 30 días de atraso implica aumento significativo del riesgo (Stage 2) y el default no ocurre después de los 90 días de atraso. Ambas presunciones solo se refutan con evidencia razonable y sustentable documentada.", "valor": {"stage2_dias": 30, "default_dias_max": 90}, "refs": ["PAR-R1-02.01.01", "PAR-R7-01.02.01"], "lecturas": ["LIT-103", "LIT-110", "LIT-111", "LIT-112", "LIT-116", "LIT-122"]}, {"id": "U-29", "tema": "Umbrales SICR cuantitativos", "regla": "El aumento significativo del riesgo se mide comparando la PD lifetime actual con la de origen, con un umbral relativo y uno absoluto calibrados por cartera. Referencia inicial: PD lifetime al menos 2 veces la de origen y al menos 50 pb por encima.", "valor": {"relativo_min": 2.0, "absoluto_min_pb": 50}, "refs": ["PAR-R7-01.01.01", "PAR-R7-01.01.02"], "nota": "Valor de referencia inicial; calibrar por cartera en el primer ciclo.", "lecturas": ["LIT-103", "LIT-110", "LIT-112", "LIT-122"]}, {"id": "U-30", "tema": "Backtesting de PD por grado (Jeffreys)", "regla": "Por grado o tramo, la tasa de default observada se contrasta con la PD con el test de Jeffreys: p-valor < 0.05 es alerta ámbar y p-valor < 0.01 es rojo (subestimación); un rojo exige plan de recalibrado.", "valor": {"ambar": 0.05, "rojo": 0.01}, "refs": ["PAR-R3-03.01.01", "PAR-R9-01.01.01"], "lecturas": ["LIT-006", "LIT-043", "LIT-104", "LIT-105", "LIT-110", "LIT-111", "LIT-113", "LIT-115"]}, {"id": "U-31", "tema": "Gobierno de overlays y ajustes post-modelo", "regla": "Cada overlay tiene causa, cuantificación reproducible, cartera afectada, fecha de revisión o expiración y aprobación en comité. Alerta si los overlays superan el 10 % de la ECL de la cartera o siguen vigentes más de 4 trimestres sin plan de absorción en el modelo.", "valor": {"peso_max": 0.1, "trimestres_max": 4}, "refs": ["PAR-R8-02.01.01", "PAR-R8-02.01.03"], "nota": "Valor de referencia inicial; calibrar en el primer ciclo.", "lecturas": ["LIT-005", "LIT-103", "LIT-110", "LIT-111", "LIT-112", "LIT-113", "LIT-114"]}, {"id": "U-32", "tema": "Escenarios y ponderación de la ECL", "regla": "Al menos tres escenarios (base, optimista y pesimista) con probabilidades sustentadas, revisados como mínimo cada trimestre. La ECL ponderada es la suma de las ECL de cada escenario por su probabilidad, nunca la ECL de un escenario promedio.", "valor": {"escenarios_min": 3, "revision": "trimestral"}, "refs": ["PAR-R6-01.01.01", "PAR-R6-02.01.02", "PAR-R8-01.01.01"], "lecturas": ["LIT-005", "LIT-103", "LIT-110", "LIT-111", "LIT-112", "LIT-117", "LIT-122"]}, {"id": "U-33", "tema": "Períodos de prueba para salir de default o de Stage 2", "regla": "Salida de default tras al menos 3 meses sin condiciones de default y 12 meses para reestructuraciones por dificultades financieras. El retorno de Stage 2 a Stage 1 exige un período de prueba documentado por cartera (referencia: 3 meses).", "valor": {"salida_default_meses": 3, "reestructurados_meses": 12, "stage2_a_1_meses_ref": 3}, "refs": ["PAR-R1-02.01.02", "PAR-R7-01.02.02"], "lecturas": ["LIT-103", "LIT-110", "LIT-111", "LIT-112", "LIT-116", "LIT-122"]}, {"id": "U-34", "tema": "Cálculo de la LGD workout", "regla": "Las recuperaciones se descuentan a la tasa de interés efectiva, netas de costos directos e indirectos, y los procesos incompletos se incluyen con un método documentado (no se excluyen).", "valor": {"descuento": "tasa_interes_efectiva", "incompletos": "incluidos"}, "refs": ["PAR-R4-01.01.01", "PAR-R4-01.01.02"], "lecturas": ["LIT-006", "LIT-104", "LIT-110", "LIT-115", "LIT-119"]}, {"id": "U-35", "tema": "Frecuencia de validación por categoría", "regla": "Validación periódica completa al menos cada año para Tier I, cada dos años /* ---------------- markdown + math */
function renderMd(md){
  const hold=[];const keep=s=>`\u0000${hold.push(s)-1}\u0000`;
  md=md.replace(/```[\s\S]*?```/g,keep).replace(/`[^`\n]+`/g,keep);
  const math=[];
  const m=(tex,disp)=>{math.push([tex,disp]);return `@@M${math.length-1}@@`};
  md=md.replace(/\$\$([\s\S]+?)\$\$/g,(_,t)=>"\n\n"+m(t,true)+"\n\n").replace(/\$([^$\n]+?)\$/g,(_,t)=>m(t,false));
  md=md.replace(/\u0000(\d+)\u0000/g,(_,i)=>hold[+i]);
  let html=marked.parse(md,{gfm:true});
  html=html.replace(/@@M(\d+)@@/g,(_,i)=>{const [t,d]=math[+i];
    try{return katex.renderToString(t,{displayMode:d,output:"mathml",throwOnError:false})}catch(e){return esc(t)}});
  return html;
}
function resolve(base,href){
  const parts=base.split("/");parts.pop();
  for(const seg of href.split("/")){if(seg===".."){parts.pop()}else if(seg!=="."){parts.push(seg)}}
  return parts.join("/");
}
function enhance(root,page){
  root.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tbl";t.replaceWith(w);w.appendChild(t)});
  root.querySelectorAll("p").forEach(p=>{if(/^(\*\*KILLER\*\*|KILLER · )?Aplica:/.test(p.textContent)||p.textContent.startsWith("KILLER · Aplica"))p.classList.add("meta")});
  root.querySelectorAll("a[href]").forEach(a=>{
    const h=a.getAttribute("href");if(/^https?:/.test(h)){a.target="_blank";a.rel="noopener";return}
    const [path]=h.split("#");if(!path)return;
    const tgt=BYPATH[resolve(page.path,path)];
    if(tgt){a.href="#"+tgt.slug}else{const s=document.createElement("code");s.textContent=a.textContent;s.title="Archivo del repositorio: "+path;a.replaceWith(s)}
  });
  root.querySelectorAll("strong").forEach(s=>{if(s.textContent==="KILLER")s.classList.add("killer")});
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("pre,a,math")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const n of nodes){
    ID_RE.lastIndex=0;if(!ID_RE.test(n.nodeValue))continue;
    const frag=document.createDocumentFragment();let last=0;ID_RE.lastIndex=0;let mm;
    while((mm=ID_RE.exec(n.nodeValue))){
      if(!idExists(mm[0]))continue;
      frag.append(n.nodeValue.slice(last,mm.index));
      const a=document.createElement("a");a.className="rid";a.textContent=mm[0];a.href="#";a.dataset.id=mm[0];frag.append(a);last=mm.index+mm[0].length;
    }
    frag.append(n.nodeValue.slice(last));n.replaceWith(frag);
  }
}

function applicable(r,cfg){

  const ok=cfg.std==="Desarrollo"?["Desarrollo","Implementación"]:["Implementación"];
  if(!ok.includes(r.estandar))return false;
  return (r.aplica_tier[cfg.model]||[]).includes(cfg.tier);
}
function days(r,cfg){
  const d=r.dias_esfuerzo;if(d==null)return 0;if(typeof d==="number")return d;
  const v=d[cfg.model];return v?(v[cfg.enf]??0):0;
}
/* Modelo de esfuerzo v2: réplica exacta de tools/esfuerzo.py */
const P=DATA.parametros_esfuerzo;
const VOL_PHASES=new Set(["DES-D1","DES-D2","DES-D3","DES-D4","CAL-C1","CAL-C2","CAL-C3","CAL-C4","PRC-P2","PRC-P4","PAR-R2","PAR-R3","PAR-R4","PAR-R5"]);
function fVol(r,scen){
  if(DATA.naturaleza[r.id]!=="datos"||!VOL_PHASES.has(r.fase))return 1;
  const ref=P.volumen_referencia,el=P.elasticidad;
  const fReg=Math.pow(scen.registros/ref.registros,el.registros);
  const tarea=+r.id.split("-").at(-1).split(".")[0];
  if(r.fase.startsWith("CAL")||r.fase.startsWith("PRC")||r.fase.startsWith("PAR")||(r.fase==="DES-D4"&&tarea>=5))return fReg;
  const e=(r.nivel_automatizacion||0)>=3?el.columnas_automatizado:el.columnas_manual;
  return fReg*Math.pow(scen.columnas/ref.columnas,e);
}
function horasMaquina(scen,cfg){
  if(cfg.std==="Implementación"||cfg.std==="Seguimiento")return 0;
  const c=P.computo,k=(scen.registros/1e6)*(P.columnas_modelo/100);
  if(cfg.std==="Calibración")return c.ajustes_calibracion*c.minutos_por_ajuste_ref.lineal*k/60;
  if(cfg.std==="Pricing")return c.ajustes_pricing*c.minutos_por_ajuste_ref.ml*k/60;
  if(cfg.std==="Parámetros")return c.ajustes_parametros*c.minutos_por_ajuste_ref.ml*k/60;
  return scen.segmentos*c.ajustes_por_segmento[cfg.model]*c.minutos_por_ajuste_ref[cfg.model]*k/60;
}
function estimar(reqs,cfg,scen){
  const g=P.agente.factor_trabajo,sup=P.agente.supervision;const fases={};
  for(const r of reqs){const b=days(r,cfg),nat=DATA.naturaleza[r.id];
    const f=fases[r.fase]??={name:r.fase_nombre,base:0,trabajo:0,agente:0};f.base+=b;
    if(nat==="reunion")continue;const w=b*fVol(r,scen);f.trabajo+=w;f.agente+=w*g[nat]*(g[nat]<1?1+sup:1)}
  const W=Object.values(fases).reduce((s,f)=>s+f.trabajo,0),Wa=Object.values(fases).reduce((s,f)=>s+f.agente,0);
  const K=horasMaquina(scen,cfg),bl=P.computo.bloqueo,hd=scen.horas_dia,m=scen.pct_reuniones;
  const Tp=(W+K*bl.personas/hd)/(1-m),R=m*Tp,Ta=Wa+K*bl.agente/hd+R,sem=t=>t/scen.fte/5;
  return {fases,W,K,R,Tp,Ta,semP:sem(Tp),semA:sem(Ta),ahorro:Tp?1-Ta/Tp:0};
}

function tiersTxt(ts){ts=[...ts].sort();if(!ts.length)return"—";const c=ts.every((t,i)=>i===0||t===ts[i-1]+1);return c&&ts.length>1?`${ROMAN[ts[0]]}–${ROMAN[ts.at(-1)]}`:ts.map(t=>ROMAN[t]).join(", ")}

function validarActa(a){
  const e=[];
  if(!a.modelo.codigo||!a.modelo.nombre)e.push("Completa el código y el nombre del modelo.");
  if(!a.fecha)e.push("Indica la fecha de la reunión.");
  if(!a.resumen.trim())e.push("Escribe el desarrollo de la reunión (sección 5).");
  if(a.asistentes.some(x=>!x.nombre.trim()))e.push("Hay participantes sin nombre (sección 2).");
  if(!a.conformidad.length)e.push("Agrega al menos un aprobador (sección 10).");
  if(a.conformidad.some(c=>c.estado!=="Conforme"))e.push("Todos los aprobadores deben estar en «Conforme» (sección 10).");

        <label for="aEst" class="sr">Estado</label><select id="aEst"><option value="">Todos los estados</option>${ACTAS.estados.map(e=>`<option ${actasFiltro.estado===e?"selected":""}>${e}</option>`).join("")}</select></div>
      ${all.length===0?`<div class="a-empty"><h2>Aún no hay actas</h2><p>Empieza con <b>Nueva acta</b>: elige el hito (por ejemplo, <i>Reunión 5 · Selección del modelo final</i>), indica el código del modelo y el acta se arma con lo que el estándar exige para esa reunión. Si prefieres ver cómo queda, abre <b>Ver un ejemplo</b>.</p></div>`:
      rows.length===0?`<p class="a-none">Ninguna acta coincide con el filtro.</p>`:
      `<div class="tbl"><table class="a-list"><thead><tr><th>N° de acta</th><th>Reunión</th><th>Modelo</th><th>Fecha</th><th>Estado</th><th>Última edición</th></tr></thead><tbody>
      ${rows.map(a=>`<tr data-open="${esc(a.id)}" tabindex="0"><td class="mono">${esc(a.numero)}</td><td>${esc((TIPO[a.tipo]||{}).nombre||a.tipo)}</td><td><span class="mono">${esc(a.modelo.codigo)}</span><br><small>${esc(a.modelo.nombre)}</small></td><td class="mono">${esc(a.fecha)}</td><td>${chipEstado(a.estado)} <small>v${a.version}</small></td><td><small>${esc(fmtFecha(a.actualizado))}</small></td></tr>`).join("")}
      </tbody></table></div>`}
    </div>`;
    $("#aQ")&&($("#aQ").oninput=e=>{actasFiltro.q=e.target.value;store.set("actas.filtro",actasFiltro);clearTimeout(render.t);render.t=setTimeout(()=>{render();const i=$("#aQ");i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)});
    $("#aEst")&&($("#aEst").onchange=e=>{actasFiltro.estado=e.target.value;store.set("actas.filtro",actasFiltro);render()});

    <div class="a-grid">
      <label class="ctl full" for="nTipo"><span>Reunión / hito del estándar</span><select id="nTipo" required>${grupos.map(g=>`<optgroup label="${g}">${ACTAS.tipos.filter(t=>t.estandar===g).map(t=>`<option value="${t.id}">${esc(t.nombre)} — ${esc(t.acta)}</option>`).join("")}</optgroup>`).join("")}</select></label>
      <label class="ctl" for="nCod"><span>Código de modelo</span><input id="nCod" required placeholder="MOD-ORI-001" value="${esc(last?last.modelo.codigo:"")}"></label>
      <label class="ctl" for="nNom"><span>Nombre del modelo</span><input id="nNom" required placeholder="Score de originación TC" value="${esc(last?last.modelo.nombre:"")}"></label>
      <label class="ctl" for="nTier"><span>Tier</span><select id="nTier">${["","I","II","III","IV"].map(x=>`<option ${last&&last.modelo.tier===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="ctl" for="nMod"><span>Tipo de modelo</span><select id="nMod"><option value=""></option>${Object.entries(MOD_LBL).map(([k,v])=>`<option value="${k}" ${last&&last.modelo.tipo_modelo===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label class="ctl" for="nFecha"><span>Fecha de la reunión</span><input id="nFecha" type="date" required value="${hoy()}"></label>
    </div>
    <p class="a-hint" id="nHint"></p>
    <div class="a-actions"><button class="primary" type="submit">Crear acta</button><button type="button" id="nCancel">Cancelar</button></div></form>`;
  const hint=()=>{const t=TIPO[$("#nTipo").value];$("#nHint").innerHTML=`Se precargan ${t.agenda.length} puntos de agenda, ${t.decisiones.length} decisiones esperadas y ${t.participantes.length} roles${t.requisito?`. Requisito del estándar: <a class="rid" href="#" data-id="${t.requisito}">${t.requisito}</a>`:""}.`};
  $("#nTipo").onchange=hint;hint();$("#nTipo").focus();
  $("#nCancel").onclick=()=>{$("#aNuevaPanel").innerHTML=""};
  $("#aNewForm").onsubmit=async e=>{e.preventDefault();
    const m={codigo:$("#nCod").value.trim(),nombre:$("#nNom").value.trim(),tier:$("#nTier").value,tipo_modelo:$("#nMod").value,fecha:$("#nFecha").value};
    const n=AStore.list().filter(a=>a.modelo.codigo===m.codigo).length+1;

}

function ejemplo(){
  const a=actaNueva(TIPO.R5,{codigo:"MOD-EJEMPLO-001",nombre:"Score de originación — ejemplo",tier:"II",tipo_modelo:"ml",fecha:hoy()},5);
  a.id="ejemplo";a.numero="ACTA-EJEMPLO-05";a.hora_inicio="10:00";a.hora_fin="11:15";a.lugar="Sala virtual del equipo";a.secretario="Analista de modelos (ejemplo)";
  a.asistentes=[{nombre:"Gerente de producto (ejemplo)",area:"Negocio / banca usuaria",rol:"Decide",asistio:true},{nombre:"Jefe de modelos (ejemplo)",area:"Jefatura de modelos",rol:"Aprueba",asistio:true},{nombre:"Analista de modelos (ejemplo)",area:"Equipo de modelos",rol:"Secretario",asistio:true}];
  a.resumen="Se presentaron tres modelos candidatos (XGBoost, LightGBM y logística WOE como benchmark). El XGBoost obtuvo Gini OOT de 52.1 frente a 54.0 en Train (diferencia de 1.9 pts, dentro de U-11) y supera al modelo vigente en 6.4 pts en las cosechas aprobadas de los últimos seis meses.\n\nNegocio revisó el sentido económico de las 24 variables finales; se pidió retirar una variable de canal por riesgo de sesgo operativo.";
  a.decisiones=a.decisiones.map((d,i)=>({...d,responsable:i===0?"Gerente de producto (ejemplo)":"Jefe de modelos (ejemplo)",estado:"Acordada"}));
  a.acuerdos=[{accion:"Reentrenar sin la variable de canal y confirmar Gini OOT",responsable:"Analista de modelos (ejemplo)",fecha:hoy(),estado:"Abierto"}];
  a.conformidad=a.conformidad.map(c=>({...c,nombre:c.area.includes("Negocio")?"Gerente de producto (ejemplo)":"Jefe de modelos (ejemplo)",estado:"Conforme",fecha:hoy(),medio:"Correo"}));
  a.estado="Aprobada";a.historial.push({fecha:new Date().toISOString(),version:1,cambio:"Aprobada",por:null});
  return a;
}

let ED=null; // {a, dirty, base, ejemplo, tab}
function getPath(o,p){return p.split(".").reduce((x,k)=>x==null?x:x[k],o)}
function setPath(o,p,v){const ks=p.split(".");const last=ks.pop();const t=ks.reduce((x,k)=>x[k],o);t[last]=v}

async function openActa(aOrId,isEjemplo){
  await AStore.init();
  let a=typeof aOrId==="string"?AStore.docs.get(aOrId):aOrId;
  if(!a){$("#view").innerHTML=`<div class="doc"><h1>Acta no encontrada</h1><p>Puede que se haya eliminado o que aún no cargue. <a href="#actas">Volver a las actas</a>.</p></div>`;
    if(AStore.mode==="cargando"||AStore.docs.size===0){AStore.subs.clear();AStore.subs.add(()=>{if(AStore.docs.get(aOrId))openActa(aOrId)})}return}
  ED={a:JSON.parse(JSON.stringify(a)),dirty:false,base:a.actualizado,ejemplo:!!isEjemplo,tab:store.get("acta.tab","editar"),remote:false};
  AStore.subs.clear();
  AStore.subs.add(()=>{ if(!ED||ED.ejemplo||currentView!==ED.a.id)return;const r=AStore.docs.get(ED.a.id);
    if(!r){$("#a-remote").innerHTML=`<div class="a-banner warn">Esta acta fue eliminada por otra persona.</div>`;return}
    if(r.actualizado!==ED.base&&r.actualizado_por!==AStore.me){
      if(ED.dirty){ED.remote=true;$("#a-remote").innerHTML=`<div class="a-banner warn">Otra persona guardó cambios en esta acta. <button type="button" id="aLoadRemote">Cargar su versión</button> (perderás lo que no se guardó).</div>`;
        $("#aLoadRemote").onclick=()=>{ED.a=JSON.parse(JSON.stringify(r));ED.base=r.actualizado;ED.dirty=false;renderEditor()}}
      else{ED.a=JSON.parse(JSON.stringify(r));ED.base=r.actualizado;renderEditor(true)}}
  });
  renderEditor();
}
const ro=()=>ED.ejemplo||ED.a.estado==="Aprobada"||!AStore.canWrite;
function inp(path,o={}){const v=getPath(ED.a,path)??"";const id="f-"+path.replace(/\./g,"-");
  const dis=ro()?"disabled":"";
  if(o.area)return `<textarea id="${id}" data-p="${path}" rows="${o.rows||3}" ${dis} placeholder="${esc(o.ph||"")}" aria-label="${esc(o.label||path)}">${esc(v)}</textarea>`;
  if(o.sel)return `<select id="${id}" data-p="${path}" ${dis} aria-label="${esc(o.label||path)}">${o.sel.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
  if(o.chk)return `<input type="checkbox" id="${id}" data-p="${path}" ${v?"checked":""} ${dis} aria-label="${esc(o.label||path)}">`;
  return `<input id="${id}" data-p="${path}" type="${o.type||"text"}" value="${esc(v)}" ${dis} ${o.list?`list="${o.list}"`:""} placeholder="${esc(o.ph||"")}" aria-label="${esc(o.label||path)}">`}
function rowsTable(key,cols,empty){
  const arr=ED.a[key];const dis=ro();
  return `<div class="tbl a-rows"><table><thead><tr>${cols.map(c=>`<th style="${c.w?`width:${c.w}`:""}">${c.h}</th>`).join("")}${dis?"":"<th class='x'><span class='sr'>Quitar</span></th>"}</tr></thead><tbody>
  ${arr.length?arr.map((r,i)=>`<tr>${cols.map(c=>`<td>${inp(`${key}.${i}.${c.k}`,{...c.o,label:`${c.h} ${i+1}`})}</td>`).join("")}${dis?"":`<td class="x"><button type="button" class="ico" data-del="${key}.${i}" aria-label="Quitar fila ${i+1}">✕</button></td>`}</tr>`).join("")
   :`<tr><td colspan="${cols.length+1}" class="a-none">${empty}</td></tr>`}</tbody></table></div>${dis?"":`<button type="button" class="add" data-add="${key}">+ Agregar</button>`}`}
function listEditor(key,ph){const arr=ED.a[key];const dis=ro();
  return `<ol class="a-ol">${arr.map((x,i)=>`<li>${inp(`${key}.${i}`,{ph,label:`${key} ${i+1}`})}${dis?"":`<button type="button" class="ico" data-del="${key}.${i}" aria-label="Quitar ${i+1}">✕</button>`}</li>`).join("")}</ol>${dis?"":`<button type="button" class="add" data-add="${key}">+ Agregar</button>`}`}

function nota(msg){const n=$("#a-note");if(n){n.textContent=msg;clearTimeout(nota.t);nota.t=setTimeout(()=>{n.textContent=""},6000)}}
function setSave(s){const n=$("#a-save");if(n)n.textContent=s}
let saveT=null;
function scheduleSave(){if(ED.ejemplo||ro())return;ED.dirty=true;setSave("Cambios sin guardar…");clearTimeout(saveT);saveT=setTimeout(doSave,1200)}
async function doSave(){
  if(!ED||ED.ejemplo)return;clearTimeout(saveT);setSave("Guardando…");
  try{await AStore.save(ED.a);ED.base=ED.a.actualizado;ED.dirty=false;ED.remote=false;$("#a-remote")&&($("#a-remote").innerHTML="");
    setSave(AStore.mode==="linea"?"Guardado en línea · "+new Date().toLocaleTimeString("es-PE",{timeStyle:"short"}):"Guardado en este navegador")}
  catch(e){setSave(e&&e.code==="invalid_argument"?"Solo lectura: tu acceso no permite guardar":e&&e.code==="quota_exceeded"?"Sin espacio para guardar":e&&e.code==="local_full"?"El navegador no tiene espacio":"No se pudo guardar; se reintentará con el próximo cambio");
    if(e&&e.code==="invalid_argument"){AStore.canWrite=false;renderEditor()}}
}
function wireEditor(){
  const v=$("#view");
  v.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ED.tab=b.dataset.tab;store.set("acta.tab",ED.tab);renderEditor()});
  const form=$("#aForm");
  if(form){
    form.addEventListener("input",e=>{const p=e.target.dataset.p;if(!p)return;setPath(ED.a,p,e.target.type==="checkbox"?e.target.checked:e.target.value);scheduleSave()});
    form.addEventListener("change",e=>{const p=e.target.dataset.p;if(!p)return;setPath(ED.a,p,e.target.type==="checkbox"?e.target.checked:e.target.value);scheduleSave()});
    form.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const k=b.dataset.add;const blank={asistentes:{nombre:"",area:"",rol:"Informado",asistio:true},decisiones:{texto:"",ref:"",responsable:"",estado:"Pendiente de aprobación"},
      excepciones:{umbral:"",valor:"",justificacion:"",comite:false},acuerdos:{accion:"",responsable:"",fecha:"",estado:"Abierto"},conformidad:{nombre:"",area:"",estado:"Pendiente",fecha:"",medio:"Correo"}}[k];
      ED.a[k].push(blank?{...blank}:"");scheduleSave();renderEditor();const ins=document.querySelectorAll(`[data-p^="${k}.${ED.a[k].length-1}"]`);if(ins[0])ins[0].focus()});
    form.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.del.split(".");ED.a[k].splice(+i,1);scheduleSave();renderEditor()});
  }
  v.querySelectorAll("[data-flujo]").forEach(b=>b.onclick=async()=>{
    const to=b.dataset.flujo,a=ED.a,now=new Date().toISOString();
    if(to==="Aprobada"){const e=validarActa(a);if(e.length){$("#a-check").innerHTML=`<div class="a-banner warn"><b>Antes de aprobar:</b><ul>${e.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;return}}
    $("#a-check").innerHTML="";
    if(to==="reabrir"){a.version+=1;a.estado="Borrador";a.historial.push({fecha:now,version:a.version,cambio:`Reapertura del acta (versión ${a.version})`,por:AStore.me})}
    else{a.historial.push({fecha:now,version:a.version,cambio:to==="En revisión"?"Enviada a revisión":to==="Aprobada"?"Aprobada":"Devuelta a borrador",por:AStore.me});a.estado=to}
    await doSave();renderEditor();nota(to==="Aprobada"?"Acta aprobada y bloqueada.":to==="reabrir"?`Acta reabierta como versión ${a.version}.`:"Estado actualizado: "+a.estado);
  });
  $("#aDocx").onclick=async()=>{nota("Preparando el documento Word…");try{const blob=await actaDocx(ED.a);await ofrecerArchivo(fileBase(ED.a)+".docx",blob,nota)}catch(e){nota("No se pudo generar el Word.")}};
  $("#aMd").onclick=()=>ofrecerArchivo(fileBase(ED.a)+".md",actaMd(ED.a),nota);
  $("#aCopy").onclick=()=>{const md=actaMd(ED.a);const fb=()=>{$("#a-check").innerHTML=`<textarea class="copybox" id="aCopyBox" aria-label="Acta en Markdown"></textarea>`;const t=$("#aCopyBox");t.value=md;t.select();nota("Texto seleccionado: cópialo con Ctrl+C.")};
    try{navigator.clipboard.writeText(md).then(()=>nota("Acta copiada en Markdown."),fb)}catch(e){fb()}};
  $("#aDup")&&($("#aDup").onclick=async()=>{const src=ED.a;const n=AStore.list().filter(x=>x.modelo.codigo===src.modelo.codigo).length+1;
    const c=actaNueva(TIPO[src.tipo]||TIPO.LIBRE,{...src.modelo,fecha:hoy()},n);
    Object.assign(c,{objetivo:src.objetivo,agenda:[...src.agenda],asistentes:src.asistentes.map(x=>({...x})),evidencias:[...src.evidencias]});
    c.historial[0].cambio=`Creación a partir de ${src.numero}`;await AStore.save(c);location.hash="#"+c.id});
  $("#aDel")&&($("#aDel").onclick=()=>{$("#aDelWrap").innerHTML=`<span class="a-confirm">¿Eliminar ${esc(ED.a.numero)} para todo el equipo? <button type="button" class="danger" id="aDelOk">Sí, eliminar</button><button type="button" id="aDelNo">Cancelar</button></span>`;
    $("#aDelNo").onclick=()=>renderEditor();$("#aDelOk").onclick=async()=>{await AStore.remove(ED.a.id);ED=null;location.hash="#actas"}});
}
window.addEventListener("beforeunload",e=>{if(ED&&ED.dirty){doSave()}});

let currentView="";
function route(){
  const v=(location.hash||"#index").slice(1);
  $("#side").classList.remove("open");
  if(typeof ED!=="undefined"&&ED&&ED.dirty)doSave();
  if(typeof AStore!=="undefined")AStore.subs.clear();
  currentView=v;
  if(v==="planificador"){showPlanner()}else if(v==="actas"){showActas()}else if(/^a-[a-z0-9]+-[a-z0-9]+$/.test(v)){openActa(v)}
  else if(BYSLUG[v]){showPage(BYSLUG[v])}else{currentView="index";showPage(BYSLUG["index"])}
  setActive(v.startsWith("a-")?"actas":BYSLUG[v]||v==="planificador"||v==="actas"?v:"index");window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const a=e.target.closest("a.rid");if(a){e.preventDefault();openReq(a.dataset.id);return}
  if(!e.target.closest("#drawer")&&$("#drawer").classList.contains("open")&&!e.target.closest("a.rid"))$("#drawer").classList.remove("open");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#drawer").classList.remove("open")});
$("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);const q=e.target.value.trim();qt=setTimeout(()=>{if(q.length>=2){showSearch(q);setActive("")}else route()},180)});
window.addEventListener("hashchange",()=>{$("#q").value="";route()});
$("#foot").innerHTML=`${esc(DATA.meta.nombre)} · v${esc(DATA.meta.version)} · ${DATA.meta.n_requisitos} requisitos · Generado ${esc(DATA.meta.generado)} · <b>${esc(DATA.meta.custodio)}</b> · Contenido CC BY 4.0 · Código MIT`;
buildNav();route();
</script>
