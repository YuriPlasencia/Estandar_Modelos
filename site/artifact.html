<script>
const DATA={"meta": {"nombre": "Estándares de Modelos en Banca", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "version": "2.2.0", "generado": "2026-10-17", "n_requisitos": 541, "licencia": "CC-BY-4.0 (contenido) · MIT (código en tools/)"}, "pages": [{"path": "docs/index.md", "meta": {"id": "INICIO", "titulo": "Estándares de Modelos en Banca", "estandar": "Marco", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 0}, "md": "# Estándares de Modelos en Banca\n\nEste repositorio reúne los estándares que rigen el **ciclo de vida completo** de los modelos en banca\n(scores de originación, comportamiento y cobranza; estimadores de ingresos; modelos PD/LGD/EAD y calibraciones):\ndesarrollo, calibración, implementación, seguimiento y validación. Incluye además el estándar de\n**Parámetros de riesgo** (PD, LGD, EAD, escenarios, staging y ECL bajo IFRS 9, y CLV) y el de\n**Pricing analítico** end-to-end: precio técnico, respuesta al precio, optimización, experimentación, motor de precios y gobierno.\n\nEstán escritos como **documentación como código**: texto versionado y revisable, con un catálogo estructurado\nque pueden consultar tanto los analistas como los agentes de IA.\n\n> **Línea base 2.0** (octubre 2026): contrastada con la Res. SBS 00053-2023, la SR 26-2, la práctica pública de\n> JPMorgan, HSBC, BBVA, Santander y Credicorp, y la literatura reciente de journals de primer nivel.\n> Ver [Línea base 2.0 y benchmarking](marco/linea-base.md).\n\n## Cómo está organizado\n\n| Capa | Qué contiene | Quién la usa |\n|---|---|---|\n| **Catálogo normativo** (`catalogo/*.yaml`) | 340+ requisitos con ID estable, aplicabilidad por Tier y tipo de modelo, esfuerzo, entregable e hito | Analistas, PMO, validadores, agentes |\n| **Documentación** (`docs/**/*.md`) | Cada fase explicada: objetivo, entradas, salidas, criterios de aceptación y catálogo de actividades | Analistas, revisores |\n| **Umbrales** (`catalogo/umbrales.yaml`) | Los límites cuantitativos vigentes (PSI, Gini, correlaciones...) con su trazabilidad | Todos; es la regla de oro para agentes |\n| **Frontera** (`docs/frontera/`) | Prácticas emergentes propuestas para incorporarse al estándar. **No son obligatorias** hasta que se aprueben | Equipo de metodología |\n| **Sitio** (`site/index.html`) | Todo lo anterior en un sitio navegable, con buscador y planificador por Tier/modelo | Todos |\n\n## Mapa del ciclo de vida\n\n```text\n  ┌────────────┐   ┌────────────┐   ┌──────────────┐   ┌────────────┐   ┌──────────────┐\n  │ DESARROLLO │──▶│ VALIDACIÓN │──▶│IMPLEMENTACIÓN│──▶│ SEGUIMIENTO│──▶│ CALIBRACIÓN /│\n  │  D1 … D7   │   │ metodológica│   │  + val. impl.│   │  (monitoreo)│   │ REDESARROLLO │\n  └────────────┘   └────────────┘   └──────────────┘   └─────┬──────┘   └──────┬───────┘\n         ▲                                                    │ alertas         │\n         └────────────────────────────────────────────────────┴─────────────────┘\n```\n\n## Lectura según tu rol\n\n- **Analista que va a construir un modelo:** empieza en [Ciclo de vida y gobierno](marco/ciclo-de-vida.md), luego\n  [Tiering y enfoque](marco/tiering-y-metodologia.md), y usa el **Planificador** del sitio para obtener tu checklist.\n- **Analista que va a calibrar:** [Calibración C1–C5](calibracion/c1-entendimiento.md).\n- **Implementador:** [Implementación](implementacion/implementacion.md).\n- **Validador:** [Validación](validacion/validacion.md) y [Umbrales](marco/umbrales.md).\n- **Analista de parámetros (IFRS 9):** [Parámetros de riesgo · Marco](parametros/r0-marco.md).\n- **Analista de pricing:** [Pricing analítico · Marco end-to-end](pricing/p0-marco.md) y [Agentes de IA en pricing](pricing/agentes-ia.md).\n- **Agente de IA:** lee primero [`AGENTS.md`](../AGENTS.md) y el [estándar operativo de agentes](agentes/index.md); consulta `dist/catalogo.json`.\n- **Para profundizar:** [Literatura de referencia](marco/literatura.md), con lecturas enlazadas a cada requisito.\n\n## Convenciones\n\n- **ID de requisito:** `DES-D4-05.04.01` = estándar de Desarrollo · fase D4 · tarea 05 · subtarea 04 · actividad 01.\n  Prefijos: `DES` Desarrollo · `CAL` Calibración · `IMP` Implementación · `GOB` Gobierno · `SEG` Seguimiento · `PAR` Parámetros · `PRC` Pricing · `VAL` Validación · `U` Umbral.\n  Los IDs no se reutilizan: si un requisito se elimina, su ID queda retirado.\n- **Estados de un documento:** `Vigente` (obligatorio) · `Borrador` (en revisión) · `Propuesta` (frontera, no obligatorio).\n- **\"Debe\"** expresa obligación; **\"debería\"**, recomendación; **\"puede\"**, opción permitida.\n\n> **Yuri Plasencia — Analytics Pricing & Revenue Management**. Las propuestas de cambio siguen\n> el proceso descrito en `CONTRIBUTING.md`.\n"}, {"path": "docs/marco/ciclo-de-vida.md", "meta": {"id": "MARCO-CV", "titulo": "Ciclo de vida y gobierno del modelo", "estandar": "Marco", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 1}, "md": "# Ciclo de vida y gobierno del modelo\n\n## Etapas\n\n| # | Etapa | Estándar | Resultado de salida (gate) |\n|---|---|---|---|\n| 1 | Definición, alcance, diseño y extracción | [DES-D1](../desarrollo/d1-definicion.md) | Project Charter aprobado, Kick off, definición de default/target documentada |\n| 2 | Preparación, calidad y entendimiento de datos | [DES-D2](../desarrollo/d2-calidad-datos.md) | Certificación de calidad de datos (Documento 6) |\n| 3 | Segmentación | [DES-D3](../desarrollo/d3-segmentacion.md) | Segmentación final documentada (Documento 7) |\n| 4 | Modelamiento | [DES-D4](../desarrollo/d4-modelamiento.md) | Modelo final seleccionado, calibrado y documentado; presentación en Comité de Modelos |\n| 5 | Integración a la gestión | [DES-D5](../desarrollo/d5-integracion-gestion.md) | Punto de corte e impactos (riesgo, pricing, provisiones, capital, IFRS) |\n| 6 | Implementación | [IMP](../implementacion/implementacion.md) | Certificación ≥ 95 % de coincidencia y conformidad del usuario |\n| 7 | Gobierno | [DES-D7](../desarrollo/d7-gobierno.md) | Evidencias, Tier asignado, alta en inventario |\n| — | Validación | [VAL](../validacion/validacion.md) | Dictamen de validación metodológica y de implementación |\n| — | Seguimiento | [SEG](../seguimiento/seguimiento.md) | Reportes periódicos y alertas |\n| — | Calibración | [CAL](../calibracion/c1-entendimiento.md) | Calibrado aprobado e implementado |\n| — | Parámetros de riesgo | [PAR](../parametros/r0-marco.md) | Parámetros y ECL aprobados en comité de provisiones, motor certificado y backtesting anual |\n| — | Pricing analítico | [PRC](../pricing/p0-marco.md) | Tarifario aprobado en Comité de Precios, motor certificado y seguimiento de margen |\n\n## Hitos y ceremonias\n\nEl estándar se ejecuta en **sprints** (Sprint 0 a Sprint 20) con reuniones formales que dejan **acta**:\n\n> Cada acta se crea en el sitio (**Herramientas › Actas de reunión**) o con `tools/acta.py`, ya precargada para su hito.\n> Ver [Plantilla · Acta de reunión](../plantillas/acta-de-reunion.md).\n\n| Hito | Momento | Evidencia |\n|---|---|---|\n| Reunión 1–2 | Levantamiento de expectativas (población, fuentes) | Acta 1, Acta 2 |\n| Reunión 3 | Enriquecimiento de la propuesta / diseño funcional | Acta de reunión |\n| Kick off | Arranque formal con stakeholders | PPT 2, Acta 3 |\n| Reunión 4 | Segmentación | Acta 4 |\n| Reunión 5 | Selección del modelo final | Acta 5 |\n| Reunión 6 | Presentación del calibrado | Acta 6 |\n| Reunión 7–8 | Resultados cuantitativos y enfoque cualitativo con la banca | Acta 7, Acta 8 |\n| Comité de Modelos | Aprobación | Acta del comité |\n| SME 1–13 | Revisiones con expertos de negocio (*subject matter experts*) | Según fase |\n\n## Gobierno de la entidad\n\nTodo el ciclo opera bajo el [Gobierno del riesgo de modelo](gobierno-mrm.md): comité de riesgos de modelo trimestral,\ninventario, categorización, aprobación previa al uso (GOB-G3-01.01.01) e informe anual, según la Res. SBS 00053-2023.\n\n## Tres líneas de defensa\n\n| Línea | Rol | Responsabilidad en este estándar |\n|---|---|---|\n| 1ª | Equipo desarrollador / dueño del modelo | Ejecuta D1–D7, CAL e IMP; genera las evidencias; el líder del proyecto revisa la aplicación del estándar (DES-D7-01.01.01) |\n| 2ª | Validación de modelos | Ejecuta VAL-M y VAL-I de forma independiente |\n| 3ª | Auditoría interna | Revisa que el marco se cumpla |\n\n## Reglas de gobierno transversales\n\n1. **Todo modelo debe estar registrado en el inventario** con código único antes de su implementación (IMP-01.01, VAL-M-01.12).\n2. **Toda decisión metodológica relevante debe quedar evidenciada** (correo, acta o documento) — DES-D7-01.01.02.\n3. **Todo documento técnico lleva un cuadro de control de cambios** (DES-D4-11.01.03).\n4. Si se usa una **metodología corporativa**, las definiciones de universo y target deben alinearse con ella;\n   cualquier desviación se justifica con análisis metodológico o de negocio (DES-D1-01.04.06, CAL-C1-01.01.04).\n5. Las desviaciones a un umbral (ver [Umbrales](umbrales.md)) se **sustentan por escrito** y, cuando el estándar\n   lo indica, se presentan en Comité de Modelos.\n"}, {"path": "docs/marco/linea-base.md", "meta": {"id": "MARCO-LB", "titulo": "Línea base 2.0 y benchmarking", "estandar": "Marco", "estado": "Vigente", "version": "2.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 1}, "md": "# Línea base 2.0 y benchmarking\n\nLa versión 2.0 es la **línea base** del estándar: el punto de referencia contra el que se medirán los cambios\nfuturos. Se construyó contrastando cada estándar con tres fuentes: la regulación vigente, la práctica pública de\nbancos de referencia y la literatura reciente de journals de primer nivel.\n\n## Método y límites\n\n- **Los bancos no publican sus estándares internos de modelos.** Lo que sí es público son sus informes anuales y\n  regulatorios (10-K, 20-F, Pillar 3), sus principios de IA y su investigación aplicada. Este benchmarking usa solo\n  esas fuentes y las cita. Para cualquier banco concreto, sus documentos internos aprobados prevalecen.\n- La regulación se verificó en la fuente primaria cuando fue posible (Fed, El Peruano, EBA, BCE, BIS).\n- Las referencias de journals se verificaron en sus bases bibliográficas. Las que tienen datos pendientes lo dicen en la propia cita.\n\n## Hallazgos principales\n\n1. **Perú tiene norma propia de riesgo de modelo** (Res. SBS 00053-2023). Exige comité trimestral, aprobación\n   previa de todo modelo nuevo o modificado (incluida una recalibración), réplica en alta categoría, seguimiento de\n   forzajes, informe anual, reglas para terceros y requisitos específicos de IA. Se incorporó en el nuevo estándar de\n   [Gobierno](gobierno-mrm.md) y en Desarrollo, Calibración, Implementación, Validación y Seguimiento.\n2. **SR 11-7 ya no está vigente:** fue reemplazada el 17 de abril de 2026 por **SR 26-2**, más basada en riesgo y con\n   una sección de terceros. Excluye explícitamente la IA generativa y agéntica, un vacío que este estándar cubre\n   con [AGT](../agentes/index.md).\n3. **El seguimiento es donde la norma y la práctica exigen más disciplina.** Tiene estándar propio ([Seguimiento](../seguimiento/seguimiento.md)).\n4. **La literatura reciente confirma decisiones del estándar y agrega controles:** el boosting es preferible al deep\n   learning en datos tabulares de crédito (LIT-135); las explicaciones SHAP/LIME se vuelven inestables con desbalance\n   (LIT-136); la equidad puede mejorarse a bajo costo (LIT-134); la evaluación por rentabilidad complementa al Gini (LIT-138).\n\n## Cambios por estándar\n\n| Estándar | Brecha detectada | Enriquecimiento en 2.0 | Fuente |\n|---|---|---|---|\n| **Gobierno** (nuevo) | No existía un estándar a nivel de entidad | GOB-G1 a GOB-G5: comité, inventario, categorización, aprobación previa, terceros, IA, informe anual | SBS 53-2023, SR 26-2, SS1/23, JPMorgan, HSBC, BBVA |\n| **Desarrollo** | Sin control del sesgo de selección | DES-D1-04.01.08 inferencia de rechazados | LIT-002, LIT-139 |\n| | ML sin benchmark ni validación cruzada obligatorios | DES-D4-05.03.02, DES-D4-05.03.03 | SBS art. 16, LIT-135, LIT-132 |\n| | Solo métricas estadísticas | DES-D4-06.01.03 métrica de rentabilidad (EMP) | LIT-138 |\n| | Explicabilidad sin prueba de estabilidad | DES-D4-07.01.02 | LIT-136 |\n| | Sin análisis de sensibilidad ni de equidad | DES-D4-10.01.06, DES-D4-10.01.07 | SBS art. 16, LIT-134 |\n| | Forzajes no normados | DES-D5-01.01.02, U-36 | SBS arts. 19 y 22 |\n| | Aprobación previa implícita | DES-D7-01.01.07 | SBS art. 17 |\n| **Calibración** | No se exigía justificar calibrar vs. redesarrollar | CAL-C1-01.01.07 | Práctica de bancos |\n| | Recalibrar no se trataba como modificación | CAL-C5-01.01.05 | SBS art. 17 |\n| **Implementación** | Sin pruebas de escenarios de error | IMP-01.06.05 | SBS art. 18 |\n| | Sin trazabilidad de versión por resultado | IMP-01.06.06 | FR-07, práctica de bancos |\n| **Validación** | Sin réplica, challenger, periodicidad ni severidad de hallazgos | VAL-M-05.01 a VAL-M-05.06, U-35 | SBS arts. 7, 20 y 25; Santander |\n| **Seguimiento** | Borrador | SEG-S1 a SEG-S4, U-36, U-37 | SBS arts. 21–22 |\n| **Parámetros, Pricing, Agentes** | Construidos con benchmarking propio (GPPC, BCBS, EBA, BCE, literatura de pricing e IA) | Agentes cubre el vacío de SR 26-2 en IA generativa | — |\n\n## Cómo se mantiene la línea base\n\n- **Revisión anual** del benchmarking (regulación, práctica pública de bancos y literatura), con un informe de\n  brechas que alimenta la versión menor siguiente.\n- **Cambio regulatorio:** se incorpora como versión mayor si cambia obligaciones (como en 2.0 con la SBS y SR 26-2).\n- Cada requisito nuevo lleva `nota_origen` con su fuente, para auditar por qué existe.\n\n## Fuentes públicas consultadas\n\n- Federal Reserve, [SR 26-2: Revised Guidance on Model Risk Management](https://www.federalreserve.gov/supervisionreg/srletters/sr2602.htm) (abril 2026).\n- SBS, [Reglamento de Gestión de Riesgos de Modelo, Res. SBS N° 00053-2023](https://busquedas.elperuano.pe/dispositivo/NL/2141173-1) (El Peruano).\n- JPMorgan Chase & Co., [Form 10-K 2024](https://www.sec.gov/Archives/edgar/data/19617/000001961725000270/jpm-20241231.htm), sección de riesgo de modelo.\n- BBVA, [Eight responsible AI principles](https://www.bbva.com/en/innovation/bbvas-eight-responsible-ai-principles/) y [Responsible innovation](https://www.bbva.com/en/innovation/responsible-innovation-how-bbva-ensures-safe-use-of-artificial-intelligence/).\n- HSBC, descripciones públicas de su función de Model Risk Management (portal de empleo, [ejemplo](https://mycareer.hsbc.com/fr_FR/external/PipelineDetail/Senior-Manager-Independent-Model-Review-f-m-d/253184)).\n- Credicorp, [Form 20-F 2025](https://www.sec.gov/Archives/edgar/data/0001001290/000100129026000008/bap-20251231.htm).\n- EBA, [Follow-up report on machine learning for IRB models](https://www.eba.europa.eu/eba-publishes-follow-report-use-machine-learning-internal-ratings-based-models) (2023).\n- Kiritz, Ravitz y Levonian (2019), [Model risk tiering](https://www.risk.net/journal-of-risk-model-validation/6710566/model-risk-tiering-an-exploration-of-industry-practices-and-principles), *Journal of Risk Model Validation*.\n- Artículos de EJOR 2014–2025 citados en la [literatura](literatura.md) (LIT-134 a LIT-140).\n"}, {"path": "docs/marco/gobierno-mrm.md", "meta": {"id": "MARCO-GOB", "titulo": "Gobierno del riesgo de modelo", "estandar": "Marco", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 2}, "md": "# Gobierno del riesgo de modelo\n\nLos estándares de Desarrollo, Calibración, Parámetros o Pricing dicen **cómo se hace un modelo**. Este documento dice\n**cómo la entidad gobierna todos sus modelos**: quién decide, con qué inventario y categorías, cuándo se valida, qué\npasa con los proveedores y cómo se reporta. Sus requisitos (GOB-G1 a GOB-G5) aplican a la entidad, no a un\nproyecto, y por eso no aparecen en el Planificador.\n\n## Marcos que lo sustentan\n\n| Marco | Alcance | Estado |\n|---|---|---|\n| **Res. SBS 00053-2023**, Reglamento de Gestión de Riesgos de Modelo (Perú) | Bancos y entidades supervisadas; crédito, mercado, liquidez, operacional, LA/FT | **Obligatorio en Perú** (LIT-131) |\n| **SR 26-2** (Fed, OCC, FDIC, 17-abr-2026) | Bancos de EE. UU., sobre todo los de más de 30 000 MM USD | Reemplaza a SR 11-7; excluye la IA generativa y agéntica (LIT-130) |\n| **PRA SS1/23** (Reino Unido) | Cinco principios de MRM, incluidos ML y terceros | Referencia internacional (LIT-101) |\n| **EU AI Act** | IA de alto riesgo, incluido el scoring de personas | Referencia para IA (LIT-102) |\n\n## Correspondencia entre la norma peruana y este estándar\n\n| Res. SBS 00053-2023 | Exigencia | Dónde se cumple |\n|---|---|---|\n| Art. 5 | Inventario actualizado y remitido anualmente (SUCAVE) | GOB-G2-01.01.01, GOB-G2-01.01.02 |\n| Art. 6 | Categorización por materialidad, uso y complejidad, aprobada por comité | GOB-G2-02.01.01, Tier ([FR-02](../frontera/tiering-basado-en-riesgo.md)), U-35 |\n| Art. 7 | Acciones correctivas y mitigación temporal | GOB-G5-01.01.01, VAL-M-05.04 |\n| Art. 8 | Informe anual de la unidad de riesgos | GOB-G5-02.01.01 |\n| Arts. 9–11 | Directorio y comité de riesgos de modelo trimestral | GOB-G1-01.02.01 a GOB-G1-01.02.03; acta CRM |\n| Arts. 12–13 | Independencia y nivel organizacional de validación y seguimiento | GOB-G1-01.01.01, GOB-G1-01.01.02 |\n| Art. 14 | Manuales de desarrollo, validación, uso, seguimiento, datos y proveedores | GOB-G3-01.02.01 (este estándar) |\n| Art. 15 | Documentación con historial de versiones | GOB-G3-01.02.02, DES-D4-11.01.03 |\n| Art. 16 | Desarrollo: propósito, calidad de datos, sensibilidad o benchmark; en IA, interpretabilidad, HPO y validación cruzada | DES-D2, DES-D4-10.01.06, DES-D4-05.03.02, DES-D4-05.03.03, DES-D4-07 |\n| Art. 17 | Aprobación previa de todo modelo nuevo, modificado o con cambio de uso | GOB-G3-01.01.01, DES-D7-01.01.07, CAL-C5-01.01.05 |\n| Art. 18 | Implementación: escenarios de error, automatización, accesos | IMP-01.06.05, IMP |\n| Art. 19 | Uso consistente con el propósito; capacitación; forzajes | DES-D5-01.01.02, SEG-S2-01.03.02 |\n| Art. 20 | Validación inicial y periódica; réplica en alta categoría | VAL-M-05.01, VAL-M-05.03, U-35, VAL-I |\n| Arts. 21–22 | Seguimiento con indicadores y umbrales; informe anual (forzajes, sobreajuste en IA) | SEG-S1 a SEG-S4, U-36, U-37 |\n| Arts. 23–25 | Terceros: responsabilidad, seguimiento interno, réplica o benchmarking | GOB-G4-01.01.01 a GOB-G4-01.01.03, VAL-M-05.06 |\n\n> La correspondencia se basa en el texto publicado en El Peruano. Verifica la versión vigente y su cronograma de\n> adecuación por tipo de riesgo antes de usarla como evidencia de cumplimiento.\n\n## Lo que hacen los bancos de referencia (fuentes públicas)\n\n| Banco | Práctica pública | Incorporado como |\n|---|---|---|\n| **JPMorgan Chase** | Función independiente de gobierno y revisión de modelos (MRGR); el usuario es dueño del riesgo de uso; el inventario incluye ML e IA | GOB-G1-01.01.01, GOB-G1-01.01.03, GOB-G4-02.01.01 |\n| **HSBC** | Chief Model Risk Officer con reporte al CRO, independiente de quienes desarrollan y usan los modelos | GOB-G1-01.01.01 |\n| **BBVA** | Inventario y monitoreo de sistemas de IA; ocho principios de IA responsable traducidos en controles | GOB-G4-02.01.01, GOB-G4-02.01.02 |\n| **Santander** | Remediación ordenada de hallazgos y revisiones anuales | VAL-M-05.04, U-35 |\n| **Credicorp** (Form 20-F) | Metodología pública de pérdida esperada: tres escenarios ponderados, staging mensual | PAR |\n\nDetalle y fuentes en [Línea base 2.0](linea-base.md).\n\n<!-- CATALOGO:INICIO GOB-G1 -->\n## Catálogo de requisitos · Organización y comité de riesgos de modelo\n\n> Bloque generado desde `catalogo/gob-g1.yaml` (6 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): Res. SBS 00053-2023, SR 26-2, PRA SS1/23 y práctica pública de bancos de referencia.\n\n### 1 · Estructura\n\n#### 1.1 Roles e independencia\n\n- **`GOB-G1-01.01.01`** Mantener una función de riesgo de modelo independiente de las áreas que desarrollan, usan e implementan los modelos, con un responsable que reporta a la gerencia de riesgos (SBS 53-2023 arts. 12–13).\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico\n\n- **`GOB-G1-01.01.02`** Los responsables de validación y seguimiento tienen al menos el mismo nivel organizacional que los de desarrollo; los desarrolladores están separados de las unidades de negocio.\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico\n\n- **`GOB-G1-01.01.03`** Asignar al usuario del modelo la propiedad de su riesgo de uso y la obligación de usarlo solo para el propósito aprobado (SBS art. 19).\n\n  Aplica: Tier I–IV · Automatización: 1\n\n#### 1.2 Comité de riesgos de modelo\n\n- **`GOB-G1-01.02.01`** Operar un comité de riesgos de modelo con al menos un director, el jefe de riesgos y los responsables de desarrollo, validación y seguimiento, que sesione como mínimo cada trimestre (SBS arts. 10–11).\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico · Entregable: Acta CRM: Comité de riesgos de modelo\n\n- **`GOB-G1-01.02.02`** El comité aprueba los criterios de categorización (Tier), los indicadores y umbrales de seguimiento, la periodicidad de las validaciones, los informes de validación y seguimiento y las acciones ante debilidades.\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico · Entregable: Acta CRM: Comité de riesgos de modelo\n\n- **`GOB-G1-01.02.03`** El directorio aprueba las políticas, asigna recursos y aprueba las excepciones de uso de modelos de mayor categoría con debilidades relevantes (SBS art. 9).\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico\n\n<!-- CATALOGO:FIN -->\n\n<!-- CATALOGO:INICIO GOB-G2 -->\n## Catálogo de requisitos · Inventario y categorización\n\n> Bloque generado desde `catalogo/gob-g2.yaml` (4 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): Res. SBS 00053-2023, SR 26-2, PRA SS1/23 y práctica pública de bancos de referencia.\n\n### 1 · Inventario\n\n#### 1.1 Registro de modelos\n\n- **`GOB-G2-01.01.01`** Mantener un inventario completo y actualizado de modelos con sus atributos mínimos (propósito, uso, dueño, categoría, estado, versión, validaciones, debilidades), incluidas herramientas informales influyentes como hojas de cálculo y los sistemas de IA.\n\n  Aplica: Tier I–IV · Automatización: 2 · Crítico · Entregable: Documento G1: Inventario de modelos\n\n- **`GOB-G2-01.01.02`** Remitir el inventario al supervisor con la periodicidad y el formato que exija la norma local (en Perú, anualmente vía SUCAVE según el Anexo A de la Res. SBS 53-2023).\n\n  Aplica: Tier I–IV · Automatización: 2 · Crítico · Entregable: Documento G1: Inventario de modelos\n\n### 2 · Categorización\n\n#### 2.1 Criterios de categoría\n\n- **`GOB-G2-02.01.01`** Categorizar cada modelo por materialidad, uso y complejidad con criterios aprobados por el comité (ver FR-02); la categoría determina la profundidad y frecuencia de validación y seguimiento y si se exige réplica completa (SBS art. 6; U-35).\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico · Entregable: Documento G2: Criterios de categorización · Umbrales: U-35\n\n- **`GOB-G2-02.01.02`** Revisar periódicamente el propio esquema de categorización (que sea objetivo y que discrimine), como exige SS1/23.\n\n  Aplica: Tier I–II · Automatización: 1 · Entregable: Documento G2: Criterios de categorización\n\n<!-- CATALOGO:FIN -->\n\n<!-- CATALOGO:INICIO GOB-G3 -->\n## Catálogo de requisitos · Políticas, aprobación y documentación\n\n> Bloque generado desde `catalogo/gob-g3.yaml` (3 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): Res. SBS 00053-2023, SR 26-2, PRA SS1/23 y práctica pública de bancos de referencia.\n\n### 1 · Ciclo de aprobación\n\n#### 1.1 Aprobación previa\n\n- **`GOB-G3-01.01.01`** Todo modelo nuevo, modificado (cambio de variables, supuestos o parámetros, incluida una recalibración) o con cambio de uso requiere validación y aprobación previa del comité antes de usarse (SBS art. 17).\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico\n\n#### 1.2 Manuales\n\n- **`GOB-G3-01.02.01`** Mantener manuales aprobados de desarrollo, validación, uso, seguimiento, categorización, calidad de datos y contratación de proveedores de modelos (SBS art. 14); este estándar cumple esa función para los modelos analíticos.\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico\n\n- **`GOB-G3-01.02.02`** Conservar la documentación de cada modelo (desarrollo, validación, seguimiento, actas, bases, diccionarios y código) con historial de versiones y disponible para el supervisor (SBS art. 15).\n\n  Aplica: Tier I–IV · Automatización: 2 · Crítico\n\n<!-- CATALOGO:FIN -->\n\n<!-- CATALOGO:INICIO GOB-G4 -->\n## Catálogo de requisitos · Modelos de terceros y sistemas de IA\n\n> Bloque generado desde `catalogo/gob-g4.yaml` (5 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): Res. SBS 00053-2023, SR 26-2, PRA SS1/23 y práctica pública de bancos de referencia.\n\n### 1 · Terceros\n\n#### 1.1 Proveedores\n\n- **`GOB-G4-01.01.01`** La entidad es plenamente responsable de los modelos de terceros: puede tercerizar desarrollo, validación o implementación, pero el seguimiento lo hace la propia entidad (SBS arts. 23–24).\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico\n\n- **`GOB-G4-01.01.02`** Para modelos de terceros de mayor categoría, exigir réplica; si la propiedad intelectual lo impide, aplicar benchmarking u otra técnica alternativa documentada (SBS art. 25).\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico\n\n- **`GOB-G4-01.01.03`** Contar con una estrategia de continuidad para los modelos de proveedores que soportan servicios priorizados.\n\n  Aplica: Tier I–II · Automatización: 1\n\n### 2 · Sistemas de IA\n\n#### 2.1 IA responsable\n\n- **`GOB-G4-02.01.01`** Inventariar los sistemas de IA (incluidos los de IA generativa y los agentes) y aplicarles controles proporcionales a su riesgo: los modelos de IA no generativa siguen este estándar; los generativos y agénticos, además, el estándar AGT.\n\n  Aplica: Tier I–IV · Automatización: 2 · Crítico · Entregable: Documento G1: Inventario de modelos\n\n- **`GOB-G4-02.01.02`** Adoptar principios de IA responsable (transparencia, equidad, privacidad, seguridad y supervisión humana) traducidos en métricas y controles verificables, no solo en declaraciones.\n\n  Aplica: Tier I–II · Automatización: 1\n\n<!-- CATALOGO:FIN -->\n\n<!-- CATALOGO:INICIO GOB-G5 -->\n## Catálogo de requisitos · Reporte, debilidades y auditoría\n\n> Bloque generado desde `catalogo/gob-g5.yaml` (3 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Línea base 2.0 (2026-10-17): Res. SBS 00053-2023, SR 26-2, PRA SS1/23 y práctica pública de bancos de referencia.\n\n### 1 · Debilidades\n\n#### 1.1 Gestión de debilidades\n\n- **`GOB-G5-01.01.01`** Registrar cada debilidad o hallazgo con severidad, responsable, plazo y estado; si no puede corregirse de inmediato, aplicar medidas temporales de mitigación (SBS art. 7).\n\n  Aplica: Tier I–IV · Automatización: 2 · Crítico · Entregable: Documento G3: Registro de debilidades\n\n### 2 · Reporte\n\n#### 2.1 Informe anual\n\n- **`GOB-G5-02.01.01`** La unidad de riesgos emite un informe anual con el estado de las debilidades, los modelos desarrollados o modificados en los últimos 12 meses y el cronograma de los próximos 12 meses (SBS art. 8).\n\n  Aplica: Tier I–IV · Automatización: 2 · Crítico · Entregable: Documento G4: Informe anual de riesgo de modelo\n\n- **`GOB-G5-02.01.02`** Auditoría interna incluye en su plan anual la evaluación del cumplimiento de la gestión de riesgo de modelo.\n\n  Aplica: Tier I–IV · Automatización: 1 · Crítico\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/marco/tiering-y-metodologia.md", "meta": {"id": "MARCO-TIER", "titulo": "Tiering, tipo de modelo y enfoque de trabajo", "estandar": "Marco", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 2}, "md": "# Tiering, tipo de modelo y enfoque de trabajo\n\nCada requisito del catálogo se activa según **tres dimensiones**. Antes de empezar, el proyecto debe fijarlas\nen el Project Charter (DES-D1-01.04.04 *Definición del Tier y uso del modelo*).\n\n## 1. Tier del modelo (I – IV)\n\nEl Tier refleja la **materialidad y criticidad** del modelo. Determina cuántas actividades son obligatorias:\nun Tier I exige el conjunto completo; los Tier III–IV permiten omitir análisis marcados como no aplicables\n(por ejemplo, el análisis mensual de completitud del target o la segmentación supervisada).\n\n- El Tier se asigna con participación del equipo desarrollador (DES-D7-01.01.03) y se aprueba con acta (VAL-M-01.13).\n- El catálogo indica, para cada actividad, en qué Tiers aplica (`aplica_tier`).\n\n> **Criterios de categoría.** Los aprueba el comité de riesgos de modelo (GOB-G2-02.01.01). Ver la propuesta de\n> puntaje en [Frontera › Tiering basado en riesgo](../frontera/tiering-basado-en-riesgo.md).\n\n## 2. Tipo de modelo\n\n| Clave | Tipo | Ejemplos |\n|---|---|---|\n| `lineal` | Modelos lineales / lineales generalizados | Regresión logística con WOE, regresión lineal |\n| `ml` | Machine Learning | Gradient boosting (XGBoost, LightGBM), redes |\n| `arbol` | Árboles de regresión / decisión | CART, árboles de segmentación |\n| `acp` | Modelos basados en ACP (componentes principales) | Índices sintéticos, *scorecards* expertos |\n\nAlgunas actividades son exclusivas de un tipo. Por ejemplo, la optimización de hiperparámetros (DES-D4-05.04) sólo\naplica a ML; la transformación WOE de continuas (DES-D4-04.03.02) sólo a modelos lineales.\n\n## 3. Enfoque de trabajo: Ágil vs Tradicional\n\nEl catálogo estima el esfuerzo (días-persona) para dos enfoques:\n\n- **Ágil:** sprints cortos, revisiones SME frecuentes, entregables incrementales. En el catálogo, el enfoque ágil requiere en torno a un 10 % menos de esfuerzo\n  (ver [Estimación](estimacion.md)).\n- **Tradicional:** fases secuenciales con entregables al cierre de cada etapa.\n\n## 4. Nivel de automatización\n\nCada actividad declara su nivel de automatización actual (0–4). Es la palanca principal de eficiencia: subir una\nactividad de nivel 2 a 4 la convierte en un proceso del *toolkit*.\n\n| Nivel | Significado |\n|---|---|\n| 0 | El análisis no se ha realizado previamente |\n| 1 | No se cuenta con códigos |\n| 2 | Scripts particulares |\n| 3 | Scripts estándar |\n| 4 | Procesos industrializados dentro del toolkit |\n\n## 5. Marcas de criticidad\n\n- **Crítico:** actividad cuyo incumplimiento invalida el entregable.\n- **Eficiencia:** actividad priorizada para automatización.\n- **KILLER** (validación de implementación): requisito cuyo incumplimiento bloquea la conformidad.\n"}, {"path": "docs/marco/umbrales.md", "meta": {"id": "MARCO-UMB", "titulo": "Umbrales cuantitativos vigentes", "estandar": "Marco", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 3}, "md": "# Umbrales cuantitativos vigentes\n\nEsta es la **lista cerrada** de límites cuantitativos del estándar. Cualquier valor que no aparezca aquí no es\nun umbral normativo. Cada umbral enlaza a los requisitos que lo establecen.\n\nLas desviaciones se sustentan por escrito; cuando el requisito lo indica (p.ej. U-11), se presentan en Comité de Modelos.\n\n<!-- CATALOGO:INICIO UMBRALES -->\n| ID | Tema | Regla | Establecido en |\n|---|---|---|---|\n| **U-01** | Ventana de modelamiento | Mínimo 12 meses para Train/Test y 6 meses para OOT (originación, comportamiento y cobranzas), sujeto a disponibilidad de información. | [`DES-D1-03.01.02`](../desarrollo/d1-definicion.md) |\n| **U-02** | Estabilidad poblacional / de variables (PSI) | PSI ≤ 10 % para aceptar una variable. Si ese nivel reduce considerablemente el set de variables, se puede evaluar un nivel mayor que no supere el 20 %. | [`DES-D2-01.06.03`](../desarrollo/d2-calidad-datos.md), [`DES-D1-03.01.03`](../desarrollo/d1-definicion.md), [`DES-D4-03.01.01`](../desarrollo/d4-modelamiento.md) |\n| **U-03** | Representatividad de la muestra | 95 % ≤ TM/TG ≤ 105 % (target en muestra vs. target en población). Si no se cumple, ponderar la muestra y usar los pesos en todos los análisis posteriores. | [`DES-D4-02.02.01`](../desarrollo/d4-modelamiento.md) |\n| **U-04** | Tratamiento de outliers | Revisión por percentiles 1 %, 5 %, 95 % y 99 % (automática / experta). | [`DES-D4-04.01.03`](../desarrollo/d4-modelamiento.md), [`DES-D4-01.01.01`](../desarrollo/d4-modelamiento.md) |\n| **U-05** | Imputación simple de missings | Imputación por media/mediana sólo para variables con materialidad de missing < 1 % o < 30 casos / defaults. | [`DES-D4-04.04.02`](../desarrollo/d4-modelamiento.md) |\n| **U-06** | Correlación entre variables continuas | Preselección con correlación < 60 % (tolerancia hasta < 95 % evaluando el tradeoff con el poder predictivo). | [`DES-D4-04.05.01`](../desarrollo/d4-modelamiento.md), [`DES-D4-04.05.02`](../desarrollo/d4-modelamiento.md) |\n| **U-07** | Asociación entre variables categóricas | Se aceptan variables categóricas si el p-valor de la prueba chi-cuadrado ≥ 0.0001 o la V de Cramér < 0.4. | [`DES-D4-04.05.03`](../desarrollo/d4-modelamiento.md) |\n| **U-08** | Selección de variables en ML | Top 150 variables o las que acumulen el 80 % del gain. | [`DES-D4-05.02.05`](../desarrollo/d4-modelamiento.md) |\n| **U-09** | Concentración de pesos de variables | Modelos tradicionales — peso máximo recomendado 25 % por variable (toolkit). Modelos ML — peso por gain, máximo recomendado 10 %. Calibraciones — métrica Chi-Wald. | [`DES-D4-05.02.06`](../desarrollo/d4-modelamiento.md) |\n| **U-10** | Optimización de hiperparámetros | Mínimo 50 combinaciones en búsqueda aleatoria; si no se completa, sustentar. Fijar semilla para replicabilidad. | [`DES-D4-05.04.01`](../desarrollo/d4-modelamiento.md) |\n| **U-11** | Sobreajuste Train vs OOT | Diferencia máxima de 10 puntos de performance (Gini) entre Train y OOT. Si es mayor, sustentar en la documentación y presentar el caso en Comité de Modelos. | [`DES-D4-06.03.02`](../desarrollo/d4-modelamiento.md) |\n| **U-12** | Precisión de estimadores (target continuo) | Reportar R², % de casos con real dentro de ±25 % y ±50 % del proyectado, y error cuadrático medio, en construcción y meses recientes. | [`DES-D4-06.01.02`](../desarrollo/d4-modelamiento.md) |\n| **U-13** | Materialidad de ejes de segmentación (calibración) | Si un eje de segmentación no tiene materialidad superior al 5 %, revisar su inclusión con usuarios de negocio y gerencia. | [`CAL-C4-03.01.06`](../calibracion/c4-calibrado.md) |\n| **U-14** | Precisión por bucket (calibración) | Evaluar la precisión de cada tramo del driver con intervalos de Vasicek. Buckets en semáforo rojo deben incluirse en la calibración; los que estén dentro de límites rojos se evalúan y aprueban por gerencia. | [`CAL-C4-03.01.04`](../calibracion/c4-calibrado.md) |\n| **U-15** | Certificación de implementación | Coincidencia mínima del 95 % entre el proceso de modelamiento y el implementado para obtener conformidad. | [`IMP-01.06.02`](../implementacion/implementacion.md), [`CAL-C5-01.04.02`](../calibracion/c5-implementacion.md) |\n| **U-16** | Certificación con datos de proveedor externo | Si el modelo consume datos de un proveedor externo, la certificación debe ser integral y cubrir un periodo mínimo de 3 meses. | [`VAL-I-01.09`](../validacion/validacion.md) |\n| **U-17** | Definición de default | Un cliente/operación es default (malo) si registra un atraso mayor a 60 días al menos una vez en los 12 meses siguientes a la fecha de observación. Aplica a modelos de admisión (la fecha de observación es la originación del crédito) y a modelos de buró (clientes activos en la fecha de observación). *Nota: Las operaciones que no completan los 12 meses de desempeño se excluyen (DES-D1-04.01.03, DES-D1-04.01.04). Los indeterminados, con mora menor a la altura de default pero cercana a ella, se analizan y excluyen según DES-D1-04.01.05. El rango exacto se sustenta con roll rates (DES-D1-05.02.02). La materialidad (monto mínimo vencido) se fija en el Documento 4.* | [`DES-D1-05.01.01`](../desarrollo/d1-definicion.md), [`DES-D1-05.02.01`](../desarrollo/d1-definicion.md), [`DES-D1-05.04.01`](../desarrollo/d1-definicion.md) |\n| **U-18** | Precio piso técnico (pricing) | Ninguna oferta por debajo del precio técnico mínimo, definido como la tasa con RAROC igual al hurdle de la entidad. Las excepciones solo se otorgan dentro de la matriz de facultades y por debajo del piso requieren Comité de Precios. | [`PRC-P3-02.01.01`](../pricing/p3-precio-tecnico.md), [`PRC-P7-01.02.01`](../pricing/p6-experimentacion-implementacion.md) |\n| **U-19** | Monotonicidad del precio en el riesgo (pricing) | Dentro de una misma celda (producto, plazo, canal), la tasa no puede disminuir cuando aumenta la PD o empeora el tramo de riesgo. | [`PRC-P3-02.01.02`](../pricing/p3-precio-tecnico.md), [`PRC-P5-01.01.01`](../pricing/p4-respuesta-optimizacion.md) |\n| **U-20** | Signo de la respuesta al precio (pricing) | La probabilidad de aceptación debe ser monótona decreciente en el precio en todos los segmentos (elasticidad-precio negativa). Un segmento con elasticidad positiva o nula invalida su curva para optimizar. | [`PRC-P4-02.01.02`](../pricing/p4-respuesta-optimizacion.md) |\n| **U-21** | Calibración del modelo de respuesta (pricing) | Por decil de probabilidad y por tramo de precio, la aceptación observada debe estar dentro de ±10 % relativo de la predicha o dentro del intervalo binomial al 95 %. *Nota: Valor de referencia inicial; calibrar en el primer ciclo.* | [`PRC-P4-02.02.01`](../pricing/p4-respuesta-optimizacion.md), [`PRC-P8-01.03.01`](../pricing/p8-seguimiento-gobierno.md) |\n| **U-22** | Diseño de experimentos de precio (pricing) | Potencia ≥ 80 % y α = 5 % para el efecto mínimo detectable pre-registrado; grupo de control ≥ 10 % del tráfico elegible; duración mínima de un ciclo comercial completo (4 semanas). | [`PRC-P6-01.01.01`](../pricing/p6-experimentacion-implementacion.md) |\n| **U-23** | Excepciones de precio y margen cedido (pricing) | Alerta si las operaciones con precio fuera de tarifario superan el 15 % de las colocaciones del segmento en el mes, o si el margen cedido por excepciones supera el 10 % del margen esperado. *Nota: Valor de referencia inicial; calibrar en el primer ciclo.* | [`PRC-P7-01.02.01`](../pricing/p6-experimentacion-implementacion.md), [`PRC-P8-01.03.01`](../pricing/p8-seguimiento-gobierno.md) |\n| **U-24** | Topes regulatorios de tasa (pricing) | El 100 % de las ofertas debe respetar la tasa máxima vigente donde la regulación la fije (medida como la exige la norma, p.ej. TCEA). El motor de precios lo controla antes de emitir la oferta. | [`PRC-P7-02.01.01`](../pricing/p6-experimentacion-implementacion.md), [`PRC-P9-02.01.01`](../pricing/p8-seguimiento-gobierno.md) |\n| **U-25** | Gradualidad de cambios de precio (pricing) | Un cambio de tasa de lista mayor a 100 pb, o mayor al 15 % relativo, en un mismo ciclo requiere aprobación del Comité de Precios. *Nota: Valor de referencia inicial; calibrar en el primer ciclo.* | [`PRC-P1-01.01.03`](../pricing/p1-definicion-datos.md), [`PRC-P5-01.01.01`](../pricing/p4-respuesta-optimizacion.md) |\n| **U-26** | Margen realizado vs. esperado (pricing) | Si el margen realizado del segmento se desvía más de ±15 % del esperado durante dos meses consecutivos, se revisan el precio técnico y el modelo de respuesta. *Nota: Valor de referencia inicial; calibrar en el primer ciclo.* | [`PRC-P8-01.03.01`](../pricing/p8-seguimiento-gobierno.md) |\n| **U-27** | Profundidad histórica de parámetros | Al menos cinco años de datos de default por cartera, que incluyan un período de estrés o recesión; si no existen, se documenta la limitación y se compensa con conservadurismo o datos externos. | [`PAR-R2-01.01.01`](../parametros/r2-datos.md) |\n| **U-28** | Presunciones de IFRS 9 (staging y default) | Más de 30 días de atraso implica aumento significativo del riesgo (Stage 2) y el default no ocurre después de los 90 días de atraso. Ambas presunciones solo se refutan con evidencia razonable y sustentable documentada. | [`PAR-R1-02.01.01`](../parametros/r0-marco.md), [`PAR-R7-01.02.01`](../parametros/r6-escenarios-staging.md) |\n| **U-29** | Umbrales SICR cuantitativos | El aumento significativo del riesgo se mide comparando la PD lifetime actual con la de origen, con un umbral relativo y uno absoluto calibrados por cartera. Referencia inicial: PD lifetime al menos 2 veces la de origen y al menos 50 pb por encima. *Nota: Valor de referencia inicial; calibrar por cartera en el primer ciclo.* | [`PAR-R7-01.01.01`](../parametros/r6-escenarios-staging.md), [`PAR-R7-01.01.02`](../parametros/r6-escenarios-staging.md) |\n| **U-30** | Backtesting de PD por grado (Jeffreys) | Por grado o tramo, la tasa de default observada se contrasta con la PD con el test de Jeffreys: p-valor < 0.05 es alerta ámbar y p-valor < 0.01 es rojo (subestimación); un rojo exige plan de recalibrado. | [`PAR-R3-03.01.01`](../parametros/r3-pd.md), [`PAR-R9-01.01.01`](../parametros/r9-backtesting-clv.md) |\n| **U-31** | Gobierno de overlays y ajustes post-modelo | Cada overlay tiene causa, cuantificación reproducible, cartera afectada, fecha de revisión o expiración y aprobación en comité. Alerta si los overlays superan el 10 % de la ECL de la cartera o siguen vigentes más de 4 trimestres sin plan de absorción en el modelo. *Nota: Valor de referencia inicial; calibrar en el primer ciclo.* | [`PAR-R8-02.01.01`](../parametros/r8-ecl.md), [`PAR-R8-02.01.03`](../parametros/r8-ecl.md) |\n| **U-32** | Escenarios y ponderación de la ECL | Al menos tres escenarios (base, optimista y pesimista) con probabilidades sustentadas, revisados como mínimo cada trimestre. La ECL ponderada es la suma de las ECL de cada escenario por su probabilidad, nunca la ECL de un escenario promedio. | [`PAR-R6-01.01.01`](../parametros/r6-escenarios-staging.md), [`PAR-R6-02.01.02`](../parametros/r6-escenarios-staging.md), [`PAR-R8-01.01.01`](../parametros/r8-ecl.md) |\n| **U-33** | Períodos de prueba para salir de default o de Stage 2 | Salida de default tras al menos 3 meses sin condiciones de default y 12 meses para reestructuraciones por dificultades financieras. El retorno de Stage 2 a Stage 1 exige un período de prueba documentado por cartera (referencia: 3 meses). | [`PAR-R1-02.01.02`](../parametros/r0-marco.md), [`PAR-R7-01.02.02`](../parametros/r6-escenarios-staging.md) |\n| **U-34** | Cálculo de la LGD workout | Las recuperaciones se descuentan a la tasa de interés efectiva, netas de costos directos e indirectos, y los procesos incompletos se incluyen con un método documentado (no se excluyen). | [`PAR-R4-01.01.01`](../parametros/r4-lgd-ead.md), [`PAR-R4-01.01.02`](../parametros/r4-lgd-ead.md) |\n| **U-35** | Frecuencia de validación por categoría | Validación periódica completa al menos cada año para Tier I, cada dos años para Tier II y cada tres años para Tier III–IV, además de la validación inicial antes del uso. Réplica completa obligatoria en Tier I. *Nota: Valor de referencia de la línea base; el comité de riesgos de modelo aprueba la periodicidad definitiva.* | [`VAL-M-05.03`](../validacion/validacion.md), [`VAL-M-05.01`](../validacion/validacion.md), [`GOB-G2-02.01.01`](../marco/gobierno-mrm.md) |\n| **U-36** | Forzajes (overrides) | Alerta si los forzajes superan el 5 % de las decisiones del período o si los casos forzados tienen una tasa de default significativamente mayor que los no forzados del mismo tramo. *Nota: Valor de referencia inicial; calibrar por producto en el primer ciclo.* | [`DES-D5-01.01.02`](../desarrollo/d5-integracion-gestion.md), [`SEG-S2-01.03.01`](../seguimiento/seguimiento.md) |\n| **U-37** | Semáforo de seguimiento | PSI del score: verde ≤ 10 %, ámbar entre 10 % y 25 %, rojo > 25 %. Discriminación: rojo si el Gini cae más de 10 pts frente a construcción. Calibración: rojo si un tramo sale del intervalo al 99 %. *Nota: Valor de referencia de la línea base; el comité aprueba los umbrales por modelo.* | [`SEG-S1-01.01.01`](../seguimiento/seguimiento.md), [`SEG-S2-01.02.01`](../seguimiento/seguimiento.md) |\n| **U-38** | Rango de IV y sospecha de fuga | IV menor a 0.02: la variable no aporta poder predictivo y se excluye salvo sustento de negocio. IV mayor a 0.50: sospecha de fuga de información; se excluye salvo una investigación documentada que la descarte. | [`DES-D4-03.03.03`](../desarrollo/d4-modelamiento.md), [`DES-D4-03.03.04`](../desarrollo/d4-modelamiento.md) |\n| **U-39** | No anticipación temporal de las variables | Cero variables contemporáneas o futuras: cada variable se mide con información disponible antes de la fecha de observación menos el desfase de su fuente. | [`DES-D1-01.03.04`](../desarrollo/d1-definicion.md), [`DES-D1-01.03.05`](../desarrollo/d1-definicion.md), [`DES-D4-03.03.04`](../desarrollo/d4-modelamiento.md) |\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/marco/estimacion.md", "meta": {"id": "MARCO-EST", "titulo": "Estimación de esfuerzo", "estandar": "Marco", "estado": "Vigente", "version": "2.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 4}, "md": "# Estimación de esfuerzo\n\nLa estimación se calcula desde el catálogo de requisitos con el modelo de esfuerzo.\nLos parámetros están en `catalogo/parametros_esfuerzo.yaml` y la lógica en `tools/esfuerzo.py`.\nEl Planificador del sitio usa exactamente el mismo cálculo y permite cambiar el escenario.\n\n## Cómo se calcula\n\nPara cada requisito aplicable según Tier, tipo de modelo y enfoque:\n\n$$W=\\sum_{i\\notin\\text{reuniones}} d_i\\cdot f_i,\\qquad\nf_i=\\left(\\frac{N}{N_0}\\right)^{0.15}\\left(\\frac{C}{C_0}\\right)^{e_i}$$\n\n- $d_i$: días del catálogo. $N, C$: registros y columnas del proyecto. $N_0=1\\,000\\,000$ y $C_0=300$ son el\n  volumen de referencia al que corresponden los días del catálogo.\n- $f_i$ se aplica sólo a las actividades de **datos** de D1–D4 y C1–C4. Se usa $e_i=0.5$ si la actividad es\n  manual (nivel de automatización 0–2) y $e_i=0.25$ si está automatizada (3–4). En entrenamiento y calibración\n  sólo pesa el número de registros, porque se trabaja con ~150 variables preseleccionadas (U-08) o con pocos drivers.\n- Las actividades de **reunión** del catálogo no se suman al trabajo directo: su tiempo queda dentro del\n  porcentaje de reuniones.\n\n**Con personas**, si una fracción $m$ del tiempo se va en reuniones y $B$ es el bloqueo por tiempo de máquina:\n\n$$T_{\\text{personas}}=\\frac{W+B}{1-m},\\qquad R=m\\,T_{\\text{personas}},\\qquad \\text{semanas}=\\frac{T}{\\text{FTE}\\times 5}$$\n\n**Con un agente de IA**, el agente escribe y ejecuta los scripts y redacta los borradores. Las personas\nrevisan, deciden y firman, y siguen yendo a las **mismas reuniones**:\n\n$$T_{\\text{agente}}=\\sum_i d_i f_i\\,g_i\\,(1+s)+B_{\\text{agente}}+R$$\n\n| Tipo de actividad | Esfuerzo humano que queda ($g$) | Qué hace el agente |\n|---|---:|---|\n| Datos (extracción, calidad, PSI, feature engineering, entrenamiento) | 25 % | Escribe y ejecuta scripts; la persona revisa salidas |\n| Documentación | 30 % | Redacta desde logs y resultados; la persona corrige y firma |\n| Análisis (sentido económico, segmentación, elección del modelo) | 60 % | Prepara alternativas; la decisión es humana |\n| Gobierno (aprobaciones, solicitudes, evidencias) | 100 % | No acelera trámites formales |\n| Supervisión del agente ($s$) | +15 % sobre el trabajo asistido | Instruir, verificar, corregir |\n\nCada requisito tiene su tipo en `dist/catalogo.json` (campo `naturaleza`). Si una clasificación automática no es\ncorrecta, se corrige agregando `naturaleza:` al requisito en su YAML.\n\nNo incluye esperas que no son esfuerzo, como la agenda del Comité de Modelos o la cola de Validación.\n\n## Resultado · 3 millones de registros × 1 000 columnas\n\n<!-- CATALOGO:INICIO ESFUERZO -->\n**Escenario:** 3.000.000 registros × 1.000 columnas · 4 segmentos · 1.5 personas · 30 % del tiempo en reuniones. Semanas de **calendario** (esfuerzo ÷ personas ÷ 5 días).\n\n### Desarrollo (incluye Implementación y Gobierno)\n\n| Tier | Modelo | Personas ágil | Personas trad. | Con agente ágil | Con agente trad. | Ahorro |\n|---|---|---:|---:|---:|---:|---:|\n| I | Lineal | 36.6 | 40.0 | 21.5 | 23.7 | 41% |\n| I | ML | 33.3 | 37.0 | 19.7 | 22.1 | 41% |\n| I | Árbol | 31.4 | 34.9 | 18.7 | 20.9 | 41% |\n| I | ACP | 24.5 | 27.2 | 14.1 | 15.7 | 42% |\n| II | Lineal | 33.9 | 36.8 | 20.0 | 21.8 | 41% |\n| II | ML | 31.3 | 34.5 | 18.6 | 20.6 | 40% |\n| II | Árbol | 29.4 | 32.3 | 17.5 | 19.3 | 40% |\n| II | ACP | 23.0 | 25.6 | 13.4 | 15.0 | 42% |\n| III | Lineal | 30.1 | 32.6 | 17.7 | 19.2 | 41% |\n| III | ML | 29.5 | 32.4 | 17.4 | 19.1 | 41% |\n| III | Árbol | 27.8 | 30.3 | 16.4 | 17.9 | 41% |\n| III | ACP | 21.5 | 23.8 | 12.4 | 13.8 | 42% |\n| IV | Lineal | 30.1 | 32.6 | 17.7 | 19.2 | 41% |\n| IV | ML | 29.5 | 32.4 | 17.4 | 19.1 | 41% |\n| IV | Árbol | 27.6 | 30.1 | 16.3 | 17.8 | 41% |\n| IV | ACP | 21.5 | 23.8 | 12.4 | 13.8 | 42% |\n\n### Calibración, Parámetros, Pricing, Seguimiento e Implementación\n\n| Proyecto | Personas | Con agente | Ahorro |\n|---|---:|---:|---:|\n| Calibración Tier I | 10.6 | 6.3 | 40% |\n| Calibración Tier II | 9.7 | 5.9 | 39% |\n| Calibración Tier III | 7.6 | 4.5 | 41% |\n| Calibración Tier IV | 7.6 | 4.5 | 41% |\n| Parámetros de riesgo Tier I | 20.8 | 11.5 | 45% |\n| Parámetros de riesgo Tier II | 20.8 | 11.5 | 45% |\n| Parámetros de riesgo Tier III | 16.3 | 9.0 | 45% |\n| Parámetros de riesgo Tier IV | 16.2 | 8.9 | 45% |\n| Pricing end-to-end Tier I | 20.4 | 12.0 | 41% |\n| Pricing end-to-end Tier II | 20.4 | 12.0 | 41% |\n| Pricing end-to-end Tier III | 16.1 | 9.5 | 41% |\n| Pricing end-to-end Tier IV | 15.0 | 8.8 | 41% |\n| Seguimiento anual de un modelo Tier I | 2.4 | 1.5 | 38% |\n| Seguimiento anual de un modelo Tier III | 2.4 | 1.5 | 38% |\n| Implementación (proyecto independiente) | 2.7 | 1.8 | 33% |\n\n### Desglose de referencia · Tier I, ML, ágil (días-persona)\n\n| Fase | Catálogo | Reuniones del catálogo (\\*) | Trabajo ajustado por volumen | Trabajo con agente |\n|---|---:|---:|---:|---:|\n| DES-D1 · Definición, alcance, diseño y extracción | 44.3 | 8.0 | 58.8 | 23.3 |\n| DES-D2 · Preparación, calidad y entendimiento de los datos | 4.2 | 0.0 | 6.3 | 2.8 |\n| DES-D3 · Segmentación | 2.4 | 0.8 | 2.1 | 0.7 |\n| DES-D4 · Modelamiento | 61.4 | 1.2 | 77.7 | 29.1 |\n| DES-D5 · Integración a la gestión | 12.5 | 0.0 | 12.5 | 8.0 |\n| DES-D7 · Gobierno | 1.5 | 0.0 | 1.5 | 1.5 |\n| IMP · Implementación | 14.6 | 0.5 | 14.1 | 7.5 |\n| Bloqueo por tiempo de máquina (36.0 h) | | | 1.8 | 0.5 |\n| Reuniones (30 % del tiempo de las personas) | | | 74.9 | 74.9 |\n| **Total días-persona** | **140.9** | | **249.6** | **148.1** |\n| **Semanas de calendario con 1.5 personas** | | | **33.3** | **19.7** |\n\n(\\*) Se excluyen del trabajo directo porque su tiempo ya está dentro del % de reuniones.\n\n<!-- CATALOGO:FIN -->\n\n## Notas para un proyecto de este tamaño\n\n- **Memoria:** 3 M × 1 000 columnas son unos 12 GB en `float32` (24 GB en `float64`). Se necesita un servidor\n  con ≥ 64 GB de RAM, o un motor distribuido. Para la exploración se puede trabajar sobre una muestra\n  si cumple la representatividad (U-03).\n- **Tiempo de máquina:** con ML, ~120 ajustes por segmento (≥ 50 de hiperparámetros, U-10), 4 segmentos y\n  150 variables, son unas 36 horas de cómputo. Corren de noche, pero conviene planificarlas por sprint.\n- **El agente no reduce las reuniones.** Con agente, las reuniones pasan de ser el 30 % del tiempo a cerca de la mitad.\n  La siguiente palanca es acortar ceremonias, por ejemplo con actas preparadas por el agente y decisiones por escrito.\n"}, {"path": "docs/marco/glosario.md", "meta": {"id": "MARCO-GLOS", "titulo": "Glosario y fórmulas de referencia", "estandar": "Marco", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 5}, "md": "# Glosario y fórmulas de referencia\n\n## Términos\n\n| Término | Definición |\n|---|---|\n| **Universo** | Conjunto de operaciones/clientes elegibles antes de exclusiones. |\n| **Cosecha** | Cohorte de operaciones originadas en un mismo periodo, seguida en su maduración. |\n| **Target** | Variable objetivo. Binaria (default) o continua (p.ej. ingreso estimado). |\n| **Default** | Evento de incumplimiento definido por altura (días de atraso), temporalidad (ventana de desempeño) y materialidad (monto mínimo). |\n| **Indeterminado** | Operación con mora menor a la altura de default al cierre de la ventana; se excluye del entrenamiento. |\n| **Train / Test / OOT** | Muestra de entrenamiento, de prueba (mismo periodo) y *out-of-time* (periodo posterior). |\n| **Roll rate** | Probabilidad de transitar de un tramo de mora al siguiente; sustenta la altura de default. |\n| **Driver** | Variable explicativa, en especial las usadas para calibrar. |\n| **Convolución** | Variable construida combinando otras (interacciones, ratios) con criterio de negocio. |\n| **Applicant / Behavior** | Score de originación vs. score de comportamiento; la *regla de transición* define cuándo pasar de uno a otro. |\n| **Matriz CAR** | Enfoque cualitativo (dimensiones, preguntas y pesos) que complementa al score cuantitativo. |\n| **Pauta** | Política de crédito (reglas duras de admisión). |\n| **SME** | *Subject Matter Expert*: revisión con experto de negocio. |\n| **Toolkit** | Herramienta estándar corporativa de modelamiento. |\n| **Comité de Modelos (CM)** | Instancia que aprueba modelos y excepciones. |\n\n## Fórmulas\n\n**Population Stability Index (PSI)** — estabilidad entre una distribución de referencia $e$ y una actual $a$ en $k$ tramos:\n\n$$\\mathrm{PSI}=\\sum_{i=1}^{k}\\left(a_i-e_i\\right)\\ln\\frac{a_i}{e_i}$$\n\nUmbral vigente: ver U-02.\n\n**Gini y AUC** — poder discriminante de un score binario:\n\n$$\\mathrm{Gini}=2\\,\\mathrm{AUC}-1$$\n\n**Kolmogorov–Smirnov (KS)**: $\\mathrm{KS}=\\max_s\\left|F_{\\text{malos}}(s)-F_{\\text{buenos}}(s)\\right|$.\n\n**Weight of Evidence e Information Value** — para el tramo $i$ con proporción de buenos $g_i$ y malos $b_i$:\n\n$$\\mathrm{WOE}_i=\\ln\\frac{g_i}{b_i},\\qquad \\mathrm{IV}=\\sum_i\\left(g_i-b_i\\right)\\mathrm{WOE}_i$$\n\n**V de Cramér** — asociación entre categóricas, con $\\chi^2$ de la tabla $r\\times c$ y $n$ observaciones:\n\n$$V=\\sqrt{\\frac{\\chi^2/n}{\\min(r-1,\\;c-1)}}$$\n\n**Representatividad de la muestra**: $\\dfrac{TM}{TG}\\in[0.95,\\;1.05]$, con $TM$ y $TG$ la tasa del target en muestra y población (U-03).\n\n**Intervalo de Vasicek** (precisión de PD por tramo, con correlación de activos $\\rho$ y nivel de confianza $q$):\n\n$$\\mathrm{DR}_{q}=\\Phi\\!\\left(\\frac{\\Phi^{-1}(\\mathrm{PD})+\\sqrt{\\rho}\\,\\Phi^{-1}(q)}{\\sqrt{1-\\rho}}\\right)$$\n\nSi la tasa de default observada de un tramo cae fuera de $[\\mathrm{DR}_{1-q},\\mathrm{DR}_{q}]$, el tramo se marca en rojo (U-14).\n\n**Prueba de Mann–Kendall** — tendencia monótona en una serie (p.ej. % de missing mensual, DES-D2-01.04.07):\n$S=\\sum_{i<j}\\operatorname{sgn}(x_j-x_i)$; se rechaza \"sin tendencia\" si $|Z|>z_{1-\\alpha/2}$.\n"}, {"path": "docs/marco/literatura.md", "meta": {"id": "MARCO-LIT", "titulo": "Literatura de referencia", "estandar": "Marco", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 6}, "md": "# Literatura de referencia\n\nUna biblioteca corta y curada. Cada obra está aquí porque **fundamenta un requisito o un umbral concreto** del\nestándar, y lo declara. Al abrir un requisito en el sitio, el panel muestra sus lecturas. Los agentes de IA\ncitan desde esta lista (`dist/literatura.json`) y no inventan referencias.\n\n| Nivel | Qué significa |\n|---|---|\n| **Canon** | Lectura obligatoria para quien trabaja en el área |\n| **Práctica** | Cómo se hace bien en el día a día |\n| **Frontera** | Estado del arte; sustenta las propuestas de la sección Frontera |\n| **Regulación** | Normas y guías de supervisores |\n\n## Rutas de lectura\n\n| Rol | Empieza por | Después |\n|---|---|---|\n| Analista nuevo de scoring | LIT-001, LIT-002, LIT-011 | LIT-020, LIT-008, LIT-030 |\n| Analista de ML | LIT-020, LIT-021, LIT-027 | LIT-026, LIT-040, LIT-031 |\n| Calibración y validación | LIT-006, LIT-008, LIT-043 | LIT-007, LIT-105, LIT-050 |\n| Analista de pricing | LIT-071, LIT-070, LIT-060 | LIT-064, LIT-075, LIT-062 |\n| Gobierno y agentes de IA | LIT-100, LIT-101, LIT-093 | LIT-094, LIT-090, LIT-102 |\n\n## Cómo proponer una obra\n\nAgrega la entrada en `catalogo/literatura.yaml` con su nivel, el porqué en una frase y los IDs que fundamenta.\nEl build rechaza obras que no fundamentan ningún requisito existente. Antes de una cita formal, verifica\nedición y paginación en la fuente.\n\n<!-- CATALOGO:INICIO LITERATURA -->\n103 obras en 10 temas.\n\n## Riesgo de crédito y scoring\n\n- **LIT-001** · *Canon* — Siddiqi, N. (2017). *Intelligent Credit Scoring: Building and Implementing Better Credit Risk Scorecards* (2.ª ed.). Wiley.\n\n  El manual práctico de referencia para construir scorecards: definición de malos, exclusiones, WOE, segmentación e implementación. Fundamenta: `DES-D1-04`, `DES-D1-05`, `DES-D3`, `DES-D4-04`, `DES-D4-11`, `U-38`, `DES-D4-03.03`.\n\n- **LIT-002** · *Canon* — Thomas, L. C., Crook, J. y Edelman, D. (2017). *Credit Scoring and Its Applications* (2.ª ed.). SIAM.\n\n  Fundamentos estadísticos del scoring, incluida la lógica de las ventanas de desempeño y la inferencia de rechazados. Fundamenta: `DES-D1-03`, `DES-D1-05`, `DES-D4-05`.\n\n- **LIT-003** · *Práctica* — Anderson, R. (2007). *The Credit Scoring Toolkit: Theory and Practice for Retail Credit Risk Management and Decision Automation*. Oxford University Press.\n\n  Visión de punta a punta del scoring en la operación del banco, desde los datos hasta la decisión automatizada. Fundamenta: `DES-D1`, `DES-D5`, `IMP`.\n\n- **LIT-004** · *Práctica* — Baesens, B., Rösch, D. y Scheule, H. (2016). *Credit Risk Analytics: Measurement Techniques, Applications, and Examples in SAS*. Wiley.\n\n  PD, LGD y EAD con ejemplos de código; útil para la calibración y la validación de parámetros. Fundamenta: `DES-D4-08`, `CAL-C4`, `VAL-M-03`.\n\n- **LIT-005** · *Práctica* — Bellini, T. (2019). *IFRS 9 and CECL Credit Risk Modelling and Validation*. Academic Press.\n\n  Cómo pasar de scores a PD lifetime y pérdida esperada contable; base del impacto IFRS 9 y de la PD de vida en pricing. Fundamenta: `DES-D5-01.02`, `PRC-P3-01.02`, `PAR-R3-02`, `PAR-R8`.\n\n- **LIT-006** · *Práctica* — Engelmann, B. y Rauhmeier, R. (eds.) (2011). *The Basel II Risk Parameters: Estimation, Validation, Stress Testing* (2.ª ed.). Springer.\n\n  Referencia técnica para estimar y validar PD/LGD/EAD, incluidas pruebas de calibración por tramo. Fundamenta: `DES-D4-08`, `CAL-C4-03.01.04`, `VAL-M-03`, `U-14`, `PAR-R3`, `PAR-R4`, `PAR-R5`.\n\n- **LIT-007** · *Canon* — Vasicek, O. (2002). The distribution of loan portfolio value. *Risk*, 15(12).\n\n  Origen del modelo de un factor que sustenta los intervalos de Vasicek usados para evaluar la precisión por bucket. Fundamenta: `U-14`, `CAL-C4-03.01.04`, `PAR-R3-02.01`.\n\n- **LIT-008** · *Canon* — Basel Committee on Banking Supervision (2005). *Studies on the Validation of Internal Rating Systems* (Working Paper n.º 14). BIS.\n\n  Marco clásico de validación de discriminación (AUC, Gini, KS) y calibración (binomial, Hosmer-Lemeshow, tráfico de luces). Fundamenta: `VAL-M-03`, `DES-D4-06`.\n\n- **LIT-009** · *Práctica* — Hand, D. J. y Henley, W. E. (1997). Statistical classification methods in consumer credit scoring: a review. *Journal of the Royal Statistical Society: Series A*, 160(3), 523–541.\n\n  Revisión de métodos y de sus trampas (sesgo de selección, definición de malos) que sigue vigente. Fundamenta: `DES-D1-05`, `DES-D4-05`.\n\n- **LIT-010** · *Práctica* — Lessmann, S., Baesens, B., Seow, H.-V. y Thomas, L. C. (2015). Benchmarking state-of-the-art classification algorithms for credit scoring: An update of research. *European Journal of Operational Research*, 247(1), 124–136.\n\n  Evidencia comparativa de algoritmos en scoring; sustenta exigir un benchmark interpretable frente al ML. Fundamenta: `DES-D4-05`, `DES-D4-06`.\n\n- **LIT-011** · *Práctica* — Hosmer, D. W., Lemeshow, S. y Sturdivant, R. X. (2013). *Applied Logistic Regression* (3.ª ed.). Wiley.\n\n  La regresión logística bien hecha: selección, bondad de ajuste e interpretación de coeficientes. Fundamenta: `DES-D4-05`, `VAL-M-03.07`, `CAL-C4-04`.\n\n- **LIT-012** · *Práctica* — Kaufman, L. y Rousseeuw, P. J. (1990). *Finding Groups in Data: An Introduction to Cluster Analysis*. Wiley.\n\n  Fuente original de PAM y CLARA, citados en la segmentación no supervisada. Fundamenta: `DES-D3-01.01`.\n\n- **LIT-138** · *Práctica* — Verbraken, T., Bravo, C., Weber, R. y Baesens, B. n- **LIT-080** · *Canon* — Barocas, S., Hardt, M. y Narayanan, A. (2023). *Fairness and Machine Learning: Limitations and Opportunities*. MIT Press.\n\n  El marco completo de criterios de equidad y sus límites. Fundamenta: `DES-D4-10`, `PRC-P9-02.02`, `VAL-P-04.02`.\n\n- **LIT-081** · *Práctica* — Hardt, M., Price, E. y Srebro, N. (2016). Equality of Opportunity in Supervised Learning. *Advances in NeurIPS 29*.\n\n  Define igualdad de oportunidades, una de las métricas propuestas en FR-06. Fundamenta: `DES-D4-10`.\n\n- **LIT-082** · *Práctica* — Kleinberg, J., Mullainathan, S. y Raghavan, M. (2017). Inherent Trade-Offs in the Fair Determination of Risk Scores. *Proceedings of ITCS 2017*.\n\n  Demuestra que calibración e igualdad de errores no pueden cumplirse a la vez: obliga a elegir y documentar. Fundamenta: `DES-D4-10`, `PRC-P9-02.02`.\n\n- **LIT-083** · *Frontera* — Fuster, A., Goldsmith-Pinkham, P., Ramadorai, T. y Walther, A. (2022). Predictably Unequal? The Effects of Machine Learning on Credit Markets. *The Journal of Finance*, 77(1), 5–47.\n\n  Evidencia de cómo el ML redistribuye acceso y precio del crédito entre grupos. Fundamenta: `DES-D4-10`, `PRC-P9-02.02`.\n\n- **LIT-134** · *Práctica* — Kozodoi, N., Jacob, J. y Lessmann, S. (2022). Fairness in credit scoring: Assessment, implementation and profit implications. *European Journal of Operational Research*, 297(3), 1083–1094.\n\n  Muestra que la discriminación puede reducirse a costo bajo y propone la separación como criterio de equidad para scorecards. Fundamenta: `DES-D4-10.01`, `PRC-P9-02.02`.\n\n## IA generativa, agentes y gobierno de la IA\n\n- **LIT-090** · *Canon* — Mitchell, M. et al. (2019). Model Cards for Model Reporting. *Proceedings of FAT\\* 2019*, 220–229.\n\n  Origen de las model cards; base de la ficha de nacimiento del modelo. Fundamenta: `DES-D1-01.04.08`, `DES-D7-01.01`.\n\n- **LIT-091** · *Práctica* — Gebru, T. et al. (2021). Datasheets for Datasets. *Communications of the ACM*, 64(12), 86–92.\n\n  Documentar el origen, la composición y los límites de cada base, como en el diccionario de datos. Fundamenta: `DES-D2-01.01`, `PRC-P2-02`.\n\n- **LIT-092** · *Frontera* — Yao, S. et al. (2023). ReAct: Synergizing Reasoning and Acting in Language Models. *ICLR 2023*.\n\n  El patrón razonar-actuar sobre herramientas que siguen los agentes que ejecutan este estándar. Fundamenta: `FR-08`, `PRC-P9-03`.\n\n- **LIT-093** · *Práctica* — Schluntz, E. y Zhang, B. (2024). *Building effective agents*. Anthropic.\n\n  Patrones simples y componibles para agentes (flujos, orquestador-trabajadores, evaluador-optimizador) y cuándo no usar agentes. Fundamenta: `PRC-P9-03`, `FR-08`.\n\n- **LIT-094** · *Regulación* — NIST (2023). *Artificial Intelligence Risk Management Framework (AI RMF 1.0)* (NIST AI 100-1).\n\n  Marco de gestión de riesgos de IA (gobernar, mapear, medir, gestionar) aplicable a agentes. Fundamenta: `FR-08`, `PRC-P9-03`.\n\n- **LIT-095** · *Regulación* — NIST (2024). *Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile* (NIST AI 600-1).\n\n  Riesgos específicos de la IA generativa (confabulación, seguridad de la información) y controles sugeridos. Fundamenta: `FR-08`.\n\n- **LIT-096** · *Regulación* — ISO/IEC 42001:2023. *Information technology — Artificial intelligence — Management system*.\n\n  Norma certificable de sistema de gestión de IA; útil para formalizar el gobierno de agentes. Fundamenta: `FR-08`.\n\n- **LIT-141** · *Frontera* — Beas y Díaz (2024). Documento de trabajo sobre modelos de lenguaje para predecir riesgo de crédito de consumo en Chile. Comisión para el Mercado Financiero (CMF).\n\n  Evidencia temprana: LLMs ajustados alcanzan un desempeño cercano a LightGBM, pero sus explicaciones no siempre se alinean con los datos. Verificar título y publicación. Fundamenta: `FR-08`.\n\n- **LIT-142** · *Práctica* — BBVA (s. f.). *BBVA's eight responsible AI principles* y *Responsible innovation: how BBVA risk*.\n\n  Batería estándar de pruebas de validación, incluido el test de Jeffreys por grado. Fundamenta: `VAL-M-03`, `FR-04`, `U-14`, `PAR-R3-03`, `U-30`.\n\n- **LIT-106** · *Regulación* — Basel Committee on Banking Supervision (2017). *Basel III: Finalising post-crisis reforms*. BIS.\n\n  Requerimientos de capital que determinan el consumo de capital en el precio técnico. Fundamenta: `PRC-P3-01.04`.\n\n- **LIT-107** · *Regulación* — Superintendencia de Banca, Seguros y AFP (2017). *Reglamento de Gobierno Corporativo y de la Gestión Integral de Riesgos* (Resolución SBS n.º 272-2017), y modificatorias.\n\n  Marco local de gestión integral de riesgos; verificar la versión vigente y las normas específicas de riesgo de modelo. Fundamenta: `DES-D7`, `VAL`.\n\n- **LIT-108** · *Regulación* — Congreso de la República del Perú (2021). *Ley n.º 31143, Ley que protege de la usura a los consumidores de los servicios financieros*.\n\n  Faculta al BCRP a fijar tasas máximas en ciertos créditos; origen del control U-24 en Perú. Verificar la reglamentación vigente. Fundamenta: `U-24`, `PRC-P9-02.01`.\n\n- **LIT-130** · *Regulación* — Board of Governors of the Federal Reserve System, OCC y FDIC (2026). *Revised Guidance on Model Risk Management* (SR 26-2; OCC Bulletin 2026-13; FDIC FIL-15-2026).\n\n  Reemplaza a SR 11-7 con un enfoque basado en riesgo y una sección de modelos de terceros; excluye la IA generativa y agéntica, que este estándar cubre con AGT. Fundamenta: `GOB`, `VAL`, `FR-01`.\n\n- **LIT-131** · *Regulación* — Superintendencia de Banca, Seguros y AFP (2023). *Reglamento de Gestión de Riesgos de Modelo* (Resolución SBS n.º 00053-2023).\n\n  La norma peruana de riesgo de modelo: categorización, comité trimestral, aprobación previa, réplica, forzajes, terceros y requisitos de IA. Base obligatoria de la línea base 2.0 en Perú. Fundamenta: `GOB`, `VAL-M-05`, `SEG`, `DES-D7`, `U-35`.\n\n- **LIT-132** · *Regulación* — European Banking Authority (2023). *Follow-up report on *previos** a la originación | Sí |\n| Saldo del cierre del mes de la originación, si ese cierre es posterior a la fecha de decisión | No (contemporánea) |\n| Marca de gestión de cobranza o refinanciación posterior a la observación | No (futura) |\n| Variable de buró con desfase de 1 mes, usada con su fecha real de disponibilidad | Sí, documentando el desfase |\n\nCada variable registra en el diccionario su **fecha de referencia** y el **desfase de disponibilidad** de su fuente, y\nuna prueba automática verifica que ninguna usa información posterior (DES-D1-01.03.05).\n\n## Decisiones que deben quedar cerradas al salir\n\n1. **Población objetivo** y definición cosechas vs. aprobadas (Project Charter).\n2. **Ventana histórica**: mínimo 12 meses Train/Test + 6 meses OOT (U-01), estable según PSI (U-02).\n3. **Exclusiones**: pautas duras, default en foto, desempeño incompleto, indeterminados y cambios de gestión — cada una con su análisis de materialidad (Documento 3).\n4. **Default (binario)**: se adopta la definición del estándar (U-17, ver abajo). El proyecto documenta la unidad (cliente u operación) y la materialidad (Documento 4).\n5. **Target (continuo)**, cuando aplique: altura, temporalidad y materialidad.\n6. **Tier, uso, alcance, limitaciones y criterios de éxito (OKRs)** del modelo.\n7. **Fecha de ejecución** considerando desfases de cada fuente.\n\n## Criterios de aceptación\n\n- Project Charter (PPT 1) completo y validado en Reunión 3.\n- Kick off realizado con acta (Acta 3).\n- Master table inicial (Tabla 1) y master table filtrada (Tabla 2) reproducibles desde scripts.\n- Si se usa metodología corporativa, universo y target alineados o desviación justificada (DES-D1-01.04.06).\n\n## Definición de default del estándar (U-17)\n\n> **Default = atraso mayor a 60 días al menos una vez en los 12 meses siguientes a la fecha de observación.**\n\n| Tipo de modelo | Fecha de observación | Población | Ventana de desempeño |\n|---|---|---|---|\n| **Admisión** (originación) | Fecha de otorgamiento del crédito | Créditos originados en la cosecha | 12 meses desde la originación |\n| **Buró** (comportamiento de cliente) | Fecha de corte de la foto | Clientes activos en esa fecha | 12 meses desde la foto |\n\n$$y_i=\\mathbb{1}\\left[\\max_{t\\in(t_0,\\;t_0+12]}\\ \\text{días de atraso}_{i,t} > 60\\right]$$\n\n- Basta **una** ocurrencia en la ventana; no se exige que el atraso persista.\n- Se excluyen las operaciones que **no completan los 12 meses** de desempeño (DES-D1-04.01.03) y los\n  **indeterminados** (mora cercana pero menor a la altura de default), según DES-D1-04.01.05.\n- En buró se excluye quien ya está en default en la foto (*default en foto*, DES-D1-04.01.02).\n- Con 12 meses de desempeño, la última cosecha utilizable es la de hace 12 meses. Esto condiciona\n  la ventana de modelamiento (U-01): Train/Test y OOT deben caer en cosechas ya maduras.\n- Cualquier variante (otra altura u otra ventana) es una desviación del estándar: se sustenta con roll rates y la\n  curva acumulada de defaults, y se aprueba con acta.\n\n## Análisis de soporte para la definición de default\n\nEl análisis de soporte contrasta, por segmento, las fuentes de default disponibles:\n\n| Definición | Personas | Pyme | Mayorista |\n|---|---|---|---|\n| Default corporativo de la entidad | | | ✓ |\n| Default en buró / RCC | ✓ | ✓ | |\n| Clasificación regulatoria | ✓ (recomendado) | | |\n| Días de atraso | ✓ | ✓ | ✓ |\n\nAnálisis que sustentan la decisión: matriz de coincidencias de default cliente–producto (cuántos defaults\nadicionales agrega pasar a nivel cliente), distancia temporal entre defaults de productos, **roll rates**\npara la altura (30-60-90-120 días), **curva acumulada de defaults** para la temporalidad, y monto fijo para la materialidad.\n\n<!-- CATALOGO:INICIO DES-D1 -->\n## Catálogo de requisitos · Definición, alcance, diseño y extracción\n\n> Bloque generado desde `catalogo/des-d1.yaml` (56 requisitos). Para modificarlo, edita el YAML
