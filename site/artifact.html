coherencia interna y externa con criterios funcionales y de segmentación? | Script 7 |\n\n## Criterios de aceptación\n\n- Variables con PSI > 10 % (o > 20 % en excepción justificada) quedan fuera del set candidato (U-02).\n- Toda incidencia de calidad queda documentada con su decisión (usar, corregir, excluir).\n- Documento 6 firmado por el líder del proyecto.\n\n<!-- CATALOGO:INICIO DES-D2 -->\n## Catálogo de requisitos · Preparación, calidad y entendimiento de los datos\n\n> Bloque generado desde `catalogo/des-d2.yaml` (18 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Desarrollo v1.0.\n\n### 1 · Revisión documental y control review\n\n#### 1.1 Revisión del diccionario de datos\n\n- **`DES-D2-01.01.01`** Garantizar la existencia de un diccionario de datos sobre la base disponible\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0 d ágil / 0 d trad. · Automatización: 1 · Entregable: Excel 4: Diccionario de datos. · Hito: Sprint 6\n\n#### 1.2 Revisión del reporte de calidad de datos del proveedor\n\n- **`DES-D2-01.02.01`** Revisar detalladamente el informe de calidad de datos entregado por el proveedor de información\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Documento 5: Informe de calidad de datos.\n\n#### 1.3 Análisis de validez\n\n- **`DES-D2-01.03.01`** Comparar información recibida con la petición formal de información\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n#### 1.4 Análisis de completitud\n\n- **`DES-D2-01.04.01`** % de registros sin ninguna información\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Script 5: Análisis de completitud: Registros sin información.\n\n- **`DES-D2-01.04.02`** % de registros sólo con información de llaves\n\n  Aplica: Todos los tipos, Tier I–IV · Automatización: 1 · Entregable: Script 5: Análisis de completitud: Análisis de registros con solo información de llaves.\n\n- **`DES-D2-01.04.03`** % de registros sin información de la variable target (total)\n\n  Aplica: Todos los tipos, Tier I–IV · Automatización: 1 · Entregable: Script 5: Análisis de completitud: Análisis de registros sin la variable target.\n\n- **`DES-D2-01.04.04`** % de registros sin información de la variable target (mensual)\n\n  Aplica: Todos los tipos, Tier I–II · Automatización: 1 · Entregable: Script 5: Análisis de completitud: Análisis de registros sin la variable target mensual.\n\n- **`DES-D2-01.04.05`** % de datos faltantes por variable independiente (total)\n\n  Aplica: Todos los tipos, Tier I–IV · Automatización: 1 · Entregable: Excel 5: Fill Rate (total).\n\n- **`DES-D2-01.04.06`** % de datos faltantes por variable independiente (mensual)\n\n  Aplica: Todos los tipos, Tier I–II · Automatización: 1 · Entregable: Excel 5: Fill Rate (mensual).\n\n- **`DES-D2-01.04.07`** Análisis de estabilidad de valores faltantes en cada variable\n\n  Aplica: Todos los tipos, Tier I–II · Automatización: 1 · Entregable: Excel 5: Resultados del test de Mann-Kendall de tendencia para % de missing por mes.\n\n#### 1.5 Análisis de Unicidad\n\n- **`DES-D2-01.05.01`** % de registros duplicados\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Script 6: Análisis de unicidad.\n\n#### 1.6 Análisis descriptivo de variables\n\n- **`DES-D2-01.06.01`** Análisis descriptivo de todas las variables (automático)\n\n  Aplica: Todos los tipos, Tier I–II · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Excel 6: Análisis descriptivo de variables: Máximo, mínimo, promedio, mediana, percentiles.\n\n- **`DES-D2-01.06.02`** Análisis descriptivo de las variables definidas como mínimas\n\n  Aplica: Lineal/Árbol I–II · ML I–IV · ACP III–IV · Automatización: 1 · Entregable: Excel 6: Análisis descriptivo de variables: Máximo, mínimo, promedio, mediana, percentiles.\n\n- **`DES-D2-01.06.03`** Análisis de estabilidad de las variables a través del PSI (incluyendo meses recientes) con un umbral minimo de aceptación del 10%; en caso dicho nivel reduzca considerablemente el set disponible de variables para el modelamiento se evaluará un nivel de aceptación mayor que no supere el 20%.\n\n  Aplica: Lineal/Árbol I–II · ML/ACP I–IV · Automatización: 1 · Entregable: Excel 6: Analisis de estabilidad · Umbrales: U-02\n\n### 2 · Control de Calidad y entendimiento de los datos\n\n#### 2.1 Análisis de Precisión\n\n- **`DES-D2-02.01.01`** Comparación de descriptivos de la base de datos con información de negocio\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Excel 7: Comparación de evolutivos con datos del negocio.\n\n#### 2.2 Análisis de consistencia\n\n- **`DES-D2-02.02.01`** Consistencia y coherencia interna y externa con criterios funcionales o de negocio (criterios y def de segmentación)\n\n  Aplica: Todos los tipos, Tier I–II · Esfuerzo: 1.4875 d ágil / 1.75 d trad. · Automatización: 1 · Entregable: Script 7: Analisis de consistencia: Criterios funcionales y de negocio.\n\n#### 2.3 Reporte final de caildad de datos\n\n- **`DES-D2-02.03.01`** Revisión del conjunto de análisis y decisión sobre calidad de datos\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.5 d ágil / 0.5 d trad. · Automatización: 1\n\n- **`DES-D2-02.03.02`** Documentación de los análisis y certificación de calidad\n\n  Aplica: Todos los tipos, Tier I–IV · Automatización: 1 · Entregable: Documento 6: Analisis y certificación de calidad.\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/desarrollo/d3-segmentacion.md", "meta": {"id": "DES-D3", "titulo": "D3 · Segmentación", "estandar": "Desarrollo", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 12}, "md": "# D3 · Segmentación\n\n## Objetivo\n\nDecidir si conviene construir **un modelo único o varios modelos por segmento**, y con qué ejes. Un segmento\nse justifica sólo si mejora el desempeño frente al modelo unisegmento y es estable y material.\n\n## Enfoque\n\n1. **Propuesta de ejes** con stakeholders (Reunión 4). Si los drivers no son claros, usar árboles de decisión\n   para identificar candidatos y cortes.\n2. **Materialidad y target por segmento**: tasa de default, volumen, estabilidad en el tiempo.\n3. **Segmentación supervisada**: comparar modelos *naive* por segmento vs. modelo unisegmento.\n4. **Segmentación no supervisada** (opcional): k-medias, k-modas, k-medoides, jerárquico, CLARA, PAM; número\n   de clusters por gráfico de sedimentación (codo).\n5. **Contraste estadístico** de homogeneidad intra-segmento y heterogeneidad entre segmentos, y contraste con el negocio.\n\n## Criterios de aceptación\n\n- La segmentación elegida supera al unisegmento en desempeño (PPT 3).\n- Cada segmento tiene materialidad suficiente y target estable (Excel 8).\n- Documento 7 aprobado en SME 3.\n- Supuesto de estimación: máximo 4–5 segmentos (ver [Estimación](../marco/estimacion.md)).\n\n<!-- CATALOGO:INICIO DES-D3 -->\n## Catálogo de requisitos · Segmentación\n\n> Bloque generado desde `catalogo/des-d3.yaml` (9 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Desarrollo v1.0.\n\n### 1 · Segmentación\n\n#### 1.1 Brainstorming sobre propuestas de segmentación y análisis\n\n- **`DES-D3-01.01.01`** Reunión stakeholder para determinar propuesta de ejes de segmentación, en caso no tenga claridad de los posibles drivers de segmentación se utilizar técnicas como árboles de decisión para la identificar de potenciales drivers, así como cortes propuestos\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.85 d ágil / 1 d trad. · Automatización: 1 · Entregable: Acta 4: Reunión de segmentación. · Hito: Reunión 4\n\n- **`DES-D3-01.01.02`** Análisis de ratio de default y materialidad/Análisis de target ( Estabilidad de Segmentos)\n\n  Aplica: Lineal/ML/Árbol I–IV · Esfuerzo: 0.5 d ágil / 0.5 d trad. · Automatización: 1 · Entregable: Excel 8: Analisis de materialidad y target por segmento. · Hito: Sprint 7\n\n- **`DES-D3-01.01.03`** Segmentación por metodología supervisada (modelos naive) / Modelo Segmentado VS Modelo Unisegmento\n\n  Aplica: Lineal I–II · Esfuerzo: 2 d ágil / 2 d trad. · Automatización: 1 · Entregable: Excel 8: Analisis comparativo entre modelos.\n\n- **`DES-D3-01.01.04`** Segmentación con ejes adicionales\n\n  Aplica: Lineal/ACP I–II · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Tabla 3: Master table por segmento.\n\n- **`DES-D3-01.01.05`** Segmentación por metodología no supervisada (opcional): Evaluar diversos tipos de clustering de acuerdo con el tipo de datos utilizados (k-medias, k-modas, k-medoids, clustering jerárquico, CLARA, PAM). Definir el número óptimo de clusters mediante gráfico de sedimentación.\n\n  Aplica: Lineal I–II · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Tabla 3: Master table por segmento.\n\n#### 1.2 Análisis final y Documentación\n\n- **`DES-D3-01.02.01`** Comparación del desempeño de las segmentaciones con el modelo unisegmento\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Ppt 3: Análisis de segmentación.\n\n- **`DES-D3-01.02.02`** Análisis de estabilidad del target y materialidad, contraste estadístico (homogeneidad y/o heterogeneidad), contraste con el negocio\n\n  Aplica: Lineal/ML/Árbol I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Excel 8: Analisis de materialidad y target por segmento.\n\n- **`DES-D3-01.02.03`** Elaboración de presentación de segmentación final.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.5 d ágil / 0.5 d trad. · Automatización: 1 · Entregable: Ppt 3: Análisis de segmentación.\n\n- **`DES-D3-01.02.04`** Documentación y definición de la segmentación final\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.5–1.5 d ágil / 0.5–1.5 d trad. · Automatización: 1 · Entregable: Documento 7: Análisis de segmentación. · Hito: SME 3\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/desarrollo/d4-modelamiento.md", "meta": {"id": "DES-D4", "titulo": "D4 · Modelamiento", "estandar": "Desarrollo", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 13}, "md": "# D4 · Modelamiento\n\n## Objetivo\n\nConstruir, seleccionar, calibrar y documentar el modelo final, y llevarlo a aprobación del Comité de Modelos.\nEs la fase con más requisitos del estándar (≈ 9–11 semanas).\n\n## Flujo\n\n```text\nExclusiones del target ─▶ Muestreo (representatividad) ─▶ Train/Test/OOT\n      ─▶ Depuración (PSI, fill rate, Gini univariado) ─▶ Feature engineering\n      ─▶ Entrenamiento ─▶ Optimización HP ─▶ Bootstrap ─▶ Selección del modelo final\n      ─▶ Interpretación (SHAP) ─▶ Calibración y regla de transición\n      ─▶ Performance por drivers ─▶ Limitaciones ─▶ Documentación ─▶ Cierre cuanti/cuali ─▶ Comité\n```\n\n## Antes de entrenar: el orden es obligatorio\n\nNingún modelo se entrena sobre variables que no hayan pasado, en este orden, por:\n\n```text\n 1 No anticipación        cada variable usa solo información anterior a la observación      U-39 · DES-D1-01.03.04\n 2 Univariado             distribución, faltantes, especiales, categorías raras, extremos   DES-D4-03.02.02\n 3 Fill rate y PSI        poblamiento global y mensual; estabilidad temporal                DES-D4-03.02.01 · U-02\n 4 Bivariado              WOE e IV por tramo, tendencia y monotonicidad del riesgo          DES-D4-03.03.02\n 5 Sospecha de fuga       IV > 0.50 no entra salvo investigación que descarte leakage       U-38 · DES-D4-03.03.03\n 6 Filtro de confiables   IV entre 0.02 y 0.50, fill rate del plan, PSI; luego correlación  DES-D4-03.03.04 · U-06 · U-07\n ──────────────────────────────────────────────────────────────────────────────────────────────────────────\n Embudo de variables documentado ─▶ Feature engineering ─▶ Entrenamiento\n```\n\n**Por qué la no anticipación es la regla número uno.** En producción el modelo decide con lo que se sabe *antes*\nde la fecha de observación. Una variable contemporánea o del futuro (un saldo de fin de mes posterior a la\noriginación, una marca de cobranza o un campo que se actualiza tras el default) no existe en el momento de decidir.\nInfla el Gini en construcción y hace que el modelo falle al implementarse. Cada variable documenta su fecha de\nreferencia y el desfase de su fuente (DES-D1-01.03.05).\n\n**Por qué un IV demasiado alto es una alarma.** En crédito, un IV mayor a 0.50 casi siempre indica que la variable\ncontiene información del target (fuga) y no poder predictivo genuino. Es la regla clásica de la práctica de scoring\n(LIT-001). Antes de usarla hay que demostrar lo contrario.\n\n## Reglas clave (resumen de umbrales)\n\n| Tema | Regla | Umbral |\n|---|---|---|\n| No anticipación | Cero variables contemporáneas o futuras | U-39 |\n| Poder predictivo y fuga | IV entre 0.02 y 0.50; IV > 0.50 solo con investigación de fuga | U-38 |\n| Representatividad | $0.95 \\le TM/TG \\le 1.05$; si no, ponderar | U-03 |\n| Estabilidad de variables | PSI ≤ 10 % (≤ 20 % excepción) | U-02 |\n| Outliers | Percentiles 1-5-95-99 | U-04 |\n| Correlación continuas | < 60 % (hasta < 95 % por tradeoff) | U-06 |\n| Asociación categóricas | p-valor χ² ≥ 0.0001 o V de Cramér < 0.4 | U-07 |\n| Selección ML | Top 150 variables / 80 % del gain | U-08 |\n| Concentración de pesos | ≤ 25 % (tradicional) · ≤ 10 % (ML, gain) | U-09 |\n| Hiperparámetros | ≥ 50 combinaciones, semilla fija | U-10 |\n| Sobreajuste | \\|Gini Train − Gini OOT\\| ≤ 10 pts | U-11 |\n\n## Selección del modelo final\n\nLas métricas se evalúan **global, por mes y por segmento**, tanto en los meses de construcción como en los\n**meses más recientes con desempeño**:\n\n- Target binario: AUC / Gini, y la alerta $\\left|\\mathrm{Gini}_{\\text{construcción}}-\\mathrm{Gini}_{\\text{último mes}}\\right|$.\n- Target continuo: $R^2$, % de real dentro de ±25 % y ±50 % del proyectado, ECM (U-12).\n- Comparación contra el **modelo vigente** en cosechas / solicitudes aprobadas.\n- Si se modeló sobre muestra: consistencia Gini muestra vs. población por bootstrap (DES-D4-06.03.03).\n\n## Reproducibilidad (obligatorio)\n\nGuardar las bases **Train, Test y OOT** (DES-D4-05.03.01), fijar semillas (DES-D4-05.04.01) y documentar\nversiones y rutas de las herramientas (DES-D4-11.01.06).\n\n## Limitaciones\n\nTodo modelo cierra con un reporte de debilidades de **discriminación, calibración y estabilidad**, incluyendo\nel desempeño en subpoblaciones distintas a la de modelamiento (PPT 14). Este reporte es un capítulo obligatorio\ndel documento metodológico.\n\n<!-- CATALOGO:INICIO DES-D4 -->\n## Catálogo de requisitos · Modelamiento\n\n> Bloque generado desde `catalogo/des-d4.yaml` (97 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Desarrollo v1.0.\n\n### 1 · Exclusiones del target (contínuo)\n\n#### 1.1 Exclusión de outliers del target\n\n- **`DES-D4-01.01.01`** Excluir outliers del target por percentiles\n\n  Aplica: Lineal/ML/Árbol I–IV · Esfuerzo: 0.25 d ágil / 0.5 d trad. · Automatización: 1 · Entregable: Script 8: Exclusión de outliers del target. · Hito: Sprint 8 · Umbrales: U-04\n\n### 2 · Muestreo y estratificación\n\n#### 2.1 Muestreo aleatorio para la reducción de registros\n\n- **`DES-D4-02.01.01`** Examinar la materialidad para definir el porcentaje de exclusión.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Script 9: Muestreo y Estratificación\n\n#### 2.2 Análisis de representatividad de la muestra\n\n- **`DES-D4-02.02.01`** Examinar la representatividad a través de la exactitud target a nivel global en la población (TG) y en la muestra (TM).  \n  95%<=TM/TG<=105%  \n  En caso la muestra no sea representativa ponderar la muestra. La ponderación de la muestra será utilizada para el modelamiento y todos los análisis posteriores incluyendo el cálculo de pesos.\n\n  Aplica: Lineal/ML/Árbol I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Gráficos: resultado de representatividad · Umbrales: U-03\n\n#### 2.3 Selección de muestras\n\n- **`DES-D4-02.03.01`** Selección train, test y OOT (secuencial / estrat por target y mes)\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Tabla 4: Master table por muestra.\n\n### 3 · Depuración de variables\n\n#### 3.1 Análisis de estabilidad\n\n- **`DES-D4-03.01.01`** Análisis de tendencia de las variables independientes calculando el indicador PSI (estabilidad temporal) incluyendo meses recientes, justificación de la permanencia o depuración de variables inestables.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 2 · Entregable: Excel 9: Resultados del test de estabilidad · Umbrales: U-02\n\n#### 3.2 Fill rate\n\n- **`DES-D4-03.02.01`** Análisis de porcentaje de casos poblados (global/por mes)\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 3 · Entregable: Excel 10: Univariate analysis I\n\n- **`DES-D4-03.02.02`** Análisis univariado de cada variable sobre la muestra de entrenamiento: distribución, valores especiales y faltantes, categorías raras y valores extremos. Es requisito previo del análisis bivariado.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 3 · Crítico · Entregable: Excel 10: Univariate analysis I · Nota: Línea base 2.1 (2026-10-17): criterio del custodio.\n\n#### 3.3 Gini por variables\n\n- **`DES-D4-03.03.01`** Análisis de discriminación por variables (global/por mes)\n\n  Aplica: Lineal/ML/Árbol I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 3 · Hito: SME 4\n\n- **`DES-D4-03.03.02`** Análisis bivariado de cada variable frente al target: WOE e IV por tramo, tendencia y monotonicidad del riesgo, y estabilidad del IV entre períodos.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1.5 d ágil / 1.5 d trad. · Automatización: 3 · Crítico · Entregable: Excel 10: Univariate analysis I · Nota: Línea base 2.1 (2026-10-17): criterio del custodio.\n\n- **`DES-D4-03.03.03`** Tratar como sospecha de fuga de información (leakage) toda variable con IV mayor a 0.50: no entra al modelamiento salvo una investigación documentada que descarte que contiene información del target o posterior a la observación (U-38).\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.5 d ágil / 0.5 d trad. · Automatización: 2 · Crítico · Entregable: Excel 9: Resultados del test de estabilidad · Umbrales: U-38 · Nota: Línea base 2.1 (2026-10-17): criterio del custodio.\n\n- **`DES-D4-03.03.04`** Filtro de variables confiables antes del entrenamiento: solo pasan las variables que cumplen no anticipación (U-39), fill rate mínimo del plan del modelo, estabilidad (U-02) e IV entre 0.02 y 0.50 (U-38); después se aplican las reglas de correlación (U-06, U-07). Se reporta el embudo de variables (cuántas entran y salen en cada filtro y por qué).\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 3 · Crítico · Entregable: Tabla 1: Base de variables finalistas. · Umbrales: U-38, U-39 · Nota: Línea base 2.1 (2026-10-17): criterio del custodio.\n\n### 4 · Feature engineering\n\n#### 4.1 Detección y tratamiento de outliers\n\n- **`DES-D4-04.01.01`** Análisis de percentiles automático (revisión variables críticas & revisión por criterio de tipo de variable)\n\n  Aplica: Lineal/Árbol/ACP I · Esfuerzo: 2 d ágil / 2 d trad. · Automatización: 3 · Entregable: Excel 10: Univariate analysis I · Hito: Sprint 9\n\n- **`DES-D4-04.01.02`** An d. · Automatización: 1 · Entregable: Ppt 14: Debilidades del modelo. · Hito: Sprint 16\n\n- **`DES-D4-10.01.02`** Debilidades de calibración.\n\n  Aplica: Todos los tipos, Tier I–IV\n\n- **`DES-D4-10.01.03`** Debilidades de estabilidad / Matriz de migración temporal\n\n  Aplica: Todos los tipos, Tier I–IV\n\n- **`DES-D4-10.01.04`** En en caso el modelo se utilice en subpoblaciones distintas a la de modelamiento se debera evaluar el performece (Gini) en dichas subpoblacion.\n\n  Aplica: Lineal/ML/Árbol I–IV\n\n- **`DES-D4-10.01.05`** Reporte de debilidades del modelo\n\n  Aplica: Lineal/ML/Árbol I–IV · Hito: SME 10\n\n- **`DES-D4-10.01.06`** Realizar un análisis de sensibilidad del score ante variaciones de sus variables principales y de los supuestos del modelo.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 2 · Crítico · Nota: Línea base 2.0 (2026-10-17). Res. SBS 00053-2023 art. 16.\n\n- **`DES-D4-10.01.07`** Para modelos sobre personas naturales Tier I–II, analizar la equidad: variables sensibles y sus proxies, métricas por grupo (separación) y decisión documentada sobre el criterio priorizado y su costo (FR-06).\n\n  Aplica: Todos los tipos, Tier I–II · Esfuerzo: 1.5 d ágil / 2 d trad. · Automatización: 2 · Nota: Línea base 2.0 (2026-10-17). Kozodoi, Jacob y Lessmann (2022); Barocas et al. (2023).\n\n### 11 · Documentación Metodológica\n\n#### 11.1 Elaboaración de la documentación\n\n- **`DES-D4-11.01.01`** Documentación funcional\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1.275 d ágil / 1.5 d trad. · Automatización: 1 · Entregable: Documento 11: Memoria metodológica del modelo. · Hito: Sprint 17\n\n- **`DES-D4-11.01.02`** Documentación técnica\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 2.55 d ágil / 3 d trad. · Automatización: 1 · Entregable: Documento 12: Manual de extracción.\n\n- **`DES-D4-11.01.03`** Agregar un registo al cuadro de control de cambios con cada modificación\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0 d ágil / 0 d trad. · Automatización: 1 · Entregable: En caso exista algun cambio en el documento metodológico se agregará un registro al cuadro de control de cambios.\n\n- **`DES-D4-11.01.04`** Agregar un cápitulo que detalle el reporte debilidades encontradas en el modelo\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0 d ágil / 0 d trad. · Automatización: 1\n\n- **`DES-D4-11.01.05`** Agregar un cápitulo que detalle los usos del modelo\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0 d ágil / 0 d trad. · Automatización: 1\n\n- **`DES-D4-11.01.06`** Especificar las versiones y rutas de las herramientas de procesamiento estadístico usadas y la funcionalidad de estas en cuanto al uso dado, así como las rutas productivas deonde se almacenará todo el desarrollo del proyecto\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0 d ágil / 0 d trad. · Automatización: 1\n\n- **`DES-D4-11.01.07`** Elaborar el documento metodológico con la plantilla dinámica del estándar: registrar los datos del modelo en docs/documento.yaml y generar el documento con tools/documento.py (Markdown, HTML, Word y PDF desde la misma fuente). El documento evalúa los umbrales obtenidos, incluye la matriz de cumplimiento tomada de evidencias.yaml y no se presenta a Comité ni a Validación con secciones «Completar» pendientes.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0 d ágil / 0 d trad. · Automatización: 3 · Eficiencia · Entregable: Documento 11: Documento metodológico generado desde docs/documento.yaml (.md, .html, .docx y .pdf). · Nota: Versión 2.2.0 (2026-10-17). Documentación como código: una sola fuente versionada para todos los formatos.\n\n#### 11.2 Consolidación\n\n- **`DES-D4-11.02.01`** Documentación consolidada\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.425 d ágil / 0.5 d trad. · Automatización: 1 · Entregable: Ppt 15: Cierre del modelo.\n\n### 12 · Cierre Cuantitativo\n\n#### 12.1 Cierre de modelo final\n\n- **`DES-D4-12.01.01`** Reunión de resultados del modelo final cuantitativo\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Acta 7: Reunión de resultados del modelo final. · Hito: Reunión 7\n\n### 13 · Cierre Cualitativo\n\n#### 13.1 Enfoque Caulitativo (matrix CAR)\n\n- **`DES-D4-13.01.01`** Reunión con la banca para revisión del enfoque cualitativo\n\n  Aplica: Lineal/ML I–IV · Árbol I–III · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Acta 8: Acta de reunión con la banca · Hito: Reunión 8\n\n- **`DES-D4-13.01.02`** Revisión, análisis y actualización de dimensiones en caso amerite\n\n  Aplica: Lineal/ML I–IV · Árbol I–III · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`DES-D4-13.01.03`** Revisión, análisis y actualización de preguntas en caso amerite\n\n  Aplica: Lineal/ML I–IV · Árbol I–III · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`DES-D4-13.01.04`** Revisión, análisis y actualización de pesos en caso amerite\n\n  Aplica: Lineal/ML I–IV · Árbol I–III · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n#### 13.2 Documentación cualitativa\n\n- **`DES-D4-13.02.01`** Documentación consolidado Cualitativo\n\n  Aplica: Lineal/ML I–IV · Árbol I–III · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Entregable: Documento 11: Memoria metodológica del modelo.\n\n### 14 · Presentación en CM\n\n#### 14.1 Presentación\n\n- **`DES-D4-14.01.01`** Presentación en Reunión de Aprobación\n\n  Aplica: Lineal/ML/Árbol I–IV · ACP I–II · Esfuerzo: 0 d ágil / 0 d trad. · Automatización: 1 · Entregable: Acta 8: Acta del comité de modelos. · Hito: Comité de modelos\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/desarrollo/d5-integracion-gestion.md", "meta": {"id": "DES-D5", "titulo": "D5 · Integración a la gestión", "estandar": "Desarrollo", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 14}, "md": "# D5 · Integración a la gestión\n\n## Objetivo\n\nTraducir el modelo en **decisiones y valor**: puntos de corte e impacto cuantificado en el negocio, el riesgo\ny los estados financieros. Un modelo sin esta fase no está listo para comité.\n\n## Impactos a evaluar\n\n| Impacto | Métrica típica | Evidencia |\n|---|---|---|\n| Punto de corte | Curvas de sensibilidad / especificidad por segmento | Excel |\n| Cobertura (leads) | Variación de aprobados; errores tipo I y II | Excel 20 |\n| Indicadores de riesgo | Mora de cosecha esperada | Excel 20 |\n| Pricing | Sólo estimadores de ingresos | Excel 20 |\n| Provisiones | Provisión / saldo, provisión / margen | Excel 20 |\n| Capital económico | Variación del capital asignado | Correo 1 |\n| IFRS 9 | Impacto en pérdida esperada | Correo 2 |\n\nEl desarrollo, la calibración o el ajuste **deben coordinarse con los modelos PD / LGD / EAD** para armonizar\ncriterios y supuestos (DES-D5-01.02.07).\n\nPara **estimadores**, se acuerda con el equipo de seguimiento la **muestra mínima mensual** de ingresos/ventas\nreales por estrato necesaria para un seguimiento confiable (DES-D5-01.03.01).\n\n<!-- CATALOGO:INICIO DES-D5 -->\n## Catálogo de requisitos · Integración a la gestión\n\n> Bloque generado desde `catalogo/des-d5.yaml` (11 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Desarrollo v1.0.\n\n### 1 · Evaluación de Impactos\n\n#### 1.1 Definición de punto de corte teórico\n\n- **`DES-D5-01.01.01`** Definición de punto de corte teórico / segmentos\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 3 · Entregable: Excel: Curvas de especificidad y sensibilidad. · Hito: Sprint 18\n\n- **`DES-D5-01.01.02`** Definir la política de forzajes (overrides): quién puede forzar, motivos válidos, registro obligatorio y límite de materialidad; el seguimiento medirá su volumen y desempeño (U-36).\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.5 d ágil / 0.5 d trad. · Automatización: 1 · Crítico · Umbrales: U-36 · Nota: Línea base 2.0 (2026-10-17). Res. SBS 00053-2023 arts. 19 y 22.\n\n#### 1.2 Evaluación de impactos en el negocio y valorización de ganancias del modelo\n\n- **`DES-D5-01.02.01`** Impacto en variación de leads (cobertura).\n\n  Aplica: Lineal/ML/Árbol I · ACP I–IV · Esfuerzo: 1.5–2 d ágil / 2–3 d trad. · Automatización: -1 · Entregable: Excel 20: Análisis de Impactos en error tipo I y II · Hito: SME 11\n\n- **`DES-D5-01.02.02`** Impacto en los indicadores de riesgo según tipo modelo (ej. Cosecha mora)\n\n  Aplica: Lineal/ML/Árbol I · Esfuerzo: 1.5–2 d ágil / 2–3 d trad. · Automatización: -1 · Entregable: Excel 20: Análisis de Impactos en error tipo I y II\n\n- **`DES-D5-01.02.03`** Impacto en pricing (solo para estimadores de ingresos).\n\n  Aplica: Lineal/ML/Árbol I–IV · Esfuerzo: 1.5 d ágil / 2 d trad. · Automatización: 0 · Entregable: Excel 20: Análisis de Impactos en Pricing.\n\n- **`DES-D5-01.02.04`** Impacto en provisiones. (provisión/saldo, provisión/margen)\n\n  Aplica: Todos los tipos, Tier I–II · Esfuerzo: 1.5 d ágil / 2 d trad. · Automatización: 0 · Entregable: Excel 20: Análisis de Impactos en provisiones.\n\n- **`DES-D5-01.02.05`** Impacto en asignación de capital económico.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Correo 1: Impactos en CE.\n\n- **`DES-D5-01.02.06`** Impacto en IFRS.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Correo 2: Impactos en IFRS. · Hito: SME 12\n\n- **`DES-D5-01.02.07`** Coordinar la construcción/ calibración/ ajuste con PD/ LGD/ EAD, armonizando los crieterios y/o supuestos\n\n  Aplica: Lineal/ML/Árbol I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Correo 2: Impactos en IFRS.\n\n#### 1.3 (estimadores) Definición de muestra mínima de ingresos/ventas reales para el seguimiento\n\n- **`DES-D5-01.03.01`** Coordinar con el equipo de seguimiento la muestra mínima de ingresos/ventas por estratos que serán necesarias mensualmente para asegurar la confiabilidad del seguimiento de cada modelo de estimador. Esta será compartida al usuario encargado de disponibilizar la información.\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 1 d ágil / 1 d trad. · Automatización: 1 · Entregable: Documentacion metodológica y de implementación · Hito: Sprint 19\n\n- **`DES-D5-01.03.02`** ñ\n\n  Aplica: Todos los tipos, Tier I–IV\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/desarrollo/d7-gobierno.md", "meta": {"id": "DES-D7", "titulo": "D7 · Gobierno", "estandar": "Desarrollo", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 16}, "md": "# D7 · Gobierno\n\n> La fase 6 del desarrollo (Implementación) es un estándar transversal propio: ver [Implementación](../implementacion/implementacion.md).\n\n## Objetivo\n\nAsegurar que el proyecto es **auditable**: que el estándar se aplicó, que cada decisión tiene evidencia y que el\nmodelo está dado de alta en el inventario con su Tier.\n\n## Responsabilidades\n\n- El **líder del proyecto** revisa la aplicación del estándar de construcción.\n- El equipo **evidencia** correos, actas, documentación y conformidades.\n- El equipo participa en la **asignación del Tier** y en el **alta/baja** del modelo (ficha de nacimiento — ver\n  [plantilla](../plantillas/ficha-de-nacimiento.md)).\n- Se preparan las presentaciones de **aprobación y ratificación**.\n- Se evidencia la documentación y reglamentación de **variables críticas**.\n\n<!-- CATALOGO:INICIO DES-D7 -->\n## Catálogo de requisitos · Gobierno\n\n> Bloque generado desde `catalogo/des-d7.yaml` (7 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Desarrollo v1.0.\n\n### 1 · Gobierno\n\n#### 1.1 Gobierno\n\n- **`DES-D7-01.01.01`** Revisar la aplicación los estándares de construcción (responsable lider del proyecto)\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.1875 d ágil / 0.25 d trad. · Automatización: 1 · Crítico · Eficiencia\n\n- **`DES-D7-01.01.02`** Evidenciar correos, actas, documentación, conformidades u otros medios\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Crítico · Eficiencia\n\n- **`DES-D7-01.01.03`** Participar en la asignación de Tier de un modelo\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.185 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`DES-D7-01.01.04`** Cooperar en el alta/ baja de un modelo (ficha de nacimiento del modelo)\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`DES-D7-01.01.05`** Presentaciones de aprobación/ ratificación\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.125 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`DES-D7-01.01.06`** Evidenciar el cumpliento de la documentación y reglamentación de variables críticas\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1\n\n- **`DES-D7-01.01.07`** Obtener la aprobación previa del comité de riesgos de modelo antes de usar todo modelo nuevo, modificado o con cambio de uso (GOB-G3-01.01.01).\n\n  Aplica: Todos los tipos, Tier I–IV · Esfuerzo: 0.25 d ágil / 0.25 d trad. · Automatización: 1 · Crítico · Nota: Línea base 2.0 (2026-10-17). Res. SBS 00053-2023 art. 17.\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/calibracion/c1-entendimiento.md", "meta": {"id": "CAL-C1", "titulo": "Calibración · C1–C3 Entendimiento, datos y segmentación", "estandar": "Calibración", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 20}, "md": "# Calibración · C1–C3 Entendimiento, datos y segmentación\n\n## Cuándo se calibra\n\nUna calibración corrige el **nivel** (y, si se incorporan drivers, parte del ordenamiento) de un modelo vigente\ncuando el seguimiento muestra **descalibración** pero el poder discriminante sigue siendo aceptable. Si el\nordenamiento se ha degradado, corresponde **redesarrollar** (estándar de Desarrollo).\n\nSupuesto de la estimación de esfuerzo: se usa la **base de seguimiento como base de calibración**.\nDuración de referencia: ≈ 10 semanas (Tier 1), ≈ 9 (Tier 2), ≈ 7 (Tier 3–4).\n\n## C1 · Entendimiento\n\n- Entender el modelo actual, su uso y su **status de descalibración**.\n- Alinear universo y target con la metodología corporativa, o justificar la desviación.\n- Para **segmentos definidos por otros equipos**: revisar su sentido funcional con gerencia, decidir si la\n  asignación es única o múltiple con evidencias, y solicitar los archivos de trabajo de los criterios.\n- Pedir las bases de seguimiento / universo, los drivers descalibrados identificados por seguimiento y los\n  drivers propuestos por negocio o por la pauta actual.\n- Analizar **cambios y quiebres poblacionales** y la pauta vigente.\n\n<!-- CATALOGO:INICIO CAL-C1 -->\n## Catálogo de requisitos · Entendimiento\n\n> Bloque generado desde `catalogo/cal-c1.yaml` (12 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Calibración v1.0.\n\n### 1 · Definición del objetivo del calibrado\n\n#### 1.1 Entendimiento del modelo y usos\n\n- **`CAL-C1-01.01.01`** Entendimiento del modelo actual\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d\n\n- **`CAL-C1-01.01.02`** Entendimiento del uso\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C1-01.01.03`** Status descalibrado del modelo\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C1-01.01.04`** En el caso se utilice una metodología corporativa para la calibración, se debe alienar las principales definiciones a utilizar en el modelamiento (Universo y Target). En caso no aplique, se debería justificar el cambio en las definiciones con análisis metodológicos y/o de negocio.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C1-01.01.05`** Para la inclusión de segmentos definidos por otros equipos:\n  - Revision del sentido funcional de los ejes propuestas con la gerencia.\n  - Evaluación en función de los resultados de la revisión, si la asignación del segmento será única o múltiple, solicitar las evidencias y respaldos de esto.\n  - Solicitud archivos de trabajo sobre los criterios definidos.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d\n\n- **`CAL-C1-01.01.06`** Dependiendo de la necesidad del proyecto de calibración, para el caso en el que se requiere de alguna acción para estimar impactos coyunturales en la cartera y el uso de estos:  \n  Listar y Evaluar con la gerencia y usuarios, alternativas que no requieran aplicar medidas directas en los resultados de los modelos.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d\n\n- **`CAL-C1-01.01.07`** Documentar por qué se calibra y no se redesarrolla: discriminación vigente aceptable y descalibración como causa principal, según el árbol de decisión de Seguimiento (SEG-S3-01.01.01).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Crítico · Nota: Línea base 2.0 (2026-10-17). Práctica de bancos de referencia.\n\n#### 1.2 Petición y elaboración de la base universo y filtros básicos (todas estas actividades asumen la disponibilidad de la data input)\n\n- **`CAL-C1-01.02.01`** Petición de bases de seguimiento / universo\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C1-01.02.02`** Elaboración de los principales drivers descalibrados proporcionados por seguimiento\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n- **`CAL-C1-01.02.03`** Elaboración de posibles drivers de calibrado proporcionado por los stakeholders del negocio / Pauta actual\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n### 2 · Población y Pauta actual\n\n#### 2.1 Análisis de la población y pauta actual\n\n- **`CAL-C1-02.01.01`** Análisis de los cambios poblacionales / quiebres de población\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C1-02.01.02`** Conocimiento de las pauta actual\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n<!-- CATALOGO:FIN -->\n\n## C2 · Preparación y calidad de datos\n\n- **Cuadrar** la base con los informes de seguimiento (total mensual, tasa de default mensual y PD actual mensual).\n- Duplicados, descriptivos de drivers candidatos (global y mensual) y contraste con negocio.\n- Propuesta inicial de cambio de nivel y **Kick off** con el área solicitante (con acta).\n\n<!-- CATALOGO:INICIO CAL-C2 -->\n## Catálogo de requisitos · Preparación y calidad de datos\n\n> Bloque generado desde `catalogo/cal-c2.yaml` (8 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Calibración v1.0.\n\n### 1 · Control de Calidad y entendimiento de los datos\n\n#### 1.1 Análisis de completitud y unicidad\n\n- **`CAL-C2-01.01.01`** Cuadre de la infromación con los informes de seguimeinto (Total mensual, rd mensual y pd actual mensual)\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C2-01.01.02`** % de registros duplicados\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C2-01.01.03`** Análisis descriptivo de los posibles drivers de calibrado (global y mensual)\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C2-01.01.04`** Comparación de descriptivos de la base de datos con información de negocio\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C2-01.01.05`** Propuesta inicial de cambio de nivel en el modelo (generico)\n\n  Aplica: Tier I–II · Esfuerzo: 1 d\n\n#### 1.2 Análisis previos al kick off\n\n- **`CAL-C2-01.02.01`** Elaboración de la PPT\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n### 2 · Reunión Kick off\n\n#### 2.1 Reunión Kick off\n\n- **`CAL-C2-02.01.01`** Reunión kick off  \n  (Se tiene que convocar al area Solicitante)\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n- **`CAL-C2-02.01.02`** Acta de la reunión\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n<!-- CATALOGO:FIN -->\n\n## C3 · Segmentación\n\nTasa de default y materialidad de los segmentos candidatos, y performance del modelo actual por segmento\nen los **12 últimos meses con desempeño** (o según disponibilidad).\n\n<!-- CATALOGO:INICIO CAL-C3 -->\n## Catálogo de requisitos · Segmentación\n\n> Bloque generado desde `catalogo/cal-c3.yaml` (2 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Calibración v1.0.\n\n### 1 · Segmentación\n\n#### 1.1 Segmentación a probar\n\n- **`CAL-C3-01.01.01`** Análisis de ratio de default y materialidad para posibles segmentos de calibrado\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n- **`CAL-C3-01.01.02`** Performance del modelo actual según los los segmentos para el calibrado (12 ulitmos meses con desempeño y/o según disponibilidad de información)\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/calibracion/c4-calibrado.md", "meta": {"id": "CAL-C4", "titulo": "Calibración · C4 Calibrado", "estandar": "Calibración", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 21}, "md": "# Calibración · C4 Calibrado\n\n## Flujo iterativo\n\n```text\nDepuración de drivers (estabilidad, fill rate, quiebres, correlación)\n   ─▶ Feature engineering (dummies, transformación toolkit, convoluciones)\n   ─▶ Evaluación del score a calibrar (estabilidad y discriminación, ventanas)\n   ─▶ Iteración 1 ─▶ Reunión preliminar 1 ─▶ Iteración 2 ─▶ Reunión preliminar 2   (Tier 1–2)\n   ─▶ Calibrado final (drivers significativos, signos, bootstrap, migración, granularidad)\n   ─▶ Tabla puntuada a seguimiento ─▶ Reunión de cierre con acta\n```\n\n## Reglas para incluir un driver de calibración\n\n1. **Trameado** del driver por cortes recomendados o de interés de negocio.\n2. Precisión de cada tramo con **intervalos de Vasicek** (ver [Glosario](../marco/glosario.md)):\n   tramos en rojo deben incluirse en la calibración; los que estén en los límites se evalúan y aprueba gerencia (U-14).\n3. **Significancia** de los coeficientes añadidos y **sentido económico** de los signos.\n4. **Aporte marginal** a la discriminación del modelo.\n5. Tratamiento de **missing y valores especiales** documentado.\n6. Ejes de segmentación con materialidad ≤ 5 % se revisan con negocio y gerencia (U-13).\n\n## Correlación\n\nPearson para continuas; V de Cramér, Spearman u otros para cualitativas. Superar el umbral es posible por\nnecesidad de negocio, con excepción documentada (CAL-C4-01.02.01).\n\n## Ventanas\n\nPara calibraciones con fases diferenciadas por ventana, se debe usar la información **más reciente y confiable**;\nde lo contrario se documenta como **limitación** (CAL-C4-03.01.03).\n\n<!-- CATALOGO:INICIO CAL-C4 -->\n## Catálogo de requisitos · Calibrado\n\n> Bloque generado desde `catalogo/cal-c4.yaml` (32 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Calibración v1.0.\n\n### 1 · Depuración de variables\n\n#### 1.1 Análisis de estabilidad y fill rate\n\n- **`CAL-C4-01.01.01`** Análisis de tendencia de los posibles drivers de calibrado (estabilidad temporal)\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C4-01.01.02`** Análisis de porcentaje de casos poblados para los posibles drivers de calibrado\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C4-01.01.03`** Análisis de tendencias y quiebres\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n#### 1.2 Análisis Inicial de Correlación de Variables\n\n- **`CAL-C4-01.02.01`** Análisis de la correlación de los drivers objeto de análisis, para el caso de variables continuas se medirá el indicador de correlación pearson, y para el caso de variables cualitativas se evaluaran diferentes indicador (V-Carmer, Spearman, etc), sin embargo en el caso de superar el umbral se pueden hacer excepciones según las necesidades del negocio.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n### 2 · Feature Engineering\n\n#### 2.1 Tratamiento de variables\n\n- **`CAL-C4-02.01.01`** Transformación de variables: Evaluación de posibles transformaciones de las variables (Categorización Dummies, Transformación toolkie, sin transformación)\n\n  Aplica: Tier I · Esfuerzo: 3 d\n\n- **`CAL-C4-02.01.02`** Evaluación de convolución de variables\n\n  Aplica: Tier I · Esfuerzo: 1 d\n\n### 3 · Ejecución de calibración\n\n#### 3.1 Modelo a Calibrar\n\n- **`CAL-C4-03.01.01`** Evaluación de la estabilidad poblacional y del poder de discriminación del score a calibrarir, aplica tanto para los modelos base como para los modelos calibrados previamente\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d\n\n- **`CAL-C4-03.01.02`** Evaluación de las ventanas de construcción de los componentes de la calibración, incluyendo al score base o score calibrado, verificando el performance actual para delimitar el uso de estos.\n\n  Aplica: Tier I–IV\n\n- **`CAL-C4-03.01.03`** Para calibraciones que contemplen fases diferenciadas por las ventanas de análisis, se debe de incluir la información más reciente y confiable, caso contario se debe de documentar como una limitación.\n\n  Aplica: Tier I–IV\n\n- **`CAL-C4-03.01.04`** Para la inclusion de los drivers:\n  - Trameado (bucketización) del driver por cortes recomendados u objetos de interés de negocio.\n  - Evaluación de la precisión por cada tramo o bucket según los intervalos de Vasicek.\n  - Buckets que se encuentren en semáforo rojo deberán de incluirse en el proceso de calibración.\n  - Buckets que se encuentren dentro de los límites rojos, deberán de evaluarse y aprobarse por la gerencia.\n  - Verificación de la significancia de los coeficientes añadidos\n  - Evaluación del aporte marginal en la discriminación del modelo por la inclusión de los drivers de calibración. Sin embargo, el tener un aporte muy bajo no será determinante para excluir el driver. Llevar discucion a la gerencia.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Umbrales: U-14\n\n- **`CAL-C4-03.01.05`** Dependiendo del tipo de calibración e inclusión de los drivers:  \n  Evaluación y esclarecimiento en la documentación el tratamiento de valores missing y especiales.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C4-03.01.06`** Dependiendo de la necesidad del proyecto de calibración:\n  - Evaluación de la materialidad de los ejes de segmentación, en el caso que no tengan materialidad superior a 5%, revisar la inclusión con los usuarios de negocio y la gerencia.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Umbrales: U-13\n\n#### 3.2 Calibrado con drivers - 1era iteración\n\n- **`CAL-C4-03.02.01`** Ejecución del calibrado para validar significancia e ingreso de los drivers del backlog al calibrado\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d\n\n- **`CAL-C4-03.02.02`** Revisión por sentido económico\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d\n\n- **`CAL-C4-03.02.03`** Análisis de correlación según el tipo de transformación de la variable.\n\n  Aplica: Tier I–IV\n\n- **`CAL-C4-03.02.04`** Matriz de migración / performance del modelo por driver / granularidad\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C4-03.02.05`** Entendimiento inicial de los resultados\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n#### 3.3 1era renión preliminar de resultados\n\n- **`CAL-C4-03.03.01`** Reunión y elaboración de acta\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n#### 3.4 Calibrado con drivers - 2da iteración\n\n- **`CAL-C4-03.04.01`** Ejecución del calibrado para validar significancia e ingreso de los drivers al calibrado\n\n  Aplica: Tier I–II · Esfuerzo: 1.5 d\n\n- **`CAL-C4-03.04.02`** Revisión por sentido económico\n\n  Aplica: Tier I–II · Esfuerzo: 1.5 d\n\n- **`CAL-C4-03.04.03`** Análisis de correlación según el tipo de transformación de la variable.\n\n  Aplica: Tier I–IV\n\n- **`CAL-C4-03.04.04`** Matriz de migración / performance del modelo por driver / granularidad\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n- **`CAL-C4-03.04.05`** Entendimiento inicial de los resultados\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n#### 3.5 2da reunión preliminar de resultados\n\n- **`CAL-C4-03.05.01`** Reunión y elaboración de acta\n\n  Aplica: Tier I–II · Esfuerzo: 0.5 d\n\n### 4 · Calibrado final\n\n#### 4.1 Ejecución del modelo final\n\n- **`CAL-C4-04.01.01`** Selección de drivers significativos\n\n  Aplica: Tier I–II · Esfuerzo: 1 d\n\n- **`CAL-C4-04.01.02`** Conclusiones del sentido de los coeficientes.\n\n  Aplica: Tier I–II · Esfuerzo: 1 d\n\n- **`CAL-C4-04.01.03`** Ejecución final del calibrado\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d\n\n- **`CAL-C4-04.01.04`** Bootstrap driver finales / Matriz de migración / performance del modelo por driver(general y mensual) / granularidad (rangos de pd, rangos de ventas)\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C4-04.01.05`** Envio de tabla puntuada al equipo de seguimiento\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n#### 4.2 Analisis previos a la reunión de cierre\n\n- **`CAL-C4-04.02.01`** Elaboración de la PPT\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n### 5 · Reunión presentación del calibrado\n\n#### 5.1 Reunión presentación de calibrado\n\n- **`CAL-C4-05.01.01`** Reunión calibrado final\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n- **`CAL-C4-05.01.02`** Acta del cirre del calibrado\n\n  Aplica: Tier I–IV\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/calibracion/c5-implementacion.md", "meta": {"id": "CAL-C5", "titulo": "Calibración · C5 Implementación del calibrado", "estandar": "Calibración", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 22}, "md": "# Calibración · C5 Implementación del calibrado\n\nLa implementación de un calibrado sigue el estándar transversal de [Implementación](../implementacion/implementacion.md)\n(documento de implementación, lineamientos, calidad de datos, entorno tecnológico y certificación ≥ 95 %).\nLas actividades específicas del calibrado son:\n\n- **Manual metodológico del calibrado** y **manual de implementación**.\n- Envío del manual al equipo implementador, revisión conjunta y **acta de entrega**.\n- Certificación con **≥ 95 % de coincidencia** (U-15) y conformidad del líder de implementación\n  (o del Sub Gerente de Modelos de Riesgo si implementa el equipo modelador).\n- Presentación al equipo usuario con acta.\n\n<!-- CATALOGO:INICIO CAL-C5 -->\n## Catálogo de requisitos · Implementación del calibrado\n\n> Bloque generado desde `catalogo/cal-c5.yaml` (12 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Calibración v1.0.\n\n### 1 · Implementación\n\n#### 1.1 Documento del calibrado\n\n- **`CAL-C5-01.01.01`** Elaboración del manual metodológico de calibardo\n\n  Aplica: Tier I–IV · Esfuerzo: 2.75 d\n\n- **`CAL-C5-01.01.02`** Elaboración del manual de implementación\n\n  Aplica: Tier I–IV · Esfuerzo: 2.75 d\n\n- **`CAL-C5-01.01.03`** Envío de manual de implementación al equipo implementador\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d\n\n- **`CAL-C5-01.01.04`** Revisión con área de implementación y acta de entrega\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d\n\n- **`CAL-C5-01.01.05`** Una recalibración es una modificación del modelo: requiere validación y aprobación previa del comité de riesgos de modelo antes de su uso.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d · Automatización: 1 · Crítico · Nota: Línea base 2.0 (2026-10-17). Res. SBS 00053-2023 art. 17.\n\n#### 1.2 Desarrollo de implementación\n\n- **`CAL-C5-01.02.01`** Desarrollo de script de implementación\n\n  Aplica: Tier I–IV\n\n#### 1.3 Calidad de datos\n\n- **`CAL-C5-01.03.01`** Desarrollo de controles de calidad de datos para variables input\n\n  Aplica: Tier I–IV · Esfuerzo: 2.5 d\n\n#### 1.4 Pruebas de certificación\n\n- **`CAL-C5-01.04.01`** Definición de pruebas sobre el modelo a implementar\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d\n\n- **`CAL-C5-01.04.02`** Revisión de diferencias entre proceso de modelamiento vs proceso de implementación (95% de coincidencia mínima para obtener conformidad)\n\n  Aplica: Tier I–IV · Esfuerzo: 1.25 d · Umbrales: U-15\n\n- **`CAL-C5-01.04.03`** Constancia de pruebas de control sobre el modelo\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d\n\n- **`CAL-C5-01.04.04`** Solicitar conformidad de los resultados al líder del proyecto de implementación (en caso la implementación sea realizada por el equipo modelador, la aprobación será brindada por el Sub Gerente de Modelos de Riesgos)\n\n  Aplica: Tier I–IV · Esfuerzo: 0.25 d\n\n#### 1.5 Presentación del proceso de implementación al equipo usuario\n\n- **`CAL-C5-01.05.01`** Reunión y elaboración de acta\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/pricing/p0-marco.md", "meta": {"id": "PRC", "titulo": "Pricing analítico · Marco end-to-end", "estandar": "Pricing", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 24}, "md": "# Pricing analítico · Marco end-to-end\n\nEl precio es la palanca de rentabilidad más potente y la menos industrializada de un banco. Un punto básico\nsobre una cartera grande vale más que meses de optimización de costos. Pero un precio mal fijado destruye\nvalor por partida doble: cede margen donde el cliente habría aceptado más, y pierde volumen bueno donde el\nprecio está por encima de lo que el riesgo justifica. Este estándar convierte el precio en una decisión\n**medible, reproducible, gobernada y auditable**.\n\n## Principios\n\n1. **Ningún precio por debajo de su costo económico.** Todo precio parte de un *piso técnico*: fondeo,\n   pérdida esperada, costos y capital (U-18).\n2. **El precio se decide con la respuesta del cliente, no solo con el costo.** Sobre el piso, el precio\n   óptimo depende de la probabilidad de aceptación y del valor de la operación.\n3. **La elasticidad se identifica, no se supone.** El precio histórico no fue aleatorio: sin una estrategia\n   causal explícita, el modelo confunde riesgo con sensibilidad al precio (PRC-P4-01.01.01).\n4. **Se prueba antes de escalar.** Los cambios materiales se validan con experimentos o despliegues escalonados.\n5. **El precio es justo y explicable.** Se explica por riesgo, costo, plazo, canal y relación, nunca por\n   atributos protegidos o la vulnerabilidad del cliente (PRC-P9-02.02.01).\n6. **Personas deciden; modelos y agentes recomiendan.** Ningún modelo ni agente fija o aprueba precios (PRC-P9-03.01.01).\n\n## Ciclo end-to-end\n\n```text\n P1 Caso y gobierno ─▶ P2 Datos de cotizaciones ─▶ P3 Precio técnico (piso, RAROC)\n                                                        │\n              ┌─────────────────────────────────────────┘\n              ▼\n P4 Respuesta al precio (causal) ─▶ P5 Optimización + escenarios ─▶ Comité de Precios\n                                                                          │\n              ┌───────────────────────────────────────────────────────────┘\n              ▼\n P6 Experimento / piloto ─▶ P7 Motor de precios y facultades ─▶ P8 Seguimiento ─┐\n              ▲                                                                  │\n              └──────────── recalibrado (insumos trimestral, respuesta anual) ◀──┘\n                                  P9 Gobierno, conducta y regulación (transversal)\n```\n\n| Fase | Pregunta que responde | Entregable principal |\n|---|---|---|\n| [P1](p1-definicion-datos.md) | ¿Qué precio decidimos, para qué objetivo y con qué restricciones? | Documento P1 · Ficha del caso |\n| [P2](p1-definicion-datos.md) | ¿Tenemos ofertas aceptadas **y rechazadas**, con su costo a la fecha? | Tabla P1 · Base de cotizaciones |\n| [P3](p3-precio-tecnico.md) | ¿Cuál es el precio mínimo que crea valor? | Excel P2 · Calculadora de precio técnico |\n| [P4](p4-respuesta-optimizacion.md) | ¿Cómo responde cada cliente al precio? | Script P1 · Modelo de respuesta |\n| [P5](p4-respuesta-optimizacion.md) | ¿Qué precio maximiza el objetivo respetando las restricciones? | PPT P1 · Escenarios; Acta del Comité |\n| [P6](p6-experimentacion-implementacion.md) | ¿Funciona en el mundo real? | Documento P6 · Diseño del experimento |\n| [P7](p6-experimentacion-implementacion.md) | ¿Llega al cliente exactamente como se aprobó? | Tarifario, facultades y motor certificado |\n| [P8](p8-seguimiento-gobierno.md) | ¿Estamos capturando el valor? | Dashboard P1 · Seguimiento |\n| [P9](p8-seguimiento-gobierno.md) | ¿Es legal, justo y está gobernado? | Documento P9 · Política de precios |\n\n## Integración con el resto del estándar\n\n| Pricing usa | De | Para |\n|---|---|---|\n| PD, LGD, EAD aprobadas | [Desarrollo](../desarrollo/d4-modelamiento.md) y [Calibración](../calibracion/c4-calibrado.md) | Pérdida esperada del piso técnico (PRC-P3-01.02.01) |\n| Proceso de construcción de modelos | DES-D4 (muestras, depuración, selección, documentación) | Modelo de respuesta (PRC-P4-02.01.01) |\n| Certificación ≥ 95 % (U-15) | [Implementación](../implementacion/implementacion.md) | Motor de precios (PRC-P7-02.02.01) |\n| Revisión independiente | [Validación](../validacion/validacion.md), ámbito VAL-P | Modelos de precio técnico, respuesta y optimizador |\n| Actas por hito | [Actas de reunión](../plantillas/acta-de-reunion.md) | Kick off, modelo de respuesta, Comité de Precios, piloto, revisión post-implementación |\n| Estimación de esfuerzo | [Estimación](../marco/estimacion.md) | Plazos con personas y con agentes de IA |\n\n## Qué enfoque de precio usar\n\n| Situación | Enfoque | Requisitos mínimos |\n|---|---|---|\n| Producto nuevo o sin datos de ofertas rechazadas | **Costo + riesgo** (piso técnico con margen objetivo) | P1, P2, P3, P7, P9 |\n| Tarifario por celdas, cartera madura | **Basado en riesgo + respuesta por celda** | P1–P5, despliegue escalonado P6, P7–P9 |\n| Precio individual en originación, alto volumen | **Optimización individual con respuesta heterogénea** | Todo el estándar, con experimento P6 obligatorio |\n| Depósitos y pasivos | **Beta de traslado + elasticidad de saldos**, piso = valor FTP del fondeo | P1–P5 con modelos de pasivos (PRC-P4-03.01.01) |\n| Renovación o repricing de cartera | **Respuesta de retención (fuga) + valor remanente** | P3, P4 (fuga), P5, P8 |\n\n## Indicadores de éxito del programa de pricing\n\n- **Price realization:** tasa efectiva ÷ tasa de lista, por segmento.\n- **Margen y RAROC realizados vs. esperados** (U-26).\n- **Margen cedido por excepciones** (U-23).\n- **Conversión por tramo de precio**, con su curva observada contra la predicha (U-21).\n- **% de ofertas bajo el piso técnico** (objetivo: 0 % sin aprobación).\n- **Cumplimiento regulatorio de tasas:** 100 % (U-24).\n"}, {"path": "docs/pricing/p1-definicion-datos.md", "meta": {"id": "PRC-P1", "titulo": "Pricing · P1–P2 Caso, gobierno y datos", "estandar": "Pricing", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 25}, "md": "# Pricing · P1–P2 Caso, gobierno y datos\n\n## P1 · El caso de pricing\n\nLa mitad de los proyectos de pricing que fracasan lo hacen por un objetivo mal definido. \"Subir margen\" sin\ndecir a costa de cuánto volumen lleva a una propuesta que el negocio rechaza en el comité. El caso debe dejar escrito:\n\n- **La decisión:** tarifario por celdas, precio individual, renovación, repricing o tasa de depósitos.\n- **La función objetivo y su horizonte:** por ejemplo, *maximizar el margen esperado a 12 meses con un volumen\n  no inferior al 95 % del actual*.\n- **Las restricciones duras:** tope regulatorio (U-24), piso técnico (U-18), gradualidad (U-25), apetito de riesgo.\n- **El valor en juego:** margen cedido hoy por excepciones y operaciones bajo el piso. Es la línea base\n  contra la que se mide el éxito en la revisión post-implementación (PRC-P8-02.01.01).\n\n<!-- CATALOGO:INICIO PRC-P1 -->\n## Catálogo de requisitos · Definición del caso de pricing y gobierno inicial\n\n> Bloque generado desde `catalogo/prc-p1.yaml` (8 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Caso de negocio\n\n#### 1.1 Objetivo y alcance\n\n- **`PRC-P1-01.01.01`** Definir el producto (activo o pasivo), los segmentos, los canales y el tipo de decisión de precio: tarifario de lista, precio individual en originación, renovación, repricing de cartera o tasa de depósitos.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 1 · Crítico · Entregable: Documento P1: Ficha del caso de pricing · Hito: Sprint 0\n\n- **`PRC-P1-01.01.02`** Fijar la función objetivo y su horizonte: margen financiero, NIM, RAROC, valor de vida del cliente (CLV), volumen o una combinación ponderada. Documentar explícitamente el trade-off volumen–margen que acepta el negocio.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Crítico · Entregable: Documento P1: Ficha del caso de pricing\n\n- **`PRC-P1-01.01.03`** Inventariar las restricciones: topes regulatorios de tasa (U-24), apetito de riesgo, metas de volumen y de colocación, política comercial, compromisos con clientes, gradualidad máxima de cambios (U-25) y restricciones de conducta.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Crítico · Entregable: Documento P1: Ficha del caso de pricing · Umbrales: U-25\n\n#### 1.2 Diagnóstico del precio actual\n\n- **`PRC-P1-01.02.01`** Diagnosticar el esquema de precios vigente: tarifario, bandas de negociación, facultades de descuento, dispersión de tasas por segmento de riesgo, price realization (tasa efectiva vs. tasa de lista) y brecha frente a la competencia.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Entregable: Excel P1: Diagnóstico del precio actual · Hito: Sprint 1\n\n- **`PRC-P1-01.02.02`** Estimar el valor en juego: margen cedido por excepciones (leakage), clientes con precio por debajo del piso técnico (U-18) y oportunidad por segmento. Es la base para priorizar el proyecto y medir su éxito.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Entregable: Excel P1: Diagnóstico del precio actual\n\n### 2 · Gobierno inicial\n\n#### 2.1 Clasificación y responsables\n\n- **`PRC-P1-02.01.01`** Registrar en el inventario los modelos que intervendrán (precio técnico, respuesta, optimizador) y asignar su Tier. Un modelo de pricing es un modelo sujeto a este estándar y a Validación.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Crítico · Entregable: Documento P1: Ficha del caso de pricing\n\n- **`PRC-P1-02.01.02`** Definir la matriz RACI: dueño del precio (negocio), Finanzas/ALM (costo de fondos y capital), Riesgos (PD/LGD y apetito), Analytics Pricing (modelos y optimización), Cumplimiento y Legal (conducta y transparencia), Tecnología (motor de precios).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Entregable: Documento P1: Ficha del caso de pricing\n\n#### 2.2 Kick off\n\n- **`PRC-P1-02.02.01`** Reunión de kick off del proyecto de pricing con el dueño del precio, Finanzas, Riesgos y Cumplimiento.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Entregable: Acta PRC-KO: Kick off de pricing · Hito: Kick Off\n\n<!-- CATALOGO:FIN -->\n\n## P2 · La base de cotizaciones\n\nEl error de datos más caro en pricing es **modelar solo las operaciones desembolsadas**. Quien aceptó revela\npoco sobre quien rechazó; sin las ofertas rechazadas, la elasticidad no se puede estimar. La unidad de la base es la **oferta**:\n\n| Bloque | Campos mínimos |\n|---|---|\n| Oferta | id de oferta, fecha, producto, monto, plazo, canal, ejecutivo, precio de lista, precio ofrecido, excepción y aprobador |\n| Resultado | aceptó (sí/no), precio final, fecha de desembolso, motivo de no aceptación |\n| Costo a la fecha | FTP por plazo, PD, LGD, EAD, costo operativo, capital consumido (versionados a la fecha de la oferta) |\n| Contexto | tasa de la competencia, tasa de referencia, campaña, saturación del canal |\n| Comportamiento posterior | prepago, cancelación, uso de línea, saldo, default |\n\n**Variación exógena del precio.** Antes de modelar, mide cuánta variación del precio no depende del cliente:\ncambios de tarifario, campañas, saltos de la grilla. Si casi todo el precio se explica por el riesgo, no hay\nidentificación posible. Entonces el experimento (P6) es un **requisito previo**, no un extra (PRC-P2-02.01.02).\n\n<!-- CATALOGO:INICIO PRC-P2 -->\n## Catálogo de requisitos · Datos de pricing y calidad\n\n> Bloque generado desde `catalogo/prc-p2.yaml` (7 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Base de cotizaciones\n\n#### 1.1 Construcción\n\n- **`PRC-P2-01.01.01`** Construir la base a nivel de oferta o cotización, no solo de operaciones desembolsadas: precio ofrecido, precio final, aceptación (sí/no), monto, plazo, canal, ejecutivo, fecha y motivo de no aceptación. Sin las ofertas rechazadas por el cliente no se puede estimar la respuesta al precio.\n\n  Aplica: Tier I–IV · Esfuerzo: 4 d · Automatización: 2 · Crítico · Entregable: Tabla P1: Base de cotizaciones · Hito: Sprint 1\n\n- **`PRC-P2-01.01.02`** Enriquecer cada oferta con los insumos del precio técnico vigentes a la fecha de la oferta: PD y LGD del modelo de riesgo aprobado (definición de default U-17), curva FTP, costo operativo y consumo de capital.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Tabla P1: Base de cotizaciones\n\n- **`PRC-P2-01.01.03`** Incorporar variables de contexto: tasas de la competencia por producto y plazo, tasa de referencia de política monetaria, campañas vigentes, estacionalidad y saturación del canal.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Entregable: Tabla P1: Base de cotizaciones\n\n- **`PRC-P2-01.01.04`** Para productos con comportamiento posterior (TC, consumo, hipotecario, depósitos), unir el desempeño: prepago, cancelación, uso de línea, saldo promedio y default, para calcular el valor de la operación y no solo su aceptación.\n\n  Aplica: Tier I–III · Esfuerzo: 3 d · Automatización: 2 · Entregable: Tabla P1: Base de cotizaciones\n\n### 2 · Calidad de datos de pricing\n\n#### 2.1 Controles\n\n- **`PRC-P2-02.01.01`** Aplicar los controles de calidad de DES-D2 (validez, completitud, unicidad, precisión, consistencia) y los específicos de pricing: precio ofrecido registrado antes de la decisión del cliente, cotizaciones duplicadas por re-cotización, tasas fuera de rango y fechas de oferta coherentes con la de desembolso.\n\n  Aplica: Tier I–IV · Esfuerzo: 2.5 d · Automatización: 3 · Crítico · Entregable: Documento P2: Diccionario y certificación de datos de pricing\n\n- **`PRC-P2-02.01.02`** Medir la variación exógena del precio disponible para identificar la elasticidad: cambios de tarifario, campañas, saltos de la grilla, pruebas previas. Si no existe variación suficiente, el diseño de un experimento (P6) pasa a ser requisito previo para el modelo de respuesta.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 1 · Crítico · Entregable: Documento P2: Diccionario y certificación de datos de pricing\n\n- **`PRC-P2-02.01.03`** Certificar la base de pricing con acta de conformidad de las fuentes (Finanzas para FTP y costos; Riesgos para PD/LGD).\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 1 · Entregable: Documento P2: Diccionario y certificación de datos de pricing\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/pricing/p3-precio-tecnico.md", "meta": {"id": "PRC-P3", "titulo": "Pricing · P3 Precio técnico y RAROC", "estandar": "Pricing", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 26}, "md": "# Pricing · P3 Precio técnico y RAROC\n\nEl precio técnico es la **tasa mínima a la que una operación crea valor**: la que deja un RAROC igual a la\ntasa de retorno mínima exigida al capital (*hurdle*). Por debajo de ese piso, cada operación destruye valor\naunque contablemente parezca rentable.\n\n## Cascada del precio\n\n```text\n  Tasa de lista ───────────────────────────────────────────────┐\n     − descuento comercial (dentro de facultades, U-23)        │  margen comercial\n  = Tasa ofrecida ─────────────────────────────────────────────┤\n     − prima de opcionalidad (prepago, cancelación)            │\n     − costo de capital   K·(h/(1−t) − r_FTP)                  │  precio técnico\n     − costo operativo     c_op                                │  (piso, U-18)\n     − pérdida esperada    PD_anual · LGD                      │\n     − costo de fondos     r_FTP (+ prima de liquidez)         │\n  = Margen económico  ≥ 0  ────────────────────────────────────┘\n```\n\n## Fórmulas\n\n**Precio técnico mínimo** de una operación (tasa anual sobre el saldo), con $K$ el capital por unidad de\nsaldo, $h$ el hurdle después de impuestos y $t$ la tasa impositiva:\n\n$$r_{\\min}= r_{\\text{FTP}} + \\mathrm{PD}_{\\text{anual}}\\cdot \\mathrm{LGD} + c_{\\text{op}} + K\\left(\\frac{h}{1-t}-r_{\\text{FTP}}\\right) + \\pi_{\\text{opc}}$$\n\n**RAROC** de la operación al precio $r$:\n\n$$\\mathrm{RAROC}(r)=\\frac{\\left(r - r_{\\text{FTP}} - \\mathrm{PD}_{\\text{anual}}\\cdot\\mathrm{LGD} - c_{\\text{op}} - \\pi_{\\text{opc}}\\right)(1-t) + K\\,r_{\\text{FTP}}\\,(1-t)}{K}$$\n\nSe cumple $\\mathrm{RAROC}(r_{\\min}) = h$.\n\n## Decisiones metodológicas que debes documentar\n\n- **Horizonte de la PD.** Los scores del estándar estiman default a 12 meses (U-17). Para una operación a\n  36 meses, la pérdida relevante es la de toda su vida esperada. Usa la PD *lifetime* anualizada sobre el\n  perfil de amortización y prepago: $\\mathrm{PD}_{\\text{anual}} = 1-(1-\\mathrm{PD}_{\\text{vida}})^{1/T_{\\text{esperado}}}$.\n  Usar la PD a 12 meses en plazos largos **subestima** el piso de los créditos malos de maduración tardía.\n- **Duración, no plazo.** El FTP se toma en la duración del flujo (amortización y prepago), no en el plazo contractual.\n- **Capital económico o regulatorio.** Usa el que la entidad gestiona como restricción vinculante y declara cuál.\n- **Costo marginal o completo.** Para decidir precio se usa el costo **marginal** de originar y mantener;\n  el costo completo se reporta aparte. Declara cuál y por qué.\n- **Depósitos.** El \"piso\" es inverso: la tasa máxima a pagar es la que deja el valor FTP del fondeo, menos\n  los costos de captación y el costo de liquidez del comportamiento esperado del saldo.\n\n<!-- CATALOGO:INICIO PRC-P3 -->\n## Catálogo de requisitos · Precio técnico y rentabilidad ajustada por riesgo\n\n> Bloque generado desde `catalogo/prc-p3.yaml` (9 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Componentes del precio técnico\n\n#### 1.1 Costo de fondos\n\n- **`PRC-P3-01.01.01`** Asignar el costo de fondos con la curva de precios de transferencia (FTP) de Finanzas/ALM según plazo y perfil de amortización (duración equivalente), incluyendo la prima de liquidez. Para depósitos, el FTP es el valor del fondeo que aporta el producto.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 2 · Crítico · Entregable: Excel P2: Calculadora de precio técnico · Hito: Sprint 2\n\n#### 1.2 Pérdida esperada\n\n- **`PRC-P3-01.02.01`** Calcular la pérdida esperada anualizada con los modelos de riesgo aprobados: PD ajustada al horizonte de la operación (lifetime o promedio anual sobre la vida esperada, no solo la PD a 12 meses de U-17), LGD y EAD con su perfil de amortización y uso de línea.\n\n  Aplica: Tier I–IV · Esfuerzo: 3 d · Automatización: 2 · Crítico · Entregable: Excel P2: Calculadora de precio técnico\n\n#### 1.3 Costos operativos y de adquisición\n\n- **`PRC-P3-01.03.01`** Asignar costos operativos (originación, mantenimiento, cobranza) y de adquisición por canal, con su driver (por operación o por saldo), conciliados con Finanzas.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 2 · Entregable: Excel P2: Calculadora de precio técnico\n\n#### 1.4 Costo de capital\n\n- **`PRC-P3-01.04.01`** Calcular el cargo por capital: capital económico o regulatorio consumido por la operación por la tasa de retorno mínima (hurdle) antes de impuestos, neto del beneficio de fondear con capital.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 2 · Entregable: Excel P2: Calculadora de precio técnico\n\n#### 1.5 Opcionalidad\n\n- **`PRC-P3-01.05.01`** Valorar la opcionalidad del cliente (prepago sin penalidad, cancelación anticipada de depósitos, uso de línea) e incorporarla como prima o como ajuste del valor esperado.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 1 · Entregable: Excel P2: Calculadora de precio técnico\n\n### 2 · Precio técnico y RAROC\n\n#### 2.1 Cálculo y grilla\n\n- **`PRC-P3-02.01.01`** Calcular el precio técnico mínimo (tasa piso con RAROC igual al hurdle) por celda de producto × plazo × canal × tramo de riesgo, y el RAROC de cada operación al precio vigente. Ninguna oferta por debajo del piso salvo excepción dentro de facultades (U-18).\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 3 · Crítico · Entregable: Excel P2: Calculadora de precio técnico · Umbrales: U-18\n\n- **`PRC-P3-02.01.02`** Verificar la monotonicidad del precio técnico respecto del riesgo dentro de cada celda (U-19) y la coherencia de la estructura por plazo.\n\n  Aplica: Tier I–IV · Esfuerzo: 0.5 d · Automatización: 3 · Entregable: Excel P2: Calculadora de precio técnico · Umbrales: U-19\n\n- **`PRC-P3-02.01.03`** Conciliar el precio técnico con Finanzas (FTP, costos, capital) y con Riesgos (PD, LGD); diferencias mayores a 5 pb por celda se explican por escrito.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 1 · Entregable: Documento P3: Metodología de precio técnico\n\n#### 2.2 Documentación\n\n- **`PRC-P3-02.02.01`** Documentar la metodología de precio técnico, sus supuestos, fuentes y fecha de vigencia de cada insumo, con cuadro de control de cambios.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 1 · Entregable: Documento P3: Metodología de precio técnico\n\n<!-- CATALOGO:FIN -->\n"}, {"path": "docs/pricing/p4-respuesta-optimizacion.md", "meta": {"id": "PRC-P4", "titulo": "Pricing · P4–P5 Respuesta al precio y optimización", "estandar": "Pricing", "estado": "Vigente", "version": "1.0.0", "custodio": "Yuri Plasencia — Analytics Pricing & Revenue Management", "actualizado": "2026-10-17", "orden": 27}, "md": "# Pricing · P4–P5 Respuesta al precio y optimización\n\n## P4 · El modelo de respuesta\n\nEstima la probabilidad de que el cliente $i$ acepte la oferta al precio $r$:\n\n$$P_i(r)=\\sigma\\!\\left(\\alpha(x_i)+\\beta(x_i)\\,\\big(r - r^{\\text{ref}}_i\\big)\\right),\\qquad \\beta(x_i)<0$$\n\ndonde $r^{\\text{ref}}_i$ es la referencia del cliente: tasa de la competencia, tasa de lista o su precio anterior.\nLa **elasticidad** en el punto $r$ es $\\varepsilon_i(r)=\\dfrac{\\partial \\ln P_i}{\\partial \\ln r}=\\beta(x_i)\\,r\\,\\big(1-P_i(r)\\big)$.\n\n### El problema central: endogeneidad\n\nEl precio histórico se fijó *por* el riesgo y el perfil. Un modelo ingenuo concluye que \"los clientes que\npagan más aceptan menos\" cuando en realidad mide que \"los clientes riesgosos aceptan menos\". Ese sesgo tiende\na **exagerar** la sensibilidad y lleva a ceder margen. La estrategia de identificación es un requisito\ndocumentado (PRC-P4-01.01.01):\n\n| Estrategia | Cuándo | Riesgo principal |\n|---|---|---|\n| **Experimento aleatorio** de precio | Siempre que sea posible (P6) | Costo de oportunidad del piloto; diseño ético |\n| **Discontinuidad en la grilla** | Precio salta en un umbral de score o monto | Validez solo cerca del umbral |\n| **Variable instrumental** | Cambios del costo de fondos o del tarifario ajenos al cliente | Instrumento débil o no excluible |\n| **Double machine learning** | Muchos controles y variación residual suficiente | Variables omitidas |\n\n### Reglas de construcción\n\n- Se sigue DES-D4 (Train/Test/OOT, depuración, selección, documentación).\n- Monotonicidad obligatoria: la aceptación decrece con el precio en **todo** segmento (U-20).\n- **La calibración manda más que el Gini** (U-21). El optimizador consume probabilidades, no rankings.\n- Se declara el **rango de precios válido**: la curva no se extrapola fuera del soporte observado.\n\n<!-- CATALOGO:INICIO PRC-P4 -->\n## Catálogo de requisitos · Modelos de respuesta al precio\n\n> Bloque generado desde `catalogo/prc-p4.yaml` (9 requisitos). Para modificarlo, edita el YAML y ejecuta `python tools/build.py`. Fuente: Estándar de Pricing Analítico v1.0 (nuevo, 2026-10-17).\n\n### 1 · Identificación causal\n\n#### 1.1 Estrategia de identificación\n\n- **`PRC-P4-01.01.01`** Documentar cómo se separa el efecto del precio del efecto del riesgo y del perfil del cliente, dado que el precio histórico no fue asignado al azar: experimento aleatorio (preferido), discontinuidad en la grilla de precios, variable instrumental (por ejemplo, cambios del costo de fondos o del tarifario ajenos al cliente) o double machine learning con controles completos.\n\n  Aplica: Tier I–IV · Esfuerzo: 2 d · Automatización: 1 · Crítico · Entregable: Documento P4: Modelo de respuesta y elasticidad · Hito: Sprint 3\n\n- **`PRC-P4-01.01.02`** Pruebas de robustez de la identificación: placebo en periodos sin cambio de precio, balance de covariables entre grupos de precio, sensibilidad a variables omitidas y estabilidad de la elasticidad entre submuestras temporales.\n\n  Aplica: Tier I–II · Esfuerzo: 2 d · Automatización: 2 · Entregable: Documento P4: Modelo de respuesta y elasticidad\n\n### 2 · Modelo de aceptación\n\n#### 2.1 Construcción\n\n- **`PRC-P4-02.01.01`** Estimar la probabilidad de aceptación de la oferta en función del precio relativo (precio ofrecido frente a referencia o competencia) y de las características del cliente, siguiendo DES-D4 para muestras (Train/Test/OOT), depuración y selección de variables.\n\n  Aplica: Tier I–IV · Esfuerzo: 5 d · Automatización: 2 · Crítico · Entregable: Script P1: Modelo de respuesta\n\n- **`PRC-P4-02.01.02`** Imponer la restricción de monotonicidad decreciente de la aceptación en el precio (U-20), incluso en modelos de machine learning (restricciones monotónicas en gradient boosting) y permitir elasticidades heterogéneas por segmento.\n\n  Aplica: Tier I–IV · Esfuerzo: 1 d · Automatización: 2 · Crítico · Entregable: Script P1: Modelo de respuesta · Umbrales: U-20\n\n#### 2.2 Desempeño\n\n- **`PRC-P4-02.02.01`** Validar discriminación (Gini/AUC) y, sobre todo, calibración: aceptación observada vs. predicha por decil y por tramo de precio (U-21). En pricing un modelo descalibrado optimiza mal aunque ordene bien.\n\n  Aplica: Tier I–IV · Esfuerzo: 1.5 d · Automatización: 3 · Crítico · Entregable: Excel P3: Curvas de respuesta por segmento · Umbrales: U-21\n\n### 3 · Comportamiento posterior\n\n#### 3.1 Modelos de valor\n\n- **`PRC-P4-03.01.01`** Estimar los modelos que determinan el valor de la operación según el precio: prepago y cancelación (activos), sensibilidad de saldo y fuga ante cambios de tasa (depósitos: beta de traslado y elasticidad de saldos), uso de línea (TC).\n\n  Aplica: Tier I–II · Esfuerzo: 4 d · Automatización: 2 · Entregable: Script P1: Modelo de respuesta\n\n- **`PRC-P4-03.01.02`** Evaluar si el precio afecta el riesgo (selección adversa); si la PD observada cambia con el precio para un mismo score, incorporarlo en el valor esperado.\n\n  Aplica: Tier I–II · Esfuerzo: 1.5 d · Automatización: 2 · Entregable: Documento P4: Modelo de respuesta y elasticidad\n\n### 4 · Cierre del modelo de respuesta\n\n#### 4.1 Revisión\n\n- **`PRC-P4-04.01.01`*
