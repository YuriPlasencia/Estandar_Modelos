- id: IMP-01.02.01
  tarea: Implementación tecnológica
  subtarea: Documento de Lineamientos
  actividad: "Preparación del documento de Lineamientos del proceso de Implementación. (Agregar un registo al cuadro\
    \ de control de cambios con cada modificación ), este documento debe precisar:\n- Responsables de la Ejecución\
    \ Periódica.\n- Ubicación del documento de implementación y archivos de ejecución\n- Planes de Contingencia:\n\
    \ - En caso el responsable de la ejecución no se encuentre disponible..\n - En caso los servidores y/o aplicaciones\
    \ donde se ejecute el modelo no se encuentren disponibles.\n - En caso la información no se encuentre disponible.\n\
    \ - En caso se tengan alertas de calidad de datos.\n- Evidencias de disponibilidad de los usaurios que tienen\
    \ accesos a los ambientes productivos del modelo.\n- Evidencia de los backups de los docuemnto, archivos de\
    \ ejecución e información procesada.\n- Detalles de las herramientas o medios de comunicación por la cual se\
    \ comparte información del modelo a validación y la normativa en el cual se rigen para que la transferencia\
    \ sea bajo los lineamientos indicados por seguridad"
  critico: false
  eficiencia: false
  nivel_automatizacion: 1
