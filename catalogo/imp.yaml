- id: IMP-01.01.01
  tarea: Implementación tecnológica
  subtarea: Documento de implementación
  actividad: "Preparación del documento de implementación (Agregar un registo al cuadro de control de cambios con\
    \ cada modificación ), este documento debe contener:\n- Proceso de Implementación. El cual debe detallar:\n\
    \ - Cuadro resumen de las versiones del modelo y código del modelo.\n - Descripción funcional de las variables\
    \ input\n - Descripción a detalle de la generación del universo.\n - Descripción de las llaves y desfases a\
    \ usar.\n - Descripción a detalle de todo el proceso de implementación.\n - Descripción funcional de las variables\
    \ del output.\n - Descripción de los aplicativos necesarios para la ejecución del proceso..\n- Proceso de control\
    \ de Calidad de Datos. El cual consta del análisis de estabilidad poblacional de las variables cuyas umbrales\
    \ son definidos corportaivamente.\n- Detalle del plan de Acción cuando existan alertas en el control de Calidad\
    \ de Datos"
