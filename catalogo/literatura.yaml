- id: LIT-008
  tema: credito
  nivel: Canon
  cita: "Basel Committee on Banking Supervision (2005). *Studies on the Validation of Internal Rating Systems* (Working Paper n.º 14). BIS."
  por_que: "Marco clásico de validación de discriminación (AUC, Gini, KS) y calibración (binomial, Hosmer-Lemeshow, tráfico de luces)."
