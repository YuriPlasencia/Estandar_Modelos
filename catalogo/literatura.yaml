  aplica: [DES-D4-05, DES-D4-06]
- id: LIT-011
  tema: credito
  nivel: Práctica
  cita: "Hosmer, D. W., Lemeshow, S. y Sturdivant, R. X. (2013). *Applied Logistic Regression* (3.ª ed.). Wiley."
