# Yuri Plasencia — Analytics Pricing & Revenue Management
# Literatura de referencia. Cada obra declara los requisitos o umbrales que fundamenta (`aplica`, por ID o prefijo).
# Niveles: Canon (lectura obligatoria del área) · Práctica (cómo se hace bien) · Frontera (estado del arte) · Regulación.
# Antes de citar formalmente, verifica edición y paginación en la fuente.
version: 1
temas:
  - {id: credito, nombre: "Riesgo de crédito y scoring"}
  - {id: ml, nombre: "Machine learning y explicabilidad"}
  - {id: parametros, nombre: "Parámetros de riesgo e IFRS 9"}
  - {id: calibracion, nombre: "Calibración e incertidumbre"}
  - {id: monitoreo, nombre: "Estabilidad, monitoreo y MLOps"}
  - {id: causal, nombre: "Inferencia causal y experimentación"}
  - {id: pricing, nombre: "Pricing y revenue management"}
  - {id: equidad, nombre: "Equidad y conducta"}
  - {id: agentes, nombre: "IA generativa, agentes y gobierno de la IA"}
  - {id: regulacion, nombre: "Regulación y supervisión"}
obras:
# ---------------------------------------------------------------- crédito
- id: LIT-001
  tema: credito
  nivel: Canon
  cita: "Siddiqi, N. (2017). *Intelligent Credit Scoring: Building and Implementing Better Credit Risk Scorecards* (2.ª ed.). Wiley."
  por_que: "El manual práctico de referencia para construir scorecards: definición de malos, exclusiones, WOE, segmentación e implementación."
  aplica: [DES-D1-04, DES-D1-05, DES-D3, DES-D4-04, DES-D4-11, U-38, DES-D4-03.03]
- id: LIT-002
  tema: credito
  nivel: Canon
  cita: "Thomas, L. C., Crook, J. y Edelman, D. (2017). *Credit Scoring and Its Applications* (2.ª ed.). SIAM."
  por_que: "Fundamentos estadísticos del scoring, incluida la lógica de las ventanas de desempeño y la inferencia de rechazados."
  aplica: [DES-D1-03, DES-D1-05, DES-D4-05]
- id: LIT-003
  tema: credito
  nivel: Práctica
  cita: "Anderson, R. (2007). *The Credit Scoring Toolkit: Theory and Practice for Retail Credit Risk Management and Decision Automation*. Oxford University Press."
  por_que: "Visión de punta a punta del scoring en la operación del banco, desde los datos hasta la decisión automatizada."
  aplica: [DES-D1, DES-D5, IMP]
- id: LIT-004
  tema: credito
  nivel: Práctica
  cita: "Baesens, B., Rösch, D. y Scheule, H. (2016). *Credit Risk Analytics: Measurement Techniques, Applications, and Examples in SAS*. Wiley."
  por_que: "PD, LGD y EAD con ejemplos de código; útil para la calibración y la validación de parámetros."
