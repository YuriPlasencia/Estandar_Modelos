  aplica_tier: [1, 2, 3]
- id: CAL-C4-03.01.03
  tarea: Ejecución de calibración
  subtarea: Modelo a Calibrar
  actividad: Para calibraciones que contemplen fases diferenciadas por las ventanas de análisis, se debe de incluir
    la información más reciente y confiable, caso contario se debe de documentar como una limitación.
  aplica_tier: [1, 2, 3]
- id: CAL-C4-03.01.04
  tarea: Ejecución de calibración
  subtarea: Modelo a Calibrar
  actividad: 'Para la inclusion de los drivers:

    - Trameado (bucketización) del driver por cortes recomendados u objetos de interés de negocio.

    - Evaluación de la precisión por cada tramo o bucket según los intervalos de Vasicek.

    - Buckets que se encuentren en semáforo rojo deberán de incluirse en el proceso de calibración.

    - Buckets que se encuentren dentro de los límites rojos, deberán de evaluarse y aprobarse por la gerencia.

    - Verificación de la significancia de los coeficientes añadidos

    - Evaluación del aporte marginal en la discriminación del modelo por la inclusión de los drivers de calibración.
    Sin embargo, el tener un aporte muy bajo no será determinante para excluir el driver. Llevar discucion a la
    gerencia.'
  dias_esfuerzo: 2.0
  aplica_tier: [1, 2, 3]
- id: CAL-C4-03.01.05
  tarea: Ejecución de calibración
  subtarea: Modelo a Calibrar
  actividad: 'Dependiendo del tipo de calibración e inclusión de los drivers:

    Evaluación y esclarecimiento en la documentación el tratamiento de valores missing y especiales.'
  dias_esfuerzo: 0.5
  aplica_tier: [1, 2, 3]
- id: CAL-C4-03.01.06
  tarea: Ejecución de calibración
  subtarea: Modelo a Calibrar
  actividad: 'Dependiendo de la necesidad del proyecto de calibración:

    - Evaluación de la materialidad de los ejes de segmentación, en el caso que no tengan materialidad superior
    a 5%, revisar la inclusión con los usuarios de negocio y la gerencia.'
  dias_esfuerzo: 2.0
  aplica_tier: [1, 2, 3]
