# ---------------- VALIDACIÓN DE MODELOS DE PRICING
- id: VAL-P-01.01
  ambito: VAL-P
  bloque: Precio técnico
  killer: false
  requisito: "Conciliación del precio técnico con Finanzas (FTP, costos, capital) y Riesgos (PD, LGD), con fecha de vigencia de cada insumo y diferencias por celda explicadas."
- id: VAL-P-01.02
  ambito: VAL-P
  bloque: Precio técnico
  killer: false
  requisito: "Uso de una PD coherente con el horizonte de la operación (lifetime o anualizada sobre la vida esperada) y sustento de la elección."
- id: VAL-P-01.03
  ambito: VAL-P
  bloque: Precio técnico
  killer: true
  requisito: "Ninguna celda del tarifario aprobado por debajo del piso técnico sin acta del Comité de Precios (U-18) y monotonicidad del precio en el riesgo (U-19)."
- id: VAL-P-02.01
  ambito: VAL-P
  bloque: Modelo de respuesta
  killer: true
  requisito: "Estrategia de identificación causal documentada y pruebas de robustez; un modelo de respuesta estimado solo sobre operaciones desembolsadas no es válido."
- id: VAL-P-02.02
  ambito: VAL-P
  bloque: Modelo de respuesta
  killer: false
  requisito: "Elasticidad negativa y aceptación monótona en todos los segmentos (U-20), con el rango de precios en que la curva es válida."
- id: VAL-P-02.03
  ambito: VAL-P
  bloque: Modelo de respuesta
  killer: false
  requisito: "Calibración de la aceptación por decil y por tramo de precio en OOT y meses recientes (U-21)."
- id: VAL-P-03.01
  ambito: VAL-P
  bloque: Optimizador
  killer: false
  requisito: "Reproducción independiente de la propuesta con el mismo código, semilla y datos, y verificación de que respeta todas las restricciones."
- id: VAL-P-03.02
  ambito: VAL-P
  bloque: Optimizador
  killer: false
  requisito: "Sensibilidad de la propuesta a la incertidumbre de la elasticidad y a los supuestos de valor (prepago, fuga, venta cruzada)."
- id: VAL-P-04.01
  ambito: VAL-P
  bloque: Implementación y conducta
  killer: true
  requisito: "Control preventivo de topes regulatorios en el motor de precios con 100 % de cumplimiento en las pruebas (U-24) y certificación ≥ 95 % (U-15)."
- id: VAL-P-04.02
  ambito: VAL-P
  bloque: Implementación y conducta
  killer: false
  requisito: "Análisis de equidad del precio y de proxies de atributos protegidos (PRC-P9-02.02.01)."
- id: VAL-P-04.03
  ambito: VAL-P
  bloque: Implementación y conducta
  killer: false
  requisito: "Registro y log de los agentes de IA usados en el ciclo de pricing, sin facultad para fijar ni aprobar precios (PRC-P9-03.01.01)."
# ---------------- VALIDACIÓN DE PARÁMETROS DE RIESGO
- id: VAL-R-01.01
  ambito: VAL-R
  bloque: Definiciones y datos
  killer: false
  requisito: "Definición de default consistente con la gestión del riesgo y la contabilidad, con la presunción de 90 días (U-28) y el puente documentado con la definición de los scores (U-17)."
- id: VAL-R-01.02
  ambito: VAL-R
  bloque: Definiciones y datos
  killer: false
  requisito: "Profundidad y representatividad de los datos (U-27) y conciliación de saldos, defaults y castigos con contabilidad."
- id: VAL-R-02.01
  ambito: VAL-R
  bloque: PD
  killer: false
  requisito: "Calibración de la PD por grado con el test de Jeffreys (U-30) y PD lifetime con tratamiento de riesgos competitivos (prepago, cancelación)."
- id: VAL-R-02.02
  ambito: VAL-R
  bloque: LGD
  killer: false
  requisito: "LGD workout descontada a la tasa de interés efectiva, con costos y procesos incompletos incluidos (U-34), y LGD en default para Stage 3."
- id: VAL-R-02.03
  ambito: VAL-R
  bloque: EAD
  killer: false
  requisito: "Perfil de exposición consistente con prepagos, CCF de revolventes y sustento del período de exposición conductual."
- id: VAL-R-03.01
  ambito: VAL-R
  bloque: Escenarios y staging
  killer: true
  requisito: "Al menos tres escenarios con probabilidades sustentadas y ECL ponderada como promedio de las ECL por escenario (U-32)."
- id: VAL-R-03.02
  ambito: VAL-R
  bloque: Escenarios y staging
  killer: false
  requisito: "Umbrales SICR calibrados (U-29), backstops de 30 y 90 días (U-28) y evidencia de que Stage 2 anticipa el default."
- id: VAL-R-04.01
  ambito: VAL-R
  bloque: ECL y gobierno
  killer: true
  requisito: "Overlays con causa, cuantificación, expiración y aprobación (U-31), y plan de absorción en el modelo."
- id: VAL-R-04.02
  ambito: VAL-R
  bloque: ECL y gobierno
  killer: true
  requisito: "Motor de ECL certificado con coincidencia ≥ 95 % (U-15) y conciliado con contabilidad."
- id: VAL-R-04.03
  ambito: VAL-R
  bloque: ECL y gobierno
  killer: false
  requisito: "Backtesting anual de PD, LGD, CCF, staging y ECL, con acciones documentadas."
# ---------------- LÍNEA BASE 2.0 · alcance y profundidad de la validación (Res. SBS 00053-2023 arts. 7, 16, 20 y 25)
- id: VAL-M-05.01
  ambito: VAL-M
  bloque: Alcance y profundidad de la validación
  killer: false
  requisito: "Réplica completa e independiente del modelo para los modelos de mayor categoría (Tier I), incluida la reconstrucción de la base y del entrenamiento."
- id: VAL-M-05.02
  ambito: VAL-M
  bloque: Alcance y profundidad de la validación
  killer: false
  requisito: "Benchmarking con un modelo alternativo (challenger) construido o seleccionado por Validación."
- id: VAL-M-05.03
  ambito: VAL-M
  bloque: Alcance y profundidad de la validación
  killer: false
  requisito: "Validación periódica según la categoría (U-35) que revise el uso real del modelo, la categoría asignada y los forzajes."
- id: VAL-M-05.04
  ambito: VAL-M
  bloque: Alcance y profundidad de la validación
  killer: true
  requisito: "Hallazgos clasificados por severidad (alta, media, baja) con responsable, plazo y seguimiento hasta su cierre; los de severidad alta exigen mitigación temporal hasta corregirse."
- id: VAL-M-05.05
  ambito: VAL-M
  bloque: Alcance y profundidad de la validación
  killer: false
  requisito: "Para modelos de IA: evaluación de interpretabilidad (incluida la estabilidad de las explicaciones), optimización de hiperparámetros, validación cruzada y nivel de sobreajuste."
- id: VAL-M-05.06
  ambito: VAL-M
  bloque: Alcance y profundidad de la validación
  killer: false
  requisito: "Modelos de terceros: réplica o, si la propiedad intelectual lo impide, benchmarking u otra técnica alternativa documentada."
