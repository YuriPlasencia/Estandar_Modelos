# Fuente de verdad del catálogo normativo. Editar vía control de cambios (ver CONTRIBUTING.md).
# Yuri Plasencia — Analytics Pricing & Revenue Management
fase: VAL
nombre: Validación
estandar: Validación
origen: Estándar de Validación v1.0
ambitos_validacion:
  - id: VAL-M
    nombre: Validación metodológica
    descripcion: >-
      Revisión independiente (segunda línea) de la construcción o calibración del modelo. Aplica a los
      tres tipos de entrega: documentación y gobierno, modelo/calibración, y calibración vía seguimiento.
  - id: VAL-I
    nombre: Validación de implementación
    descripcion: >-
      Revisión de que el modelo implementado en producción replica el modelo aprobado y opera bajo
      controles de calidad, accesos y respaldo. Los requisitos marcados como KILLER bloquean la conformidad.
  - id: VAL-P
    nombre: Validación de modelos de pricing
    descripcion: >-
      Revisión independiente de los modelos del estándar de Pricing (precio técnico, respuesta al precio y optimizador)
      y de sus controles de implementación y conducta.
  - id: VAL-R
    nombre: Validación de parámetros de riesgo
    descripcion: >-
      Revisión independiente de los parámetros IFRS 9 y de gestión (PD, LGD, EAD/CCF, escenarios, staging y ECL)
      y de su motor de cálculo, overlays y backtesting.
